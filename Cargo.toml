[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.clippy]
float_arithmetic = "warn"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"

# Browser build (tools/build_web.sh): speed first, no debug info, one codegen unit and fat LTO
# so the sim's i64 hot paths inline across crates, `panic = "abort"` (wasm cannot unwind anyway;
# this drops the unwind tables of the std glue).
[profile.web]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
strip = "debuginfo"

# Same, optimized for size (`opt-level = "s"`): for slow links; see docs/wasm-bench.md for the speed cost.
[profile.web-small]
inherits = "web"
opt-level = "s"

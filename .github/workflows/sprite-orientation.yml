name: sprite-orientation
on:
  pull_request:
  workflow_dispatch:
jobs:
  sprite-orientation-linux:
    # Existing unprivileged bwrap-compatible profile; migration is tracked in #154.
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mandatory software GPU and source isolation prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers bubblewrap
          mapfile -t lavapipe < <(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd([.][^/]*)?[.]json$')
          test "${#lavapipe[@]}" -eq 1
          test -r "${lavapipe[0]}"
          printf 'VK_DRIVER_FILES=%s\nVK_ICD_FILENAMES=%s\n' "${lavapipe[0]}" "${lavapipe[0]}" >> "$GITHUB_ENV"
          test "$(id -u)" -ne 0
          bwrap --die-with-parent --ro-bind / / -- /bin/true
          mkdir -p orientation-evidence
          git rev-parse HEAD HEAD^{tree} > orientation-evidence/source.txt
      - name: Default boundaries and positive CPU inventories
        run: |
          set -euo pipefail
          cargo check --locked --release -p orr_editor -p orr_sample
          cargo test --locked --release -p orr_editor --test deps
          cargo test --locked --release -p orr_sample --features project-export,collect-sprites,image-reimport --test sprite_orientation -- --test-threads=1 2>&1 | tee orientation-evidence/sample-cpu.log
          cargo test --locked --release -p orr_editor --features sprites,collect-dodge,image-reimport --test sprite_orientation -- --test-threads=1 2>&1 | tee orientation-evidence/editor-cpu.log
          python3 - <<'PY'
          import pathlib, re
          inventories = {
            'sample-cpu': (5, 2, {
              'tests::strict_schema_rejects_old_version_presence_and_malformed_orientation',
              'tests::sixteen_authored_combinations_have_eight_distinct_geometric_transforms',
              'tests::arena_runtime_preserves_frame_and_owned_orientation_through_pause_seek_restart',
              'tests::collect_orientation_does_not_change_gameplay_collection_or_restart',
              'reimport_preserves_exact_v3_sidecar_and_immutable_original_package',
            }),
            'editor-cpu': (3, 1, {
              'orientation_history_restores_exact_legacy_bytes_and_reset_keeps_v3',
              'real_widgets_reassignment_save_undo_reset_and_play_source_fences',
              'externally_reimported_source_requires_reload_before_orientation_transaction',
            }),
          }
          for stage, (passed, ignored, expected) in inventories.items():
              text = pathlib.Path(f'orientation-evidence/{stage}.log').read_text()
              actual = set(re.findall(r'^test (\S+) \.\.\. ok$', text, re.M))
              assert actual == expected, (stage, actual, expected)
              summaries = re.findall(r'^test result:.*$', text, re.M)
              assert len(summaries) == 1 and re.fullmatch(
                  rf'test result: ok\. {passed} passed; 0 failed; {ignored} ignored; 0 measured; 0 filtered out; finished in .+', summaries[0]), summaries
          PY
      - name: Require every ignored GPU and export target to exist
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_sample --features project-export,collect-sprites,image-reimport --test sprite_orientation -- --ignored --list > orientation-evidence/sample-ignored.txt
          cargo test --locked --release -p orr_editor --features sprites,collect-dodge,image-reimport --test sprite_orientation -- --ignored --list > orientation-evidence/editor-ignored.txt
          python3 - <<'PY'
          import pathlib
          expected = {
            'sample': {
              'tests::all_orientations_render_asymmetric_non_square_runtime_texels: test',
              'authored_orientation_export_relocates_with_sources_hidden_and_read_only: test',
            },
            'editor': {'all_orientations_render_asymmetric_non_square_actual_editor_texels: test'},
          }
          for package, names in expected.items():
              lines = pathlib.Path(f'orientation-evidence/{package}-ignored.txt').read_text().splitlines()
              assert {line for line in lines if line.endswith(': test')} == names, (package, lines)
          PY
      - name: Mandatory actual runtime and composed editor pixels
        env:
          ORR_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export ORR_ORIENTATION_CAPTURE_DIR="$PWD/orientation-evidence/runtime"
          cargo test --locked --release -p orr_sample --features project-export,collect-sprites,image-reimport --test sprite_orientation -- --ignored --exact tests::all_orientations_render_asymmetric_non_square_runtime_texels --show-output 2>&1 | tee orientation-evidence/runtime-gpu.log
          export ORR_ORIENTATION_CAPTURE_DIR="$PWD/orientation-evidence/editor"
          cargo test --locked --release -p orr_editor --features sprites,collect-dodge,image-reimport --test sprite_orientation -- --ignored --exact all_orientations_render_asymmetric_non_square_actual_editor_texels --show-output 2>&1 | tee orientation-evidence/editor-gpu.log
          python3 - <<'PY'
          import pathlib, re
          for stage, test in [
              ('runtime-gpu', 'tests::all_orientations_render_asymmetric_non_square_runtime_texels'),
              ('editor-gpu', 'all_orientations_render_asymmetric_non_square_actual_editor_texels'),
          ]:
              text = pathlib.Path(f'orientation-evidence/{stage}.log').read_text()
              assert re.findall(r'^test (\S+) \.\.\. ok$', text, re.M) == [test], (stage, text)
              summaries = re.findall(r'^test result:.*$', text, re.M)
              assert len(summaries) == 1 and summaries[0].startswith('test result: ok. 1 passed; 0 failed; 0 ignored;'), summaries
          for kind, count in [('runtime',16),('editor',32)]:
              images = list(pathlib.Path(f'orientation-evidence/{kind}').glob('*.png'))
              assert len(images) == count and all(p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n') for p in images), (kind, images)
          PY
      - name: Mandatory production export with sources hidden and read-only bundles
        env:
          ORR_REQUIRE_GPU: '1'
          ORR_REQUIRE_PROJECT_ISOLATION: '1'
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo build --locked --release -p orr_sample --features project-export,collect-sprites,image-reimport --bin arena --bin orr_export_arena --bin collect_dodge --bin orr_export_collect
          export ORR_ORIENTATION_ARENA_RUNTIME="$PWD/target/release/arena"
          export ORR_ORIENTATION_ARENA_EXPORTER="$PWD/target/release/orr_export_arena"
          export ORR_ORIENTATION_COLLECT_RUNTIME="$PWD/target/release/collect_dodge"
          export ORR_ORIENTATION_COLLECT_EXPORTER="$PWD/target/release/orr_export_collect"
          export ORR_ORIENTATION_CAPTURE_DIR="$PWD/orientation-evidence/export"
          sha256sum "$ORR_ORIENTATION_ARENA_RUNTIME" "$ORR_ORIENTATION_ARENA_EXPORTER" "$ORR_ORIENTATION_COLLECT_RUNTIME" "$ORR_ORIENTATION_COLLECT_EXPORTER" > orientation-evidence/production-binaries.sha256
          cargo test --locked --release -p orr_sample --features project-export,collect-sprites,image-reimport --test sprite_orientation -- --ignored --exact authored_orientation_export_relocates_with_sources_hidden_and_read_only --show-output 2>&1 | tee orientation-evidence/export.log
          python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path('orientation-evidence/export.log').read_text()
          expected = 'authored_orientation_export_relocates_with_sources_hidden_and_read_only'
          assert re.findall(r'^test (\S+) \.\.\. ok$', text, re.M) == [expected], text
          summaries = re.findall(r'^test result:.*$', text, re.M)
          assert len(summaries) == 1 and summaries[0].startswith('test result: ok. 1 passed; 0 failed; 0 ignored;'), summaries
          for game in ['ARENA','COLLECT']:
              root = pathlib.Path('orientation-evidence/export')
              source = (root/f'export-{game}-source.png').read_bytes()
              assert source.startswith(b'\x89PNG\r\n\x1a\n') and source == (root/f'export-{game}-isolated.png').read_bytes()
              json.loads((root/f'export-{game}-manifest.json').read_text())
          PY
      - name: Strict default and optional consumer configurations
        run: |
          set -euo pipefail
          cargo clippy --locked --release -p orr_sample -p orr_editor --all-targets -- -D warnings
          cargo clippy --locked --release -p orr_sample --features project-export,project-create,collect-sprites,image-reimport --all-targets -- -D warnings
          cargo clippy --locked --release -p orr_editor --features sprites,collect-dodge,image-reimport,project-create --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-orientation-evidence
          path: orientation-evidence
          if-no-files-found: error

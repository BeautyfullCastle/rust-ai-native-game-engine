name: Room input controls focused Linux CI
# Additive checks only; no existing workflow or branch protection is changed.
on:
  pull_request:
    branches: [su/engine-correctness-hardening]
    paths:
      - '.github/workflows/room-input-controls-focused.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/orr_session/**'
      - 'crates/orr_input/**'
      - 'crates/orr_package/**'
      - 'crates/orr_sample/Cargo.toml'
      - 'crates/orr_sample/src/lib.rs'
      - 'crates/orr_sample/src/room*'
      - 'crates/orr_sample/src/room*/**'
      - 'crates/orr_sample/src/project*'
      - 'crates/orr_sample/src/project*/**'
      - 'crates/orr_sample/src/bin/room_escape.rs'
      - 'crates/orr_sample/src/bin/orr_export_room.rs'
      - 'crates/orr_sample/src/bin/orr_attach_room_controls.rs'
      - 'crates/orr_sample/src/bin/orr_playtest_room.rs'
      - 'crates/orr_sample/src/bin/orr_new_arena.rs'
      - 'crates/orr_sample/tests/*room*'
      - 'crates/orr_games/src/room*'
      - 'crates/orr_editor/Cargo.toml'
      - 'crates/orr_editor/src/app.rs'
      - 'crates/orr_editor/src/app/**'
      - 'crates/orr_editor/src/lib.rs'
      - 'crates/orr_editor/src/main.rs'
      - 'crates/orr_editor/src/room_authoring*'
      - 'crates/orr_editor/src/room_authoring*/**'
      - 'crates/orr_editor/src/room_input*'
      - 'crates/orr_editor/src/room_input*/**'
      - 'crates/orr_editor/src/bin/orr_room_input_map.rs'
      - 'crates/orr_editor/tests/room_input_map_authoring_ui.rs'
      - 'crates/orr_editor/tests/deps.rs'
      - 'crates/orr_editor/tests/room_input_map_boundary.rs'
      - 'tools/create_room_controls.py'
      - 'tools/test_create_room_controls.py'
      - 'tools/create_room_grid.py'
      - 'tools/test_create_room_grid.py'
      - 'docs/room-grid-authoring.md'
      - 'tools/test_attach_room_controls.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: room-input-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  room-input-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/ci-evidence
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record pinned source and scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'CARGO_TARGET_DIR=%s/room-input-controls-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          printf '%s\n' 'Native window, physical key capture and GPU checks are NOT RUN.' > "$EVIDENCE/limitations.txt"
      - name: Install official Ubuntu build dependencies
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "$rc" > "$EVIDENCE/dependencies.exit"' EXIT
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev 2>&1 | tee -a "$EVIDENCE/dependencies.log"
      - name: Select Rust 1.99.1 with Clippy
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "$rc" > "$EVIDENCE/toolchain.exit"' EXIT
          rustup toolchain install 1.99.1 --profile minimal --component clippy 2>&1 | tee "$EVIDENCE/toolchain.log"
          rustup override set 1.99.1 2>&1 | tee -a "$EVIDENCE/toolchain.log"
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          python3 --version | tee "$EVIDENCE/python.txt"
      - name: Run focused inventories, tests, lint and CPU export closure
        shell: python {0}
        run: |
          import hashlib, json, os, re, subprocess, sys, time, traceback
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE'])
          receipts, failures = [], []
          def save():
              (evidence / 'receipts.json').write_text(json.dumps(receipts, indent=2) + '\n')
          def run(label, command):
              record = {'label': label, 'command': command, 'log': label + '.log', 'exit': None}
              receipts.append(record)
              save()
              started = time.monotonic()
              try:
                  with (evidence / record['log']).open('w') as log:
                      result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, text=True, timeout=1500)
                  record['exit'] = result.returncode
              except subprocess.TimeoutExpired:
                  record['exit'] = 124
                  record['timeout_seconds'] = 1500
              finally:
                  record['elapsed_seconds'] = round(time.monotonic() - started, 3)
                  save()
              output = (evidence / record['log']).read_text(errors='replace')
              print(output, end='', flush=True)
              if record['exit'] != 0:
                  raise RuntimeError(f'{label}: exit {record["exit"]}')
              return output, record

          def attempt(label, callback):
              try:
                  callback()
              except Exception:
                  failures.append(label)
                  (evidence / (label + '-failure.log')).write_text(traceback.format_exc())
                  traceback.print_exc()

          expected_inventories = {
              'recorded-route-session': [
                  'replay::debug_presence_tests::presence_includes_commands_outside_input_range',
              ],
              'recorded-route-converter': [
                  'room_project::recorded_route::tests::winning_route_replays_and_preserves_release',
                  'room_project::recorded_route::tests::rejects_debug_commands_at_any_tick_and_simulation_commands',
                  'room_project::recorded_route::tests::rejects_invalid_identity_corruption_missing_ticks_and_stop_receipts',
                  'room_project::recorded_route::tests::bounds_steps_ticks_and_preparse_memory',
                  'room_project::recorded_route::tests::rejects_nonzero_start_missing_initial_frame_wrong_frame_and_intermediate_checksum',
              ],
              'recorded-route-editor': [
                  'room_authoring_panel::recorded_route::tests::actual_stopped_play_prepares_copies_and_replays_through_cli_when_supplied',
                  'room_authoring_panel::recorded_route::tests::close_blocker_play_restart_and_changed_file_invalidate_copy',
                  'room_authoring_panel::recorded_route::tests::actual_widgets_prepare_cancel_copy_emit_only_explicit_clipboard_output',
                  'room_authoring_panel::recorded_route::tests::same_path_reload_different_scene_and_corrupt_recording_cannot_reuse_prepared_route',
              ],
              'recorded-route-editor-controls': [
                  'room_authoring_panel::recorded_route::tests::actual_stopped_play_prepares_copies_and_replays_through_cli_when_supplied',
                  'room_authoring_panel::recorded_route::tests::close_blocker_play_restart_and_changed_file_invalidate_copy',
                  'room_authoring_panel::recorded_route::tests::actual_widgets_prepare_cancel_copy_emit_only_explicit_clipboard_output',
                  'room_authoring_panel::recorded_route::tests::same_path_reload_different_scene_and_corrupt_recording_cannot_reuse_prepared_route',
                  'room_authoring_panel::recorded_route::tests::authored_controls_are_refused_at_prepare_and_after_prepare',
              ],
              'playtest-keys-off-cli': [
                  'key_scripts_require_explicit_compiled_support',
              ],
              'playtest-keys-cli': [
                  'enabled::controls_are_required_read_fresh_and_never_fallback_on_invalid_project',
                  'enabled::key_script_validation_is_strict_before_project_admission',
                  'enabled::mapped_keys_win_repeat_and_report_exact_admitted_map_without_writes',
                  'enabled::maximum_key_script_report_is_bounded',
              ],
              'room-layout-shared-parser': [
                  'room_layout::tests::bounded_strict_shared_recipe',
              ],
              'editor-layout-import-backend': [
                  'room_authoring::layout_import::tests::bound_wall_and_play_mode_refuse_before_mutation',
                  'room_authoring::layout_import::tests::import_is_one_undoable_edit_and_save_reopens_without_sidecar_changes',
                  'room_authoring::layout_import::tests::imported_saved_puzzle_blocks_shortcut_and_replays_winning_detour',
                  'room_authoring::layout_import::tests::rejected_import_rolls_back_partial_changes_and_stale_context',
                  'room_authoring::layout_import::tests::same_checksum_document_rename_rejects_stale_preview',
              ],
              'editor-layout-import-controls-backend': [
                  'room_authoring::layout_import::tests::bound_wall_and_play_mode_refuse_before_mutation',
                  'room_authoring::layout_import::tests::import_is_one_undoable_edit_and_save_reopens_without_sidecar_changes',
                  'room_authoring::layout_import::tests::imported_saved_puzzle_blocks_shortcut_and_replays_winning_detour',
                  'room_authoring::layout_import::tests::rejected_import_rolls_back_partial_changes_and_stale_context',
                  'room_authoring::layout_import::tests::same_checksum_document_rename_rejects_stale_preview',
              ],
              'editor-layout-import-ui': [
                  'room_authoring_panel::layout_import::tests::actual_widgets_preview_cancel_apply_once_and_disable_for_model_edits',
                  'room_authoring_panel::layout_import::tests::draft_close_blocker_and_stale_source_invalidate_preview',
              ],
              'room-layout-unit': [
                  'project_create::room_layout::tests::strict_recipe_and_authoritative_admission',
                  'project_create::room_layout::tests::deterministic_layout_and_report_match_saved_scene',
                  'project_create::room_layout::tests::invalid_input_never_publishes_and_special_files_fail',
              ],
              'room-layout-cli': [
                  'authored_wall_blocks_direct_route_and_saved_detour_wins',
                  'cli_rejects_bad_recipe_and_incompatible_flags_without_output',
              ],
              'playtest-cli': [
                  'saved_completion_repeats_exactly_without_writes_and_requires_release',
                  'actual_wall_blocks_route_and_false_assertions_fail',
                  'rejects_schema_fields_ranges_budget_and_non_regular_inputs',
                  'cli_usage_and_project_admission_fail_closed',
                  'json_reports_repeatable_success_and_actionable_first_failure',
                  'json_usage_admission_and_maximum_report_are_bounded',
              ],
              'playtest-unified-cli': [
                  'saved_completion_repeats_exactly_without_writes_and_requires_release',
                  'actual_wall_blocks_route_and_false_assertions_fail',
                  'rejects_schema_fields_ranges_budget_and_non_regular_inputs',
                  'cli_usage_and_project_admission_fail_closed',
                  'json_reports_repeatable_success_and_actionable_first_failure',
                  'json_usage_admission_and_maximum_report_are_bounded',
                  'unified_controls_feature_does_not_grant_consumer_support',
              ],
              'editor-project-bin': [
                  'room_input_map_authoring::tests::bounded_history_and_semantic_selection_survive_reordered_imports',
                  'room_input_map_authoring::tests::eight_aliases_roundtrip_and_overflow_and_failed_save_preserve_state',
                  'room_input_map_authoring::tests::rejects_invalid_drafts_without_mutating_map_or_history',
                  'room_input_map_authoring::tests::safe_persistence_pending_draft_and_runtime_interpretation',
                  'room_input_map_authoring::tests::save_rejects_incompatible_root_document_names_without_writes',
                  'room_input_map_authoring::widgets::project_link::tests::applied_uncertain_outcome_is_not_reported_as_no_change',
                  'room_input_map_authoring::widgets::project_link::tests::attaches_reopens_and_revises_without_changing_sidecars_or_history',
                  'room_input_map_authoring::widgets::project_link::tests::changed_sidecar_after_preview_is_rejected_and_preview_consumed',
                  'room_input_map_authoring::widgets::project_link::tests::edits_drafts_and_every_request_field_invalidate_confirmation',
                  'room_input_map_authoring::widgets::project_link::tests::mismatch_pending_stale_and_external_changes_fail_without_retry',
                  'room_input_map_authoring::widgets::project_link::tests::production_widgets_cancel_repeat_edit_fail_and_commit',
                  'room_input_map_authoring::widgets::project_link::tests::production_widgets_revision_and_restore_do_not_reuse_confirmation',
              ],
              'editor-project-ui': [
                  'all_five_actions_persist_and_invalid_open_preserves_history',
                  'production_apply_history_save_reopen_and_pending_cancellation',
                  'production_duplicate_rejection_action_navigation_and_reserved_choices_absent',
                  'room_input_map_authoring::tests::bounded_history_and_semantic_selection_survive_reordered_imports',
                  'room_input_map_authoring::tests::eight_aliases_roundtrip_and_overflow_and_failed_save_preserve_state',
                  'room_input_map_authoring::tests::rejects_invalid_drafts_without_mutating_map_or_history',
                  'room_input_map_authoring::tests::safe_persistence_pending_draft_and_runtime_interpretation',
                  'room_input_map_authoring::tests::save_rejects_incompatible_root_document_names_without_writes',
                  'room_input_map_authoring::widgets::project_link::tests::applied_uncertain_outcome_is_not_reported_as_no_change',
                  'room_input_map_authoring::widgets::project_link::tests::attaches_reopens_and_revises_without_changing_sidecars_or_history',
                  'room_input_map_authoring::widgets::project_link::tests::changed_sidecar_after_preview_is_rejected_and_preview_consumed',
                  'room_input_map_authoring::widgets::project_link::tests::edits_drafts_and_every_request_field_invalidate_confirmation',
                  'room_input_map_authoring::widgets::project_link::tests::mismatch_pending_stale_and_external_changes_fail_without_retry',
                  'room_input_map_authoring::widgets::project_link::tests::production_widgets_cancel_repeat_edit_fail_and_commit',
                  'room_input_map_authoring::widgets::project_link::tests::production_widgets_revision_and_restore_do_not_reuse_confirmation',
                  'standalone_app_scrolls_to_project_preview_and_confirms_saved_map',
              ],
              'editor-project-boundary': [
                  'main_editor_play_is_separate_explicit_capability',
                  'project_linking_is_separate_from_main_editor_play',
                  'room_editor_is_explicit_and_default_off',
              ],
              'room-attach': [
                  'room_controls_attach::tests::attaches_preserving_manifest_semantics_and_exact_sidecar_and_backup',
                  'room_controls_attach::tests::conflicts_in_manifest_controls_and_scene_prevent_publication',
                  'room_controls_attach::tests::injected_prepublication_failures_keep_original_and_postpublication_is_explicit',
                  'room_controls_attach::tests::rejects_backup_collisions_preserving_everything',
                  'room_controls_attach::tests::rejects_null_duplicate_wrong_game_and_existing_controls_without_writes',
                  'room_controls_attach::tests::rejects_unsafe_controls_and_aliases',
                  'room_controls_attach::tests::explicit_revision_preserves_both_sidecars_and_every_version_backup',
                  'room_controls_attach::tests::revision_rejects_stale_references_aliases_and_unsafe_names_without_writes',
                  'room_controls_attach::tests::revision_rejects_missing_null_unsupported_and_corrupt_projects',
                  'room_controls_attach::tests::revision_rejects_old_and_new_links_and_backup_collisions',
                  'room_controls_attach::tests::revision_detects_early_and_late_changes_to_both_sidecars_and_project',
                  'room_controls_attach::tests::revision_failure_outcomes_preserve_data_and_uncertain_apply_rejects_retry',
              ],
              'editor-play': [
                  'app::room_controls::tests::actual_restart_restores_pinned_map_without_rereading_disk',
                  'app::room_controls::tests::actual_room_host_uses_physical_project_keys_and_releases_on_interrupted_focus',
                  'app::room_controls::tests::focus_reclaim_map_change_and_repeat_quarantine_until_release',
                  'app::room_controls::tests::fresh_cli_bootstrap_accepts_preadmitted_controls_after_play_ticks_only_once',
                  'app::room_controls::tests::full_editor_ui_does_not_treat_logical_escape_as_physical_release',
                  'app::room_controls::tests::invalid_map_and_pending_draft_do_not_replace_live_controls',
                  'app::room_controls::tests::missing_identity_and_shortcuts_do_not_create_gameplay_presses',
                  'app::room_controls::tests::missing_physical_release_cannot_leave_a_remapped_key_held',
                  'app::room_controls::tests::physical_aliases_signs_and_logical_escape_follow_admitted_map',
                  'app::room_controls::tests::production_widgets_require_explicit_use_for_play_and_disable_in_play',
                  'app::room_controls::tests::project_snapshot_survives_restart_but_not_a_different_scene',
                  'app::room_controls::tests::public_project_install_rejects_play_lease_and_pending_draft',
                  'app::room_controls::tests::scene_change_resets_session_map_without_discarding_authoring_draft',
              ],
          }

          def suite(label, package, features, targets):
              command = ['cargo', 'test', '--locked', '--release', '-p', package, '--no-default-features']
              if features:
                  command += ['--features', features]
              command += targets
              listing, record = run(label + '-inventory', command + ['--', '--list', '--format=terse'])
              names = re.findall(r'^(.+): test$', listing, re.M)
              record['test_count'] = len(names)
              save()
              if not names or len(names) != len(set(names)):
                  raise RuntimeError(f'{label}: empty or duplicate inventory')
              if label in expected_inventories and sorted(names) != sorted(expected_inventories[label]):
                  raise RuntimeError(f'{label}: focused inventory differs from the reviewed exact test set')
              output, record = run(label, command + ['--', '--format=pretty', '--color=never', '--test-threads=1'])
              if package == 'orr_package':
                  child_pattern = (r'test tests::fifo_inputs_fail_without_blocking \.\.\. \n'
                                   r'running 1 test\ntest tests::fifo_inputs_fail_without_blocking \.\.\. ok\n'
                                   r'\ntest result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; '
                                   + str(len(names) - 1) + r' filtered out; finished in [^\n]+\n\nok\n')
                  output, child_count = re.subn(child_pattern, 'test tests::fifo_inputs_fail_without_blocking ... ok\n', output)
                  record['fifo_subprocess_count'] = child_count
                  save()
                  if child_count != 1:
                      raise RuntimeError('Expected exactly one passing bounded FIFO child and parent')
              cases = re.findall(r'^test (.+) \.\.\. (ok|FAILED|ignored)(?: .*)?$', output, re.M)
              summaries = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;', output, re.M)
              record['test_count'] = len(cases)
              record['inventory_count'] = len(names)
              save()
              if summaries != [(str(len(names)), '0', '0', '0')] or sorted(name for name, status in cases if status == 'ok') != sorted(names):
                  raise RuntimeError(f'{label}: inventory, execution or skip mismatch')

          def source_fence(label):
              head, record = run(label + '-head', ['git', 'rev-parse', 'HEAD'])
              if head.strip() != os.environ['SOURCE_SHA']:
                  raise RuntimeError(f'{label}: HEAD changed from the pinned source')
              run(label + '-status', ['git', 'status', '--porcelain=v1', '--untracked-files=no'])
              # HEAD comparison catches staged additions as well as tracked edits/deletions.
              run(label + '-diff', ['git', 'diff', '--exit-code', 'HEAD', '--'])

          try:
              attempt('source-before', lambda: source_fence('source-before'))
              if failures:
                  raise RuntimeError('Refusing to test a dirty or unpinned source tree')
              on = 'room-input-actions,project-create,project-export'
              off = 'room-project,project-create,project-export'
              suites = [
                  ('recorded-route-session', 'orr_session', '', ['--lib', 'replay::debug_presence_tests::']),
                  ('recorded-route-converter', 'orr_sample', 'room-project', ['--lib', 'room_project::recorded_route::']),
                  ('recorded-route-editor', 'orr_editor', 'room-authoring', ['--lib', 'room_authoring_panel::recorded_route::']),
                  ('recorded-route-editor-controls', 'orr_editor', 'room-authoring,room-input-map-play', ['--lib', 'room_authoring_panel::recorded_route::']),
                  ('playtest-keys-off-cli', 'orr_sample', 'room-playtest,project-create', ['--test', 'room_playtest_keys_cli']),
                  ('playtest-keys-cli', 'orr_sample', 'room-playtest,project-create,room-input-actions', ['--test', 'room_playtest_keys_cli']),
                  ('room-layout-shared-parser', 'orr_sample', 'room-project', ['--lib', 'room_layout::']),
                  ('editor-layout-import-backend', 'orr_editor', 'room-authoring', ['--lib', 'room_authoring::layout_import::']),
                  ('editor-layout-import-controls-backend', 'orr_editor', 'room-authoring,room-input-map-play', ['--lib', 'room_authoring::layout_import::']),
                  ('editor-layout-import-ui', 'orr_editor', 'room-authoring', ['--lib', 'room_authoring_panel::layout_import::']),
                  ('room-layout-unit', 'orr_sample', 'project-create,room-project', ['--lib', 'project_create::room_layout::']),
                  ('room-layout-cli', 'orr_sample', 'project-create,room-playtest', ['--test', 'room_layout_cli']),
                  ('playtest-cli', 'orr_sample', 'room-playtest,project-create', ['--test', 'room_playtest_cli']),
                  ('playtest-unified-cli', 'orr_sample', 'room-playtest,project-create,room-input-actions', ['--test', 'room_playtest_cli']),
                  ('room-attach', 'orr_sample', 'room-controls-attach,project-create', ['--lib', 'room_controls_attach::']),
                  ('room-controls', 'orr_sample', on, ['--lib', 'room_controls::']),
                  ('room-admission-on', 'orr_sample', on, ['--lib', 'room_controls_project_tests::']),
                  ('room-admission-off', 'orr_sample', off, ['--lib', 'room_controls_project_tests::']),
                  ('room-runtime-on', 'orr_sample', on, ['--lib', 'room_app::']),
                  ('room-runtime-off', 'orr_sample', off, ['--lib', 'room_app::']),
                  ('package', 'orr_package', '', ['--lib']),
                  ('editor-play', 'orr_editor', 'room-input-map-play', ['--lib', 'app::room_controls::']),
                  ('editor-project-bin', 'orr_editor', 'room-input-map-project,project-create', ['--bin', 'orr_room_input_map']),
                  ('editor-project-ui', 'orr_editor', 'room-input-map-project,project-create', ['--test', 'room_input_map_authoring_ui']),
                  ('editor-project-boundary', 'orr_editor', 'room-input-map-project,project-create', ['--test', 'room_input_map_boundary']),
                  ('editor-bin', 'orr_editor', 'room-input-map-editor', ['--bin', 'orr_room_input_map']),
                  ('editor-ui', 'orr_editor', 'room-input-map-editor', ['--test', 'room_input_map_authoring_ui']),
                  ('editor-default-off', 'orr_editor', '', ['--test', 'deps']),
                  ('editor-room-boundary', 'orr_editor', '', ['--test', 'room_input_map_boundary']),
              ]
              for args in suites:
                  attempt(args[0], lambda args=args: suite(*args))

              def python_tests():
                  output, record = run('python-controls', ['python3', '-m', 'unittest', 'discover', '-s', 'tools', '-p', 'test_create_room_controls.py', '-v'])
                  record['test_count'] = sum(1 for line in output.splitlines() if line.startswith('test_') and line.endswith(' ... ok'))
                  save()
                  if record['test_count'] != 13 or not re.search(r'^Ran 13 tests in ', output, re.M) or not re.search(r'^OK$', output, re.M):
                      raise RuntimeError('Python suite must execute all 13 cases without skips')
              attempt('python-controls', python_tests)

              def python_grid_tests():
                  from textwrap import dedent
                  expected = [
                      'test_create_room_grid.GridMergeTests.test_cli_merge_formats_and_duplicate_rejection',
                      'test_create_room_grid.GridMergeTests.test_merge_does_not_relax_invalid_input',
                      'test_create_room_grid.GridMergeTests.test_merge_option_types_are_strict',
                      'test_create_room_grid.GridMergeTests.test_more_than_sixty_four_boxes_rejected',
                      'test_create_room_grid.GridMergeTests.test_more_than_sixty_four_tiles_can_merge',

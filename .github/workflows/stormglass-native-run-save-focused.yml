name: Stormglass native run save CI
# CPU App/Session evidence; no native window, browser, physical input or GPU acceptance.
on:
  push:
    branches: [su/stormglass-native-run-save-20261104]
permissions:
  contents: read
concurrency:
  group: stormglass-native-run-save-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-run-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          python3 --version | tee "$EVIDENCE/python.txt"
      - name: Verify native run save and production consumer
        shell: python {0}
        run: |
          import hashlib, json, os, re, runpy, shutil
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE']).resolve()
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          run = helpers['run_logged']
          expected_suites = {'defense_app': ['defense_app::pause_tests::admitted_delayed_input_is_frozen_then_completes_after_explicit_continue', 'defense_app::pause_tests::focus_false_dominates_continue_and_gameplay_in_any_event_order', 'defense_app::pause_tests::focus_return_requires_explicit_continue', 'defense_app::pause_tests::held_gestures_cannot_cross_pause_or_continue', 'defense_app::pause_tests::long_pause_freezes_frame_tick_economy_and_resumes_without_catchup', 'defense_app::pause_tests::manual_pause_keeps_actual_session_frame_unchanged', 'defense_app::pause_tests::pause_and_continue_frames_do_not_submit_mixed_gameplay', 'defense_app::pause_tests::pause_clears_unsubmitted_queue_selection_and_partial_time', 'defense_app::pause_tests::pause_continue_buttons_are_event_attributed_and_consume_frame', 'defense_app::pause_tests::ready_terminal_and_authored_restart_contracts_survive_pause', 'defense_app::pause_tests::repeated_keys_do_not_pause_or_resume_and_space_remains_summon', 'defense_app::pause_tests::responsive_pause_controls_render_and_use_matching_hit_rects', 'defense_app::pause_tests::unfocused_raw_input_blocks_start_resume_and_commands', 'defense_app::run_save_acceptance_tests::admitted_scene_bytes_survive_source_replacement', 'defense_app::run_save_acceptance_tests::authored_natural_terminal_and_restart_restore_exact_original_source', 'defense_app::run_save_acceptance_tests::detached_loading_cancel_busy_mixed_input_and_focus_preserve_live_state', 'defense_app::run_save_acceptance_tests::hostile_parse_errors_are_bounded_sanitized_and_survive_redraw', 'defense_app::run_save_acceptance_tests::journal_cap_disables_save_but_app_keeps_advancing_and_old_copy_survives', 'defense_app::run_save_acceptance_tests::replay_checksum_error_is_atomic_after_multiple_detached_batches', 'defense_app::run_save_tests::actual_app_repeated_save_replace_cancel_and_focus', 'defense_app::run_save_tests::actual_app_save_title_load_and_next_input_parity', 'defense_app::run_save_tests::separate_process_restore', 'defense_app::tests::bounded_cli', 'defense_app::tests::bounded_scene_loading_preserves_defaults_and_authored_restart', 'defense_app::tests::campaign_only_scene_preserves_default_scenario_and_authored_campaign', 'defense_app::tests::scene_cli_is_explicit_and_available_in_both_modes', 'defense_app::tests::scene_loader_rejects_symlinks_and_fifos_before_read', 'defense_app::tests::session_tracks_scenario_build_identity', 'defense_app::tests::unreadable_scene_fails_before_startup'], 'defense_run_save': ['defense_run_save::tests::malformed_numbers_actions_ordinals_and_nested_fields_are_rejected', 'defense_run_save::tests::payload_integrity_covers_both_future_admissions', 'defense_run_save::tests::reconstructs_tick_boundaries_and_two_hidden_future_admissions', 'defense_run_save::tests::recording_limit_does_not_stop_session', 'defense_run_save::tests::strict_envelope_and_pending_tail_validation'], 'defense_run_save_store': ['defense_run_save_store::tests::capacity_boundary_allows_last_generation_then_refuses', 'defense_run_save_store::tests::foreign_entries_are_preserved_and_scan_is_bounded', 'defense_run_save_store::tests::hostile_generation_never_followed_and_old_save_preserved', 'defense_run_save_store::tests::opened_directory_survives_path_replacement_without_redirecting_write', 'defense_run_save_store::tests::rejects_linked_oversized_or_public_generation_without_losing_previous', 'defense_run_save_store::tests::rejects_symlink_components_unsafe_directory_and_forbidden_roots', 'defense_run_save_store::tests::repeated_save_is_immutable_and_bounded'], 'defense_ui': ['defense_ui::authored_core_tests::health_bar_uses_authored_maximum_and_stays_bounded', 'defense_ui::click_attribution_tests::board_clicks_select_and_move_actual_unit_without_hover_retargeting', 'defense_ui::click_attribution_tests::configured_click_distance_duration_and_generation_bound_pending_press', 'defense_ui::click_attribution_tests::cross_frame_press_works_but_drag_out_return_or_bare_release_does_not', 'defense_ui::click_attribution_tests::first_eligible_click_wins_and_later_valid_click_cannot_restart', 'defense_ui::click_attribution_tests::genuine_economic_and_restart_clicks_keep_event_target_and_mutate_simulation', 'defense_ui::click_attribution_tests::keyboard_pulses_still_reach_simulation_after_pointer_cancellation', 'defense_ui::click_attribution_tests::mixed_click_and_drag_releases_do_not_borrow_eligibility', 'defense_ui::click_attribution_tests::pointer_gone_cancels_pending_and_focus_loss_cancels_entire_frame', 'defense_ui::click_attribution_tests::resized_layout_and_duplicate_press_cancel_old_gesture', 'defense_ui::click_attribution_tests::secondary_buttons_never_qualify_or_retarget_primary_click', 'defense_ui::click_attribution_tests::start_is_pinned_to_click_not_late_hover_and_does_not_spend', 'defense_ui::click_attribution_tests::unrelated_click_cannot_restart_spend_or_select_after_late_motion', 'defense_ui::run_save_tests::changed_list_cancels_press_and_loading_only_cancels', 'defense_ui::run_save_tests::focus_loss_and_restore_discard_gestures_and_exhaustion_is_safe', 'defense_ui::run_save_tests::modal_selection_pages_and_confirmation_have_explicit_targets', 'defense_ui::run_save_tests::paused_save_load_never_continue_or_issue_commands', 'defense_ui::run_save_tests::terminal_run_can_pause_and_save_with_enabled_storage', 'defense_ui::run_save_tests::title_load_dominates_start_keyboard_and_pointer', 'defense_ui::tests::hud_wave_total_uses_default_and_authored_campaign', 'defense_ui::tests::pointer_select_and_move_uses_only_local_board', 'defense_ui::tests::ready_start_does_not_spend_and_summon_has_one_sequence', 'defense_ui::tests::responsive_cell_hit_is_local_and_exact'], 'defense_view': ['defense_view::tests::aspect_fit_and_clipped_hits_only_select_local_cells', 'defense_view::tests::frame_wrapper_and_readonly_view_produce_identical_clipped_shapes']}
          compatibility_suites = {'defense_app': ['defense_app::pause_tests::admitted_delayed_input_is_frozen_then_completes_after_explicit_continue', 'defense_app::pause_tests::focus_false_dominates_continue_and_gameplay_in_any_event_order', 'defense_app::pause_tests::focus_return_requires_explicit_continue', 'defense_app::pause_tests::held_gestures_cannot_cross_pause_or_continue', 'defense_app::pause_tests::long_pause_freezes_frame_tick_economy_and_resumes_without_catchup', 'defense_app::pause_tests::manual_pause_keeps_actual_session_frame_unchanged', 'defense_app::pause_tests::pause_and_continue_frames_do_not_submit_mixed_gameplay', 'defense_app::pause_tests::pause_clears_unsubmitted_queue_selection_and_partial_time', 'defense_app::pause_tests::pause_continue_buttons_are_event_attributed_and_consume_frame', 'defense_app::pause_tests::ready_terminal_and_authored_restart_contracts_survive_pause', 'defense_app::pause_tests::repeated_keys_do_not_pause_or_resume_and_space_remains_summon', 'defense_app::pause_tests::responsive_pause_controls_render_and_use_matching_hit_rects', 'defense_app::pause_tests::unfocused_raw_input_blocks_start_resume_and_commands', 'defense_app::tests::bounded_cli', 'defense_app::tests::bounded_scene_loading_preserves_defaults_and_authored_restart', 'defense_app::tests::campaign_only_scene_preserves_default_scenario_and_authored_campaign', 'defense_app::tests::scene_cli_is_explicit_and_available_in_both_modes', 'defense_app::tests::scene_loader_rejects_symlinks_and_fifos_before_read', 'defense_app::tests::session_tracks_scenario_build_identity', 'defense_app::tests::unreadable_scene_fails_before_startup'], 'defense_ui': ['defense_ui::authored_core_tests::health_bar_uses_authored_maximum_and_stays_bounded', 'defense_ui::click_attribution_tests::board_clicks_select_and_move_actual_unit_without_hover_retargeting', 'defense_ui::click_attribution_tests::configured_click_distance_duration_and_generation_bound_pending_press', 'defense_ui::click_attribution_tests::cross_frame_press_works_but_drag_out_return_or_bare_release_does_not', 'defense_ui::click_attribution_tests::first_eligible_click_wins_and_later_valid_click_cannot_restart', 'defense_ui::click_attribution_tests::genuine_economic_and_restart_clicks_keep_event_target_and_mutate_simulation', 'defense_ui::click_attribution_tests::keyboard_pulses_still_reach_simulation_after_pointer_cancellation', 'defense_ui::click_attribution_tests::mixed_click_and_drag_releases_do_not_borrow_eligibility', 'defense_ui::click_attribution_tests::pointer_gone_cancels_pending_and_focus_loss_cancels_entire_frame', 'defense_ui::click_attribution_tests::resized_layout_and_duplicate_press_cancel_old_gesture', 'defense_ui::click_attribution_tests::secondary_buttons_never_qualify_or_retarget_primary_click', 'defense_ui::click_attribution_tests::start_is_pinned_to_click_not_late_hover_and_does_not_spend', 'defense_ui::click_attribution_tests::unrelated_click_cannot_restart_spend_or_select_after_late_motion', 'defense_ui::tests::hud_wave_total_uses_default_and_authored_campaign', 'defense_ui::tests::pointer_select_and_move_uses_only_local_board', 'defense_ui::tests::ready_start_does_not_spend_and_summon_has_one_sequence', 'defense_ui::tests::responsive_cell_hit_is_local_and_exact'], 'defense_view': ['defense_view::tests::aspect_fit_and_clipped_hits_only_select_local_cells', 'defense_view::tests::frame_wrapper_and_readonly_view_produce_identical_clipped_shapes']}
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def test_producer(feature, label):
              output = run(['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--features', feature, '--lib', '--no-run', '--message-format=json'], evidence / (label + '-build.log'))
              candidates = set()
              for line in output.splitlines():
                  if not line.startswith('{'):
                      continue
                  item = json.loads(line)
                  if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'orr_sample' and item.get('profile', {}).get('test') and item.get('executable'):
                      candidates.add(item['executable'])
              if len(candidates) != 1:
                  raise RuntimeError('Expected exactly one libtest producer: ' + label)
              source = Path(candidates.pop())
              if not source.is_file():
                  raise RuntimeError('Missing test executable')
              return source
          producer = evidence / 'orr_sample_tests'
          shutil.copy2(test_producer('coop-defense-run-save', 'feature'), producer)
          fresh = evidence / 'fresh-process'
          fresh.mkdir()
          os.environ['ORR_NATIVE_SAVE_EVIDENCE_DIR'] = str(fresh)
          def suites(executable, inventory, prefix):
              for suite, expected in inventory.items():
                  output = run([str(executable.resolve()), suite + '::', '--format=pretty', '--color=never', '--test-threads=1'], evidence / (prefix + suite + '.log'))
                  helpers['validate_tests'](output, suite, len(expected))
                  if {name for name, _ in helpers['CASE'].findall(output)} != set(expected):
                      raise RuntimeError('Missing exact ' + suite + ' inventory')
          suites(producer, expected_suites, '')
          receipts = list(fresh.glob('native-run-save-*/receipt.json'))
          if len(receipts) != 1:
              raise RuntimeError('Expected one separate-process receipt')
          receipt_path = receipts[0]
          receipt = json.loads(receipt_path.read_text())
          p, c = receipt['producer'], receipt['consumer']
          if receipt['kind'] != 'native CPU egui App/Session separate-process restore' or receipt['frame_bytes_equal'] is not True or receipt['frame_checksums_equal'] is not True or receipt['os_window_physical_input_gpu_verified'] is not False:
              raise RuntimeError('Invalid receipt scope or comparison')
          pids = [receipt['parent_pid'], p['pid'], c['pid']]
          if len(set(pids)) != 3 or not all(type(pid) is int and pid > 0 for pid in pids):
              raise RuntimeError('Not separate processes')
          for mode, item in [('produce', p), ('consume', c)]:
              if item['mode'] != mode or item['executable_sha256'] != sha(producer) or item['origin'] != 'default' or item['saved_tick'] != 2 or item['saved_high_water'] != 3 or item['continued_high_water'] != 4:
                  raise RuntimeError('Wrong fresh-process identity or admission boundary')
              rows = item['frame_checksums']
              if len(rows) != 31 or [row[0] for row in rows] != list(range(2, 33)) or rows[0][1] != item['saved_checksum']:
                  raise RuntimeError('Incomplete frame checksum trace')
              if json.loads((receipt_path.parent / (mode + '.json')).read_text()) != item:
                  raise RuntimeError('Child receipt mismatch')
          if p['frame_checksums'] != c['frame_checksums']:
              raise RuntimeError('Frame checksum mismatch')
          a = (receipt_path.parent / 'produce.trace').read_bytes()
          b = (receipt_path.parent / 'consume.trace').read_bytes()
          if not a or a != b:
              raise RuntimeError('Full frame bytes differ')
          suites(test_producer('coop-defense', 'compatibility'), compatibility_suites, 'compatibility-')
          for feature, label in [('coop-defense-run-save', 'strict'), ('coop-defense', 'compatibility-strict')]:
              run(['cargo', 'clippy', '--locked', '--release', '-p', 'orr_sample', '--features', feature, '--lib', '--', '-D', 'warnings'], evidence / (label + '.log'))
          run(['cargo', 'check', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--lib'], evidence / 'feature-off.log')
          run(['cargo', 'build', '--locked', '--release', '-p', 'orr_sample', '--features', 'coop-defense-run-save', '--bin', 'coop_defense'], evidence / 'native-build.log')
          binary = (Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / 'release/coop_defense').resolve()
          shipped = evidence / 'coop_defense'
          shutil.copy2(binary, shipped)
          scene = Path('examples/static-game-starter/scenes/stormglass-short.scene.yaml')
          shipped_scene = evidence / scene.name
          shutil.copy2(scene, shipped_scene)
          smoke = run([str(shipped), '--headless', '--scene', str(shipped_scene), '--ticks', '6000', '--demo'], evidence / 'native-smoke.log')
          rows = re.findall(r'^Stormglass tick=(\d+) wave=(\d+) phase=(\d+) reactor=(\d+) kills=(\d+) merges=(\d+) checksum=(0x[0-9a-f]{16})$', smoke, re.MULTILINE)
          expected_smoke = ('1884', '3', '1', '75', '72', '29', '0x7f44dac0fea52bc1')
          if rows != [expected_smoke]:
              raise RuntimeError('Native headless result changed from verified authored baseline')
          run(['git', 'diff', '--exit-code'], evidence / 'source-unchanged.log')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'tests': {suite: len(names) for suite, names in expected_suites.items()}, 'test_inventory': expected_suites, 'compatibility_tests': {suite: len(names) for suite, names in compatibility_suites.items()}, 'compatibility_inventory': compatibility_suites, 'feature_tests': 66, 'feature_disabled_tests': 39, 'unique_cases': 66, 'session_input_delay': 2, 'strict': True, 'compatibility_strict': True, 'feature_off': True, 'test_producer_sha256': sha(producer), 'native_binary_sha256': sha(shipped), 'scene_sha256': sha(shipped_scene), 'native_smoke': rows[0], 'fresh_process_receipt': str(receipt_path.relative_to(evidence)), 'fresh_process_trace_sha256': hashlib.sha256(a).hexdigest(), 'cpu_egui': True, 'native_window': False, 'physical_input': False, 'browser': False, 'gpu': False, 'full_workspace': False}, indent=2))
      - name: Preserve exact source and evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-native-run-save-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

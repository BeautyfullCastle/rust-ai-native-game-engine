name: Checked package update
on:
  push:
    branches: [main, su/engine-correctness-hardening]
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    name: checked package update (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: cpu, os: ubuntu-22.04}
          - {mode: cpu, os: windows-latest}
          - {mode: ui, os: ubuntu-22.04}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install software Vulkan
        if: matrix.mode == 'ui'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers libxkbcommon-dev
      - name: Run fresh source-bound acceptance
        env:
          ORR_PACKAGE_UPDATE_EVIDENCE: ${{ runner.temp }}/orr-package-update-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: python -B tools/package_update_gate.py '${{ matrix.mode }}'
      - name: Retain evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-update-${{ matrix.mode }}-${{ matrix.os }}
          path: ${{ runner.temp }}/orr-package-update-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  required:
    name: checked package update required
    if: always()
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - env:
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE" = success

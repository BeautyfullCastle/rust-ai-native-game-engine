name: Terrain patrol native bundle focused CI
on:
  push:
    branches: [codex/terrain-patrol-native-bundle-20261107]
permissions:
  contents: read
jobs:
  terrain-patrol-native-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      EDITOR_FEATURES: package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol,mesh-prop-shading,terrain-patrol-export
      BUNDLE_FEATURES: authored-surface-bundle,terrain-patrol-bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect independent results and require every gate
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          last_ok=0
          legacy_ready=0
          patrol_ready=0
          printf 'suite\tcommand_exit\ttee_exit\tresult\n' > ci-evidence/status.tsv
          run_log() {
            local label="$1"; shift
            set +e
            "$@" 2>&1 | tee "ci-evidence/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            command_exit="${statuses[0]}"
            tee_exit="${statuses[1]}"
            last_ok=0
            if [[ "$command_exit" -eq 0 && "$tee_exit" -eq 0 ]]; then
              last_ok=1
            else
              failed=1
            fi
          }
          check() {
            local label="$1"; shift
            run_log "$label" "$@"
            printf '%s\t%s\t%s\t%s\n' "$label" "$command_exit" "$tee_exit" "$last_ok" >> ci-evidence/status.tsv
          }
          cases() {
            local label="$1" count="$2"; shift 2
            run_log "$label" "$@"
            if [[ "$last_ok" -eq 1 ]]; then
              if ! grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "ci-evidence/$label.log"; then
                failed=1
                last_ok=0
              fi
            fi
            printf '%s\t%s\t%s\t%s\n' "$label" "$command_exit" "$tee_exit" "$last_ok" >> ci-evidence/status.tsv
          }
          cases legacy-profile 4 cargo test --locked -p orr_navigation_view --features authored-surface-bundle --lib bundle::manifest::profile_tests:: -- --test-threads=1
          cases legacy-descriptors 5 cargo test --locked -p orr_navigation_view --features authored-surface-bundle --lib bundle::manifest::tests:: -- --test-threads=1
          cases legacy-source 3 cargo test --locked -p orr_navigation_view --features authored-surface-bundle --lib bundle::source::tests:: -- --test-threads=1
          cases legacy-matrix 3 cargo test --locked -p orr_navigation_view --features authored-surface-bundle --lib terrain_patrol_tests:: -- --test-threads=1
          check legacy-build cargo build --locked -p orr_navigation_view --features authored-bundle --bin navigation_player
          export ORR_TERRAIN_PATROL_LEGACY_RUNTIME="$RUNNER_TEMP/legacy-navigation-player"
          if [[ "$last_ok" -eq 1 ]]; then
            if cp target/debug/navigation_player "$ORR_TERRAIN_PATROL_LEGACY_RUNTIME"; then legacy_ready=1; else failed=1; fi
          fi
          cases direct-profile 4 cargo test --locked -p orr_navigation_view --features authored-surface-bundle,terrain-patrol --lib bundle::manifest::profile_tests:: -- --test-threads=1
          cases direct-matrix 4 cargo test --locked -p orr_navigation_view --features authored-surface-bundle,terrain-patrol --lib terrain_patrol_tests:: -- --test-threads=1
          cases patrol-profile 6 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib bundle::manifest::profile_tests:: -- --test-threads=1
          cases patrol-matrix 4 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib terrain_patrol_tests:: -- --test-threads=1
          cases patrol-cli 3 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib player::patrol_bundle_tests:: -- --test-threads=1
          cases patrol-probe 2 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib bundle::export::patrol_native_tests:: -- --skip native_patrol_bundle_relocates_source_hidden_and_matches_two_hundred_tick_restart --test-threads=1
          cases patrol-descriptors 5 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib bundle::manifest::tests:: -- --test-threads=1
          cases patrol-source 3 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib bundle::source::tests:: -- --test-threads=1
          check patrol-build cargo build --locked -p orr_navigation_view --features terrain-patrol-bundle --bin navigation_player --bin navigation_export
          export ORR_TERRAIN_PATROL_BUNDLE_RUNTIME="$RUNNER_TEMP/patrol-navigation-player"
          if [[ "$last_ok" -eq 1 ]]; then
            if cp target/debug/navigation_player "$ORR_TERRAIN_PATROL_BUNDLE_RUNTIME"; then patrol_ready=1; else failed=1; fi
          fi
          if [[ "$legacy_ready" -eq 1 && "$patrol_ready" -eq 1 ]]; then
            sha256sum "$ORR_TERRAIN_PATROL_LEGACY_RUNTIME" "$ORR_TERRAIN_PATROL_BUNDLE_RUNTIME" | tee ci-evidence/native-runtime.txt
            cases native-relocated 1 cargo test --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib bundle::export::patrol_native_tests::native_patrol_bundle_relocates_source_hidden_and_matches_two_hundred_tick_restart -- --exact --ignored --test-threads=1
          else
            echo 'UNRUN: native relocation acceptance requires successful legacy AND patrol build/copy.' | tee ci-evidence/native-unrun.txt
            failed=1
          fi
          cases editor-worker 7 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib app::navigation_export::tests:: -- --skip actual_button_worker_relocates_and_rejects_queued_source_change --test-threads=1
          cases editor-patrol 1 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib app::navigation_export::patrol_tests:: -- --skip actual_patrol_export_button_delivers_saved_profile_and_native_checksum --test-threads=1
          cases authoring 2 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib navigation_panel::patrol_integration_tests:: -- --test-threads=1
          if [[ "$patrol_ready" -eq 1 ]]; then
            export ORR_EDITOR_NAVIGATION_RUNTIME="$ORR_TERRAIN_PATROL_BUNDLE_RUNTIME"
            export ORR_TERRAIN_PATROL_EXPORT_RUNTIME="$ORR_TERRAIN_PATROL_BUNDLE_RUNTIME"
            cases editor-worker-native 1 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib app::navigation_export::tests::actual_button_worker_relocates_and_rejects_queued_source_change -- --exact --ignored --test-threads=1
            cases editor-patrol-native 1 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib app::navigation_export::patrol_tests::actual_patrol_export_button_delivers_saved_profile_and_native_checksum -- --exact --ignored --test-threads=1
          else
            echo 'UNRUN: two required native UI acceptances require a successful patrol build/copy.' | tee ci-evidence/editor-native-unrun.txt
            failed=1
          fi
          check direct-editor cargo check --locked -p orr_editor --features terrain-patrol,navigation-export --lib
          check minimal-editor cargo check --locked -p orr_editor --features terrain-patrol-export --lib
          check clippy-legacy cargo clippy --locked -p orr_navigation_view --features authored-surface-bundle --lib --bin navigation_player --bin navigation_export -- -D warnings
          check clippy-patrol cargo clippy --locked -p orr_navigation_view --features "$BUNDLE_FEATURES" --lib --bin navigation_player --bin navigation_export -- -D warnings
          check clippy-editor cargo clippy --locked -p orr_editor --features "$EDITOR_FEATURES" --lib -- -D warnings
          echo 'Expected59 CPU executions, including3 required explicitly executed ignored native/UI acceptances. Native processes are headless. GPU/window/physical playtest/video UNRUN; Windows new UI/FS/strict UNRUN after known OS5, no retry.' | tee ci-evidence/scope.txt
          printf 'aggregate_exit=%s\n' "$failed" | tee ci-evidence/result.txt
          exit "$failed"
      - name: Preserve originals including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-patrol-native-bundle-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

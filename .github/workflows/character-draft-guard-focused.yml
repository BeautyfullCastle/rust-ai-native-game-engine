name: Character draft guard focused CI
on:
  push:
    branches: [codex/character-draft-guard-20261107]
permissions:
  contents: read
jobs:
  character-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Unapplied draft protection and existing applied save and runtime path
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features room-character,project-create --lib room_character_panel::tests::draft_guard -- --test-threads=1 2>&1 | tee ci-evidence/draft-guards.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/draft-guards.log
          cargo test --locked -p orr_editor --features room-character,project-create --test room_character_workflow character_edit_undo_redo_reopen_and_authoritative_play_states -- --exact 2>&1 | tee ci-evidence/draft-widgets.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/draft-widgets.log
          cargo test --locked -p orr_editor --features room-character,project-create --lib room_character_panel::tests::pair_save_second_file_failure_restores_both_files_and_dirty_history_then_retries -- --exact 2>&1 | tee ci-evidence/save-rollback.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/save-rollback.log
          cargo build --locked -p orr_sample --features room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_CHARACTER_CLIP_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features room-character,project-create,windows-export --lib room_character_panel::tests::clip_catalog_mapping_saves_into_source_hidden_real_export -- --exact 2>&1 | tee ci-evidence/export-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/export-regression.log
          cargo clippy --locked -p orr_editor --features room-character,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-character.log
          cargo clippy --locked -p orr_editor --features models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-draft-guard-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

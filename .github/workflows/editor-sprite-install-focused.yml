name: Editor local sprite install focused CI
on:
  push:
    paths:
      - '.github/workflows/editor-sprite-install-focused.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/sprite_demo/**'
      - 'scenes/arena_blank.scene.yaml'
      - 'crates/orr_editor/**'
      - 'crates/orr_package/**'
      - 'crates/orr_sample/**'
      - 'crates/orr_sprite/**'
  pull_request:
    paths:
      - '.github/workflows/editor-sprite-install-focused.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/sprite_demo/**'
      - 'scenes/arena_blank.scene.yaml'
      - 'crates/orr_editor/**'
      - 'crates/orr_package/**'
      - 'crates/orr_sample/**'
      - 'crates/orr_sprite/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-sprite-install-${{ github.ref }}
  cancel-in-progress: false
jobs:
  editor-sprite-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}' | tee ci-evidence/source-commit-and-tree.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy 2>&1 | tee ci-evidence/rustup.log
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          uname -a | tee ci-evidence/platform.txt
          hostname | tee ci-evidence/runner-hostname.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Run focused sprite install and compatibility checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/editor-sprite-install-${{ github.run_id }}-${{ github.run_attempt }}
        shell: python {0}
        run: |
          import json, re, subprocess
          from pathlib import Path

          evidence = Path('ci-evidence')
          results = []
          full = 'sprite-grid-authoring,tilemap'

          def run(label, command, expected=None):
              log_path = evidence / f'{label}.log'
              with log_path.open('w', encoding='utf-8') as log:
                  process = subprocess.Popen(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding='utf-8',
                      errors='replace',
                      bufsize=1,
                  )
                  lines = []
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                      log.flush()
                      lines.append(line)
                  code = process.wait()
              output = ''.join(lines)
              ok = code == 0
              if expected is not None:
                  summaries = re.findall(
                      r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',
                      output,
                      re.M,
                  )
                  names = re.findall(r'^test (\S+) \.\.\. ok$', output, re.M)
                  running = re.findall(r'^running (\d+) tests?$', output, re.M)
                  ok = ok and summaries == [('ok', str(expected), '0', '0', '0')]
                  ok = ok and len(names) == len(set(names)) == expected
                  ok = ok and running == [str(expected)]
              results.append({
                  'label': label,
                  'command': command,
                  'exit': code,
                  'ok': ok,
                  'expected_tests': expected,
              })
              (evidence / 'results.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
              return ok

          def tests(label, selector, expected, features=full):
              run(
                  label,
                  ['cargo', 'test', '--locked', '-p', 'orr_editor', '--features', features, '--lib', selector, '--', '--test-threads=1'],
                  expected,
              )

          run(
              'sprite-package-install-backend',
              ['cargo', 'test', '--locked', '-p', 'orr_editor', '--features', 'sprite-package-install', '--lib', 'sprite_package_install::tests::', '--', '--test-threads=1'],
              10,
          )
          run(
              'existing-sprite-panel-load-assign',
              ['cargo', 'test', '--locked', '-p', 'orr_editor', '--features', 'sprite-package-install', '--lib', 'sprite_panel::tests::headless_widgets_assign_remove_save_and_guard_dirty_scene_switch', '--', '--test-threads=1'],
              1,
          )
          tests(
              'sprite-install-ui',
              'sprite_panel::package_install_ui::tests::',
              4,
              features='sprite-package-install',
          )
          tests('sprite-install-preview-commit-integration', 'sprite_panel::package_install_ui::integration_tests::', 2)
          tests('sprite-settings-regression', 'sprite_panel::sprite_settings_tests::', 5)
          tests('clip-timing-regression', 'sprite_panel::clip_timing::tests::', 34)
          run(
              'strict-editor-install-feature',
              ['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', 'sprite-package-install', '--lib', '--', '-D', 'warnings'],
          )
          run(
              'strict-editor-grid-minimal-feature',
              ['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', 'sprite-grid-authoring', '--lib', '--', '-D', 'warnings'],
          )
          run(
              'strict-editor-grid-tilemap-full-feature',
              ['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', full, '--lib', '--', '-D', 'warnings'],
          )
          run(
              'strict-editor-sprites-only-feature',
              ['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', 'sprites', '--lib', '--', '-D', 'warnings'],
          )
          run(
              'editor-default-feature-off',
              ['cargo', 'check', '--locked', '-p', 'orr_editor', '--lib'],
          )
          (evidence / 'scope.txt').write_text(
              'Focused local sprite-package installation: checked sprite-only/new-name admission, read-only preview, checked install backend, four install-control UI tests, two Linux integration tests for preview/install/Load/Assign/save/source-hidden playback, existing SpritePanel Load/Assign/Save, settings and clip-timing regressions, strict minimal/full/sprites-only profiles, and default-feature-off editor compile. GUI checks use a headless egui harness; native window rendering, physical GPU rendering, Windows execution, and actual play/video are unverified. No workspace-wide validation is included.\n',
              encoding='utf-8',
          )
          if not all(result['ok'] for result in results):
              raise SystemExit('Focused editor sprite install checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-sprite-install-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

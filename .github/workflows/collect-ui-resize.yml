name: Collect UI resize acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-ui-resize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_COLLECT_RESIZE_CI: ${{ github.workspace }}/target/collect-ui-resize-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused resize state and actual EditorApp controls
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_RESIZE_CI"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Existing preview/panel/runtime and original GPU gates remain required
          # in collect-ui-screen-preview.yml; this workflow adds the resize scope.
          suite = "collect_ui_resize::tests"
          expected = {
              "collect_ui_resize::tests::all_anchors_and_nested_nodes_preserve_every_field_except_selected_size",
              "collect_ui_resize::tests::cancel_clears_moving_or_released_state_without_touching_source",
              "collect_ui_resize::tests::dimensions_must_be_positive_and_finite_on_each_axis",
              "collect_ui_resize::tests::entire_accepted_document_is_pinned_not_just_selected_geometry",
              "collect_ui_resize::tests::every_pinned_context_change_rejects_drag_and_released_candidate",
              "collect_ui_resize::tests::exact_limits_are_accepted_and_overflow_is_rejected_without_clamping",
              "collect_ui_resize::tests::finite_extreme_coordinates_cannot_overflow_intermediate_arithmetic",
              "collect_ui_resize::tests::invalid_current_dimensions_cancel_an_existing_draft",
              "collect_ui_resize::tests::invalid_pointer_at_start_motion_or_release_fails_closed",
              "collect_ui_resize::tests::missing_node_wrong_screen_and_invalid_source_refuse_start",
              "collect_ui_resize::tests::motion_only_tracks_numeric_ghost_and_release_includes_final_pointer",
              "collect_ui_resize::tests::new_begin_replaces_old_selection_context_and_candidate",
              "collect_ui_resize::tests::removed_selected_or_unrelated_node_rejects_apply",
              "collect_ui_resize::tests::repeated_release_or_motion_cannot_change_candidate_and_second_apply_is_stale",
              "collect_ui_resize::tests::resizes_with_landscape_portrait_and_independent_axis_scales",
              "collect_ui_resize::tests::rounds_delta_ties_away_before_adding_accepted_size",
              "collect_ui_resize::tests::subpixel_movement_at_either_limit_can_remain_noop",
              "collect_ui_resize::tests::unchanged_context_and_document_keep_motion_and_ready_candidate",
              "collect_ui_resize::tests::zero_subpixel_and_return_to_origin_create_no_candidate",
          }
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "resize-state.log")
          h["validate_tests"](output, suite, 19)
          if {name for name, status in h["CASE"].findall(output.replace("\r\n", "\n"))} != expected:
              raise RuntimeError("Exact resize state inventory differs from the 19 mandatory cases")
          name = "app::collect_ui_preview::tests::actual_editor_resize_controls_keep_explicit_selection_separate"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", name, "--", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-resize-controls-cpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected exactly one passing actual EditorApp resize test")
          for label, command in (
              ("default-check", ["cargo", "check", "--locked", "-p", "orr_editor", "--lib"]),
              ("minimal-collect-ui-check", ["cargo", "check", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui", "--lib"]),
              ("collect-ui-strict", ["cargo", "clippy", "--locked", "-p", "orr_editor", "--features", "collect-ui", "--lib", "--tests", "--", "-D", "warnings"]),
          ):
              h["run_logged"](command, evidence / (label + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_COLLECT_RESIZE_CI/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_COLLECT_RESIZE_CI/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/collect-preview-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_COLLECT_RESIZE_CI/vulkan-driver.log"
      - name: Actual EditorApp resize staging and production renderer parity
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import runpy
          import struct
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_RESIZE_CI"]).resolve()
          captures = evidence / "software-gpu"
          captures.mkdir(exist_ok=False)
          os.environ["ORR_COLLECT_UI_RESIZE_EVIDENCE"] = str(captures)
          name = "app::collect_ui_preview::tests::actual_editor_resize_gpu_stages_applies_and_cancels_sizes"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", name, "--", "--ignored", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-preview-gpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected one executed software GPU test with no skips")
          receipt = json.loads((captures / "collect-ui-resize-acceptance.json").read_text())
          if (type(receipt.get("schema")) is not int or receipt["schema"] != 1
                  or receipt.get("window_pixels") != [1800, 1200]
                  or type(receipt.get("production_collect_ui_pixel_parity_cases")) is not int
                  or receipt["production_collect_ui_pixel_parity_cases"] != 6):
              raise RuntimeError("Unexpected preview receipt schema or parity inventory")
          for flag in ("production_editor_app", "software_vulkan", "resize_ghost_without_context_rebuild",
                       "release_candidate_build_once", "staging_changes_pixels_only", "cancel_restores_exact_pixels",
                       "apply_one_undo", "expanded_button_and_parent_clipped_hit_regions", "parent_resizes_child_clip_without_rewriting_descendants",
                       "escape_focus_screen_resize_close_stale_document_play_cancel", "host_unchanged_during_authoring",
                       "save_reopen", "full_visible_controls", "pointer_leave_late_release_cancel", "same_path_scene_epoch_cancel",
                       "focus_snapshot_cancel", "staged_mode_selection_cancel", "inactive_move_selection_preserves_resize"):
              if receipt.get(flag) is not True:
                  raise RuntimeError("Missing verified resize predicate: " + flag)
          if type(receipt.get("portrait_display_scale")) is not float or receipt["portrait_display_scale"] != 0.75:
              raise RuntimeError("Expected explicit 75-percent portrait scaling proof")
          if receipt.get("child_anchors") != [0, 500, 1000]:
              raise RuntimeError("Expected all three child-anchor fixtures")
          if receipt.get("native_os_window") is not False:
              raise RuntimeError("Software-GPU synthetic input must not claim native window acceptance")
          adapter = receipt.get("adapter")
          if not isinstance(adapter, str) or "llvmpipe" not in adapter.lower() or "Cpu" not in adapter or "Vulkan" not in adapter:
              raise RuntimeError("Explicit llvmpipe CPU Vulkan evidence required")
          for name, size in (
              ("resize-initial-title", (640, 360)),
              ("resize-staged-title", (640, 360)),
              ("resize-cancelled-title", (640, 360)),
              ("resize-applied-title", (640, 360)),
              ("resize-portrait-container", (360, 640)),
              ("resize-saved-reopened", (360, 640)),
          ):
              for suffix, expected in (("canvas", size), ("editor", (1800, 1200))):
                  filename = name + "-" + suffix + ".png"
                  raw = (captures / filename).read_bytes()
                  if raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR" or struct.unpack(">II", raw[16:24]) != expected:
                      raise RuntimeError("Missing or wrong-sized preview screenshot: " + filename)
          raw = (captures / "resize-drag-ghost-editor.png").read_bytes()
          if raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR" or struct.unpack(">II", raw[16:24]) != (1800, 1200):
              raise RuntimeError("Missing full-editor drag-ghost capture")
      - name: Retain exact counts, production parity captures and full controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-ui-resize-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_COLLECT_RESIZE_CI }}
          if-no-files-found: error

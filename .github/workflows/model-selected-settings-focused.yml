name: selected model settings focused CI
on:
  push:
    branches: [codex/model-selected-settings-20261107]
permissions:
  contents: read
jobs:
  model-settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Focused selected settings, save/reopen and host Play checks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features models --test yard3d_models settings_copy:: -- --test-threads=1 2>&1 | tee ci-evidence/static-copy.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/static-copy.log
          cargo test --locked -p orr_editor --features animated-models --test yard3d_animated settings_copy:: -- --test-threads=1 2>&1 | tee ci-evidence/animated-copy.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/animated-copy.log
          cargo test --locked -p orr_editor --features models --test yard3d_models actual_widgets_assign_remove_undo_save_reopen_and_disable_mutation_in_play -- --test-threads=1 2>&1 | tee ci-evidence/static-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/static-regression.log
          cargo test --locked -p orr_editor --features animated-models --test yard3d_animated independent_clip_indices_sample_one_shared_asset_and_edit_mutations_are_rejected_in_play -- --test-threads=1 2>&1 | tee ci-evidence/animated-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/animated-regression.log
          cargo clippy --locked -p orr_editor --features models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
          cargo clippy --locked -p orr_editor --features animated-models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-animated.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selected-settings-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error




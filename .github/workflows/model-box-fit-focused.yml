name: Model box fit focused CI
on:
  push:
    branches: [codex/model-box-fit-20261107]
permissions:
  contents: read
jobs:
  model-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Fit arithmetic and actual editor save and runtime paths
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features models --lib model_panel::fit::tests -- --test-threads=1 2>&1 | tee ci-evidence/math.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/math.log
          cargo test --locked -p orr_sample --lib yard3d_view::tests::editor_box_dimensions_keep_ground_thickness_and_exact_entity_generation -- --exact 2>&1 | tee ci-evidence/box-bridge.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/box-bridge.log
          cargo test --locked -p orr_editor --features models --test yard3d_models box_fit:: -- --test-threads=1 2>&1 | tee ci-evidence/static-ui.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/static-ui.log
          cargo test --locked -p orr_editor --features animated-models --test yard3d_animated box_fit:: -- --test-threads=1 2>&1 | tee ci-evidence/animated.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/animated.log
          cargo test --locked -p orr_editor --features room-project --test room_model_admission fitted_room_binding_saves_and_reopens_in_actual_runtime_pose_path -- --exact 2>&1 | tee ci-evidence/room.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/room.log
          cargo test --locked -p orr_editor --features models --test yard3d_models actual_widgets_assign_remove_undo_save_reopen_and_disable_mutation_in_play -- --exact 2>&1 | tee ci-evidence/play-guard.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/play-guard.log
          cargo clippy --locked -p orr_editor --features models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
          cargo clippy --locked -p orr_editor --features animated-models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-animated.log
          cargo clippy --locked -p orr_editor --features room-project --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-room.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-box-fit-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: Coop attack timing focused CI
# Real native/WASM with mock DOM; additive to mandatory local review/checks.
on:
  push:
    branches: [su/coop-attack-timing-20261103]
permissions:
  contents: read
concurrency:
  group: coop-attack-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-wasm-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ runner.temp }}/attack-timing-evidence
      ORR_ATTACK_TIMING_EVIDENCE_DIR: ${{ runner.temp }}/attack-timing-evidence/actual
      ORR_BASELINE_PACKAGE_BIN: ${{ runner.temp }}/attack-timing-evidence/orr_pkg-baseline
      ORR_RUST_PACKAGE_BIN: ${{ github.workspace }}/target/release/orr_pkg
      ORR_COOP_WEB_BUILD_DIR: ${{ runner.temp }}/attack-timing-evidence/web-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact source and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE" "$ORR_ATTACK_TIMING_EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          node --version | tee "$EVIDENCE/node.txt"
          python3 -m venv "$RUNNER_TEMP/attack-timing-python"
          "$RUNNER_TEMP/attack-timing-python/bin/pip" install Pillow==11.3.0 2>&1 | tee "$EVIDENCE/python-dependencies.log"
          echo "$RUNNER_TEMP/attack-timing-python/bin" >> "$GITHUB_PATH"
      - name: Build immutable baseline and candidate; verify focused contracts
        shell: python {0}
        run: |
          import hashlib, json, os, re, runpy, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          run = helpers['run_logged']
          base = 'bc000d251801df599844ef864539b4fada4b1984'
          baseline = Path(os.environ['RUNNER_TEMP']) / 'attack-timing-baseline'
          run(['git', 'worktree', 'add', '--detach', str(baseline), base], evidence / 'baseline-worktree.log')
          source = subprocess.check_output(['git', '-C', str(baseline), 'rev-parse', 'HEAD', 'HEAD^{tree}'], text=True)
          if source.splitlines()[0] != base:
              raise RuntimeError('Incorrect baseline source')
          (evidence / 'baseline-source.txt').write_text(source)
          old = ['cargo', '+1.99.1', 'build', '--locked', '--release', '--manifest-path', str(baseline / 'Cargo.toml'), '--target-dir', str(baseline / 'target'), '-p', 'orr_package', '--features', 'coop-web-authoring', '--bin', 'orr_pkg']
          run(old, evidence / 'baseline-build.log')
          import shutil
          shutil.copy2(baseline / 'target/release/orr_pkg', os.environ['ORR_BASELINE_PACKAGE_BIN'])
          run(['cargo', 'build', '--locked', '--release', '-p', 'orr_package', '--features', 'coop-web-authoring', '--bin', 'orr_pkg'], evidence / 'candidate-build.log')
          for label, selector, count in [('manifest', 'coop_web_authoring::manifest::tests::', 10), ('cli', 'coop_web_authoring::cli_tests::', 4)]:
              output = run(['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--features', 'coop-web-authoring', '--lib', selector, '--', '--format=pretty', '--color=never', '--test-threads=1'], evidence / (label + '.log')).replace('\r\n', '\n')
              summaries, cases = helpers['SUMMARY'].findall(output), helpers['CASE'].findall(output)
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, 0, 0) or len(cases) != count or len({name for name, status in cases}) != count or any(status != 'ok' or not name.startswith(selector) for name, status in cases):
                  raise RuntimeError(f'{label}: exact count/case failure')
          run(['cargo', 'build', '--locked', '-p', 'orr_coop_defense_web', '--target', 'wasm32-unknown-unknown', '--profile', 'web'], evidence / 'wasm-build.log')
          run([os.environ['ORR_RUST_PACKAGE_BIN'], 'copy-coop-web-assets', '--source-dir', str(Path.cwd() / 'crates/orr_coop_defense_web/web'), '--output', os.environ['ORR_COOP_WEB_BUILD_DIR'], '--wasm', str(Path.cwd() / 'target/wasm32-unknown-unknown/web/orr_coop_defense_web.wasm')], evidence / 'web-assets.log')
          binaries = {name: hashlib.sha256(Path(os.environ[name]).read_bytes()).hexdigest() for name in ['ORR_BASELINE_PACKAGE_BIN', 'ORR_RUST_PACKAGE_BIN']}
          (evidence / 'binary-hashes.json').write_text(json.dumps(binaries, indent=2))
          output = run(['python3', '-B', '-m', 'unittest', 'discover', '-s', 'tools', '-p', 'test_rust_coop_attack_timing.py', '-v'], evidence / 'actual-driver.log')
          cases = re.findall(r'^(test_\w+) \([^\n]+\) \.\.\. ok$', output, re.MULTILINE)
          if len(cases) != 5 or len(set(cases)) != 5 or not re.search(r'^Ran 5 tests in ', output, re.MULTILINE) or not re.search(r'^OK$', output, re.MULTILINE) or re.search(r'\bskipped\b|^FAILED', output, re.MULTILINE):
              raise RuntimeError('Expected five distinct successful delivery tests without skips')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'baseline': base, 'cpu': 14, 'actual_delivery': 5, 'mock_dom': True, 'gpu': False, 'full_workspace': False}, indent=2))
      - name: Preserve logs, original source identity and actual delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-attack-timing-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attack-timing-evidence
          if-no-files-found: error

name: Room light viewport placement focused CI
on:
  push:
    branches: [codex/room-light-viewport-pick-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Fixed light workplane draft to saved Room settings
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_editor --no-default-features --lib 2>&1 | tee ci-evidence/feature-off.log
          cargo test --locked -p orr_editor --features room-lighting --lib room_lighting_panel::viewport_pick::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/math-state.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/math-state.log
          cargo test --locked -p orr_editor --features room-lighting,project-create,room-authoring,windows-export --lib room_lighting_panel::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/legacy-panel.log
          grep -F 'test result: ok. 15 passed; 0 failed; 0 ignored;' ci-evidence/legacy-panel.log
          cargo test --locked -p orr_editor --features room-lighting,project-create,room-authoring,windows-export --lib app::room_light_pick::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/app-adapter.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/app-adapter.log
          cargo test --locked -p orr_editor --features room-lighting,project-create,room-authoring,windows-export --test room_lighting generated_room_lighting_actual_editor_apply_undo_redo_save_reopen -- --exact 2>&1 | tee ci-evidence/legacy-widgets.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-widgets.log
          cargo test --locked -p orr_editor --features room-lighting,project-create,room-authoring,windows-export --test room_lighting activation::conditional_light_widgets_save_reopen_actual_pickup_victory_seek_stop -- --exact 2>&1 | tee ci-evidence/legacy-gameplay.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-gameplay.log
          cargo check --locked -p orr_editor --features room-lighting,room-authoring,project-create,windows-export,package-manager,mesh-hazards-export,navigation,terrain --lib 2>&1 | tee ci-evidence/cross-tools.log
          cargo clippy --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-room-consumer.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-light-viewport-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

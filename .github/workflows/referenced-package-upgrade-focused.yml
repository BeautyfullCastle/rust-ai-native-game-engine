name: Referenced Room package upgrade focused CI
on:
  push:
    branches: [codex/referenced-package-upgrade-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: referenced-package-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  referenced-package-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Aggregate focused copy, actual executable and strict checks
        shell: python {0}
        run: |
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          evidence = Path('ci-evidence')
          results = []
          base = 'package-upgrade-copy'
          full = base + ',room-animated-models,room-character,room-lighting,terrain-patrol-export'
          namespace = 'package_manager::referenced_copy::tests::'
          actual = namespace + 'actual_cli_new_copy_success_and_collision_preserve_originals'
          tool = evidence.resolve() / 'orr_room_package_upgrade'
          def record(label, command, count=None):
              log = evidence / (label + '.log')
              with log.open('w') as stream:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  output = []
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      stream.write(line)
                      stream.flush()
                      output.append(line)
                  code = process.wait()
              text = ''.join(output)
              valid = code == 0
              reason = None
              if count is not None:
                  summaries = re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;', text, re.M)
                  cases = re.findall(r'^test (\S+) \.\.\. ok$', text, re.M)
                  running = re.findall(r'^running (\d+) tests?$', text, re.M)
                  valid = valid and summaries == [('ok', str(count), '0', '0', '0')] and len(cases) == count and len(set(cases)) == count and running == [str(count)]
                  if not valid:
                      reason = 'command failure or exact test census mismatch'
              result = {'label': label, 'command': command, 'exit': code, 'ok': valid, 'expected_passed': count, 'reason': reason}
              results.append(result)
              (evidence / 'results.json').write_text(json.dumps(results, indent=2))
              return valid
          # Build exit gates the copied executable: a stale target binary cannot be used.
          built = record('tool-build', ['cargo','build','--locked','-p','orr_editor','--features',full,'--bin','orr_room_package_upgrade'])
          if built:
              shutil.copy2('target/debug/orr_room_package_upgrade', tool)
              tool.chmod(0o755)
              os.environ['ORR_ROOM_PACKAGE_UPGRADE_TOOL'] = str(tool)
              (evidence / 'tool.sha256').write_text(hashlib.sha256(tool.read_bytes()).hexdigest() + '  ' + str(tool) + '\n')
          for label, features, count in [('copy-base',base,9), ('copy-full',full,10)]:
              record(label, ['cargo','test','--locked','-p','orr_editor','--features',features,'--lib',namespace,'--','--skip',actual,'--test-threads=1'], count)
          if built:
              record('actual-cli', ['cargo','test','--locked','-p','orr_editor','--features',full,'--lib',actual,'--','--ignored','--exact','--test-threads=1'], 1)
          else:
              results.append({'label':'actual-cli','ok':False,'blocked_by':'tool-build','expected_passed':1})
          for label, features in [('base',base), ('full',full)]:
              record('strict-' + label, ['cargo','clippy','--locked','-p','orr_editor','--features',features,'--lib','--bin','orr_room_package_upgrade','--','-D','warnings'])
          record('feature-off', ['cargo','check','--locked','-p','orr_editor','--features','package-manager','--lib'])
          (evidence / 'results.json').write_text(json.dumps(results, indent=2))
          (evidence / 'scope.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'expected_test_executions':20,'expected_ignored':0,'full_workspace':False,'gpu_window_playtest':False}, indent=2))
          if not all(item['ok'] for item in results):
              raise SystemExit('Focused verification failed; all collected original logs retained')
      - name: Preserve exact source, status and every failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: referenced-package-upgrade-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          include-hidden-files: true
          if-no-files-found: error

name: Stormglass live observation CPU CI
# Game-owned OVS production and in-process registered-editor wire acceptance.
# Dependencies may build, but no sockets, windows, GPU/device or model execution.
on:
  push:
    branches: [su/stormglass-live-observation-20261105]
permissions:
  contents: read
concurrency:
  group: stormglass-live-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stormglass-observation-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: 1
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and select supported Rust
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/stormglass-live-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          rustup toolchain install 1.99.1 --profile minimal --component clippy 2>&1 | tee "$EVIDENCE/toolchain-install.log"
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          python3 --version | tee "$EVIDENCE/python.txt"
      - name: Validate reviewed CPU inventories and exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/check_stormglass_live_observation.py --expected-head "$GITHUB_SHA"
      - name: Preserve copied executables and evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-live-observation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          compression-level: 6

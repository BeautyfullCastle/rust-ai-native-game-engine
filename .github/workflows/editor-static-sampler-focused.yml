name: Editor static sampler focused CI
on:
  push:
    branches: [codex/editor-static-sampler-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-static-sampler-${{ github.ref }}
  cancel-in-progress: false
jobs:
  editor-static-sampler:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          uname -a | tee ci-evidence/platform.txt
          hostname | tee ci-evidence/runner-hostname.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect static sampler authoring and editor-use checks
        shell: python {0}
        run: |
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          evidence=Path('ci-evidence');results=[]
          full='package-manager,room-character,room-lighting,project-create,windows-export'
          def run(label,command,count=None):
              with (evidence/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  lines=[]
                  for line in p.stdout:
                      print(line,end='',flush=True);log.write(line);log.flush();lines.append(line)
                  code=p.wait()
              text=''.join(lines);ok=code==0
              if count is not None:
                  summary=re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text,re.M)
                  # CLI writes directly to stdout, splitting some test completion lines.
                  pattern=r'^test (\S+) \.\.\. ' if label=='model-sampler-existing-contract' else r'^test (\S+) \.\.\. ok$'
                  names=re.findall(pattern,text,re.M)
                  running=re.findall(r'^running (\d+) tests?$',text,re.M)
                  ok=ok and summary==[('ok',str(count),'0','0','0')] and len(names)==len(set(names))==count and running==[str(count)]
              results.append(dict(label=label,command=command,exit=code,ok=ok,expected=count))
              (evidence/'results.json').write_text(json.dumps(results,indent=2))
              return ok
          def tests(label,selector,count,extra=()):
              if not libtest_ready:
                  results.append(dict(label=label,ok=False,expected=count,unrun="libtest compilation failed"));return
              run(label,['cargo','test','--locked','-p','orr_editor','--features',full,'--lib',selector,'--']+list(extra)+['--test-threads=1'],count)
          run('model-sampler-library',['cargo','test','--locked','-p','orr_model','--features','import','--lib','static_sampler::tests::','--','--test-threads=1'],3)
          run('model-sampler-existing-contract',['cargo','test','--locked','-p','orr_model','--features','import','--test','static_model_sampler','--','--test-threads=1'],21)
          run('strict-model-sampler',['cargo','clippy','--locked','-p','orr_model','--features','import','--lib','--example','static_model_sampler','--','-D','warnings'])
          run('model-feature-off',['cargo','check','--locked','-p','orr_model','--lib'])
          libtest_ready=run("libtest-build",["cargo","test","--locked","-p","orr_editor","--features",full,"--lib","--no-run"])
          checks=[
            ('static-sampler-backend','model_package_import::static_sampler::tests::',8),
            ('static-sampler-ui','model_package_import_panel::static_sampler_ui::tests::',4),
            ('static-sampler-editor-use','package_manager_panel::editor_static_sampler_tests::',2),
            ('shared-publication-regression','model_package_import::tests::',21),
            ('catalog-regression','model_package_import_panel::source_inspection::tests::',6),
            ('static-uv-ui-regression','model_package_import_panel::static_uv_ui::tests::',4),
            ('static-texture-ui-regression','model_package_import_panel::static_texture_ui::tests::',4),
            ('static-assembly-ui-regression','model_package_import_panel::static_assembly_ui::tests::',4),
            ('static-assembly-editor-use-regression','package_manager_panel::editor_static_assembly_tests::',2),
            ('glb-subtree-ui-regression','model_package_import_panel::glb_subtree_ui::tests::',4),
            ('glb-subtree-editor-use-regression','package_manager_panel::editor_glb_subtree_tests::',2),
            ('static-pivot-ui-regression','model_package_import_panel::static_pivot_ui::tests::',4),
            ('static-pivot-editor-use-regression','package_manager_panel::editor_static_pivot_tests::',2),
            ('static-browser-regression','package_manager_panel::cooked_model_tests::',2),
          ]
          for label,selector,count in checks: tests(label,selector,count)
          run('static-sampler-minimal-tests',['cargo','test','--locked','-p','orr_editor','--features','package-manager','--lib','model_package_import::static_sampler::tests::','--','--test-threads=1'],8)
          run('static-sampler-ui-minimal',['cargo','test','--locked','-p','orr_editor','--features','package-manager','--lib','model_package_import_panel::static_sampler_ui::tests::','--','--test-threads=1'],4)
          run('catalog-minimal-regression',['cargo','test','--locked','-p','orr_editor','--features','package-manager','--lib','model_package_import_panel::source_inspection::tests::','--','--test-threads=1'],3)
          run('strict-package-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','package-manager','--lib','--','-D','warnings'])
          run('strict-static-and-animated-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','package-manager,room-animated-models','--lib','--','-D','warnings'])
          run('strict-combined',['cargo','clippy','--locked','-p','orr_editor','--features',full,'--lib','--','-D','warnings'])
          run('feature-off',['cargo','check','--locked','-p','orr_editor','--lib'])
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          (evidence/'scope.txt').write_text('Focused CPU static material sampler authoring, exact used-slot selection and filter/wrap combinations, strict recipes and shared-image preservation, immutable provenance and safe publication, install/binding/history/Save/reopen and recording-RHI uniform consumption. Windows/GPU/physical play/video UNRUN; no full-workspace validation.')
          if not all(r['ok'] for r in results):raise SystemExit('Focused Editor static sampler checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-static-sampler-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

name: Registered starter navigation CPU CI
# Exact-candidate CPU/in-process ERP and native identity queries only.
# No sockets, native windows, browser, audio-device or GPU execution.
on:
  push:
    branches: [su/registered-starter-navigation-20261105]
permissions:
  contents: read
concurrency:
  group: registered-starter-navigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  registered-navigation-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and select supported Rust
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/registered-starter-navigation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          rustup toolchain install 1.99.1 --profile minimal --component clippy 2>&1 | tee "$EVIDENCE/toolchain-install.log"
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          python3 --version | tee "$EVIDENCE/python.txt"
      - name: Validate reviewed inventories and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/check_registered_starter_navigation.py --self-test
          python3 -B tools/check_registered_starter_navigation.py --expected-head "$GITHUB_SHA"
      - name: Preserve exact binaries and evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-starter-navigation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          compression-level: 6

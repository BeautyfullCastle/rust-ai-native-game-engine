name: Delivery reachability CPU CI
# Compile native harnesses only; execute CPU/filesystem tests, fixed bundle shell fixtures and read-only queries.
on:
  push:
    branches: [su/delivery-authored-reachability-20261105]
permissions:
  contents: read
concurrency:
  group: delivery-reachability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  delivery-reachability-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: 1
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact candidate and select supported Rust
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/delivery-reachability-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          rustup toolchain install 1.99.1 --profile minimal --component clippy 2>&1 | tee "$EVIDENCE/toolchain-install.log"
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          python3 --version | tee "$EVIDENCE/python.txt"
      - name: Validate exact-head CPU diagnostics and fixture contracts
        run: python3 -B tools/check_switchboard_objective.py --expected-head "$GITHUB_SHA"
      - name: Preserve original executables and evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-reachability-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          compression-level: 6

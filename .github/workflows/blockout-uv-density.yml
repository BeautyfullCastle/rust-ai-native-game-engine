name: Blockout UV density acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021, su/static-game-starter-20261022]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blockout-uv-density:
    # Additive optional-feature coverage; no existing mandatory gate is replaced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_UV_DENSITY_EVIDENCE: ${{ github.workspace }}/target/blockout-uv-density-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused CPU preview contracts and optional feature boundaries
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_UV_DENSITY_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Existing blockout acceptance and refusal tests remain unchanged.
          for suite, count in (
              ("app::blockout_uv_density::tests", 5),
          ):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "models",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (suite.replace("::", "-") + ".log"))
              helpers["validate_tests"](output, suite, count)
          if os.name == "nt":
              suite = "blockout::windows_path_tests"
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "models",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / "blockout-windows-root-paths.log")
              helpers["validate_tests"](output, suite, 1)
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "models", "--test", "blockout_uv_density",
               "--", "--format=pretty", "--color=never", "--test-threads=1"], evidence / "uv-density-math.log")
          expected_names = {
              "all_six_faces_and_four_turns_have_requested_baked_edge_density",
              "resizing_recalculates_scales_from_current_recipe_dimensions",
              "nonpositive_nonfinite_overflow_and_out_of_range_density_are_rejected_without_clamping",
              "invalid_source_recipes_are_rejected_before_proposing_scales",
              "computing_or_rejecting_density_preserves_source_files_history_and_redo",
          }
          cases = helpers["CASE"].findall(output)
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (5, 0, 0, 0)
                  or len(cases) != 5 or {name for name, _ in cases} != expected_names
                  or any(status != "ok" for _, status in cases)):
              raise RuntimeError("Expected all five UV density math tests to pass without skips")
          for name, args in (
              ("default-check", ["check", "--lib"]),
              ("models-check", ["check", "--lib", "--features", "models"]),
              ("models-lint", ["clippy", "--lib", "--features", "models", "--", "-D", "warnings"]),
              ("uv-density-ui-lint", ["clippy", "--test", "blockout_uv_density_ui", "--features", "models", "--", "-D", "warnings"]),
          ):
              helpers["run_logged"](["cargo", args[0], "--locked", "-p", "orr_editor", *args[1:]],
                                    evidence / (name + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_UV_DENSITY_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_UV_DENSITY_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/blockout-uv-density-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_UV_DENSITY_EVIDENCE/vulkan-driver.log"
      - name: Explicit ignored production EditorApp Blockout UV density acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_UV_DENSITY_EVIDENCE"])
          capture = evidence / "uv-density-ui"
          if capture.exists():
              raise RuntimeError("UV density acceptance requires an absent, fresh capture directory")
          os.environ["ORR_UV_DENSITY_CAPTURE_DIR"] = str(capture.resolve())
          name = "density_widgets_preserve_draft_and_render_after_existing_bake"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "models",
               "--test", "blockout_uv_density_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "uv-density-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "acceptance-receipt.json").read_text())
          expected = {
              "test": "density_widgets_preserve_draft_and_render_after_existing_bake",
              "other_face_equal": True, "software_gpu": True, "physical_os_input": False,
              "density_helper_default_width": 340, "fixed_inspector_width": 560,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh Blockout UV density receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          changed = receipt.get("positive_x_changed_pixels")
          if type(changed) is not int or changed <= 1000:
              raise RuntimeError("Rebaked selected-face checker must change more than 1000 pixels")
          if receipt.get("features") != ["models"] or receipt.get("full_editor_size") != [1800.0, 1500.0] or receipt.get("fixed_viewport_size") != [1010, 1383]:
              raise RuntimeError("Unexpected feature or fixed-camera capture dimensions")
          calculation = receipt.get("calculation")
          if calculation != {"face": "+X", "recipe_edges": [3, 4], "model_units_per_repeat": 2,
                             "scale": [1.5, 2], "quarter_turn": 1, "binding_scale_excluded": [1, 1.5, 0.75]}:
              raise RuntimeError("Recipe-space density oracle mismatch")
          import hashlib
          inventory = json.loads((capture / "capture-inventory.json").read_text())
          if type(inventory) is not dict or not inventory:
              raise RuntimeError("Missing fresh capture inventory")
          images = ("01-full-editor-initial-controls.png", "02-before-positive-x.png", "03-before-positive-z.png",
                    "04-full-editor-staged-controls.png", "04b-full-editor-default-width-density.png",
                    "05-staged-positive-x-unchanged.png",
                    "06-full-editor-applied-preview.png", "07-applied-immutable-positive-x-unchanged.png",
                    "08-baked-assigned-positive-x.png", "09-baked-assigned-positive-z.png",
                    "10-full-editor-resize-recalculated.png")
          for name in (*images, "acceptance-receipt.json"):
              if inventory.get(name) != hashlib.sha256((capture / name).read_bytes()).hexdigest():
                  raise RuntimeError(f"Capture inventory SHA mismatch: {name}")
          for image in images:
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh UV density capture: {image}")
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockout-uv-density-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_UV_DENSITY_EVIDENCE }}
          if-no-files-found: error

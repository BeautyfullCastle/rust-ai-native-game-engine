                  if ast.dump(ast.parse(code)) != ast.dump(ast.parse(Path(__file__).read_text())):
                      raise ValueError('Executed aggregate wrapper does not match workflow bytes')
                  report['wrapper_sha256'] = digest(Path(__file__))
                  report['guard_files'] = GUARD_FILES
                  report['valid'] = True
              except Exception as exc:
                  report.update(valid=False, hardening_error=type(exc).__name__ + ': ' + str(exc))
              write('preflight.json', report)
              return 0 if report['valid'] else 1
          

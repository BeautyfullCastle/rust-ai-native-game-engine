              if original_setup():
                  return 1
              commands = [
                  ('wasm-target-install', ['rustup', 'target', 'add', 'wasm32-unknown-unknown', '--toolchain', '1.99.1']),
                  ('wasm-targets', ['rustup', 'target', 'list', '--installed', '--toolchain', '1.99.1']),
                  ('node-version', ['node', '--version']),
              ]
              for label, argv in commands:
                  code = run_command(label, argv)
                  if code:
                      write('setup.json', {'valid': False, 'failed_command': label, 'exit_code': code})
                      return 1
              valid = 'wasm32-unknown-unknown' in (COMMANDS / 'wasm-targets.stdout').read_text().splitlines()
              write('setup.json', {'valid': valid, 'pinned_rust': '1.99.1', 'wasm_target': 'wasm32-unknown-unknown',

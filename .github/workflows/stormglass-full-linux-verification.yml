              require(len(header) == 20 and header[:6] == b'\x7fELF\x02\x01' and header[18:20] == b'\x3e\x00', 'Expected fresh ELF64 little-endian x86-64 runtime')
          
          
          
          def require(value, reason):
              if not value:
                  raise ValueError(reason)
          
          
          def inventory(text, expected, ignored=(), fifo=False, filtered=0):
              """Validate one serial libtest suite, plus precisely the known FIFO child."""
              expected, ignored = sorted(expected), sorted(ignored)
              require(expected and len(expected) == len(set(expected)), 'Invalid or empty required parent inventory')
              require(not set(expected) & set(ignored), 'Passed and ignored inventory overlaps')
              require(not re.search(r'(?m)^test result: FAILED|^test \S+ \.\.\. FAILED$|^FAILED$', text), 'Explicit failed test')
              nested = None
              if fifo:
                  require(FIFO in expected, 'FIFO not required by parent')
                  # --test-threads=1 emits the parent prefix, then the child suite, then bare parent ok.
                  pattern = (r'(?m)^test ' + re.escape(FIFO) + r' \.\.\. \nrunning 1 test\n'
                             r'test ' + re.escape(FIFO) + r' \.\.\. ok\n\n'
                             r'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; '
                             + str(len(expected) + len(ignored) - 1) + r' filtered out; finished in [0-9.]+s\n\nok$')
                  matches = list(re.finditer(pattern, text))
                  require(len(matches) == 1, 'Missing, duplicate or malformed expected FIFO nesting')
                  nested = matches[0].group(0)
                  text = text[:matches[0].start()] + 'test ' + FIFO + ' ... ok' + text[matches[0].end():]
              summaries = re.findall(r'(?m)^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;', text)
              passed = re.findall(r'(?m)^test (\S+) \.\.\. ok$', text)
              skips = re.findall(r'(?m)^test (\S+) \.\.\. ignored(?:,.*)?$', text)
              running = re.findall(r'(?m)^running (\d+) tests?$', text)
              require(sorted(passed) == expected, 'Missing, extra, duplicate or wrong passed parent tests')
              require(sorted(skips) == ignored, 'Unexpected or missing ignored parent tests')
              require(summaries == [tuple(str(n) for n in (len(expected), 0, len(ignored), 0, filtered))], 'Parent test summary mismatch')
              require(running == [str(len(expected) + len(ignored))], 'Parent running count mismatch')
              require(len(re.findall(r'(?m)^test (?!result:)', text)) == len(expected) + len(ignored), 'Unrecognized parent test line')
              return {'passed': expected, 'ignored': ignored, 'nested_fifo_child': bool(nested), 'filtered': filtered}
          
          
          def listed(text):
              names = re.findall(r'(?m)^(\S+): test$', text)
              counts = re.findall(r'(?m)^(\d+) tests?, 0 benchmarks?$', text)
              require(names and len(names) == len(set(names)) and counts == [str(len(names))], 'Invalid full test listing')
              return sorted(names)
          
          
          def cargo(action, package, features=None):
              args = ['cargo', action, '--locked', '--release', '-p', package, '--no-default-features']
              return args + (['--features', features] if features else [])
          
          
          def test_args(package, features, target, exact=None, ignored=False, listing=False):
              args = cargo('test', package, features) + target
              if exact:
                  args += [exact]
              args += ['--', '--test-threads=1', '--color=never']
              if exact:
                  args += ['--exact']
              if ignored:
                  args += ['--ignored', '--nocapture']
              if listing:
                  args += ['--list']
              return args
          
          
          def plan():
              return [('package-native-list', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--lib', '--', '--test-threads=1', '--color=never', '--list']), ('package-native-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--lib', '--', '--test-threads=1', '--color=never']), ('native-cli-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--test', 'native_scene_cli', '--', '--test-threads=1', '--color=never']), ('creator-build', ['cargo', 'build', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--bin', 'orr_pkg', '--message-format=json']), ('player-build', ['cargo', 'build', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense', '--bin', 'coop_defense', '--message-format=json']), ('wasm-build', ['cargo', 'build', '--locked', '-p', 'orr_coop_defense_web', '--target', 'wasm32-unknown-unknown', '--profile', 'web', '--message-format=json']), ('wasm-parity', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--test', 'native_scene_cli', 'existing_web_command_executes_real_wasm_and_matches_native_yaml', '--', '--test-threads=1', '--color=never', '--exact', '--ignored', '--nocapture']), ('native-delivery', ['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense', '--lib', 'defense_app::native_scene_tests::relocated_native_creator_scene_reaches_player_session_and_restart', '--', '--test-threads=1', '--color=never', '--exact', '--ignored', '--nocapture']), ('sample-list', ['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense', '--lib', '--', '--test-threads=1', '--color=never', '--list']), ('sample-native-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense', '--lib', '--', '--test-threads=1', '--color=never']), ('default-cli-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--test', 'native_scene_cli', '--', '--test-threads=1', '--color=never']), ('web-only-cli-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-web-authoring', '--test', 'native_scene_cli', '--', '--test-threads=1', '--color=never']), ('native-package-clippy', ['cargo', 'clippy', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--lib', '--bins', '--tests', '--', '-D', 'warnings']), ('web-only-package-clippy', ['cargo', 'clippy', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-web-authoring', '--lib', '--bins', '--tests', '--', '-D', 'warnings']), ('default-package-clippy', ['cargo', 'clippy', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--lib', '--bins', '--tests', '--', '-D', 'warnings']), ('sample-native-clippy', ['cargo', 'clippy', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense', '--lib', '--bin', 'coop_defense', '--tests', '--', '-D', 'warnings']), ('sample-feature-off', ['cargo', 'check', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--lib']), ('default-package-boundary', ['cargo', 'tree', '--locked', '-p', 'orr_package', '--no-default-features', '--edges', 'normal,build', '--prefix', 'none', '--format', '{p}']), ('web-only-package-boundary', ['cargo', 'tree', '--locked', '-p', 'orr_package', '--no-default-features', '--edges', 'normal,build', '--prefix', 'none', '--format', '{p}', '--features', 'coop-web-authoring']), ('bundle-native-cli-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--test', 'native_bundle_cli', '--', '--test-threads=1', '--color=never']), ('bundle-default-cli-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--test', 'native_bundle_cli', '--', '--test-threads=1', '--color=never']), ('bundle-web-only-cli-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-web-authoring', '--test', 'native_bundle_cli', '--', '--test-threads=1', '--color=never']), ('package-default-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--lib', '--', '--test-threads=1', '--color=never']), ('bundle-player-build', ['cargo', 'build', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense-run-save', '--bin', 'coop_defense', '--message-format=json']), ('bundle-real-acceptance', ['cargo', 'test', '--locked', '--release', '-p', 'orr_package', '--no-default-features', '--features', 'coop-native-authoring', '--test', 'native_bundle_cli', 'relocated_native_bundle_runs_without_original_inputs_and_enforces_save_boundary', '--', '--test-threads=1', '--color=never', '--ignored', '--exact', '--nocapture']), ('sample-save-list', ['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense-run-save', '--lib', '--', '--test-threads=1', '--color=never', '--list']), ('sample-save-tests', ['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense-run-save', '--lib', '--', '--test-threads=1', '--color=never']), ('sample-save-clippy', ['cargo', 'clippy', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--features', 'coop-defense-run-save', '--lib', '--bin', 'coop_defense', '--tests', '--', '-D', 'warnings']), ('bundle-launcher-python', ['python3', '-B', '-m', 'unittest', '-v', 'tools/test_stormglass_native_bundle_launcher.py'])]
          
          
          ARTIFACTS = {
              'creator-build': ('orr_package', 'orr_pkg', 'src/main.rs', ['bin'], 'release', 'creator', ['coop-native-authoring', 'coop-web-authoring']),
              'player-build': ('orr_sample', 'coop_defense', 'src/bin/coop_defense.rs', ['bin'], 'release', 'player', ['coop-defense']),
              'bundle-player-build': ('orr_sample', 'coop_defense', 'src/bin/coop_defense.rs', ['bin'], 'release', 'player-save', ['coop-defense', 'coop-defense-run-save']),
          PYFOCUSED_PART2

      - name: Continue focused wrapper part 3
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/stormglass-focused.py" <<'PYFOCUSED_PART3'
              'wasm-build': ('orr_coop_defense_web', 'orr_coop_defense_web', 'src/lib.rs', ['cdylib', 'rlib'], 'wasm32-unknown-unknown/web', 'game.wasm', []),
          }
          
          
          def select_artifact(records, label, root, target, inspect=True):
              package, name, src, kinds, directory, dest, features = ARTIFACTS[label]
              selected = [r for r in records if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == name]
              require(len(selected) == 1, 'Missing or ambiguous Cargo production artifact')
              a = selected[0]
              manifest = root / 'crates' / package / 'Cargo.toml'
              require(a.get('manifest_path') == str(manifest), 'Artifact manifest differs from exact checkout')
              require(a.get('package_id', '').startswith(manifest.parent.as_uri() .replace('file:', 'path+file:', 1) + '#'), 'Artifact package identifier differs')
              require(a['target'].get('src_path') == str(manifest.parent / src) and a['target'].get('kind') == kinds, 'Artifact source/target mismatch')
              require(a.get('profile', {}).get('test') is False, 'Test executable cannot stand in for production')
              require(set(features) <= set(a.get('features', [])), 'Required features absent from artifact')
              require([r for r in records if r.get('reason') == 'build-finished'] == [{'reason': 'build-finished', 'success': True}], 'Cargo build is incomplete')
              filenames = a.get('filenames', [])
              if label == 'wasm-build':
                  paths = [p for p in filenames if p.endswith('.wasm')]
                  require(len(paths) == 1 and a.get('executable') is None, 'Expected one production WASM')
                  path = Path(paths[0])
              else:
                  require(a.get('executable') in filenames, 'Executable absent from Cargo filenames')
                  path = Path(a['executable'])
              require(path.is_absolute() and path.parent == target / directory, 'Artifact is outside the run fresh target/profile')
              require('..' not in path.parts, 'Noncanonical artifact path')
              if inspect:
                  require(path.resolve() == path and stat.S_ISREG(path.lstat().st_mode), 'Artifact is not a direct regular file')
                  with path.open('rb') as f:
                      magic = f.read(8)
                  require(magic == b'\x00asm\x01\x00\x00\x00' if label == 'wasm-build' else magic.startswith(b'\x7fELF'), 'Wrong artifact format')
                  if label == 'bundle-player-build':
                      check_bundle_elf(path)
                  if label != 'wasm-build':
                      require(path.stat().st_mode & 0o111, 'Artifact is not executable')
              return a, path, dest
          
          
          def collect(h, label):
              records = [json.loads(line) for line in (h.COMMANDS / (label + '.stdout')).read_text().splitlines() if line.strip()]
              record, source, name = select_artifact(records, label, h.ROOT, h.TARGET)
              destination = h.EVIDENCE / 'bin' / name
              destination.parent.mkdir(exist_ok=True)
              before = h.digest(source)
              with source.open('rb') as src, destination.open('xb') as out:
                  shutil.copyfileobj(src, out)
              destination.chmod(0o644 if label == 'wasm-build' else 0o755)
              require(before == h.digest(source) == h.digest(destination), 'Artifact changed while copied')
              return {'path': str(destination), 'source_path': str(source), 'sha256': before,
                      'bytes': destination.stat().st_size, 'cargo_compiler_artifact': record,
                      'build_command': label, 'build_stdout_sha256': h.digest(h.COMMANDS / (label + '.stdout'))}
          
          
          def validate_report(h, report, offline=False):
              """Reconstruct required successes from raw receipts/logs, never trust status alone.
          
              Offline audit maps retained copied files under EVIDENCE; original source/target
              paths remain literal provenance and are not expected to exist on the auditor.
              """
              require(report.get('status') == 'passed' and report.get('tested_commit') == h.EXPECTED_SHA and report.get('tested_tree') == h.EXPECTED_TREE, 'Focused receipt failed/missing/wrong source')
              require(report.get('commands') == dict(plan()), 'Required command plan absent or changed')
              require(set(report.get('artifacts', {})) == set(ARTIFACTS), 'Required fresh artifact set absent or changed')
              artifacts = report['artifacts']
              inventories = {}
              boundaries = {}
              full_sample = listed((h.COMMANDS / 'sample-list.stdout').read_text())
              require(set(SAMPLE_REQUIRED + SAMPLE_IGNORED) <= set(full_sample), 'Required sample regressions absent')
              require(report.get('sample_list') == full_sample, 'Sample listing receipt mismatch')
              for label, argv in plan():
                  r = h.read('commands/' + label + '.json', {})
                  env = {}
                  if label == 'wasm-parity':
                      env = {'ORR_NATIVE_SCENE_WASM': artifacts['wasm-build']['path']}
                  elif label == 'bundle-real-acceptance':
                      env = {'ORR_NATIVE_BUNDLE_RUNTIME_BIN': artifacts['bundle-player-build']['path']}
                  elif label == 'native-delivery':
                      env = {'ORR_NATIVE_SCENE_CREATOR_BIN': artifacts['creator-build']['path'],
                             'ORR_NATIVE_SCENE_PLAYER_BIN': artifacts['player-build']['path']}
                  require(r.get('status') == 'passed' and r.get('exit_code') == 0 and r.get('argv') == argv and r.get('env_overrides') == env and r.get('cwd') == str(h.ROOT), 'Required command receipt mismatch: ' + label)
                  require((h.COMMANDS / (label + '.exit-status')).read_text() == '0\n', 'Command exit receipt mismatch: ' + label)
                  for field, suffix in [('log', '.log'), ('stdout', '.stdout'), ('stderr', '.stderr')]:
                      relative = 'commands/' + label + suffix
                      require(r.get(field) == relative and r.get(field + '_sha256') == h.digest(h.EVIDENCE / relative), 'Command output hash mismatch: ' + relative)
                  text = (h.COMMANDS / (label + '.stdout')).read_text()
                  if label in ARTIFACTS:
                      records = [json.loads(line) for line in text.splitlines() if line.strip()]
                      # Cargo may subsequently rebuild the same target/<profile>/<bin> for
                      # the off/web-only matrix. The exclusively copied artifact is stable;
                      # source_path is build-time provenance, verified during collect().
                      a, source, name = select_artifact(records, label, h.ROOT, h.TARGET, inspect=False)
                      saved = artifacts[label]
                      expected_original = str(h.ORIGINAL_EVIDENCE / 'bin' / name) if offline else str(h.EVIDENCE / 'bin' / name)
                      require(saved.get('path') == expected_original and saved.get('source_path') == str(source), 'Artifact copy/source path mismatch')
                      require(saved.get('cargo_compiler_artifact') == a and saved.get('build_command') == label and saved.get('build_stdout_sha256') == h.digest(h.COMMANDS / (label + '.stdout')), 'Artifact build provenance mismatch')
                      copied = h.EVIDENCE / 'bin' / name
                      require(copied.is_file() and not copied.is_symlink() and saved.get('bytes') == copied.stat().st_size and saved.get('sha256') == h.digest(copied), 'Retained artifact hash mismatch')
                      with copied.open('rb') as stream:
                          magic = stream.read(8)
                      require(magic == b'\x00asm\x01\x00\x00\x00' if label == 'wasm-build' else magic.startswith(b'\x7fELF'), 'Retained artifact format mismatch')
                      if label == 'bundle-player-build':
                          check_bundle_elf(copied)
                  elif label == 'package-native-tests':
                      inventories[label] = inventory(text, PACKAGE_TESTS, fifo=True)
                  elif label == 'native-cli-tests':
                      inventories[label] = inventory(text, [CLI, REJECTION], [WASM])
                  elif label == 'wasm-parity':
                      inventories[label] = inventory(text, [WASM], filtered=2)
                  elif label == 'native-delivery':
                      inventories[label] = inventory(text, [DELIVERY], filtered=len(full_sample) - 1)
                  elif label == 'sample-native-tests':
                      inventories[label] = inventory(text, sorted(set(full_sample) - set(SAMPLE_IGNORED)), SAMPLE_IGNORED)
                  elif label in ('default-cli-tests', 'web-only-cli-tests'):
                      inventories[label] = inventory(text, [CLI])
                  elif label.endswith('-package-boundary'):
                      names = re.findall(r'(?m)^(\S+) v\S+', text)
                      require(names and names[0] == 'orr_package' and 'orr_games' not in names, 'Default/web-only dependency boundary failed')
                      boundaries[label] = sorted(set(names))
                  extra = bundle_inventory(h, label, text, full_sample)
                  if extra is not None:
                      inventories[label] = extra
              require(report.get('inventories') == inventories and report.get('boundaries') == boundaries, 'Reconstructed inventory/boundary receipts differ')
              return {'inventories': inventories, 'boundaries': boundaries}
          
          
          def run(h):
              report = {'status': 'failed', 'tested_commit': h.EXPECTED_SHA, 'tested_tree': h.EXPECTED_TREE,
                        'commands': dict(plan()), 'inventories': {}, 'artifacts': {},
                        'limitations': ['Fresh CPU/CLI gates only, no hardware/window/browser certification',
                                        'Known source-hidden Arena UI test remains ignored; native delivery is explicit']}
              h.write('focused.json', report)
              try:
                  require(h.read('preflight.json', {}).get('valid') and h.read('setup.json', {}).get('valid'), 'Preflight/setup not passed')
                  require(h.snapshot('before-focused')['valid'], 'Focused pre-source fence failed')
                  require(h.digest(h.ROOT / 'tools/check-linux-local.sh') == GATE_HASH, 'Original aggregate changed')
                  h.validate_guard_files()
                  full_sample = None
                  for label, argv in plan():
                      env = {}
                      if label == 'wasm-parity':
                          env = {'ORR_NATIVE_SCENE_WASM': report['artifacts']['wasm-build']['path']}
                      if label == 'bundle-real-acceptance':
                          env = {'ORR_NATIVE_BUNDLE_RUNTIME_BIN': report['artifacts']['bundle-player-build']['path']}
                      if label == 'native-delivery':
                          env = {'ORR_NATIVE_SCENE_CREATOR_BIN': report['artifacts']['creator-build']['path'],
                                 'ORR_NATIVE_SCENE_PLAYER_BIN': report['artifacts']['player-build']['path']}
                      require(h.run_command(label, argv, env=env) == 0, 'Required command failed: ' + label)
                      text = (h.COMMANDS / (label + '.stdout')).read_text()
                      if label in ARTIFACTS:
                          report['artifacts'][label] = collect(h, label)
                      elif label == 'package-native-tests':
                          report['inventories'][label] = inventory(text, PACKAGE_TESTS, fifo=True)
                      elif label == 'native-cli-tests':
                          report['inventories'][label] = inventory(text, [CLI, REJECTION], [WASM])
                      elif label == 'wasm-parity':
                          report['inventories'][label] = inventory(text, [WASM], filtered=2)
                      elif label == 'native-delivery':
                          # Cross-check this count against the full compiled listing in the next command.
                          summaries = re.findall(r'(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; (\d+) filtered out;', text)
                          require(len(summaries) == 1 and int(summaries[0]) >= len(SAMPLE_REQUIRED), 'Invalid filtered sample count')
                          report['inventories'][label] = inventory(text, [DELIVERY], filtered=int(summaries[0]))
                      elif label == 'sample-list':
                          full_sample = listed(text)
                          require(set(SAMPLE_REQUIRED + SAMPLE_IGNORED) <= set(full_sample), 'Required sample regressions absent')
                          require(report['inventories']['native-delivery']['filtered'] == len(full_sample) - 1, 'Explicit delivery count differs from full sample binary')
                          report['sample_list'] = full_sample
                      elif label == 'sample-native-tests':
                          report['inventories'][label] = inventory(text, sorted(set(full_sample) - set(SAMPLE_IGNORED)), SAMPLE_IGNORED)
                      elif label in ('default-cli-tests', 'web-only-cli-tests'):
                          report['inventories'][label] = inventory(text, [CLI])
                      elif label.endswith('-package-boundary'):
                          names = re.findall(r'(?m)^(\S+) v\S+', text)
                          require(names and names[0] == 'orr_package', 'Empty or incorrect package dependency tree')
                          require('orr_games' not in names, 'Native game dependency leaked into default or web-only package')
                          report.setdefault('boundaries', {})[label] = sorted(set(names))
                      extra = bundle_inventory(h, label, text, full_sample)
                      if extra is not None:
                          report['inventories'][label] = extra
                      h.write('focused.json', report)
                  report['status'] = 'passed'
              except BaseException:
                  report['error'] = traceback.format_exc()
              finally:
                  try:
                      require(h.snapshot('after-focused')['valid'], 'Focused post-source fence failed')
                      for artifact in report['artifacts'].values():
                          require(h.digest(Path(artifact['path'])) == artifact['sha256'], 'Copied fresh artifact changed during verification')
                  except BaseException:
                      report.update(status='failed', final_error=traceback.format_exc())
                  h.write('focused.json', report)
              return 0 if report['status'] == 'passed' else 1
          
          
          def seal(h):
              receipt = h.read('receipt.json', {})
              errors = []
              report = h.read('focused.json', {'status': 'not_started'})
              fence = False
              try:
                  require(not (h.EVIDENCE / 'aggregate-receipt.json').exists(), 'Scoped run must not invent aggregate receipts')
                  require(not (h.COMMANDS / 'linux-aggregate.json').exists(), 'Scoped run must not rerun aggregate')
                  require(receipt.get('historical_evidence') == h.HISTORICAL_EVIDENCE, 'Historical references changed')
                  require(receipt.get('full_aggregate_this_run') == 'NOT_RUN_BY_DESIGN', 'Aggregate claim changed')
                  require(h.read('preflight.json', {}).get('valid') and h.read('setup.json', {}).get('valid'), 'Preflight/setup incomplete')
                  validate_report(h, report)
                  h.validate_guard_files()
                  for a in report['artifacts'].values():
                      require(h.digest(Path(a['path'])) == a['sha256'], 'Retained artifact final hash changed')
              except BaseException:
                  errors.append(traceback.format_exc())
              finally:
                  try:
                      fence = h.snapshot('scoped-seal')['valid']
                      require(fence, 'Final scoped source fence failed')
                  except BaseException:
                      errors.append(traceback.format_exc())
              receipt.update(status='failed' if errors else 'passed', errors=errors, focused=report,
                             source_fence_valid=fence, scoped_sealed_utc=h.now())
              h.write('receipt.json', receipt)
              h.write('evidence-sha256.json', [{'path': str(p.relative_to(h.EVIDENCE)), 'bytes': p.stat().st_size, 'sha256': h.digest(p)}
                                             for p in sorted(h.EVIDENCE.rglob('*')) if p.is_file() and p.name != 'evidence-sha256.json'])
              return 1 if errors else 0
          
          
          if __name__ == '__main__':
              spec = importlib.util.spec_from_file_location('aggregate', Path(os.environ['RUNNER_TEMP']) / 'stormglass-full-linux-harness.py')
              h = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(h)
              signal.signal(signal.SIGTERM, h.interrupted)
              signal.signal(signal.SIGINT, h.interrupted)
              try:
                  code = {'run': run, 'seal': seal}[sys.argv[1]](h)
              except BaseException:
                  if h.EVIDENCE.is_dir():
                      h.write('focused-' + sys.argv[1] + '-exception.json', {'traceback': traceback.format_exc()})
                  raise
              sys.exit(code)
          PYFOCUSED_PART3
          cp "$RUNNER_TEMP/stormglass-focused.py" "$EVIDENCE/focused-harness.py"
          python3 -B "$RUNNER_TEMP/stormglass-focused.py" run

      - name: Seal scoped results with historical references
        if: ${{ always() }}
        run: python3 -B "$RUNNER_TEMP/stormglass-focused.py" seal

      - name: Always upload original failures and receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-native-bundle-scoped-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          compression-level: 6

name: PNG sprite package import acceptance
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  png-sprite-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_PNG_EVIDENCE: ${{ github.workspace }}/target/png-sprite-package-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Default-feature refusal, strict checks, and exact-count admission tests
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          import subprocess
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_PNG_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=False)
          suffix = '.exe' if os.name == 'nt' else ''
          importer = str(Path('target/debug/examples') / ('png_sprite_package' + suffix))
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', '--example', 'png_sprite_package'], evidence / 'build-default.log')
          # This branch must reject before argument parsing or file access.
          for label, args in [('help', ['--help']), ('inputs', ['--png', str(evidence / 'missing.png'), '--json', str(evidence / 'missing.json'), '--license', str(evidence / 'missing.txt'), '--name', 'disabled', '--version', '1.0.0', '--out', str(evidence / 'must-not-exist')])]:
              result = subprocess.run([importer, *args], capture_output=True, text=True, timeout=10)
              (evidence / ('disabled-' + label + '.log')).write_text(result.stdout + result.stderr + '\nexit=' + str(result.returncode), encoding='utf-8')
              if result.returncode != 1 or result.stdout or result.stderr.strip() != 'png_sprite_package requires --features project-create; no files were read or written' or (evidence / 'must-not-exist').exists():
                  raise RuntimeError('Default-disabled example did not fail closed before file access')
          helpers['run_logged'](['rustfmt', '--edition', '2021', '--check', 'crates/orr_sample/examples/png_sprite_package.rs'], evidence / 'format.log')
          commands = (
              ('example-tests', ['test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--example', 'png_sprite_package', '--', '--format=pretty', '--color=never']),
              ('strict-lint', ['clippy', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--example', 'png_sprite_package', '--', '-D', 'warnings']),
              ('build-importer', ['build', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--example', 'png_sprite_package']),
              ('build-package-cli', ['build', '--locked', '-p', 'orr_package', '--bin', 'orr_pkg']),
          )
          for name, command in commands:
              output = helpers['run_logged'](['cargo', *command], evidence / (name + '.log'))
              if name == 'example-tests':
                  output = output.replace('\r\n', '\n')
                  expected = 14 if os.name == 'nt' else 16
                  summaries = helpers['SUMMARY'].findall(output)
                  cases = helpers['CASE'].findall(output)
                  if (expected == 0 or len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (expected, 0, 0, 0, 0)
                      or re.findall(r'^running (\d+) tests?$', output, re.M) != [str(expected)]
                      or len(cases) != expected or len({name for name, _ in cases}) != expected
                      or any(status != 'ok' for _, status in cases)):
                      raise RuntimeError('Expected complete passing import/admission tests with no skips or filters')
      - name: Real CLI import and immutable installed verification
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_PNG_EVIDENCE'])
          suffix = '.exe' if os.name == 'nt' else ''
          helpers['run_logged'](['python', 'tools/check-png-sprite-package.py',
              '--evidence', str(evidence / 'cli'),
              '--importer', str(Path('target/debug/examples') / ('png_sprite_package' + suffix)),
              '--package-cli', str(Path('target/debug') / ('orr_pkg' + suffix))], evidence / 'cli.log')
      - name: Retain receipts and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-sprite-package-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_PNG_EVIDENCE }}
          if-no-files-found: error

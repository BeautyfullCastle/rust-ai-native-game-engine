name: Collect UI distribution acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-ui-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_COLLECT_DISTRIBUTION_CI: ${{ github.workspace }}/target/collect-ui-distribution-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused distribution state and actual EditorApp controls
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_DISTRIBUTION_CI"])
          evidence.mkdir(parents=True, exist_ok=False)
          # All four existing UI acceptance workflows remain required unchanged.
          # This workflow adds the independent distribution namespace.
          suite = "collect_ui_alignment::distribution::tests"
          expected = {
              "collect_ui_alignment::distribution::tests::both_axes_root_and_nested_preserve_every_unowned_field",
              "collect_ui_alignment::distribution::tests::fractional_anchors_round_final_offset_and_bound_gap_residual",
              "collect_ui_alignment::distribution::tests::selection_and_authored_order_do_not_change_stable_id_ties",
              "collect_ui_alignment::distribution::tests::rational_gaps_do_not_accumulate_rounding_and_restage_is_noop",
              "collect_ui_alignment::distribution::tests::signed_ties_and_unrounded_bounds_are_exact",
              "collect_ui_alignment::distribution::tests::checked_helpers_reject_overflow_and_bad_divisors",
              "collect_ui_alignment::distribution::tests::negative_space_and_quantized_overlap_reject_whole_draft",
              "collect_ui_alignment::distribution::tests::original_overlap_can_be_resolved_and_zero_gaps_are_allowed",
              "collect_ui_alignment::distribution::tests::invalid_selection_document_or_context_clears_previous_draft",
              "collect_ui_alignment::distribution::tests::entire_document_and_every_context_field_are_pinned",
              "collect_ui_alignment::distribution::tests::later_target_out_of_bounds_never_stages_partial_result",
              "collect_ui_alignment::distribution::tests::cancellation_and_switching_alignment_preserve_compatible_api",
          }
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "distribution-state.log")
          h["validate_tests"](output, suite, 12)
          if {name for name, status in h["CASE"].findall(output.replace("\r\n", "\n"))} != expected:
              raise RuntimeError("Exact distribution state inventory differs from the 12 mandatory cases")
          name = "app::collect_ui_preview::tests::distribution_acceptance::actual_editor_distribution_requires_three_siblings_and_keeps_multi_select_open"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", name, "--", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-distribution-controls-cpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected exactly one passing actual EditorApp distribution test")
          for label, command in (
              ("default-check", ["cargo", "check", "--locked", "-p", "orr_editor", "--lib"]),
              ("minimal-collect-ui-check", ["cargo", "check", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui", "--lib"]),
              ("default-strict", ["cargo", "clippy", "--locked", "-p", "orr_editor", "--lib", "--tests", "--", "-D", "warnings"]),
              ("minimal-collect-ui-strict", ["cargo", "clippy", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui", "--lib", "--tests", "--", "-D", "warnings"]),
              ("collect-ui-strict", ["cargo", "clippy", "--locked", "-p", "orr_editor", "--features", "collect-ui", "--lib", "--tests", "--", "-D", "warnings"]),
          ):
              h["run_logged"](command, evidence / (label + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_COLLECT_DISTRIBUTION_CI/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_COLLECT_DISTRIBUTION_CI/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/collect-preview-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_COLLECT_DISTRIBUTION_CI/vulkan-driver.log"
      - name: Actual EditorApp distribution staging and production renderer parity
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import runpy
          import struct
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_DISTRIBUTION_CI"]).resolve()
          captures = evidence / "software-gpu"
          captures.mkdir(exist_ok=False)
          os.environ["ORR_COLLECT_UI_DISTRIBUTION_EVIDENCE"] = str(captures)
          name = "app::collect_ui_preview::tests::distribution_acceptance::actual_editor_distribution_gpu_stages_cancels_applies_and_fresh_reopens"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", name, "--", "--ignored", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-preview-gpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected one executed software GPU test with no skips")
          receipt = json.loads((captures / "collect-ui-distribution-acceptance.json").read_text())
          if (type(receipt.get("schema")) is not int or receipt["schema"] != 1
                  or receipt.get("window_pixels") != [1800, 1200]
                  or type(receipt.get("production_collect_ui_pixel_parity_cases")) is not int
                  or receipt["production_collect_ui_pixel_parity_cases"] != 8):
              raise RuntimeError("Unexpected preview receipt schema or parity inventory")
          for flag in ("production_editor_app", "software_vulkan", "three_siblings_required_multi_checkbox",
                       "endpoints_fixed_interior_reference_moves", "horizontal_vertical_equal_edge_gaps",
                       "staging_changes_pixels_only", "cancel_restores_exact_pixels", "apply_one_undo",
                       "old_and_new_button_hit_regions", "nested_ancestor_clip",
                       "host_and_project_files_unchanged_before_apply", "save_fresh_editor_reopen"):
              if receipt.get(flag) is not True:
                  raise RuntimeError("Missing verified distribution predicate: " + flag)
          if type(receipt.get("portrait_display_scale")) is not float or receipt["portrait_display_scale"] != 0.75:
              raise RuntimeError("Expected explicit 75-percent portrait scaling proof")
          if receipt.get("native_os_window") is not False:
              raise RuntimeError("Software-GPU synthetic input must not claim native window acceptance")
          adapter = receipt.get("adapter")
          if not isinstance(adapter, str) or "llvmpipe" not in adapter.lower() or "Cpu" not in adapter or "Vulkan" not in adapter:
              raise RuntimeError("Explicit llvmpipe CPU Vulkan evidence required")
          for name, size in (
              ("distribution-original", (640, 360)),
              ("distribution-root-0", (640, 360)),
              ("distribution-root-1", (640, 360)),
              ("distribution-cancelled", (640, 360)),
              ("distribution-applied", (640, 360)),
              ("distribution-nested-0", (360, 640)),
              ("distribution-nested-1", (360, 640)),
              ("distribution-fresh-reopened", (360, 640)),
          ):
              for suffix, expected in (("canvas", size), ("editor", (1800, 1200))):
                  filename = name + "-" + suffix + ".png"
                  raw = (captures / filename).read_bytes()
                  if raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR" or struct.unpack(">II", raw[16:24]) != expected:
                      raise RuntimeError("Missing or wrong-sized preview screenshot: " + filename)
      - name: Retain exact counts, production parity captures and full controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-ui-distribution-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_COLLECT_DISTRIBUTION_CI }}
          if-no-files-found: error

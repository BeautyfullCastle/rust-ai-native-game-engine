name: Room actor placement acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021, su/static-game-starter-20261022]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-actor-placement:
    # Additive optional-feature coverage; no existing mandatory gate is replaced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_ROOM_ACTOR_EVIDENCE: ${{ github.workspace }}/target/room-actor-placement-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused CPU preview contracts and optional feature boundaries
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_ROOM_ACTOR_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Shared wall/stamp regressions remain required in room-wall-footprint.yml.
          for suite, count in (
              ("room_authoring_panel::actor_placement::tests", 8),
          ):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "room-authoring",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (suite.replace("::", "-") + ".log"))
              helpers["validate_tests"](output, suite, count)
          for name, args in (
              ("default-check", ["check", "--lib"]),
              ("room-authoring-check", ["check", "--lib", "--features", "room-authoring"]),
              ("room-authoring-lint", ["clippy", "--lib", "--features", "room-authoring", "--", "-D", "warnings"]),
              ("actor-ui-lint", ["clippy", "--test", "room_actor_placement_ui", "--features", "room-authoring", "--", "-D", "warnings"]),
          ):
              helpers["run_logged"](["cargo", args[0], "--locked", "-p", "orr_editor", *args[1:]],
                                    evidence / (name + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_ROOM_ACTOR_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_ROOM_ACTOR_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/room-actor-placement-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_ROOM_ACTOR_EVIDENCE/vulkan-driver.log"
      - name: Explicit ignored production EditorApp Room actor placement acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_ROOM_ACTOR_EVIDENCE"])
          capture = evidence / "actor-ui"
          if capture.exists():
              raise RuntimeError("Actor placement acceptance requires an absent, fresh capture directory")
          os.environ["ORR_ROOM_ACTOR_PLACEMENT_DIR"] = str(capture.resolve())
          name = "actor_ground_placement_preserves_staging_and_completes_room"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "room-authoring",
               "--test", "room_actor_placement_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "actor-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "acceptance.json").read_text())
          expected = {
              "schema": 1, "production_editor_app": True, "software_gpu": True,
              "physical_os_input": False, "three_role_ground_clicks": True,
              "actor_wall_mutual_exclusion": True, "staging_no_mutation": True,
              "overlap_refusal_atomic": True, "escape_preserves_selection": True,
              "apply_undo_redo_save_reopen": True, "play_key_pickup_then_exit_won": True,
              "guids_models_camera_preserved": True,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh Room actor placement receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          for image in ("01-overlap-refused.png", "02-staged-roles.png", "03-applied-saved.png",
                        "04-reopened.png", "05-key-collected.png", "06-room-won.png"):
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh actor placement capture: {image}")
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-actor-placement-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_ROOM_ACTOR_EVIDENCE }}
          if-no-files-found: error

name: Checked package removal acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-removal:
    # Additive optional-feature coverage; no existing mandatory gate is replaced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_PACKAGE_REMOVAL_EVIDENCE: ${{ github.workspace }}/target/package-removal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused checked removal contracts and feature boundaries
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_PACKAGE_REMOVAL_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_package", "--test", "checked_remove", "--",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "checked-remove-core.log")
          cases = helpers["CASE"].findall(output)
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (8, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["8"]
                  or len(cases) != 8 or len({name for name, _ in cases}) != 8
                  or any(not name.startswith("checked_remove_") or status != "ok" for name, status in cases)):
              raise RuntimeError("Expected all eight checked removal core tests to pass without skips")
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_package", "--test", "restore_removed", "--",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "restore-removed-core.log")
          expected_restore_tests = {
              "restores_root_and_orphaned_dependency_without_original_sources",
              "restores_shared_dependency_and_retained_transitive_root_flags_exactly",
              "stale_active_lock_cannot_be_overwritten_by_old_receipt",
              "rejects_non_inverse_and_forged_identity_before_callback",
              "missing_or_tampered_cache_refuses_preview_and_commit",
              "callback_failure_and_competing_writer_preserve_current_lock",
              "existing_writer_is_retained_and_preview_remains_read_only",
          }
          cases = helpers["CASE"].findall(output)
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (7, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["7"]
                  or len(cases) != 7 or {name for name, _ in cases} != expected_restore_tests
                  or any(status != "ok" for _, status in cases)):
              raise RuntimeError("Expected all seven checked restoration core tests to pass without skips")
          for suite, count in (
              ("package_manager::removal::tests", 20 if os.name == "nt" else 22),
              ("package_manager_panel::tests", 14),
          ):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "package-manager,room-animated-models",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (suite.replace("::", "-") + ".log"))
              helpers["validate_tests"](output, suite, count)
          # The same saved-usage cases run through an example harness to avoid
          # integration-test-driven linking of unrelated sample executables.
          for room_features in ("room-project", "room-animated-models"):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_sample", "--no-default-features",
                   "--features", room_features, "--example", "room_package_usage", "--",
                   "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / ("room-usage-" + room_features + ".log"))
              helpers["validate_tests"](output, "tests", 12 if os.name == "nt" else 13)
          consumer = "saved_usage_guides_partial_then_complete_editor_reassignment_and_checked_removal"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features",
               "--features", "package-manager,room-animated-models",
               "--test", "room_package_usage_consumer", "--",
               "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "room-usage-consumer.log").replace("\r\n", "\n")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(consumer, "ok")]):
              raise RuntimeError("Expected exactly one passing saved Room usage consumer test")
          for name, package, args in (
              ("package-core-lint", "orr_package", ["clippy", "--all-targets", "--", "-D", "warnings"]),
              ("room-usage-static-lint", "orr_sample", ["clippy", "--no-default-features", "--features", "room-project", "--example", "room_package_usage", "--test", "room_package_usage", "--", "-D", "warnings"]),
              ("room-usage-animated-lint", "orr_sample", ["clippy", "--no-default-features", "--features", "room-animated-models", "--example", "room_package_usage", "--test", "room_package_usage", "--", "-D", "warnings"]),
              ("room-usage-default-off-lint", "orr_sample", ["clippy", "--no-default-features", "--example", "room_package_usage", "--", "-D", "warnings"]),
              ("room-usage-consumer-lint", "orr_editor", ["clippy", "--no-default-features", "--features", "package-manager,room-animated-models", "--test", "room_package_usage_consumer", "--", "-D", "warnings"]),
              ("without-package-manager-check", "orr_editor", ["check", "--lib", "--features", "room-animated-models"]),
              ("package-manager-check", "orr_editor", ["check", "--lib", "--features", "package-manager"]),
              ("package-manager-lint", "orr_editor", ["clippy", "--lib", "--features", "package-manager,room-animated-models", "--", "-D", "warnings"]),
              ("removal-ui-lint", "orr_editor", ["clippy", "--test", "package_removal_ui", "--features", "package-manager,room-animated-models", "--", "-D", "warnings"]),
          ):
              helpers["run_logged"](["cargo", args[0], "--locked", "-p", package, *args[1:]],
                                    evidence / (name + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_PACKAGE_REMOVAL_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_PACKAGE_REMOVAL_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/package-removal-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_PACKAGE_REMOVAL_EVIDENCE/vulkan-driver.log"
      - name: Explicit ignored production EditorApp checked removal acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_PACKAGE_REMOVAL_EVIDENCE"])
          capture = evidence / "removal-ui"
          if capture.exists():
              raise RuntimeError("Package removal acceptance requires an absent, fresh capture directory")
          os.environ["ORR_PACKAGE_REMOVAL_CAPTURE_DIR"] = str(capture.resolve())
          name = "verified_room_package_removal_preserves_content_and_reopens_for_play"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "package-manager,room-animated-models",
               "--test", "package_removal_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "removal-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "acceptance.json").read_text())
          expected = {
              "schema": 1, "production_editor_app": True, "physical_os_input": False,
              "software_gpu": True,
              "static_animated_used_refused": True, "stale_lock_refused": True,
              "direct_to_retained_dependency": True, "explicit_preview_remove": True,
              "cache_sources_scene_models_camera_preserved": True, "checksum_history_unchanged": True,
              "inventory_refreshed": True, "reopen_play_stop": True,
              "restored_exact_prior_lock": True, "restored_transitive_dependencies": True,
              "source_hidden_during_restore_and_reopen": True,
              "restored_model_assigned_and_saved": True, "sources_restored": True,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh checked removal receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          for image in ("01-verified.png", "02-used-refused.png", "03-removal-preview.png",
                        "04-inventory-refreshed.png", "05-restoration-preview.png", "06-restored.png",
                        "07-restored-model-assigned.png", "08-reopened.png", "09-playing.png"):
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh package removal capture: {image}")
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-removal-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_PACKAGE_REMOVAL_EVIDENCE }}
          if-no-files-found: error

name: PNG sequence named clips
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: PNG named clips (${{ matrix.mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [cpu, gpu]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software Vulkan
        if: matrix.mode == 'gpu'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 libxkbcommon-dev
      - name: Run current-source fail-closed acceptance
        env:
          ORR_PNG_SEQUENCE_CLIPS_EVIDENCE: ${{ runner.temp }}/png-sequence-clips-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -B tools/png_sequence_clips_gate.py '${{ matrix.mode }}'
      - name: Retain compiled producers, logs, receipts and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-sequence-clips-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/png-sequence-clips-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
  required:
    name: PNG named clips required
    if: always()
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - env:
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE" = success

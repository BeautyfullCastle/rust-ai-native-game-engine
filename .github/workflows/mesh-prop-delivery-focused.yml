name: mesh-prop-delivery focused Linux CI
# Publication waits for final product review and exact remote PR/head handoff.
# Added by the 2026-11-03 request for minimal actual remote CI.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/mesh-shaded-prop-delivery-20261103]
permissions:
  contents: read
concurrency:
  group: mesh-prop-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mesh-prop-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      WGPU_BACKEND: gl
      ORR_REQUIRE_GPU: '1'
      EVIDENCE: ${{ github.workspace }}/ci-evidence
      ORR_TEST_MESH_PROP_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence/captures
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build and software rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/mesh-prop-delivery-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Build actual trusted exporter and player
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p orr_editor --features mesh-prop-delivery --bin orr_mesh_prop_export --bin orr_mesh_prop_player --message-format=json > "$EVIDENCE/build.jsonl" 2> "$EVIDENCE/build.log"
          python3 - <<'PYARTIFACT'
          import json, os
          from pathlib import Path
          records = [json.loads(line) for line in (Path(os.environ['EVIDENCE']) / 'build.jsonl').read_text().splitlines()]
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for binary, key in [('orr_mesh_prop_export', 'ORR_TEST_MESH_PROP_EXPORT'), ('orr_mesh_prop_player', 'ORR_TEST_MESH_PROP_PLAYER')]:
                  paths = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact' and r.get('target', {}).get('name') == binary and r.get('executable')]
                  assert len(paths) == 1, paths
                  out.write(f'{key}={paths[0]}\n')
          PYARTIFACT
      - name: Verify CPU contracts and actual relocated headless delivery
        shell: python {0}
        run: |
          import json, os, re, runpy
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          suites = [('cpu', [], 15, 3), ('actual-binary-and-gpu', ['--ignored'], 3, 0)]
          for label, extra, count, ignored in suites:
              command = ['cargo', 'test', '--locked', '--release', '-p', 'orr_editor', '--features', 'mesh-prop-delivery', '--lib', 'mesh_prop_delivery', '--', '--format=pretty', '--color=never', '--test-threads=1', '--show-output'] + extra
              output = helpers['run_logged'](command, evidence / (label + '.log')).replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(output)
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, ignored, 0):
                  raise RuntimeError(f'{label}: expected exactly {count} passes and {ignored} explicitly ignored tests')
              cases = helpers['CASE'].findall(output)
              passed = [name for name, status in cases if status == 'ok']
              if len(passed) != count or len(set(passed)) != count:
                  raise RuntimeError(f'{label}: missing or duplicate passing cases')
          images = list((evidence / 'captures').rglob('*.png'))
          if len(images) < 3:
              raise RuntimeError('Expected fresh actual-player captures including shading counterfactual')
          for path in images:
              data = path.read_bytes()
              if len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise RuntimeError(f'Invalid PNG: {path.name}')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'cpu_passed': 15, 'actual_binary_tests_passed': 3, 'coverage': 'Linux software GPU/headless only', 'full_workspace': False}, indent=2))
      - name: Strict changed-feature Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p orr_editor --features mesh-prop-delivery --lib --bins --tests -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-prop-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

name: Mesh waypoint patrol focused CI
on:
  push:
    branches: [codex/mesh-waypoint-patrol-20261107]
permissions:
  contents: read
jobs:
  mesh-waypoint-patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Authored patrol and deterministic runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_games --features mesh-mission --lib mesh_navigation_game::mesh_play_input_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/legacy-input-golden.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/legacy-input-golden.log
          cargo test --locked -p orr_games --features mesh-mission --test mesh_navigation  -- --test-threads=1 2>&1 | tee ci-evidence/legacy-navigation.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/legacy-navigation.log
          cargo test --locked -p orr_games --features mesh-patrol,mesh-mission --lib mesh_navigation_game::patrol::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/patrol-core.log
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' ci-evidence/patrol-core.log
          cargo test --locked -p orr_remote --features mesh-patrol,mesh-hazards --lib mesh_navigation::patrol::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/authoring.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/authoring.log
          cargo test --locked -p orr_remote --features mesh-patrol,mesh-hazards --lib mesh_navigation::hazards::patrol_profile_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/hazard-profile.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/hazard-profile.log
          cargo test --locked -p orr_remote --features mesh-mission --test mesh_feature_profile  -- --test-threads=1 2>&1 | tee ci-evidence/profile-off.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/profile-off.log
          cargo test --locked -p orr_remote --features mesh-patrol,mesh-hazards --test mesh_feature_profile  -- --test-threads=1 2>&1 | tee ci-evidence/profile-on.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/profile-on.log
          cargo test --locked -p orr_remote --features mesh-navigation,orr_games/mesh-patrol --test mesh_feature_profile  -- --test-threads=1 2>&1 | tee ci-evidence/profile-mismatch.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/profile-mismatch.log
          cargo test --locked -p orr_editor --features mesh-patrol --lib mesh_navigation::patrol_panel::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features mesh-patrol --lib mesh_navigation::patrol_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/integration.log
          cargo check --locked -p orr_editor --features mesh-navigation --lib 2>&1 | tee ci-evidence/legacy-editor.log
          cargo check --locked -p orr_editor --features package-manager,room-animated-models,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib 2>&1 | tee ci-evidence/cross-editor.log
          cargo build --locked -p orr_remote --features mesh-patrol,mesh-mission --bin orr_mesh 2>&1 | tee ci-evidence/native-runtime.log
          cargo clippy --locked -p orr_games --features mesh-patrol,mesh-mission --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-games.log
          cargo clippy --locked -p orr_remote --features mesh-patrol,mesh-hazards --lib --bin orr_mesh -- -D warnings 2>&1 | tee ci-evidence/clippy-remote.log
          cargo clippy --locked -p orr_editor --features mesh-patrol,mesh-hazards-export,mesh-animated-models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-waypoint-patrol-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

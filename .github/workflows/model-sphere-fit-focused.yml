name: Model sphere fit focused CI
on:
  push:
    branches: [codex/model-sphere-fit-20261107]
permissions:
  contents: read
jobs:
  sphere-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Sphere fitting and saved editor settings in deployed Room
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features models --lib model_panel::fit::tests -- --test-threads=1 2>&1 | tee ci-evidence/math.log
          grep -F 'test result: ok. 8 passed; 0 failed; 0 ignored;' ci-evidence/math.log
          cargo test --locked -p orr_sample --lib yard3d_view::tests::editor_sphere_radius_requires_exact_shape_body_and_generation -- --exact 2>&1 | tee ci-evidence/sphere-bridge.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/sphere-bridge.log
          cargo test --locked -p orr_editor --features models --test yard3d_models sphere_fit:: -- --test-threads=1 2>&1 | tee ci-evidence/static-sphere.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/static-sphere.log
          cargo test --locked -p orr_editor --features animated-models --test yard3d_animated sphere_fit:: -- --test-threads=1 2>&1 | tee ci-evidence/animated-sphere.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/animated-sphere.log
          cargo build --locked -p orr_sample --features room-project --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_SPHERE_ROOM_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features windows-export --test room_model_admission sphere_fit_export:: -- --test-threads=1 2>&1 | tee ci-evidence/room-export.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/room-export.log
          cargo test --locked -p orr_editor --features models --test yard3d_models box_fit:: -- --test-threads=1 2>&1 | tee ci-evidence/box-regression.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/box-regression.log
          cargo test --locked -p orr_editor --features models --test yard3d_models actual_widgets_assign_remove_undo_save_reopen_and_disable_mutation_in_play -- --exact 2>&1 | tee ci-evidence/play-guard.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/play-guard.log
          cargo clippy --locked -p orr_editor --features models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
          cargo clippy --locked -p orr_editor --features animated-models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-animated.log
          cargo clippy --locked -p orr_editor --features windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-export.log
          cargo clippy --locked -p orr_sample --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-bridge.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sphere-fit-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

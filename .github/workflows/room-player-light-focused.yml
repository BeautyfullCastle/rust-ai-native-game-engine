name: Room carried player light focused CI
on:
  push:
    branches: [codex/room-player-light-20261107]
permissions:
  contents: read
jobs:
  player-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Authored carried light and deployed game
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_sample --features room-project,project-create --test room_lighting -- --test-threads=1 2>&1 | tee ci-evidence/default-off.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/default-off.log
          cargo test --locked -p orr_sample --features room-lighting --lib room_lighting:: -- --test-threads=1 2>&1 | tee ci-evidence/core.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/core.log
          cargo test --locked -p orr_sample --features room-lighting,project-create --test room_lighting -- --test-threads=1 2>&1 | tee ci-evidence/admission.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/admission.log
          cargo build --locked -p orr_sample --features room-lighting,room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          cargo test --locked -p orr_sample --features room-lighting,room-character,project-create,project-export --test room_lighting_export --no-run 2>&1 | tee ci-evidence/legacy-gpu-export-compile.log
          cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --lib room_lighting_panel::tests -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 14 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --lib editor::room_lighting_coherence_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/coherence.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/coherence.log
          cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --test room_lighting generated_room_lighting_actual_editor_apply_undo_redo_save_reopen -- --exact 2>&1 | tee ci-evidence/legacy-widgets.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-widgets.log
          cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --test room_lighting carried::carried_light_widgets_save_reopen_real_movement_seek_stop_and_disable -- --exact 2>&1 | tee ci-evidence/carried-widgets.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/carried-widgets.log
          ORR_CARRIED_LIGHT_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --test room_lighting carried::carried_light_source_hidden_export_and_native_headless_follow_actual_movement -- --ignored --exact 2>&1 | tee ci-evidence/deployed-light.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed-light.log
          cargo clippy --locked -p orr_sample --features room-project,project-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-default-off.log
          cargo clippy --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-player-light-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

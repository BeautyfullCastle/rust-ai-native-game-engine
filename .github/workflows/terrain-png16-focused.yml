name: terrain-png16 focused Linux CI
# Publication waits for final product review and exact remote PR/head handoff.
# Added by the 2026-11-03 request for minimal actual remote CI.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/terrain-png16-20261103]
permissions:
  contents: read
concurrency:
  group: terrain-png16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terrain-png16:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/terrain-png16-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Run focused feature contracts and actual UI
        shell: python {0}
        run: |
          import json, os, re, runpy
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          suites = [('decoder-input', 'orr_terrain_view', 'png16', ['--lib', 'png16::'], 13), ('editor-cpu', 'orr_editor', 'terrain-png16', ['--lib', 'terrain_panel::png16::tests'], 9)]
          for label, package, features, args, count in suites:
              flags = ['--format=pretty', '--color=never', '--test-threads=1']
              command = ['cargo', 'test', '--locked', '--release', '-p', package, '--features', features] + args + ['--'] + flags
              output = helpers['run_logged'](command, evidence / (label + '.log'))
              normalized = output.replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(normalized)
              cases = helpers['CASE'].findall(normalized)
              ignored = 1 if label == 'decoder-input' else 0
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, ignored, 0):
                  raise RuntimeError(f'{label}: expected exactly {count} passing tests with only the explicit socket exclusion')
              passed = [(name, status) for name, status in cases if status == 'ok']
              if len(passed) != count or len({name for name, status in passed}) != count:
                  raise RuntimeError(f'{label}: missing, duplicate or failing individual cases')
              skipped = re.findall(r'^test (\S+) \.\.\. ignored(?:,.*)?$', normalized, re.MULTILINE)
              expected_skips = ['png16::tests::input_rejects_socket_on_permitted_host'] if ignored else []
              if skipped != expected_skips:
                  raise RuntimeError(f'{label}: unexpected excluded test inventory')
              if re.findall(r'^running (\d+) tests?$', normalized, re.MULTILINE) != [str(count + ignored)]:
                  raise RuntimeError(f'{label}: inconsistent executed test count')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'executed_test_counts': {suite[0]: suite[4] for suite in suites}, 'excluded_socket_test': 'png16::tests::input_rejects_socket_on_permitted_host', 'gpu': False, 'full_workspace': False}, indent=2))
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-png16-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

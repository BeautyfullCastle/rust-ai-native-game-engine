name: Animated material authoring focused CI
on:
  push:
    branches: [codex/animated-material-authoring-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Animated material authoring to installed game use
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_model --example animated_model_recolor 2>&1 | tee ci-evidence/feature-off.log
          cargo test --locked -p orr_model --features animation,import --test animated_model_recolor -- --test-threads=1 2>&1 | tee ci-evidence/model.log
          grep -F 'test result: ok. 9 passed; 0 failed; 1 ignored;' ci-evidence/model.log
          cargo build --locked -p orr_model --features animation,import --example animated_model_recolor 2>&1 | tee ci-evidence/tool-build.log
          ORR_ANIMATED_RECOLOR_TOOL="$PWD/target/debug/examples/animated_model_recolor" cargo test --locked -p orr_model --features animation,import --test animated_model_recolor filesystem::actual_example_cli_publishes_source_hidden_reusable_animation_and_refuses_collisions -- --ignored --exact 2>&1 | tee ci-evidence/actual-cli.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/actual-cli.log
          cargo test --locked -p orr_model --features animation,import --test animation_clip_sequence preserves_original_content_and_deterministic_direct_input_provenance -- --exact 2>&1 | tee ci-evidence/legacy-sequence.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-sequence.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::animated_recolor_import_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 1 passed; 0 failed; 1 ignored;' ci-evidence/integration.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::cooked_animated_import_tests::imported_cooked_animation_is_explicitly_installed_used_saved_and_reopened -- --exact 2>&1 | tee ci-evidence/legacy-import.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-import.log
          cargo build --locked -p orr_sample --features room-lighting,room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_ANIMATED_RECOLOR_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::animated_recolor_import_tests::authored_animated_material_survives_source_hidden_native_export -- --ignored --exact 2>&1 | tee ci-evidence/deployed.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed.log
          cargo clippy --locked -p orr_model --features animation,import --lib --example animated_model_recolor -- -D warnings 2>&1 | tee ci-evidence/clippy-model.log
          cargo clippy --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-material-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

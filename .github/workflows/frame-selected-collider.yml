name: Selected collider framing acceptance
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frame-selected-collider:
    # Additive optional-feature coverage; no existing mandatory gate is replaced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_FRAME_SELECTION_EVIDENCE: ${{ github.workspace }}/target/frame-selected-collider-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused CPU preview contracts and optional feature boundaries
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_FRAME_SELECTION_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Existing camera regressions remain required in room-camera-capture.yml.
          for suite, count in (
              ("editor::frame_selection::tests", 6),
              ("app::selection_outline::tests", 7),
          ):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "room-authoring",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (suite.replace("::", "-") + ".log"))
              helpers["validate_tests"](output, suite, count)
          for name, args in (
              ("default-check", ["check", "--lib"]),
              ("models-check", ["check", "--lib", "--features", "models"]),
              ("room-project-check", ["check", "--lib", "--features", "room-project"]),
              ("models-lint", ["clippy", "--lib", "--features", "models", "--", "-D", "warnings"]),
              ("room-project-lint", ["clippy", "--lib", "--features", "room-project", "--", "-D", "warnings"]),
              ("room-authoring-lint", ["clippy", "--lib", "--features", "room-authoring", "--", "-D", "warnings"]),
              ("frame-selection-ui-lint", ["clippy", "--test", "frame_selection_ui", "--features", "room-authoring", "--", "-D", "warnings"]),
          ):
              helpers["run_logged"](["cargo", args[0], "--locked", "-p", "orr_editor", *args[1:]],
                                    evidence / (name + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_FRAME_SELECTION_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_FRAME_SELECTION_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/frame-selected-collider-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_FRAME_SELECTION_EVIDENCE/vulkan-driver.log"
      - name: Explicit ignored production EditorApp Selected collider framing acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_FRAME_SELECTION_EVIDENCE"])
          capture = evidence / "frame-selection-ui"
          if capture.exists():
              raise RuntimeError("Collider framing acceptance requires an absent, fresh capture directory")
          os.environ["ORR_FRAME_SELECTION_DIR"] = str(capture.resolve())
          name = "collider_framing_button_and_viewport_f_preserve_authoring"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "room-authoring",
               "--test", "frame_selection_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "frame-selection-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "acceptance.json").read_text())
          expected = {
              "schema": 1, "production_editor_app": True, "software_gpu": True,
              "physical_os_input": False, "button_frames_full_collider_with_margin": True,
              "viewport_f_frames": True, "unfocused_f_ignored": True, "held_pointer_f_ignored": True,
              "no_selection_and_play_disabled": True, "yaw_pitch_preserved": True,
              "authoring_frame_history_selection_files_unchanged": True,
              "accurate_collider_outline": True,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh Selected collider framing receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          yellow = receipt.get("yellow_outline_pixels")
          if type(yellow) is not int or yellow <= 30:
              raise RuntimeError("Expected more than 30 verified yellow collider outline pixels")
          for image in ("01-offscreen-selected.png", "02-button-framed.png", "03-keyboard-framed.png"):
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh selected collider capture: {image}")
      - name: Explicit ignored production EditorApp Yard collider outline acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_FRAME_SELECTION_EVIDENCE"])
          capture = evidence / "yard-outline-ui"
          if capture.exists():
              raise RuntimeError("Collider framing acceptance requires an absent, fresh capture directory")
          os.environ["ORR_YARD_SELECTION_OUTLINE_DIR"] = str(capture.resolve())
          name = "yard_rotated_box_and_capsule_outlines_follow_colliders"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "room-authoring",
               "--test", "frame_selection_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "yard-outline-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "acceptance.json").read_text())
          expected = {
              "schema": 1, "production_editor_app": True, "software_gpu": True,
              "physical_os_input": False, "rotated_box_outline": True, "capsule_outline": True,
              "frame_history_selection_scene_unchanged": True,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh Selected collider framing receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          counts = receipt.get("yellow_pixel_counts")
          if (type(counts) is not list or len(counts) != 2
                  or any(type(value) is not int or value <= 30 for value in counts)):
              raise RuntimeError("Both Yard colliders require more than 30 verified outline pixels")
          for image in ("01-rotated-box.png", "02-capsule.png"):
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh selected collider capture: {image}")
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-selected-collider-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_FRAME_SELECTION_EVIDENCE }}
          if-no-files-found: error

name: Frame inspected Terrain patrol focused CI
on:
  push:
    branches: [codex/frame-inspected-terrain-patrol-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frame-inspected-terrain-patrol-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frame-inspected-terrain-patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect inspected route framing and conflicting input checks
        shell: python {0}
        run: |
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          evidence=Path('ci-evidence');results=[]
          full='terrain-patrol,package-manager,room-character,room-lighting,room-authoring,project-create,windows-export,mesh-hazards-export,mesh-mission,mesh-animated-models,mesh-patrol,mesh-prop-shading'
          def run(label,command,count=None):
              with (evidence/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  lines=[]
                  for line in p.stdout:
                      print(line,end='',flush=True);log.write(line);log.flush();lines.append(line)
                  code=p.wait()
              text=''.join(lines);ok=code==0
              if count is not None:
                  summary=re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text,re.M)
                  names=re.findall(r'^test (\S+) \.\.\. ok$',text,re.M)
                  running=re.findall(r'^running (\d+) tests?$',text,re.M)
                  ok=ok and summary==[('ok',str(count),'0','0','0')] and len(names)==len(set(names))==count and running==[str(count)]
              results.append(dict(label=label,command=command,exit=code,ok=ok,expected=count))
              (evidence/'results.json').write_text(json.dumps(results,indent=2))
              return ok
          def tests(label,selector,count,extra=()):
              if not libtest_ready:
                  results.append(dict(label=label,ok=False,expected=count,unrun="libtest compilation failed"));return
              run(label,['cargo','test','--locked','-p','orr_editor','--features',full,'--lib',selector,'--']+list(extra)+['--test-threads=1'],count)
          libtest_ready=run("libtest-build",["cargo","test","--locked","-p","orr_editor","--features",full,"--lib","--no-run"])
          checks=[
            ('terrain-frame-app','app::terrain_patrol_frame::tests::',4),
            ('terrain-frame-points','navigation_panel::patrol_frame_points::tests::',1),
            ('terrain-frame-ui','navigation_panel::patrol_panel::patrol_frame::ui_tests::',2),
            ('terrain-frame-core','editor::frame_terrain_patrol::tests::',5),
            ('mesh-frame-core','editor::frame_mesh_patrol::tests::',5),
            ('legacy-frame-selection','editor::frame_selection::tests::',6),
            ('terrain-route-points','navigation_panel::patrol_routes::tests::',6),
            ('terrain-inspection','navigation_panel::patrol_panel::preview_tests::',5),
            ('terrain-route-overlay','navigation_panel::patrol_route_overlay::tests::',3),
            ('terrain-patrol-widgets','navigation_panel::patrol_panel::tests::',6),
            ('terrain-patrol-pick-widgets','navigation_panel::patrol_panel::pick_panel_tests::',4),
            ('mesh-frame-app','app::mesh_patrol_frame::tests::',4),
            ('terrain-patrol-picking','app::navigation_endpoint_pick::patrol_tests::',3),
          ]
          assert sum(n for _,_,n in checks)==54
          for label,selector,count in checks: tests(label,selector,count)
          run('strict-terrain-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','terrain-patrol','--lib','--','-D','warnings'])
          run('strict-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','mesh-navigation','--lib','--','-D','warnings'])
          run('strict-patrol-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','mesh-patrol','--lib','--','-D','warnings'])
          run('strict-full',['cargo','clippy','--locked','-p','orr_editor','--features',full,'--lib','--','-D','warnings'])
          run('feature-off',['cargo','check','--locked','-p','orr_editor','--features','models','--lib'])
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          (evidence/'scope.txt').write_text('Focused CPU checks only; full sampled 3D route fitting, current source admission and conflicting input. Windows/GPU/physical play/video UNRUN; no full-workspace validation.')
          if not all(r['ok'] for r in results):raise SystemExit('Focused inspected Terrain patrol framing checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-inspected-terrain-patrol-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

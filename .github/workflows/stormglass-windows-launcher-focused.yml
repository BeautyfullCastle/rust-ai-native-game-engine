name: stormglass Windows launcher focused CI
on:
  push:
    branches: [codex/stormglass-windows-launcher-20261106, codex/stormglass-external-bank-20261107, codex/stormglass-settings-launch-20261107]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and check launcher contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory ci-evidence | Out-Null
          git rev-parse HEAD | Set-Content ci-evidence/source.txt
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong source head' }
          rustc --version | Set-Content ci-evidence/rustc.txt
          & ./tools/test_stormglass_windows_launcher.ps1 -EvidenceDirectory "$PWD/ci-evidence/contracts" *>&1 | Tee-Object ci-evidence/contracts.log
          $result = Get-Content ci-evidence/contracts/result.json -Raw | ConvertFrom-Json
          if ($result.contract_assertions -ne 88 -or $result.hosts.Count -ne 2) { throw 'Incomplete contract coverage' }
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-windows-launcher-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

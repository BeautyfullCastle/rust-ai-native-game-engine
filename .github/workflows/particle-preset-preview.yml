name: Embedded particle preset preview acceptance
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  particle-preset-preview:
    # Additive acceptance: existing required CI and baseline assertions remain mandatory.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_PARTICLE_PREVIEW_CI: ${{ github.workspace }}/target/particle-preview-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Install explicit software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ORR_PARTICLE_PREVIEW_CI"
          sudo apt-get update -q 2>&1 | tee "$ORR_PARTICLE_PREVIEW_CI/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_PARTICLE_PREVIEW_CI/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/particle-preview-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
            echo "WGPU_BACKEND=vulkan"
          } >> "$GITHUB_ENV"
      - name: Exact preview inventories, feature isolation and same-file runtime acceptance
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import runpy
          import struct
          import subprocess

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_PARTICLE_PREVIEW_CI"]).resolve()
          def source_snapshot():
              names = subprocess.check_output(["git", "ls-files", "--cached", "--others", "--exclude-standard"], text=True).splitlines()
              return {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                      for name in sorted(set(names)) if Path(name).is_file()
                      and (name.startswith(("crates/", ".github/workflows/", "tools/"))
                           or name in ("Cargo.lock", "Cargo.toml", "clippy.toml"))}
          before_source = source_snapshot()
          (evidence / "source-before.json").write_text(json.dumps(before_source, indent=2) + "\n")
          def run(label, args):
              return helpers["run_logged"](args, evidence / (label + ".log")).replace("\r\n", "\n")
          def one(base, name, ignored=False):
              args = base + [name, "--", "--exact", "--format=pretty", "--color=never", "--test-threads=1", "--show-output"]
              if ignored:
                  args.append("--ignored")
              target = base[base.index("--test") + 1] if "--test" in base else "sample"
              output = run(target + "-" + name.replace("::", "-"), args)
              summaries = helpers["SUMMARY"].findall(output)
              if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                      or helpers["CASE"].findall(output) != [(name, "ok")]):
                  raise RuntimeError("Expected exactly one executed passing test: " + name)
          def inventory(label, base, prefix, total, ignored_count):
              output = run(label + "-inventory", base + [prefix, "--", "--list"])
              names = re.findall(r"^(\S+): test$", output, re.MULTILINE)
              output = run(label + "-ignored-inventory", base + [prefix, "--", "--ignored", "--list"])
              ignored = re.findall(r"^(\S+): test$", output, re.MULTILINE)
              if (len(names) != total or len(set(names)) != total or len(ignored) != ignored_count
                      or not set(ignored).issubset(names) or any(not n.startswith(prefix) for n in names)):
                  raise RuntimeError("Unexpected exact inventory: " + label)
              for name in names:
                  if name not in ignored:
                      one(base, name)
              return ignored

          sample = ["cargo", "test", "--locked", "-p", "orr_sample", "--no-default-features", "--lib",
                    "--features", "particle-preset,material-demo"]
          editor = ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features",
                    "--features", "particle-preset-editor", "--test", "particle_preset_authoring_ui"]
          preview = ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features",
                     "--features", "particle-preset-preview", "--test", "particle_preset_preview_ui"]
          # Counts are pinned to this acceptance contract; zero-test filters fail.
          schema_gpu = inventory("schema", sample, "particle_preset::tests::", 10, 0)
          runtime_gpu = inventory("runtime", sample, "particle_demo::preset_tests::", 3, 1)
          editor_gpu = inventory("editor", editor, "", 7, 1)
          if editor_gpu != ["particle_preset_widgets_have_real_gpu_pixels"]:
              raise RuntimeError("Unexpected editor GPU inventory")
          preview_gpu = inventory("preview", preview, "", 17, 1)
          if preview_gpu != ["embedded_preview_widgets_have_real_gpu_pixels"]:
              raise RuntimeError("Unexpected preview GPU inventory")
          for label, package, args in (
              ("sample-default", "orr_sample", ["check", "--lib"]),
              ("editor-default", "orr_editor", ["check", "--lib"]),
              ("authoring-only", "orr_editor", ["check", "--bin", "orr_particle_preset", "--features", "particle-preset-editor"]),
              ("preview-only", "orr_editor", ["check", "--bin", "orr_particle_preset", "--features", "particle-preset-preview"]),
              ("preview-strict", "orr_editor", ["clippy", "--bin", "orr_particle_preset", "--test", "particle_preset_preview_ui", "--features", "particle-preset-preview", "--", "-D", "warnings"]),
              ("schema-only", "orr_sample", ["check", "--lib", "--features", "particle-preset"]),
              ("legacy-particle-bin", "orr_sample", ["check", "--bin", "particle_demo", "--features", "particle-demo"]),
              ("legacy-material-bin", "orr_sample", ["check", "--bin", "material_demo", "--features", "material-demo"]),
              ("sample-strict", "orr_sample", ["clippy", "--lib", "--bin", "particle_demo", "--features", "particle-preset,material-demo", "--", "-D", "warnings"]),
              ("editor-strict", "orr_editor", ["clippy", "--bin", "orr_particle_preset", "--test", "particle_preset_authoring_ui", "--features", "particle-preset-editor", "--", "-D", "warnings"]),
          ):
              run(label, ["cargo", args[0], "--locked", "-p", package, "--no-default-features", *args[1:]])
          features = run("preview-feature-tree", ["cargo", "tree", "--locked", "-p", "orr_editor", "--no-default-features",
                         "--features", "particle-preset-preview", "--prefix", "none", "--format", "{p} features={f}"])
          sample_features = [line.split(" features=", 1)[1].split(",") for line in features.splitlines()
                             if line.startswith("orr_sample v") and " features=" in line]
          if not sample_features or any("particle-demo" in f or "material-demo" in f for f in sample_features):
              raise RuntimeError("Authoring preview enabled a sample runtime feature")
          captures = evidence / "software-gpu"
          captures.mkdir(exist_ok=False)
          ui = captures / "editor"
          runtime = captures / "runtime"
          ui.mkdir()
          runtime.mkdir()
          saved = ui / "authored-preset.json"
          os.environ["ORR_PARTICLE_PRESET_EVIDENCE"] = str(ui)
          os.environ["ORR_PARTICLE_PRESET_ACCEPTANCE_FILE"] = str(saved)
          os.environ["ORR_PARTICLE_PRESET_CAPTURE_DIR"] = str(runtime)
          one(editor, "particle_preset_widgets_have_real_gpu_pixels", True)
          receipt = json.loads((ui / "particle-preset-ui-acceptance.json").read_text())
          for flag in ("production_eframe_app", "all_numeric_fields_widget_edited", "alpha_additive_widget_edited",
                       "invalid_apply_atomic", "dirty_save_accepted_only", "discard_undo_redo_open", "no_overwrite", "exact_saved_bytes"):
              if receipt.get(flag) is not True:
                  raise RuntimeError("Missing UI acceptance predicate: " + flag)
          if receipt.get("native_os_window") is not False or receipt.get("embedded_runtime_preview") is not False:
              raise RuntimeError("Incorrect UI execution scope")
          if not all(word in receipt.get("adapter", "") for word in ("llvmpipe", "Cpu", "Vulkan")):
              raise RuntimeError("Expected explicit software Vulkan UI adapter")
          if Path(receipt.get("authored_file", "")) != saved:
              raise RuntimeError("UI receipt does not identify runtime input")
          before = saved.read_bytes()
          digest = hashlib.sha256(before).hexdigest()
          if not before or len(before) > 64 * 1024:
              raise RuntimeError("Missing or unbounded UI-saved preset")
          for name in runtime_gpu:
              one(sample, name, True)
          if saved.read_bytes() != before:
              raise RuntimeError("Runtime changed the exact UI-saved input")
          runtime_receipt = (runtime / "runtime-evidence.txt").read_text()
          if "software=true" not in runtime_receipt or "llvmpipe" not in runtime_receipt:
              raise RuntimeError("Expected explicit software runtime adapter")
          screenshots = list(ui.glob("*.png")) + list(runtime.glob("*.png"))
          if len(list(ui.glob("*.png"))) < 2 or len(list(runtime.glob("*.png"))) < 7:
              raise RuntimeError("Missing UI or runtime screenshots")
          for filename in screenshots:
              raw = filename.read_bytes()
              if (len(raw) < 33 or raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR"
                      or min(struct.unpack(">II", raw[16:24])) < 100):
                  raise RuntimeError("Invalid retained screenshot: " + filename.name)
          (evidence / "same-file-acceptance.json").write_text(json.dumps({
              "schema": 1, "ui_saved_runtime_input_sha256": digest,
              "unchanged_after_runtime": True, "software_vulkan": True,
              "synthetic_widget_input": True, "native_os_window": False,
              "physical_gpu_performance": False,
          }, indent=2) + "\n")
          embedded = captures / "embedded-preview"
          embedded.mkdir()
          os.environ["ORR_PARTICLE_PREVIEW_EVIDENCE"] = str(embedded)
          one(preview, "embedded_preview_widgets_have_real_gpu_pixels", True)
          report = json.loads((embedded / "embedded-preview-acceptance.json").read_text())
          for flag in ("production_eframe_app", "same_device_native_texture", "accepted_burst", "different_color",
                       "later_frame", "pause_freezes", "restart_exact", "dirty_draft_excluded_same_age_pixels",
                       "accepted_edit_stale_until_refresh", "expiry_exact_empty_baseline", "full_window_texture_visible",
                       "close_and_drop_unregister_texture"):
              if report.get(flag) is not True:
                  raise RuntimeError("Missing embedded preview predicate: " + flag)
          if report.get("native_os_window") is not False or report.get("target_size") != [320, 240]:
              raise RuntimeError("Unexpected embedded preview execution scope")
          if not all(word in report.get("adapter", "") for word in ("llvmpipe", "Cpu", "Vulkan")):
              raise RuntimeError("Expected explicit software Vulkan preview adapter")
          for name in ("initial", "later", "alternate", "restarted", "expired", "empty-baseline"):
              target = (embedded / ("preview-" + name + ".png")).read_bytes()
              if (len(target) < 33 or target[:8] != b"\x89PNG\r\n\x1a\n" or target[12:16] != b"IHDR"
                      or struct.unpack(">II", target[16:24]) != (320, 240)):
                  raise RuntimeError("Invalid production target capture: " + name)
          raw = (embedded / "embedded-preview-full-window.png").read_bytes()
          if (len(raw) < 33 or raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR"
                  or min(struct.unpack(">II", raw[16:24])) < 240):
              raise RuntimeError("Missing full-window GPU capture")
          after_source = source_snapshot()
          (evidence / "source-after.json").write_text(json.dumps(after_source, indent=2) + "\n")
          if before_source != after_source:
              raise RuntimeError("Source or dependency lockfile changed during acceptance")
      - name: Preserve exact inventories, failures and software GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: particle-preset-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_PARTICLE_PREVIEW_CI }}
          if-no-files-found: error
          retention-days: 7

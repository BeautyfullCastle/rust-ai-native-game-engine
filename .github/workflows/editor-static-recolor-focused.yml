name: Editor static recolor focused CI
on:
  push:
    branches: [codex/editor-static-recolor-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-static-recolor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  editor-static-recolor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/editor-static-recolor-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          uname -a | tee ci-evidence/platform.txt
          hostname | tee ci-evidence/runner-hostname.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect static RGB authoring and editor-use checks
        shell: python {0}
        run: |
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          evidence=Path('ci-evidence');results=[]
          full='package-manager,room-character,room-lighting,project-create,windows-export'
          def run(label,command,count=None):
              with (evidence/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  lines=[]
                  for line in p.stdout:
                      print(line,end='',flush=True);log.write(line);log.flush();lines.append(line)
                  code=p.wait()
              text=''.join(lines);ok=code==0
              if count is not None:
                  summary=re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text,re.M)
                  # CLI writes directly to stdout, splitting some test completion lines.
                  pattern=r'^test (\S+) \.\.\. ' if label=='model-recolor-existing-contract' else r'^test (\S+) \.\.\. ok$'
                  names=re.findall(pattern,text,re.M)
                  running=re.findall(r'^running (\d+) tests?$',text,re.M)
                  ok=ok and summary==[('ok',str(count),'0','0','0')] and len(names)==len(set(names))==count and running==[str(count)]
              results.append(dict(label=label,command=command,exit=code,ok=ok,expected=count))
              (evidence/'results.json').write_text(json.dumps(results,indent=2))
              return ok
          def tests(label,selector,count,extra=()):
              if not libtest_ready:
                  results.append(dict(label=label,ok=False,expected=count,unrun="libtest compilation failed"));return
              run(label,['cargo','test','--locked','-p','orr_editor','--features',full,'--lib',selector,'--']+list(extra)+['--test-threads=1'],count)
          run('model-recolor-library',['cargo','test','--locked','-p','orr_model','--features','import','--lib','static_recolor::tests::','--','--test-threads=1'],3)
          cli_ready=run('recolor-cli-build',['cargo','build','--locked','-p','orr_model','--features','import','--example','static_model_recolor','--message-format=json'])
          artifacts=[]
          if cli_ready:
              for line in (evidence/'recolor-cli-build.log').read_text(encoding='utf-8').splitlines():
                  try: artifact=json.loads(line)
                  except json.JSONDecodeError: continue
                  if artifact.get('reason')=='compiler-artifact' and artifact.get('target',{}).get('name')=='static_model_recolor' and artifact.get('target',{}).get('kind')==['example'] and artifact.get('executable'):
                      artifacts.append(artifact)
              assert len(artifacts)==1, 'exactly one current-source recolor CLI artifact required'
              artifact=artifacts[0]
              assert Path(artifact['manifest_path']).resolve()==Path('crates/orr_model/Cargo.toml').resolve()
              assert 'import' in artifact['features']
              binary=Path(artifact['executable'])
              assert binary.is_absolute() and binary.is_file()
              binary=binary.resolve(strict=True)
              os.environ['ORR_STATIC_MODEL_RECOLOR_BIN']=str(binary)
              (evidence/'producer.json').write_text(json.dumps(dict(executable=str(binary),sha256=hashlib.sha256(binary.read_bytes()).hexdigest(),source=os.environ['GITHUB_SHA'],tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),artifact=artifact),indent=2))
              run('recolor-cli-help',[str(binary),'--help'])
              run('model-recolor-existing-contract',['cargo','test','--locked','-p','orr_model','--features','import','--test','static_model_recolor','--','--test-threads=1'],17)
          else:
              results.append(dict(label='model-recolor-existing-contract',ok=False,expected=17,unrun='current-source CLI build failed'))
          run('strict-model-recolor',['cargo','clippy','--locked','-p','orr_model','--features','import','--lib','--example','static_model_recolor','--','-D','warnings'])
          run('model-feature-off',['cargo','check','--locked','-p','orr_model','--lib'])
          libtest_ready=run("libtest-build",["cargo","test","--locked","-p","orr_editor","--features",full,"--lib","--no-run"])
          checks=[
            ('static-recolor-backend','model_package_import::static_recolor::tests::',9),
            ('static-recolor-ui','model_package_import_panel::static_recolor_ui::tests::',4),
            ('static-recolor-editor-use','package_manager_panel::editor_static_recolor_tests::',2),
            ('shared-publication-regression','model_package_import::tests::',21),
            ('catalog-regression','model_package_import_panel::source_inspection::tests::',6),
            ('static-uv-ui-regression','model_package_import_panel::static_uv_ui::tests::',4),
            ('static-texture-ui-regression','model_package_import_panel::static_texture_ui::tests::',4),
            ('static-assembly-ui-regression','model_package_import_panel::static_assembly_ui::tests::',4),
            ('static-assembly-editor-use-regression','package_manager_panel::editor_static_assembly_tests::',2),
            ('glb-subtree-ui-regression','model_package_import_panel::glb_subtree_ui::tests::',4),
            ('glb-subtree-editor-use-regression','package_manager_panel::editor_glb_subtree_tests::',2),
            ('static-pivot-ui-regression','model_package_import_panel::static_pivot_ui::tests::',4),
            ('static-pivot-editor-use-regression','package_manager_panel::editor_static_pivot_tests::',2),
            ('static-sampler-ui-regression','model_package_import_panel::static_sampler_ui::tests::',4),
            ('static-sampler-editor-use-regression','package_manager_panel::editor_static_sampler_tests::',2),
            ('static-browser-regression','package_manager_panel::cooked_model_tests::',2),
          ]
          for label,selector,count in checks: tests(label,selector,count)
          run('static-recolor-minimal-tests',['cargo','test','--locked','-p','orr_editor','--features','package-manager','--lib','model_package_import::static_recolor::tests::','--','--test-threads=1'],9)
          run('static-recolor-ui-minimal',['cargo','test','--locked','-p','orr_editor','--features','package-manager','--lib','model_package_import_panel::static_recolor_ui::tests::','--','--test-threads=1'],4)
          run('catalog-minimal-regression',['cargo','test','--locked','-p','orr_editor','--features','package-manager','--lib','model_package_import_panel::source_inspection::tests::','--','--test-threads=1'],3)
          run('strict-package-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','package-manager','--lib','--','-D','warnings'])
          run('strict-static-and-animated-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','package-manager,room-animated-models','--lib','--','-D','warnings'])
          run('strict-combined',['cargo','clippy','--locked','-p','orr_editor','--features',full,'--lib','--','-D','warnings'])
          run('feature-off',['cargo','check','--locked','-p','orr_editor','--lib'])
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          (evidence/'scope.txt').write_text('Focused CPU static linear RGB authoring, strict f64 bounds before f32 conversion, used-slot/alpha/shared-image and sampler preservation, immutable provenance and safe publication, install/binding/history/Save/reopen and actual renderer initialization color uniforms. Windows/GPU/physical play/video UNRUN; no full-workspace validation.')
          if not all(r['ok'] for r in results):raise SystemExit('Focused Editor static recolor checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-static-recolor-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

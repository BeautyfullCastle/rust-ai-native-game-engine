name: Static shadow fit focused Linux CI
# Added by the 2026-11-03 request for minimal actual remote CI.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/static-shadow-fit-20261102]
permissions:
  contents: read
concurrency:
  group: static-shadow-fit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static-shadow-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      WGPU_BACKEND: gl
      EVIDENCE: ${{ github.workspace }}/ci-evidence
      ORR_MESH_SHADOW_FIT_CAPTURE_DIR: ${{ github.workspace }}/ci-evidence/captures
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build and software rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/shadow-fit-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Run shadow fitting, affected camera regression and real offscreen UI
        shell: python {0}
        run: |
          import json, os, re, runpy, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          common = ['cargo', 'test', '--locked', '--release', '-p', 'orr_editor', '--features', 'mesh-navigation']
          camera = 'mesh_camera_panel::tests::saved_sidecar_binding_matches_exact_optional_digest_only_when_admitted_cleanly'
          ui = 'actual_static_shadow_fit_stages_then_applies_receiver_shadow_and_reopens'
          suites = [
              ('shadow-fit', ['--lib', 'mesh_lighting_panel::shadow_fit::'], 5, None),
              ('shadow-panel', ['--lib', 'mesh_lighting_panel::shadow_fit_panel_tests::'], 4, None),
              ('camera-regression', ['--lib', camera], 1, camera),
              ('offscreen-ui', ['--test', 'mesh_shadow_fit_ui', ui], 1, ui),
          ]
          for label, args, count, exact in suites:
              flags = ['--format=pretty', '--color=never', '--test-threads=1']
              if exact:
                  flags += ['--exact']
              if label == 'offscreen-ui':
                  flags += ['--ignored', '--nocapture']
              output = helpers['run_logged'](common + args + ['--'] + flags, evidence / (label + '.log'))
              summaries = helpers['SUMMARY'].findall(output.replace('\r\n', '\n'))
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, 0, 0):
                  raise RuntimeError(f'{label}: expected exactly {count} passes and no ignored tests')
              if exact and not re.search(r'^test ' + re.escape(exact) + r' \.\.\. .*?ok$', output, re.MULTILINE):
                  # --nocapture may interleave renderer diagnostics with the test result;
                  # the unique exact test filter and single passing summary still bind this execution.
                  if re.findall(r'^running (\d+) tests?$', output, re.MULTILINE) != ['1']:
                      raise RuntimeError(f'{label}: exact test did not execute')
              if label == 'shadow-fit':
                  helpers['validate_tests'](output, 'mesh_lighting_panel::shadow_fit', count)
              if label == 'shadow-panel':
                  helpers['validate_tests'](output, 'mesh_lighting_panel::shadow_fit_panel_tests', count)
          images = list((evidence / 'captures').glob('*.png'))
          if len(images) != 10:
              raise RuntimeError(f'Expected 10 fresh rendered PNGs, found {len(images)}')
          for path in images:
              data = path.read_bytes()
              if len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise RuntimeError(f'Invalid PNG: {path.name}')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'cpu_tests': 9, 'camera_tests': 1, 'offscreen_tests': 1, 'full_workspace': False}, indent=2))
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-shadow-fit-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

name: tilemap-pattern-assets focused Linux CI
# Focused CI for the reviewed editor feature; existing workflows remain unchanged.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/tilemap-pattern-assets-20261104]
permissions:
  contents: read
concurrency:
  group: tilemap-pattern-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tilemap-pattern-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      WGPU_BACKEND: gl
      ORR_REQUIRE_GPU: '1'
      EVIDENCE: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build and software rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/tilemap-pattern-assets-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          mkdir "$runtime/mesa-cache"
          echo "MESA_SHADER_CACHE_DIR=$runtime/mesa-cache" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Run focused feature contracts
        shell: python {0}
        run: |
          import json, os, re, runpy
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          app = evidence / 'app'
          app.mkdir()
          os.environ['ORR_TILEMAP_PATTERN_ASSET_EVIDENCE'] = str(app.resolve())
          features = ['--features', 'tilemap,project-create', '--lib']
          suites = [
              ('tilemap', features + ['tilemap_panel::'], 79, 0, []),
              ('sprite-output', features + ['sprite_panel::clip_timing::output::tests'], 13, 0, []),
              ('json-output', features + ['json_output::tests'], 2, 0, []),
              ('app', features + ['app::tilemap_pattern_asset_tests::actual_pattern_asset_save_load_stamp_reopen_play_literal_cells'], 1, 0, ['--exact', '--ignored']),
              ('deps', ['--test', 'deps'], 8, 0, []),
          ]
          for label, args, count, ignored, flags in suites:
              command = ['cargo', 'test', '--locked', '--release', '-p', 'orr_editor'] + args + ['--', '--format=pretty', '--color=never', '--test-threads=1'] + flags
              output = helpers['run_logged'](command, evidence / (label + '.log')).replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(output)
              cases = helpers['CASE'].findall(output)
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, ignored, 0):
                  raise RuntimeError(f'{label}: unexpected test summary')
              passed = [name for name, status in cases if status == 'ok']
              if len(passed) != count or len(set(passed)) != count:
                  raise RuntimeError(f'{label}: missing or duplicate passing cases')
              if re.findall(r'^running (\d+) tests?$', output, re.MULTILINE) != [str(count + ignored)]:
                  raise RuntimeError(f'{label}: inconsistent executed test count')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '--release', '-p', 'orr_editor', '--features', 'tilemap,project-create', '--lib', '--tests', '--', '-D', 'warnings'], evidence / 'clippy.log')
          helpers['run_logged'](['cargo', 'check', '--locked', '--release', '-p', 'orr_editor', '--lib'], evidence / 'default-off.log')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'executed_test_counts': {suite[0]: suite[2] for suite in suites}, 'full_workspace': False}, indent=2))
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tilemap-pattern-assets-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

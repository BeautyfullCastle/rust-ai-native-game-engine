name: Room default lighting CLI focused CI
on:
  push:
    branches: [codex/lit-room-default-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Explicit default light creation and CLI compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_sample --features project-create,room-lighting --test room_lit_starter_cli -- --test-threads=1 2>&1 | tee ci-evidence/cli-off.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/cli-off.log
          cargo test --locked -p orr_sample --features project-create,room-lighting,room-character --test room_lit_starter_cli -- --test-threads=1 2>&1 | tee ci-evidence/cli-on.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/cli-on.log
          cargo clippy --locked -p orr_sample --features project-create,room-lighting --bin orr_new_lit_room -- -D warnings 2>&1 | tee ci-evidence/clippy-off.log
          cargo clippy --locked -p orr_sample --features project-create,room-lighting,room-character --bin orr_new_lit_room -- -D warnings 2>&1 | tee ci-evidence/clippy-on.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lit-room-default-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

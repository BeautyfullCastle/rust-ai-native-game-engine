name: Keep installed dependency focused CI
on:
  push:
    branches: [codex/keep-installed-dependency-20261107]
permissions:
  contents: read
jobs:
  keep-dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Installed dependency selection and saved game use
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_package --test keep_dependency -- --test-threads=1 2>&1 | tee ci-evidence/core.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/core.log
          cargo test --locked -p orr_package --test keep_dependency_cli -- --test-threads=1 2>&1 | tee ci-evidence/cli.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/cli.log
          cargo test --locked -p orr_package --test checked_remove -- --test-threads=1 2>&1 | tee ci-evidence/remove.log
          grep -F 'test result: ok. 8 passed; 0 failed; 0 ignored;' ci-evidence/remove.log
          cargo test --locked -p orr_package --test restore_removed -- --test-threads=1 2>&1 | tee ci-evidence/restore.log
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' ci-evidence/restore.log
          cargo build --locked -p orr_package --bin orr_pkg 2>&1 | tee ci-evidence/tool-build.log
          cargo build --locked -p orr_sample --features room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_KEEP_PACKAGE_TOOL="$PWD/target/debug/orr_pkg" ORR_KEEP_ROOM_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_sample --features room-character,project-create,project-export --test keep_dependency_room -- --ignored --exact saved_room_model_dependency_is_kept_after_parent_removal_and_runs_from_hidden_source_export 2>&1 | tee ci-evidence/deployed-room.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed-room.log
          cargo clippy --locked -p orr_package --lib --bin orr_pkg -- -D warnings 2>&1 | tee ci-evidence/clippy-package.log
          cargo clippy --locked -p orr_sample --features room-character,project-create,project-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-sample.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-dependency-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: custom-tileset-starter focused Linux CI
# Added by the 2026-11-03 request for minimal actual remote CI.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/custom-tileset-starter-20261103]
permissions:
  contents: read
concurrency:
  group: custom-tileset-starter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  custom-tileset-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      WGPU_BACKEND: gl
      ORR_REQUIRE_GPU: '1'
      EVIDENCE: ${{ github.workspace }}/ci-evidence
      ORR_CUSTOM_TILESET_EVIDENCE: ${{ github.workspace }}/ci-evidence/editor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE" "$ORR_CUSTOM_TILESET_EVIDENCE" "$EVIDENCE/delivery" "$EVIDENCE/editor-export"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build and software rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/custom-tileset-starter-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Verify custom creator and real saved delivery
        shell: python {0}
        run: |
          import json, os, re, runpy
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          sample = 'project-create,project-export,tilemap'
          def run(label, package, features, args, count, ignored=False):
              flags = ['--format=pretty', '--color=never', '--test-threads=1', '--show-output']
              if ignored:
                  flags += ['--ignored', '--exact']
              command = ['cargo', 'test', '--locked', '--release', '-p', package, '--features', features] + args + ([] if '--' in args else ['--']) + flags
              output = helpers['run_logged'](command, evidence / (label + '.log')).replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(output)
              cases = helpers['CASE'].findall(output)
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, 0, 0):
                  raise RuntimeError(f'{label}: expected exactly {count} passing tests without skips')
              if len(cases) != count or len({name for name, status in cases}) != count or any(status != 'ok' for name, status in cases):
                  raise RuntimeError(f'{label}: incomplete individual case census')
              if re.findall(r'^running (\d+) tests?$', output, re.MULTILINE) != [str(count)]:
                  raise RuntimeError(f'{label}: inconsistent test count')
          run('creator', 'orr_sample', sample, ['--lib', 'project_create::custom_tilemap::tests::'], 4)
          run('cli', 'orr_sample', sample, ['--test', 'custom_tileset_delivery', '--', '--skip', 'export::relocated_custom_export_captures_literal_tiles_actors_and_controls', '--skip', 'export::actual_editor_saved_project_exports_without_content_edits'], 4)
          run('editor', 'orr_editor', 'tilemap,project-create', ['--lib', 'app::custom_tileset_tests::actual_custom_tileset_palette_paint_undo_save_reopen_play'], 1, True)
          editor = evidence / 'editor'
          receipt = json.loads((editor / 'receipt.json').read_text())
          if receipt.get('completed') is not True or len(receipt.get('captures', [])) != 6:
              raise RuntimeError('Expected completed six-capture actual Editor receipt')
          os.environ['ORR_CUSTOM_TILESET_EDITOR_PROJECT'] = str(editor / 'created-project')
          os.environ['ORR_CUSTOM_TILESET_EDITOR_EXPORT_EVIDENCE'] = str(evidence / 'editor-export')
          os.environ['ORR_CUSTOM_TILESET_EVIDENCE'] = str(evidence / 'delivery')
          run('saved-delivery', 'orr_sample', sample, ['--test', 'custom_tileset_delivery', 'export::relocated_custom_export_captures_literal_tiles_actors_and_controls'], 1, True)
          run('editor-delivery', 'orr_sample', sample, ['--test', 'custom_tileset_delivery', 'export::actual_editor_saved_project_exports_without_content_edits'], 1, True)
          for folder in ['delivery', 'editor-export']:
              if len(list((evidence / folder).glob('*.png'))) != 4 or not (evidence / folder / 'oracle.txt').is_file():
                  raise RuntimeError(f'{folder}: missing four real player controls or oracle')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_sample', '--features', sample, '--lib', '--tests', '--', '-D', 'warnings'], evidence / 'strict-sample.log')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', 'tilemap,project-create', '--lib', '--tests', '--', '-D', 'warnings'], evidence / 'strict-editor.log')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'creator_cpu': 4, 'actual_cli': 4, 'actual_editor': 1, 'actual_gpu_delivery': 2, 'full_workspace': False}, indent=2))
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-tileset-starter-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

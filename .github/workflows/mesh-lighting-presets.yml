name: Mesh lighting preset acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021, su/static-game-starter-20261022]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesh-lighting-presets:
    # Additive optional-feature coverage; no existing mandatory gate is replaced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_MESH_LIGHTING_PRESET_EVIDENCE: ${{ github.workspace }}/target/mesh-lighting-presets-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused CPU preview contracts and optional feature boundaries
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_MESH_LIGHTING_PRESET_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Windows excludes four Unix filesystem tests and one Linux FIFO test.
          for suite, features, count in (
              ("mesh_lighting_preset", "mesh-navigation", 18 if os.name == "nt" else 23),
              ("mesh_lighting_panel::presets::tests", "mesh-mission", 5),
          ):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", features,
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (suite.replace("::", "-") + ".log"))
              helpers["validate_tests"](output, suite, count)
          for name, args in (
              ("default-check", ["check", "--lib"]),
              ("mesh-navigation-check", ["check", "--lib", "--features", "mesh-navigation"]),
              ("mesh-navigation-lint", ["clippy", "--lib", "--features", "mesh-navigation", "--", "-D", "warnings"]),
              ("lighting-preset-ui-lint", ["clippy", "--test", "mesh_lighting_preset_ui", "--features", "mesh-navigation", "--", "-D", "warnings"]),
          ):
              helpers["run_logged"](["cargo", args[0], "--locked", "-p", "orr_editor", *args[1:]],
                                    evidence / (name + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_MESH_LIGHTING_PRESET_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_MESH_LIGHTING_PRESET_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/mesh-lighting-presets-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_MESH_LIGHTING_PRESET_EVIDENCE/vulkan-driver.log"
      - name: Explicit ignored production EditorApp Mesh lighting preset acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          ORR_MESH_LIGHTING_PRESET_ACCEPTANCE: '1'
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_MESH_LIGHTING_PRESET_EVIDENCE"])
          capture = evidence / "lighting-preset-ui"
          if capture.exists():
              raise RuntimeError("Lighting preset acceptance requires an absent, fresh capture directory")
          os.environ["ORR_MESH_LIGHTING_PRESET_CAPTURE_DIR"] = str(capture.resolve())
          name = "portable_lighting_preset_cross_scene_stage_apply_undo_save_and_fresh_reopen"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "mesh-navigation",
               "--test", "mesh_lighting_preset_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "lighting-preset-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "receipt.json").read_text())
          expected = {
              "test": "portable_lighting_preset_cross_scene_stage_apply_undo_save_and_fresh_reopen",
              "software_vulkan": True, "synthetic_egui_input": True, "hardware_gpu": False,
              "physical_os_input": False, "runtime_or_export": False, "distinct_graphs": True,
              "staging_preserved_frame_history_files_and_pixels": True,
              "corrupt_load_preserved_draft_and_history": True, "save_did_not_overwrite_preset": True,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh Mesh lighting preset receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          changed = receipt.get("apply_changed_pixels")
          if type(changed) is not int or changed <= 20:
              raise RuntimeError("Lighting Apply must visibly change more than 20 pixels")
          hashes = ("preset_sha256", "source_viewport_sha256", "target_before_sha256",
                    "target_staged_sha256", "target_applied_sha256", "target_undone_sha256",
                    "target_redone_sha256", "target_reopened_sha256", "target_lighting_sha256")
          if any(type(receipt.get(key)) is not str or not re.fullmatch(r"[0-9a-f]{64}", receipt[key]) for key in hashes):
              raise RuntimeError("Missing exact lighting preset/pixel provenance")
          if not (receipt["target_before_sha256"] == receipt["target_staged_sha256"] == receipt["target_undone_sha256"]
                  and receipt["target_applied_sha256"] == receipt["target_redone_sha256"] == receipt["target_reopened_sha256"]):
              raise RuntimeError("Stage/Undo or Apply/Redo/fresh reopen pixel identity changed")
          layout = receipt.get("preset_controls_layout")
          if (type(layout) is not dict or layout.get("screenshot") != "09-preset-controls-layout.png"
                  or layout.get("controls_visible_and_inside_inspector") is not True
                  or type(layout.get("inspector_width")) not in (int, float)
                  or not 339 <= layout["inspector_width"] <= 341):
              raise RuntimeError("Preset controls must be visible inside the fixed-width Inspector")
          images = ("01-source-authored.png", "02-target-before-load.png", "03-target-staged-only.png",
                    "04-target-applied.png", "05-target-undone.png", "06-target-redone.png",
                    "07-corrupt-load-preserved.png", "08-fresh-target-reopen.png", "09-preset-controls-layout.png")
          if receipt.get("captures") != list(images):
              raise RuntimeError("Fresh receipt capture inventory mismatch")
          for image in images:
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh lighting preset capture: {image}")
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-lighting-presets-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_MESH_LIGHTING_PRESET_EVIDENCE }}
          if-no-files-found: error

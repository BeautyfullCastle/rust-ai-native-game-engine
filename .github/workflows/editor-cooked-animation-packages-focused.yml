name: editor cooked animation packages focused CI
on:
  push:
    branches: [codex/editor-cooked-animation-packages-20261107]
permissions:
  contents: read
jobs:
  cooked-animations:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Focused cooked model browser, saved binding and CPU checks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features package-manager --lib cooked_animation_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/animation-disabled.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/animation-disabled.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib cooked_animation_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/animation-enabled.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/animation-enabled.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib cooked_model_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/static-cooked-regression.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/static-cooked-regression.log
          cargo test --locked -p orr_editor --features package-manager --lib model_browser_widgets_filter_clear_and_select_without_changing_lock -- --test-threads=1 2>&1 | tee ci-evidence/browser-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/browser-regression.log
          cargo test --locked -p orr_editor --features package-manager --lib nondeclared_traversal_wrong_digest_and_nonmodel_requests_are_rejected -- --test-threads=1 2>&1 | tee ci-evidence/identity-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/identity-regression.log
          cargo test --locked -p orr_editor --features package-manager --lib animated_preview_requires_explicit_room_feature_even_with_unified_animation_support -- --test-threads=1 2>&1 | tee ci-evidence/feature-off-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/feature-off-regression.log
          cargo clippy --locked -p orr_editor --features package-manager --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
          cargo clippy --locked -p orr_editor --features package-manager,room-animated-models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-animated.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-cooked-animation-packages-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error





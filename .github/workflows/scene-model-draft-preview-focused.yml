name: Scene model draft preview focused CI
on:
  push:
    branches: [codex/scene-model-draft-preview-20261107]
permissions:
  contents: read
jobs:
  scene-model-draft-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Scene draft preview and explicit assignment
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_editor --features models --lib 2>&1 | tee ci-evidence/static-only.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_panel::draft_preview::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/context.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/context.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_panel::draft_preview_panel_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib app::draft_model_preview::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/composition.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/composition.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_panel::draft_preview_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/integration.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_panel::pose_fit_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/pose-regression.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/pose-regression.log
          cargo check --locked -p orr_editor --features package-manager,room-animated-models,mesh-hazards-export,mesh-animated-models --lib 2>&1 | tee ci-evidence/cross-model-consumers.log
          cargo clippy --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-draft-preview.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-model-draft-preview-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

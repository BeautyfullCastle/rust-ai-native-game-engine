name: Mesh point light focused CI
on:
  push:
    branches: [codex/mesh-point-light-20261107]
permissions:
  contents: read
jobs:
  mesh-point-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FEATURES: package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol,mesh-prop-shading
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Authored light through saved and native consumers
        shell: bash
        run: |
          set -euo pipefail
          cases() {
            local label="$1" count="$2" namespace="$3"; shift 3
            cargo test --locked -p orr_editor --features "$FEATURES" --lib "$namespace" -- --test-threads=1 "$@" 2>&1 | tee "ci-evidence/$label.log"
            grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "ci-evidence/$label.log"
          }
          cases point-codec 6 mesh_lighting::point_light::tests::
          cases legacy-codec 4 mesh_lighting::tests::
          cases post-process 4 mesh_lighting::post_process_tests::
          cases runtime-policy 2 mesh_lighting::post_process_runtime::tests::
          cases presets 9 mesh_lighting_preset::tests::
          cases preset-effects 5 mesh_lighting_preset::post_process_tests::
          cases store 6 mesh_lighting_store::tests::
          cases point-ui 4 mesh_lighting_panel::point_light_ui::tests::
          cases panel 8 mesh_lighting_panel::tests::
          cases panel-effects 3 mesh_lighting_panel::post_process_tests::
          cases panel-presets 5 mesh_lighting_panel::presets::tests::
          cases panel-preset-effects 4 mesh_lighting_panel::presets::post_process_tests::
          cases preset-integration 1 mesh_lighting_panel::preset_effects_integration_tests::
          cases point-integration 1 mesh_lighting_panel::point_light_integration_tests::
          cases app-selection 2 app::point_light_tests::
          cases export 3 mesh_export::tests::point_light_tests::
          cases hazards-export 3 mesh_hazards_export::tests::point_light_tests::
          cargo build --locked -p orr_editor --features "$FEATURES" --bin orr_mesh_player --bin orr_mesh_hazards_player 2>&1 | tee ci-evidence/native-build.log
          export ORR_MESH_POINT_LIGHT_RUNTIME="$PWD/target/debug/orr_mesh_hazards_player"
          sha256sum "$ORR_MESH_POINT_LIGHT_RUNTIME" | tee ci-evidence/native-runtime.txt
          cases native-headless 1 mesh_hazards_player::point_light_acceptance::point_light_survives_source_hidden_native_export_and_restart --exact --ignored
          cargo check --locked -p orr_editor --features models --lib 2>&1 | tee ci-evidence/feature-off.log
          cargo check --locked -p orr_editor --features mesh-navigation --lib 2>&1 | tee ci-evidence/minimal-mesh.log
          cargo clippy --locked -p orr_editor --features "$FEATURES" --lib --bin orr_mesh_player --bin orr_mesh_hazards_player -- -D warnings 2>&1 | tee ci-evidence/clippy-consumers.log
          echo 'CPU UI/settings/export/native headless only. GPU/window/physical playtest/video UNRUN on locked computer.' | tee ci-evidence/gpu-scope.txt
      - name: Preserve originals including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-point-light-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: Blockout material colors focused CI
on:
  push:
    branches: [codex/blockout-material-colors-20261107]
permissions:
  contents: read
jobs:
  material-colors:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Material authoring, immutable revisions and deployed Room
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features models --test blockout_material_colors -- --test-threads=1 2>&1 | tee ci-evidence/material-contract.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/material-contract.log
          cargo test --locked -p orr_editor --features models --test blockout malformed_versions_duplicates_records_and_numeric_inputs_are_rejected -- --exact 2>&1 | tee ci-evidence/legacy-strict.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-strict.log
          cargo test --locked -p orr_editor --features models --test blockout six_named_faces_have_independent_outward_mesh_and_uv_oracle -- --exact 2>&1 | tee ci-evidence/geometry-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/geometry-regression.log
          cargo test --locked -p orr_editor --features models --test blockout immutable_revisions_are_idempotent_and_remain_loadable_for_binding_undo -- --exact 2>&1 | tee ci-evidence/immutable-regression.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/immutable-regression.log
          cargo build --locked -p orr_sample --features room-project --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_MATERIAL_ROOM_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features windows-export --test blockout_gpu material_colors:: -- --ignored --test-threads=1 2>&1 | tee ci-evidence/widgets-export.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/widgets-export.log
          cargo clippy --locked -p orr_editor --features models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-models.log
          cargo clippy --locked -p orr_editor --features windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-room.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockout-material-colors-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

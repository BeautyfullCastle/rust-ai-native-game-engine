name: Room movement facing focused CI
on:
  push:
    branches: [codex/room-character-facing-20261107]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: room-character-facing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  room-character-facing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect character, UI, restart and real native results
        shell: python {0}
        run: |
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          evidence=Path('ci-evidence'); results=[]
          editor='room-character,project-create,windows-export,package-manager,room-lighting'
          sample='room-character'
          native='room-character,project-export'
          def run(label,command,count=None):
              with (evidence/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  lines=[]
                  for line in p.stdout:
                      print(line,end='',flush=True);log.write(line);log.flush();lines.append(line)
                  code=p.wait()
              text=''.join(lines);ok=code==0
              if count is not None:
                  summaries=re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text,re.M)
                  names=re.findall(r'^test (\S+) \.\.\. ok$',text,re.M)
                  ok=ok and summaries==[('ok',str(count),'0','0','0')] and len(names)==len(set(names))==count
              results.append(dict(label=label,command=command,exit=code,ok=ok,expected=count))
              (evidence/'results.json').write_text(json.dumps(results,indent=2))
              return ok
          def tests(label,crate,features,selector,count,extra=(),target='--lib'):
              return run(label,['cargo','test','--locked','-p',crate,'--features',features,target]+([] if target=='--lib' else ['room_character_workflow'])+[selector,'--']+list(extra)+['--test-threads=1'],count)
          tests('legacy-character','orr_sample',sample,'room_character::tests::',26,['--skip','pickup_tests::','--skip','facing_tests::'])
          tests('pickup-character','orr_sample',sample,'room_character::tests::pickup_tests::',8)
          tests('facing-character','orr_sample',sample,'room_character::tests::facing_tests::',7)
          tests('facing-matrix','orr_sample',sample,'room_view::facing_tests::',3)
          tests('facing-panel','orr_editor',editor,'room_character_panel::tests::facing_ui_tests::',4)
          tests('pickup-panel','orr_editor',editor,'room_character_panel::tests::pickup_ui_tests::',3)
          old=[
            'clip_catalog_matches_admitted_names_without_changing_documents_or_files',
            'rate_only_history_preserves_model_transform_undo_redo_and_save',
            'invalid_crossfade_apply_preserves_documents_disk_and_history',
            'pair_save_second_file_failure_restores_both_files_and_dirty_history_then_retries',
            'once_policy_apply_history_and_paired_save_reopen_keep_model_default_and_frame',
            'motion_tests::motion_policy_save_reopen_history_and_all_mapped_clip_admission_are_atomic']
          for index,name in enumerate(old):
              tests('legacy-panel-'+str(index),'orr_editor',editor,'room_character_panel::tests::'+name,1,['--exact'])
          tests('actual-app-restart','orr_sample',sample+',project-create','room_app::pickup_tests::pickup_app_observes_event_resumes_carrying_and_restarts_without_source',1,['--exact'])
          tests('actual-editor-save','orr_editor',editor,'pickup_once::pickup_once_widgets_stage_apply_history_save_and_reopen_without_frame_changes',1,['--exact'],target='--test')
          tests('actual-facing-app','orr_sample',sample+',project-create','room_app::facing_tests::facing_actual_app_moves_holds_idle_and_restarts_without_sources_for_all_authored_axes',1,['--exact'])
          tests('actual-facing-editor','orr_editor',editor,'facing::facing_widgets_save_reopen_and_editor_native_placements_preserve_nonidentity_local_trs',1,['--exact'],target='--test')
          built=run('native-build',['cargo','build','--locked','-p','orr_sample','--features',native,'--bin','room_escape'])
          if built:
              tool=evidence.resolve()/'room-facing-runtime'
              shutil.copy2('target/debug/room_escape',tool);tool.chmod(0o755)
              os.environ['ORR_ROOM_PICKUP_RUNTIME']=str(tool)
              os.environ['ORR_ROOM_FACING_RUNTIME']=str(tool)
              (evidence/'runtime.sha256').write_text(hashlib.sha256(tool.read_bytes()).hexdigest()+'  '+str(tool)+'\n')
              tests('actual-native-source-hidden','orr_editor',editor,'pickup_once::pickup_once_source_hidden_export_native_pose_and_restart',1,['--exact','--ignored'],target='--test')
              tests('actual-facing-native','orr_sample',native+',project-create','room_app::facing_tests::facing_saved_axes_source_hidden_native_matrices_match_frame_oracle_and_restart',1,['--exact','--ignored'])
          else:
              results.append(dict(label='actual-native-source-hidden',ok=False,expected=1,unrun='runtime build failed'))
              results.append(dict(label='actual-facing-native',ok=False,expected=1,unrun='runtime build failed'))
          run('strict-sample',['cargo','clippy','--locked','-p','orr_sample','--features',sample,'--lib','--bin','room_escape','--','-D','warnings'])
          run('strict-editor',['cargo','clippy','--locked','-p','orr_editor','--features',editor,'--lib','--','-D','warnings'])
          run('off-sample',['cargo','check','--locked','-p','orr_sample','--features','room-project','--lib','--bin','room_escape'])
          run('off-editor',['cargo','check','--locked','-p','orr_editor','--lib'])
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          (evidence/'scope.txt').write_text('63 CPU executions expected, zero failed/ignored; includes explicitly executed ignored native acceptance, legacy pickup phases and new four-axis matrix acceptance, plus actual App restarts. Windows/GPU/window/physicalplay/video UNRUN; no full-workspace validation.')
          if not all(item['ok'] for item in results): raise SystemExit('Focused facing verification failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-character-facing-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

name: Stormglass native click attribution CI
# Native CPU egui/simulation evidence; no window, browser or GPU acceptance.
on:
  push:
    branches: [su/stormglass-native-click-20261104]
permissions:
  contents: read
concurrency:
  group: stormglass-native-click-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
          python3 --version | tee "$EVIDENCE/python.txt"
      - name: Verify native click commands and production consumer
        shell: python {0}
        run: |
          import hashlib, json, os, re, runpy, shutil
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          run = helpers['run_logged']
          output = run(['cargo', 'test', '--locked', '--release', '-p', 'orr_sample', '--features', 'coop-defense', '--lib', 'defense_ui::', '--', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'ui-tests.log')
          helpers['validate_tests'](output, 'defense_ui', 17)
          expected = {
              'board_clicks_select_and_move_actual_unit_without_hover_retargeting',
              'configured_click_distance_duration_and_generation_bound_pending_press',
              'cross_frame_press_works_but_drag_out_return_or_bare_release_does_not',
              'first_eligible_click_wins_and_later_valid_click_cannot_restart',
              'genuine_economic_and_restart_clicks_keep_event_target_and_mutate_simulation',
              'keyboard_pulses_still_reach_simulation_after_pointer_cancellation',
              'mixed_click_and_drag_releases_do_not_borrow_eligibility',
              'pointer_gone_cancels_pending_and_focus_loss_cancels_entire_frame',
              'resized_layout_and_duplicate_press_cancel_old_gesture',
              'secondary_buttons_never_qualify_or_retarget_primary_click',
              'start_is_pinned_to_click_not_late_hover_and_does_not_spend',
              'unrelated_click_cannot_restart_spend_or_select_after_late_motion',
          }
          names = {name.removeprefix('defense_ui::click_attribution_tests::') for name, _ in helpers['CASE'].findall(output) if name.startswith('defense_ui::click_attribution_tests::')}
          if names != expected:
              raise RuntimeError('Missing exact click attribution regression inventory')
          run(['cargo', 'clippy', '--locked', '--release', '-p', 'orr_sample', '--features', 'coop-defense', '--lib', '--', '-D', 'warnings'], evidence / 'strict.log')
          run(['cargo', 'check', '--locked', '--release', '-p', 'orr_sample', '--no-default-features', '--lib'], evidence / 'feature-off.log')
          run(['cargo', 'build', '--locked', '--release', '-p', 'orr_sample', '--features', 'coop-defense', '--bin', 'coop_defense'], evidence / 'native-build.log')
          binary = (Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / 'release/coop_defense').resolve()
          shipped = evidence / 'coop_defense'
          shutil.copy2(binary, shipped)
          scene = Path('examples/static-game-starter/scenes/stormglass-short.scene.yaml')
          shutil.copy2(scene, evidence / scene.name)
          smoke = run([str(shipped.resolve()), '--headless', '--scene', str((evidence / scene.name).resolve()), '--ticks', '6000', '--demo'], evidence / 'native-smoke.log')
          rows = re.findall(r'^Stormglass tick=(\d+) wave=(\d+) phase=(\d+) reactor=(\d+) kills=(\d+) merges=(\d+) checksum=(0x[0-9a-f]{16})$', smoke, re.MULTILINE)
          if len(rows) != 1 or rows[0][1:3] != ('3', '1') or not 0 < int(rows[0][0]) <= 6000 or int(rows[0][3]) <= 0:
              raise RuntimeError('Expected authored three-wave native headless victory')
          run(['git', 'diff', '--exit-code'], evidence / 'source-unchanged.log')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'ui_tests': 17, 'new_click_tests': sorted(expected), 'strict': True, 'feature_off': True, 'native_binary_sha256': hashlib.sha256(shipped.read_bytes()).hexdigest(), 'scene_sha256': hashlib.sha256(scene.read_bytes()).hexdigest(), 'native_smoke': rows[0], 'cpu_egui': True, 'native_window': False, 'physical_input': False, 'browser': False, 'gpu': False, 'full_workspace': False}, indent=2))
      - name: Preserve exact source and evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-native-click-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

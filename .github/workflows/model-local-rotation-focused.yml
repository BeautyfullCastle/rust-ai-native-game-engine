name: Model local rotation focused CI
on:
  push:
    branches: [codex/model-quarter-turn-20261107]
permissions:
  contents: read
jobs:
  model-rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Local quaternion authoring and saved runtime orientations
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features models --lib model_panel::rotation::tests -- --test-threads=1 2>&1 | tee ci-evidence/math.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/math.log
          cargo test --locked -p orr_editor --features models --test yard3d_models rotation:: -- --test-threads=1 2>&1 | tee ci-evidence/static-rotation.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/static-rotation.log
          cargo test --locked -p orr_editor --features animated-models --test yard3d_animated rotation:: -- --test-threads=1 2>&1 | tee ci-evidence/animated-rotation.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/animated-rotation.log
          cargo test --locked -p orr_editor --features models --test yard3d_models actual_widgets_assign_remove_undo_save_reopen_and_disable_mutation_in_play -- --exact 2>&1 | tee ci-evidence/play-guard.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/play-guard.log
          cargo build --locked -p orr_sample --features room-project --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_ROTATION_ROOM_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features windows-export --test room_model_admission rotation_export:: -- --ignored --test-threads=1 2>&1 | tee ci-evidence/rotation-export.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/rotation-export.log
          cargo clippy --locked -p orr_editor --features models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
          cargo clippy --locked -p orr_editor --features animated-models --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-animated.log
          cargo clippy --locked -p orr_editor --features windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-room.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-local-rotation-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

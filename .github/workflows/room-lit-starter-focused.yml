name: Room lit starter focused CI
on:
  push:
    branches: [codex/room-lit-starter-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: New lit project creation to saved game use
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_sample --lib 2>&1 | tee ci-evidence/default-off.log
          cargo test --locked -p orr_sample --features project-create,room-lighting --lib room_lit_starter::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/creator.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/creator.log
          cargo test --locked -p orr_sample --features project-create,room-lighting --test room_lit_starter_cli -- --test-threads=1 2>&1 | tee ci-evidence/cli.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/cli.log
          cargo build --locked -p orr_sample --features room-lighting --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          cargo test --locked -p orr_editor --features room-lighting,project-create,windows-export --test room_lighting lit_starter:: -- --test-threads=1 2>&1 | tee ci-evidence/editor.log
          grep -F 'test result: ok. 1 passed; 0 failed; 1 ignored;' ci-evidence/editor.log
          ORR_LIT_STARTER_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features room-lighting,project-create,windows-export --test room_lighting lit_starter::created_edited_lit_project_exports_and_runs_with_creator_and_sources_absent -- --ignored --exact 2>&1 | tee ci-evidence/deployed.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed.log
          cargo clippy --locked -p orr_sample --features project-create,room-lighting --lib --bin orr_new_lit_room -- -D warnings 2>&1 | tee ci-evidence/clippy-creator.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-lit-starter-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

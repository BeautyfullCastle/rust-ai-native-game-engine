name: Draft navigation route overlay focused CI
on:
  push:
    branches: [codex/draft-navigation-route-overlay-20261107]
permissions:
  contents: read
jobs:
  draft-route-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Read-only inspected route to viewport command submission
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_editor --features mesh-navigation --lib 2>&1 | tee ci-evidence/minimal-navigation.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_navigation::route_diagnostics::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/backend.log
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' ci-evidence/backend.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_navigation::route_diagnostics_overlay::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/overlay.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/overlay.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_navigation::route_diagnostics_panel::overlay_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_navigation::route_diagnostics_panel::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/legacy-panel.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/legacy-panel.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_navigation::route_diagnostics_overlay_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/integration.log
          cargo check --locked -p orr_editor --features mesh-hazards-export,navigation --lib 2>&1 | tee ci-evidence/cross-viewport.log
          cargo clippy --locked -p orr_editor --features mesh-hazards-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-navigation.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-route-overlay-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: Mesh cooked animation focused CI
on:
  push:
    branches: [codex/mesh-cooked-animation-20261107]
permissions:
  contents: read
jobs:
  mesh-cooked-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Cooked authoring variants to source-free mesh animation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_editor --features models --lib 2>&1 | tee ci-evidence/feature-off.log
          cargo check --locked -p orr_editor --features mesh-animated-models --lib 2>&1 | tee ci-evidence/minimal-animation.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib mesh_animation::cooked_provenance::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/provenance.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/provenance.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib mesh_animation_panel::import_panel::cooked_ui_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib mesh_animation_import::cooked_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/cooked-import.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/cooked-import.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib mesh_animation_import::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/raw-import.log
          grep -F 'test result: ok. 14 passed; 0 failed; 0 ignored;' ci-evidence/raw-import.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib mesh_animation::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/legacy-snapshot.log
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' ci-evidence/legacy-snapshot.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib mesh_animation_panel::cooked_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/integration.log
          cargo clippy --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
      - name: Record GPU regressions as unrun advisory coverage
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'GPU-only regressions are ignored/unrun. These receipts establish compile/selection only, not GPU coverage.' | tee ci-evidence/gpu-scope.txt
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --test mesh_animation_import_ui raw_animation_import_preview_apply_save_and_source_free_reopen -- --exact --test-threads=1 2>&1 | tee ci-evidence/raw-ui-unrun.log
          grep -F 'test result: ok. 0 passed; 0 failed; 1 ignored;' ci-evidence/raw-ui-unrun.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol --test animated_matrix_import_ui static_matrix_raw_import_matches_trs_through_source_free_editor_reopen -- --exact --test-threads=1 2>&1 | tee ci-evidence/matrix-ui-unrun.log
          grep -F 'test result: ok. 0 passed; 0 failed; 1 ignored;' ci-evidence/matrix-ui-unrun.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-cooked-animation-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

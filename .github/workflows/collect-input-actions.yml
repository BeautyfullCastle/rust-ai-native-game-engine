name: Collect input actions acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-input-actions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_COLLECT_INPUT_EVIDENCE: ${{ github.workspace }}/target/collect-input-actions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Nested saved-map hook inventory regression
        run: python -m unittest discover -s tools -p test_editor_collect_controls_gate.py
      - name: Focused map, production input lifecycle and real Bridge contracts
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          h = runpy.run_path("tools/check-authoring-controls.py")
          controls = runpy.run_path("tools/editor_collect_controls_gate.py")
          evidence = Path(os.environ["ORR_COLLECT_INPUT_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          # The Unix-only nonregular-file test includes symlink/device/FIFO refusal.
          # These are synthetic physical-key events and real Bridge CPU tests,
          # not native window or physical keyboard acceptance.
          for label, features, suite, count in (
              ("map-enabled", "collect-dodge,input-actions", "collect_app::input_actions::tests", 15 if os.name == "nt" else 16),
              ("runtime-enabled", "collect-dodge,input-actions", "collect_app::input_runtime_tests", 8),
              ("existing-view", "collect-dodge,input-actions", "collect_view", 2),
              ("existing-collect", "collect-dodge,input-actions", "collect_app::tests", 9),
              ("map-disabled", "collect-dodge", "collect_app::input_actions::tests", 4),
              ("existing-disabled", "collect-dodge", "collect_app::tests", 9),
              ("existing-ui-capture", "collect-ui", "collect_app::tests", 11),
          ):
              output = h["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_sample", "--no-default-features",
                   "--features", features, "--lib", suite + "::", "--", "--format=pretty",
                   "--color=never", "--test-threads=1"], evidence / (label + ".log"))
              if label == "runtime-enabled":
                  # The exact saved-map hook is executed by editor-collect-controls.yml.
                  controls["validate_input_runtime_regression"](output)
              else:
                  h["validate_tests"](output, suite, count)
          for label, features, count in (
              ("cli-enabled", "collect-dodge,input-actions", 5),
              ("cli-disabled", "collect-dodge", 3),
          ):
              output = h["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_sample", "--no-default-features",
                   "--features", features, "--test", "collect_input_cli", "--", "--format=pretty",
                   "--color=never", "--test-threads=1"], evidence / (label + ".log"))
              expected = {"help_describes_optional_map_and_semantic_headless_controls",
                          "map_flags_require_unambiguous_arguments",
                          "map_feature_and_headless_refusals_are_explicit"}
              if count == 5:
                  expected |= {"malformed_map_is_refused_before_missing_project_and_bytes_are_preserved",
                               "valid_map_reaches_project_admission_without_writing_either_source"}
              output = output.replace("\r\n", "\n")
              cases, summaries = h["CASE"].findall(output), h["SUMMARY"].findall(output)
              if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, 0, 0)
                      or len(cases) != count or {name for name, _ in cases} != expected
                      or any(status != "ok" for _, status in cases)):
                  raise RuntimeError("Incomplete actual binary CLI acceptance: " + label)
          for label, args in (
              ("default-check", ["check", "--lib"]),
              ("disabled-check", ["check", "--lib", "--bin", "collect_dodge", "--features", "collect-dodge"]),
              ("enabled-check", ["check", "--lib", "--bin", "collect_dodge", "--features", "collect-dodge,input-actions"]),
              ("enabled-strict", ["clippy", "--lib", "--bin", "collect_dodge", "--test", "collect_input_cli", "--features", "collect-dodge,input-actions", "--", "-D", "warnings"]),
              ("disabled-strict", ["clippy", "--lib", "--bin", "collect_dodge", "--test", "collect_input_cli", "--features", "collect-dodge", "--", "-D", "warnings"]),
              ("ui-capture-strict", ["clippy", "--lib", "--bin", "collect_dodge", "--features", "collect-ui", "--", "-D", "warnings"]),
          ):
              h["run_logged"](["cargo", args[0], "--locked", "-p", "orr_sample", "--no-default-features", *args[1:]], evidence / (label + ".log"))
      - name: Real CLI default map and refusal before project or window launch
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import subprocess
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_INPUT_EVIDENCE"]).resolve()
          binary = Path("target/debug/collect_dodge" + (".exe" if os.name == "nt" else "")).resolve()
          missing = evidence / "project-must-remain-absent"
          invalid = evidence / "invalid-map.json"
          invalid.write_text('{"version":1,"actions":[{"name":"left","bindings":[{"device":"Keyboard","key":"a"}]}]}', encoding="utf-8")
          original = invalid.read_bytes()
          def build(features, label):
              h["run_logged"](["cargo", "build", "--locked", "-p", "orr_sample", "--no-default-features",
                               "--features", features, "--bin", "collect_dodge"], evidence / (label + "-build.log"))
          def cli(label, args, success, error=None):
              path = evidence / (label + ".log")
              path.write_text("+ " + str(binary) + " " + " ".join(args) + "\n", encoding="utf-8")
              try:
                  result = subprocess.run([str(binary), *args], capture_output=True, text=True, timeout=30, check=False)
              except (OSError, subprocess.TimeoutExpired) as exc:
                  with path.open("a", encoding="utf-8") as log:
                      log.write(str(exc))
                  raise
              with path.open("a", encoding="utf-8") as log:
                  log.write(result.stdout + result.stderr + f"\nexit={result.returncode}\n")
              if (result.returncode == 0) != success or (error is not None and error not in result.stderr):
                  raise RuntimeError(f"Unexpected CLI result: {label}")
              return result.stdout
          build("collect-dodge,input-actions", "enabled")
          default = json.loads(cli("default-map", ["--print-default-input-map"], True))
          expected = {"version": 1, "actions": [
              {"name": name, "bindings": [{"device": "Keyboard", "key": key} for key in keys]}
              for name, keys in (("left", ["a", "arrow_left"]), ("right", ["d", "arrow_right"]),
                                 ("up", ["w", "arrow_up"]), ("down", ["s", "arrow_down"]),
                                 ("restart", ["space"]), ("quit", ["escape"]))]}
          if default != expected:
              raise RuntimeError("Default map differs from the existing Collect controls")
          cli("invalid-before-launch", ["--project", str(missing), "--input-bindings", str(invalid)], False,
              "exactly left/right/up/down/restart/quit")
          cli("headless-map-refused", ["--project", str(missing), "--headless", "--ticks", "0",
                                      "--input-bindings", str(invalid)], False, "window-only")
          cli("mixed-print-refused", ["--project", str(missing), "--print-default-input-map"], False, "must be used alone")
          build("collect-dodge", "disabled")
          cli("disabled-print-refused", ["--print-default-input-map"], False, "requires the input-actions feature")
          cli("disabled-map-refused", ["--project", str(missing), "--input-bindings", str(invalid)], False,
              "requires the input-actions feature")
          if missing.exists() or invalid.read_bytes() != original:
              raise RuntimeError("CLI refusal changed its inputs")
          (evidence / "cli-receipt.json").write_text(json.dumps({
              "schema": 1, "default_map_exact": True, "invalid_map_refused_before_project_launch": True,
              "headless_map_refused": True, "feature_disabled_refused": True, "map_bytes_unchanged": True,
              "input_map_sha256": hashlib.sha256(original).hexdigest(),
              "native_window_tested": False, "physical_keyboard_tested": False,
              "headless_hold_is_semantic_input": True,
          }, indent=2) + "\n", encoding="utf-8")
      - name: Retain exact counts, boundary results and CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-input-actions-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_COLLECT_INPUT_EVIDENCE }}
          if-no-files-found: error

            test "$(grep -cE '^[[:alnum:]_:]+: test$' "$ROOT/$lane-list.txt")" -eq 1
            grep -Fx "$name: test" "$ROOT/$lane-list.txt"
            cargo test --locked --release -p orr_editor --no-default-features --features collect-ui --test new_collect_ui_workflow "$name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$ROOT/$lane.log"
            python3 - "$ROOT/$lane.log" <<'PYRESULT'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          rows = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', text, re.M)
          assert rows == [('1','0','0')], rows
          assert not re.search(r'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested|without source hiding|source_hiding=false|software GPU unavailable', text, re.I)
          PYRESULT
          done
          python3 - <<'PYEVIDENCE'
          import hashlib, json, os, pathlib, re, struct
          root = pathlib.Path(os.environ['ORR_NEW_COLLECT_UI_EVIDENCE']) / 'captures'
          expected = [f'generated-collect-ui-editor-{phase}.png' for phase in ['edited','won','restarted']]
          expected += [f'generated-collect-ui-{kind}-{phase}.png' for kind in ['runtime','export'] for phase in ['initial','idle','won','hazard','timeout']]
          expected += ['generated-collect-ui-default-score.png']
          assert sorted(path.name for path in (root/'gpu').glob('*.png')) == sorted(expected)
          captures = []
          for name in expected:
              data = (root/'gpu'/name).read_bytes()
              assert len(data) > 32 and data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert width > 0 and height > 0, name
              captures.append({'path':str(root/'gpu'/name),'width':width,'height':height,'sha256':hashlib.sha256(data).hexdigest()})
          overlay = root.parent/'ui-library-overlay.png'
          data = overlay.read_bytes()
          assert len(data) > 32 and data[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', data[16:24]); assert width > 0 and height > 0
          captures.append({'path':str(overlay),'width':width,'height':height,'sha256':hashlib.sha256(data).hexdigest()})
          (root.parent/'capture-manifest.json').write_text(json.dumps(captures,indent=2)+'\n')
          for phase in ['initial','idle','won','hazard','timeout']:
              assert (root/'gpu'/f'generated-collect-ui-runtime-{phase}.png').read_bytes() == (root/'gpu'/f'generated-collect-ui-export-{phase}.png').read_bytes(), phase
          for lane in ['cpu','gpu','progress']:
              for phase in ['initial','partial','won','hazard','timeout','held-restart']:
                  text = (root/lane/f'generated-collect-ui-{phase}.txt').read_text()
                  assert not re.search('SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested',text,re.I), "artifact log contains skip/fallback"
                  assert re.search(r'collect tick: [0-9]+ checksum: 0x[0-9a-f]{16}',text), (lane,phase)
          for mode in ['win','relaunch']:
              text = (root/'progress'/f'generated-collect-ui-progress-{mode}.txt').read_text()
              rows = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;',text,re.M)
              assert text.count("test result:") == 1, "unexpected artifact progress summary"
              assert not re.search('SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested',text,re.I), "artifact progress log contains skip/fallback"
              assert rows == [('1','0','0')], (mode,rows)
          PYEVIDENCE
          sha256sum --check "$ROOT/tools.sha256"

          rows=[json.loads(line) for line in (root/f'{name}-build.jsonl').read_text().splitlines() if line.strip()]
          found=[row for row in rows if row.get('reason')=='compiler-artifact' and pathlib.Path(row['manifest_path']).resolve()==manifest and row['target']['name']==name and row['target']['kind']==['bin'] and row['profile']['test'] is False and row.get('executable')]
          assert len(found)==1,(name,found)

          python3 "$ROOT/check-results.py" "$ROOT" editor-gpu result
          python3 - <<'PYCAPTURES'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path(os.environ['ORR_IMAGE_REIMPORT_EVIDENCE']);names=['reimport-01-before.png','reimport-02-rejected.png','reimport-03-committed.png','reimport-04-reopened.png']
          assert sorted(p.name for p in (root/'editor-gpu').glob('*.png'))==sorted(names)
          entries=[]
          for name in names:
           path=root/'editor-gpu'/name;data=path.read_bytes();assert len(data)>32 and data[:8]==b'\x89PNG\r\n\x1a\n'
           width,height=struct.unpack('>II',data[16:24]);assert width>0 and height>0
           entries.append({'path':str(path),'width':width,'height':height,'sha256':hashlib.sha256(data).hexdigest()})
          (root/'editor-capture-manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          PYCAPTURES
        env:

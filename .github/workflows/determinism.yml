          JSONINVENTORY
          check_result() {
            local label=$1 passed=$2 ignored=$3
            shift 3
            "$@" -- --list > "$ROOT/$label-list.txt"
            "$@" -- --ignored --list > "$ROOT/$label-ignored.txt"
            python3 - "$ROOT" "$label" "$passed" "$ignored" <<'PYLIST'

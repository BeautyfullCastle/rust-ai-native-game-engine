        run: tools/check-room-template.sh gpu
      - name: Upload Room creator acceptance evidence
        if: always() && runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: room-template-evidence-ubuntu-22.04
          path: |
            /tmp/orr-room-template-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            /tmp/orr-room-template-${{ github.run_id }}-${{ github.run_attempt }}/**/*.sha256

            project_identity::tests::rejects_noncanonical_and_unsafe_identities \
            project_identity::tests::fork_is_explicit_distinct_validated_and_pure \
            tests::schema_three_requires_valid_explicit_collect_progress; do
            grep -Fx "$name: test" "$RUNNER_TEMP/collect-progress-package-list.txt"
          done

          # Positive feature-disabled regression; do not treat an absent cfg target as evidence.
          check_library disabled-library 61 0 cargo test --locked --release -p orr_sample --no-default-features --features collect-dodge,project-export --lib
          cargo test --locked --release -p orr_sample --no-default-features --features collect-dodge,project-export --test collect_project_export -- --ignored --list > "$RUNNER_TEMP/collect-progress-disabled-export-ignored.txt"
          python3 - "$RUNNER_TEMP/collect-progress-disabled-export-ignored.txt" <<'PYDISABLED'
          import pathlib, re, sys
          names = re.findall(r'^([A-Za-z0-9_:]+): test$', pathlib.Path(sys.argv[1]).read_text(), re.M)
          assert sorted(names) == ['collect_real_export_cpu_workflow', 'collect_real_export_gpu_workflow'], names
          PYDISABLED

          check_library library 86 2 cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --lib
          check_library joint-library 144 2 cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export,player-settings --lib
          name=game_progress::tests::stable_nonblocking_lock_and_reread_before_merge
          cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --lib "$name" -- --exact --list > "$RUNNER_TEMP/collect-progress-barrier-list.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/collect-progress-barrier-list.txt")" -eq 1
          grep -Fx "$name: test" "$RUNNER_TEMP/collect-progress-barrier-list.txt"
          cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --lib "$name" -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/collect-progress-barrier.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/collect-progress-barrier.log"
      - name: Build and pin Collect progress tools and unique compiler-JSON libtest
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/collect-progress-candidate.txt"
          python3 - <<'PYPATHS'
          import os, pathlib, tempfile
          checkout = pathlib.Path.cwd().resolve()
          hidden = checkout.parent  # CARGO_MANIFEST_DIR/../../.. in the acceptance test.
          target = pathlib.Path(os.environ.get('CARGO_TARGET_DIR', 'target')).resolve()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          assert target.is_relative_to(hidden), 'source-hidden root must cover original build outputs'
          assert not evidence.is_relative_to(hidden), 'pinned artifacts must survive the hidden workspace'
          assert not pathlib.Path(tempfile.gettempdir()).resolve().is_relative_to(hidden), 'test projects must be external'
          PYPATHS
          cargo build --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --bin collect_dodge --bin orr_export_collect --message-format=json > "$RUNNER_TEMP/collect-progress-tools-build.jsonl" 2> "$RUNNER_TEMP/collect-progress-tools-build.stderr"
          cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --lib --no-run --message-format=json > "$RUNNER_TEMP/collect-progress-libtest-build.jsonl" 2> "$RUNNER_TEMP/collect-progress-libtest-build.stderr"
          python3 - <<'PYPIN'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          manifest = (pathlib.Path.cwd() / 'crates/orr_sample/Cargo.toml').resolve()
          tools = root / 'collect-progress-tools'
          tools.mkdir()
          def artifact(log, target_name, kind, is_test):
              records = [json.loads(line) for line in log.read_text().splitlines() if line.strip()]
              found = [row for row in records if row.get('reason') == 'compiler-artifact'
                       and pathlib.Path(row['manifest_path']).resolve() == manifest
                       and row['target']['name'] == target_name and row['target']['kind'] == [kind]
                       and row['profile']['test'] is is_test and row.get('executable')]
              assert len(found) == 1, (target_name, found)
              item = found[0]
              features = set(item['features'])
              assert {'collect-progress', 'project-export'} <= features, features
              assert not features & {'player-settings', 'project-create', 'game-ui'}, features
              return item
          entries = []
          for log, target_name, kind, is_test, destination in [
              ('collect-progress-tools-build.jsonl', 'collect_dodge', 'bin', False, 'collect_dodge'),
              ('collect-progress-tools-build.jsonl', 'orr_export_collect', 'bin', False, 'orr_export_collect'),
              ('collect-progress-libtest-build.jsonl', 'orr_sample', 'lib', True, 'progress-test-harness'),
          ]:
              item = artifact(root / log, target_name, kind, is_test)
              source = pathlib.Path(item['executable']).resolve(strict=True)
              target = tools / destination
              assert os.access(source, os.X_OK), source
              shutil.copy2(source, target)
              source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
              assert source_hash == hashlib.sha256(target.read_bytes()).hexdigest()
              assert os.access(target, os.X_OK), target
              entries.append({'source': str(source), 'copy': str(target), 'sha256': source_hash,
                              'target': item['target'], 'features': item['features'], 'profile': item['profile']})
          (root / 'collect-progress-tools.sha256').write_text(''.join(f"{item['sha256']}  {item['copy']}\n" for item in entries))
          (root / 'collect-progress-artifacts.json').write_text(json.dumps({
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'manifest': str(manifest), 'artifacts': entries,
          }, indent=2) + '\n')
          PYPIN
          sha256sum --check "$RUNNER_TEMP/collect-progress-tools.sha256"
          "$RUNNER_TEMP/collect-progress-tools/progress-test-harness" --list > "$RUNNER_TEMP/collect-progress-pinned-library-list.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/collect-progress-pinned-library-list.txt")" -eq 88
          "$RUNNER_TEMP/collect-progress-tools/progress-test-harness" --ignored --list > "$RUNNER_TEMP/collect-progress-pinned-library-ignored.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/collect-progress-pinned-library-ignored.txt")" -eq 2
          grep -Fx 'collect_progress::tests::isolated_window_progress_child: test' "$RUNNER_TEMP/collect-progress-pinned-library-ignored.txt"
          grep -Fx 'game_progress::tests::concurrent_process_child: test' "$RUNNER_TEMP/collect-progress-pinned-library-ignored.txt"
      - name: Mandatory Collect progress source-hidden CPU GPU and App relaunch proofs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ORR_COLLECT_RUNTIME"
          test -x "$ORR_COLLECT_EXPORTER"
          test -x "$ORR_PROGRESS_TEST_BIN"
          sha256sum --check "$RUNNER_TEMP/collect-progress-tools.sha256"
          cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --test collect_project_export -- --ignored --list > "$RUNNER_TEMP/collect-progress-export-ignored.txt"
          python3 - "$RUNNER_TEMP/collect-progress-export-ignored.txt" <<'PYINVENTORY'
          import pathlib, re, sys
          names = re.findall(r'^([A-Za-z0-9_:]+): test$', pathlib.Path(sys.argv[1]).read_text(), re.M)
          expected = [
              'collect_real_export_cpu_workflow',
              'collect_real_export_gpu_workflow',
              'collect_progress_source_hidden_relaunch_and_no_headless_writes',
              'collect_progress_noninteractive_syscall_isolation',
          ]
          assert sorted(names) == sorted(expected), names
          PYINVENTORY
          mkdir "$ORR_COLLECT_CAPTURES"
          for name in \
            collect_real_export_cpu_workflow \
            collect_real_export_gpu_workflow \
            collect_progress_source_hidden_relaunch_and_no_headless_writes; do
            cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --test collect_project_export "$name" -- --ignored --exact --list > "$RUNNER_TEMP/collect-progress-$name-list.txt"
            test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/collect-progress-$name-list.txt")" -eq 1
            grep -Fx "$name: test" "$RUNNER_TEMP/collect-progress-$name-list.txt"
            cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --test collect_project_export "$name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/collect-progress-$name.log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/collect-progress-$name.log"
            if grep -Ei 'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested|without source hiding|source_hiding=false|software GPU unavailable' "$RUNNER_TEMP/collect-progress-$name.log"; then exit 1; fi
          done
          python3 - <<'PYIMAGES'
          import os, pathlib, struct
          root = pathlib.Path(os.environ['ORR_COLLECT_CAPTURES'])
          expected = {f'{state}-{origin}.png' for state in ['initial', 'won', 'hazard'] for origin in ['source', 'export']}
          assert {p.name for p in root.iterdir()} == expected
          for name in sorted(expected):
              data = (root / name).read_bytes()
              assert len(data) > 33 and data[:8] == b'\x89PNG\r\n\x1a\n' and data[12:16] == b'IHDR', name
              width, height = struct.unpack('>II', data[16:24])
              assert width > 0 and height > 0, name
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PYIMAGES
          sha256sum --check "$RUNNER_TEMP/collect-progress-tools.sha256"
        env:
          ORR_COLLECT_RUNTIME: ${{ runner.temp }}/collect-progress-tools/collect_dodge
          ORR_COLLECT_EXPORTER: ${{ runner.temp }}/collect-progress-tools/orr_export_collect
          ORR_PROGRESS_TEST_BIN: ${{ runner.temp }}/collect-progress-tools/progress-test-harness
          ORR_COLLECT_CAPTURES: ${{ runner.temp }}/collect-progress-captures
          ORR_REQUIRE_GPU: "1"
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
      - name: Mandatory Collect progress Linux syscall isolation proof
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # This gate must fail on absent/denied syscall observation. Never alter ptrace,
          # namespaces, AppArmor, capabilities or privilege settings to force it through.
          if ! command -v strace >/dev/null 2>&1; then
            test "${GITHUB_ACTIONS:-false}" = true
            test "$(. /etc/os-release; printf '%s' "$ID")" = ubuntu
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends strace
          fi
          command -v strace
          strace --version > "$RUNNER_TEMP/collect-progress-strace-version.txt"
          strace -f -yy -s4096 -e trace=%file -o "$RUNNER_TEMP/collect-progress-strace-preflight.log" /bin/true
          grep -F 'execve(' "$RUNNER_TEMP/collect-progress-strace-preflight.log"
          sha256sum --check "$RUNNER_TEMP/collect-progress-tools.sha256"
          name=collect_progress_noninteractive_syscall_isolation
          cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --test collect_project_export "$name" -- --ignored --exact --list > "$RUNNER_TEMP/collect-progress-$name-list.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/collect-progress-$name-list.txt")" -eq 1
          grep -Fx "$name: test" "$RUNNER_TEMP/collect-progress-$name-list.txt"
          # The source test traces the real bwrap/runtime and exporter/smoke descendants
          # with strace -f -yy -s 4096 -e trace=%file and asserts no profile path access.
          cargo test --locked --release -p orr_sample --no-default-features --features collect-progress,project-export --test collect_project_export "$name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/collect-progress-$name.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/collect-progress-$name.log"
          if grep -Ei 'SKIP:|negative skipped|without source hiding|source_hiding=false|PTRACE.*(denied|not permitted)|ptrace.*(denied|not permitted)' "$RUNNER_TEMP/collect-progress-$name.log"; then exit 1; fi
          sha256sum --check "$RUNNER_TEMP/collect-progress-tools.sha256"
        env:
          ORR_COLLECT_RUNTIME: ${{ runner.temp }}/collect-progress-tools/collect_dodge
          ORR_COLLECT_EXPORTER: ${{ runner.temp }}/collect-progress-tools/orr_export_collect
          ORR_PROGRESS_TEST_BIN: ${{ runner.temp }}/collect-progress-tools/progress-test-harness
          ORR_COLLECT_CAPTURES: ${{ runner.temp }}/collect-progress-captures
          ORR_REQUIRE_GPU: "1"
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
      - name: Strict six-crate Collect progress and optional 3D feature Clippy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p orr_sample -p orr_editor -p orr_remote -p orr_edit -p orr_package -p orr_games --no-default-features --features orr_sample/collect-dodge,orr_sample/collect-progress,orr_sample/project-create,orr_sample/project-export,orr_sample/player-settings,orr_sample/input-actions,orr_sample/game-ui,orr_editor/collect-dodge,orr_editor/project-ui,orr_editor/animated-models,orr_editor/terrain-physics,orr_editor/navigation,orr_editor/irradiance-probes,orr_remote/collect-dodge,orr_remote/terrain-physics,orr_remote/navigation,orr_games/collect-dodge,orr_games/terrain-physics,orr_games/navigation --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/collect-progress-clippy.log"
      - name: Upload generated Arena acceptance evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: new-arena-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/new-arena-captures
            ${{ runner.temp }}/new-arena-*-list.txt
            ${{ runner.temp }}/new-arena-*.log
            ${{ runner.temp }}/new-arena-tools.sha256
            ${{ runner.temp }}/collect-authored-*-list.txt
            ${{ runner.temp }}/collect-authored-*.log
            ${{ runner.temp }}/collect-authored-tools.sha256
            ${{ runner.temp }}/collect-authored-export-ignored.txt
            ${{ runner.temp }}/collect-authored-editor-ignored.txt
            ${{ runner.temp }}/collect-authored-captures
            ${{ runner.temp }}/collect-authored-candidate.txt
            ${{ runner.temp }}/collect-progress-*.txt
            ${{ runner.temp }}/collect-progress-*.log
            ${{ runner.temp }}/collect-progress-*.stderr
            ${{ runner.temp }}/collect-progress-*.json
            ${{ runner.temp }}/collect-progress-*.jsonl
            ${{ runner.temp }}/collect-progress-tools.sha256
            ${{ runner.temp }}/collect-progress-captures
          if-no-files-found: error
          retention-days: 7
      # The physics sample's headless benchmark: no window, no GPU. Runs the
      # physics game through the bridge with rollbacks (the checksum tests
      # are in `crates/orr_sample/tests/physics_e2e.rs`, run above).
      - run: cargo run -p orr_sample --release --bin physics -- --headless --bodies 300 --ticks 300
      # The 3D sample (orr_physics3d yard): headless sim plus the view's CPU work
      # (extraction, slerp interpolation, instance lists), no window, no GPU.
      - run: cargo run -p orr_sample --release --bin physics3d -- --headless --bodies 300 --ticks 300
      # The 3D sample in a real (virtual X11) window on lavapipe: renders a fixed
      # number of frames and reads the presented frame back as a PNG.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q xvfb libxkbcommon-x11-0
      # Real Arena editor windows, served by the existing integration-test host.
      # No additional host/CLI build and no renderer fallback: missing windows,
      # screenshots, expected pixels, or authoritative checksums fail this step.
      - name: Arena editor native-window smoke
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p orr_editor --release --test arena arena_native_window_smoke -- --exact --nocapture
        env:
          ORR_REQUIRE_NATIVE_EDITOR: "1"
          ORR_NATIVE_EDITOR_ARTIFACT_DIR: ${{ runner.temp }}/arena-editor-native
          WGPU_BACKEND: vulkan
      - name: Upload Arena editor native-window evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: arena-editor-native-${{ matrix.os }}
          path: ${{ runner.temp }}/arena-editor-native
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo run -p orr_sample --release --bin physics3d -- --bodies 200 --frames 20 --size 640x360 --screenshot "$RUNNER_TEMP/physics3d.png"
      # The mobile / weak-GPU preset (no MSAA, 512 texel shadow map, 12-segment meshes) on the same adapter.
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo run -p orr_sample --release --bin physics3d -- --low --bodies 200 --frames 20 --size 640x360 --screenshot "$RUNNER_TEMP/physics3d_low.png"

  wasm32:
    name: wasm32-wasip1 (wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-wasip1 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v25.0.0
      - run: echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: cargo test (orr_fp, orr_ecs, orr_session, orr_physics, orr_physics3d golden tests) on wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        # `orr_sim`/`orr_testgame` are exercised transitively through
        # `orr_session`'s tests; listing packages explicitly keeps this
        # job scoped to the crates whose determinism actually matters
        # (avoids dragging in anything future-added that isn't
        # `no_std`/wasm-clean yet).
        run: |
          cargo test --locked --release --target wasm32-wasip1 -p orr_asset
          cargo test --locked --release --target wasm32-wasip1 -p orr_asset_fixture --lib
          cargo test --release --target wasm32-wasip1 -p orr_fp
          cargo test --release --target wasm32-wasip1 -p orr_ecs
          cargo test --release --target wasm32-wasip1 -p orr_session --test arena -- golden
          cargo test --release --target wasm32-wasip1 -p orr_physics --test physics -- golden
          cargo test --release --target wasm32-wasip1 -p orr_physics3d --test golden -- golden
          cargo test --release --target wasm32-wasip1 -p orr_games --test golden
          cargo test --release --target wasm32-wasip1 -p orr_wasm_bench --test checksums

      - name: the same with wasm simd128 (the opt-in WEB_SIMD=1 build) must give the same bits
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: -C target-feature=+simd128
        run: |
          cargo test --locked --release --target wasm32-wasip1 --target-dir target/simd -p orr_asset_fixture --lib
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_fp
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_ecs
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_games --test golden
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_wasm_bench --test checksums

      - name: wasm bench report (wasmtime; informational, never fails the build)
        continue-on-error: true
        run: |
          cargo build --release --target wasm32-wasip1 -p orr_wasm_bench --bin bench_runner
          wasmtime run target/wasm32-wasip1/release/bench_runner.wasm --ms 150

  wasm32-browser:
    # The browser client (`orr_web`, wasm-bindgen glue) and the sim crates it
    # runs must build and actually execute in Chromium: transport, rollback,
    # native/wasm checksums and GPU canvas pixels are mandatory below.
    name: wasm32-unknown-unknown (browser runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-unknown-unknown target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check asset core without default features on wasm32
        run: cargo check --target wasm32-unknown-unknown -p orr_asset --no-default-features

      - name: Check audio-free asset fixture on wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p orr_asset_fixture --no-default-features

      - name: cargo build (sim crates + orr_web) for wasm32-unknown-unknown
        run: cargo build --release --target wasm32-unknown-unknown -p orr_fp -p orr_ecs -p orr_sim -p orr_proto -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_games -p orr_web -p orr_web_gpu -p orr_wasm_bench

      - name: cargo clippy (orr_web, orr_web_gpu, orr_games, orr_wasm_bench) for wasm32-unknown-unknown
        run: cargo clippy --target wasm32-unknown-unknown -p orr_web -p orr_web_gpu -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned browser test tools
        run: |
          npm ci --prefix tools/webtransport
          tools/webtransport/node_modules/.bin/playwright install --with-deps chromium

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); v={p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"}; assert len(v) == 1, v; print(v.pop())')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Generate browser JS and WASM packages
        run: tools/build_web.sh
        env:
          WEB_PROFILE: release
          WEB_GPU: "1"

      - name: Browser harness regression tests
        run: npm test --prefix tools/webtransport

      - name: Browser runtime (WebTransport, WS, WSS, WebGL2 and WebGPU)
        run: cargo test -p orr_server --release --test browser_e2e -- --nocapture --test-threads=1
        env:
          ORR_REQUIRE_BROWSER: "1"
          ORR_REQUIRE_WEBGPU: "1"

      - name: web profile build and size report (informational, never fails the build)
        continue-on-error: true
        run: |
          cargo build --profile web --target wasm32-unknown-unknown -p orr_web -p orr_web_gpu
          for f in orr_web orr_web_gpu; do
            raw=$(stat -c %s "target/wasm32-unknown-unknown/web/$f.wasm")
            gz=$(gzip -9 -c "target/wasm32-unknown-unknown/web/$f.wasm" | wc -c)
            echo "$f.wasm (web profile, before wasm-bindgen/wasm-opt): $raw bytes, gzip $gz"
          done

  android-arm64:
    # Android ARM64 (design doc 3.2): the sim crates are built for aarch64-linux-android and their
    # golden tests are run as that target's own binaries (statically linked bionic, NDK clang as the
    # linker) under qemu-user, so the bits are those of real aarch64 code. A device or emulator image
    # is not needed for determinism; docs/mobile.md says what a real device run adds.
    name: aarch64-linux-android (NDK + qemu-user)
    runs-on: ubuntu-latest
    env:
      ORR_ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-linux-android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk-${{ env.ORR_ANDROID_NDK_VERSION }}

      - name: Install qemu-user
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update -q
          sudo apt-get "${apt_options[@]}" install -y -q qemu-user

      - name: cargo build (sim crates + games) for aarch64-linux-android
        # Library builds need no linker, so this also works without an NDK.
        run: cargo build --release --target aarch64-linux-android -p orr_fp -p orr_ecs -p orr_sim -p orr_proto -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_games --lib

      - name: golden tests on aarch64-linux-android under qemu-aarch64
        # Pin the previously passing NDK: r30's static libc duplicates Rust's rust_eh_personality.
        # Temporary CI-only compatibility pin: r29 is upstream-unsupported.
        # Revalidate a supported NDK before replacing it; this is not a product-runtime requirement.
        # `crt-static` runs these binaries under qemu-user without Android's dynamic linker.
        # Doc tests are not cross-run.
        # `--test-threads=1`: a multi-threaded test harness in a static bionic binary under qemu-user
        # segfaults about one run in three (thread start-up in the emulator, not our code; the same binaries
        # passed 12 of 12 runs single-threaded).
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUNNER: qemu-aarch64
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" ]]; then
            echo "::error::Android SDK root is unavailable"
            exit 1
          fi
          NDK="$SDK/ndk/$ORR_ANDROID_NDK_VERSION"
          if [[ ! -r "$NDK/source.properties" ]]; then
            echo "::error::Pinned NDK $ORR_ANDROID_NDK_VERSION is missing at $NDK"
            exit 1
          fi
          REVISION=$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$NDK/source.properties" | tr -d '\r')
          if [[ "$REVISION" != "$ORR_ANDROID_NDK_VERSION" ]]; then
            echo "::error::Expected NDK $ORR_ANDROID_NDK_VERSION, found '$REVISION' at $NDK"
            exit 1
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in aarch64-linux-android24-clang llvm-ar; do
            if [[ ! -x "$BIN/$tool" ]]; then
              echo "::error::Pinned NDK tool is unavailable: $BIN/$tool"
              exit 1
            fi
          done
          test -r "$BIN/../sysroot/usr/lib/aarch64-linux-android/libc.a"
          echo "Using Android NDK $REVISION at $NDK"
          "$BIN/aarch64-linux-android24-clang" --version
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo test --locked --release --target aarch64-linux-android -p orr_asset --tests -- --test-threads=1
          cargo test --locked --release --target aarch64-linux-android -p orr_asset_fixture --lib -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_fp --tests -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_ecs --tests -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_session --test arena -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_physics --test physics -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_physics3d --test golden -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_games --test golden -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_wasm_bench --test checksums -- --test-threads=1

  cross_platform_checksum_compare:
    name: cross-platform checksum comparison
    # Preserve this check name for existing branch protection. Every checksum
    # target and the sample graphics/audio/editor matrix must pass the gate.
    needs: [native, wasm32, wasm32-browser, android-arm64, sample-build]
    # Without always(), a failed/skipped dependency skips this required check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every checksum and sample runner to pass
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WASM32_RESULT: ${{ needs.wasm32.result }}
          ANDROID_ARM64_RESULT: ${{ needs['android-arm64'].result }}
          BROWSER_RESULT: ${{ needs['wasm32-browser'].result }}
          SAMPLE_BUILD_RESULT: ${{ needs['sample-build'].result }}
        run: |
          failed=0
          for result_var in NATIVE_RESULT WASM32_RESULT ANDROID_ARM64_RESULT BROWSER_RESULT SAMPLE_BUILD_RESULT; do
            result="${!result_var}"
            echo "$result_var=$result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$result_var must be success, got '$result'"
              failed=1
            fi
          done
          if [[ "$failed" != "0" ]]; then
            exit 1
          fi

          echo "All native matrix legs, wasm32-wasip1 (including SIMD), and"
          echo "aarch64-linux-android passed their pinned golden-checksum assertions."
          echo "Chromium passed native/wasm checkpoint comparisons and required GPU views."
          echo "Both sample-build matrix legs passed their graphics/audio/editor checks,"
          echo "including required Linux software-GPU and Arena native-window smoke tests."
          echo "The targets assert the same constants in orr_fp, orr_session,"
          echo "orr_physics, orr_physics3d, orr_games, orr_wasm_bench, and orr_asset_fixture tests."
          echo "No checksum artifacts are exchanged: each target independently"
          echo "matches those shared expected values, so every runner must pass."

name: determinism

# Cross-platform determinism CI (design doc §3.2): the same golden tests
# (fixed input sequences with hardcoded/recorded checksums) must produce
# bit-identical results on every supported target. A single differing bit
# on any platform is a CI failure — that's the whole point of fixed-point,
# integer-only simulation.

on:
  pull_request:
    branches: [main, su/engine-correctness-hardening]
    types: [ready_for_review]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest-x86_64
          - os: windows-latest
            name: windows-latest-x86_64
          - os: macos-latest
            name: macos-latest-arm64
          - os: ubuntu-24.04-arm
            name: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulation float-type guard
        # Type declarations (including arithmetic-free POD fields) are checked
        # separately from float arithmetic. Keep view/test/bench float use out
        # of this library-only policy; FP's feature-gated conversion boundary
        # is exercised explicitly. Failure is mandatory on every native leg.
        run: python tools/check_sim_float_types.py

      - name: Simulation POD regression fixtures
        # Keep native commands in separate steps so Windows' default pwsh
        # cannot hide the library guard's failure behind a later success.
        run: python tools/test_sim_float_guard.py

      - name: Asset core, cooker, and strict fixture gates
        run: cargo test --locked --release -p orr_asset -p orr_asset_cook -p orr_asset_fixture

      - name: Reproduce checked-in cooked asset bytes
        run: cargo run --locked --release -p orr_asset_cook -- cook --index assets/fixture_v1/index.json --out assets/fixture_v1/cooked --root a_0000000000001001 --root a_0000000000002001 --check

      - name: Strict asset crate clippy
        run: cargo clippy --locked -p orr_asset -p orr_asset_cook -p orr_asset_fixture --all-targets -- -D warnings

      - name: cargo test --workspace --release
        # Release, not debug: matches the profile the design doc's tick
        # budget is measured against, and is what the golden tests (whose
        # constants are pinned to a specific i64/i128 op sequence, not to
        # a specific build profile) are expected to run under in CI.
        #
        # `orr_sample` (wgpu + winit window demo) is excluded: it is view
        # layer, needs no determinism check, and its GPU stack is checked
        # separately from the sim crates by the required `sample-build` job.
        # `orr_editor` (egui, needs Rust 1.95+, GUI/GPU stack) is excluded for
        # the same reason and is built and tested by `sample-build` too.
        # `orr_web_gpu` (the browser's wgpu view) is excluded likewise (`sample-build`).
        #
        # `orr_games` (PhysGame, Yard3D: the sample games without any view code) and
        # `orr_wasm_bench` (pinned checksums of the FP/ECS/physics workloads) are in it: their
        # golden tests are the cross-platform checks of the wasm/narrow fast paths.
        #
        # This includes `orr_relay_net` and the relay end-to-end tests of
        # `orr_server` (`tests/net_e2e.rs`): real loopback QUIC/WebSocket with
        # a real-time server loop, a few seconds each.
        #
        # `orr_ffi` (the C ABI) is in it: its test compiles a C client with the
        # runner's C compiler (gcc/clang, or MSVC through the `cc` crate), links
        # it to the built cdylib and compares its output with the Rust bridge.
        # Linux must have a compiler (required); elsewhere the test skips with a
        # message if the runner has none.
        run: cargo test --workspace --release --timings --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu
        env:
          ORR_REQUIRE_C_COMPILER: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Upload native release build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-native-${{ matrix.name }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Required CollectDodge gameplay core and example
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_games --features collect-dodge --test collect_dodge -- --list > collect-dodge-tests.txt
          test "$(grep -cE '^[[:alnum:]_:]+: test$' collect-dodge-tests.txt)" -eq 17
          cargo test --locked --release -p orr_games --features collect-dodge --test collect_dodge -- --nocapture 2>&1 | tee collect-dodge-tests.log
          grep -F 'test result: ok. 17 passed; 0 failed; 0 ignored;' collect-dodge-tests.log
          cargo run --locked --release -p orr_games --features collect-dodge --example collect_dodge 2>&1 | tee collect-dodge-example.log
          grep -F 'win -> restart -> hazard loss verified; checksum=a7b61c44ba9f26bd' collect-dodge-example.log
          cargo clippy --locked -p orr_games --all-features --all-targets -- -D warnings

      - name: Required RoomEscapeV1 gameplay core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_games --features room-escape --lib room_escape_game::tests:: -- --list > room-core-list.txt
          cargo test --locked --release -p orr_games --features room-escape --lib room_escape_game::tests:: -- --ignored --list > room-core-ignored.txt
          python - <<'PYROOM'
          import pathlib, re
          expected = ['room_escape_game::tests::admission_rejects_hostile_hidden_fields_missing_roles_and_anonymous_entities', 'room_escape_game::tests::canonical_setup_and_initial_only_admission', 'room_escape_game::tests::hostile_samples_are_wholly_neutral', 'room_escape_game::tests::key_then_exit_requires_separate_edges_and_won_freezes', 'room_escape_game::tests::movement_bounds_each_segment_before_casting', 'room_escape_game::tests::only_connected_slot_zero_controls_player', 'room_escape_game::tests::rejects_noncanonical_and_unbounded_authoring_before_math', 'room_escape_game::tests::snapshot_replay_and_initial_frame_restart_match_exact_bytes', 'room_escape_game::tests::wall_blocks_key_interaction_and_exit_stays_locked', 'room_escape_game::tests::walls_stop_motion_and_diagonal_is_normalized']
          read = lambda name: pathlib.Path(name).read_text()
          listed = lambda name: sorted(re.findall(r'^([A-Za-z0-9_:]+): test$', read(name), re.M))
          assert listed('room-core-list.txt') == expected
          assert listed('room-core-ignored.txt') == []
          PYROOM
          cargo test --locked --release -p orr_games --features room-escape --lib room_escape_game::tests:: -- --nocapture 2>&1 | tee room-core.log
          python - <<'PYROOM'
          import pathlib, re
          text = pathlib.Path('room-core.log').read_text()
          rows = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', text, re.M)
          assert text.count('test result:') == 1
          assert rows == [('10', '0', '0')], rows
          assert not re.search(r'(?im)^\s*(?:SKIP:|.*\bskipping\b)', text)
          PYROOM
      - name: Upload RoomEscapeV1 native core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-core-${{ matrix.name }}
          path: |
            room-core-list.txt
            room-core-ignored.txt
            room-core.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify orr_ffi artifacts (cdylib + staticlib + import library)
        # The C ABI tests always build and verify these, even when the runner
        # has no C compiler. Reuse their artifacts instead of rebuilding with
        # a different workspace feature set after the tests.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) artifacts=(liborr_ffi.so liborr_ffi.a) ;;
            macOS) artifacts=(liborr_ffi.dylib liborr_ffi.a) ;;
            Windows) artifacts=(orr_ffi.dll orr_ffi.dll.lib orr_ffi.lib) ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          for artifact in "${artifacts[@]}"; do
            path="target/release/$artifact"
            if [[ ! -f "$path" || ! -s "$path" ]]; then
              echo "::error::Missing or empty FFI artifact: $path"
              exit 1
            fi
          done

      - name: cargo clippy --workspace --all-targets
        # `-D warnings` only on the crates this task owns (`orr_sim`,
        # `orr_session`, `orr_testgame`, `orr_physics`, `orr_physics3d`); other crates may be
        # under concurrent work with their own warning budget.
        run: |
          cargo clippy --workspace --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu --all-targets
          cargo clippy -p orr_sim -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_proto -p orr_server -p orr_relay_net -p orr_reflect -p orr_reflect_derive -p orr_edit -p orr_remote -p orr_mcp -p orr_cli -p orr_viewstream -p orr_tui -p orr_net -p orr_web -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - name: Required RAW16 native inventories and strict feature boundary
        run: python -B tools/raw16_import_gate.py native --evidence "${{ runner.temp }}/raw16-native-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain RAW16 native and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw16-native-${{ matrix.name }}
          path: ${{ runner.temp }}/raw16-native-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

      - name: cargo build -p orr_sim --features hotpatch
        # Desktop-only, off-by-default hot-patch hook (design doc decision
        # #10 — see crates/orr_sim/src/hotpatch.rs): build-only check (not
        # `test`/`run`) that the `subsecond`-backed code path still
        # compiles on every native desktop target. Never build this
        # feature for the wasm32 job below — subsecond has no wasm32
        # code-swap story and the feature must never leak into a release
        # or replay-verification build.
        run: cargo build -p orr_sim --features hotpatch

  sample-linked-prefabs:
    name: sample linked prefabs (ubuntu-22.04)
    # Independent required Linux lane; keep commands and evidence identical to
    # the former sample-build block. Never reuse binaries from another job.
    # Pin matches sample-build's bubblewrap-compatible x64 runner; migrate
    # before 2027-04-17: https://github.com/actions/runner-images/issues/14254
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install linked-prefab software Vulkan dependency
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Linked Collect prefab contracts and feature boundaries
        shell: bash
        run: tools/check-linked-prefabs.sh contracts
      - name: Install linked-prefab namespace acceptance dependency
        run: sudo apt-get install -y -q bubblewrap
      - name: Linked Collect actual editor GPU and source-hidden export
        shell: bash
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: "1"
        run: tools/check-linked-prefabs.sh gpu
      - name: Strict seven-crate linked prefab and inherited feature Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p orr_sample -p orr_editor -p orr_remote -p orr_edit -p orr_reflect -p orr_package -p orr_games --no-default-features --features orr_editor/linked-prefabs,orr_sample/linked-prefabs,orr_remote/linked-prefabs,orr_edit/linked-prefabs,orr_reflect/linked-prefabs,orr_sample/collect-ui,orr_editor/collect-ui,orr_sample/collect-dodge,orr_sample/collect-sprites,orr_sample/collect-progress,orr_sample/project-create,orr_sample/project-export,orr_sample/player-settings,orr_sample/input-actions,orr_sample/game-ui,orr_editor/collect-dodge,orr_editor/project-ui,orr_editor/animated-models,orr_editor/terrain-physics,orr_editor/navigation,orr_editor/irradiance-probes,orr_remote/collect-dodge,orr_remote/terrain-physics,orr_remote/navigation,orr_games/collect-dodge,orr_games/terrain-physics,orr_games/navigation --all-targets -- -D warnings 2>&1 | tee "${ORR_LINKED_EVIDENCE:-target/linked-prefab-evidence}/combined-feature-clippy.log"
      - name: Upload linked prefab acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linked-prefab-evidence-ubuntu-22.04
          path: |
            target/linked-prefab-evidence/*.log
            target/linked-prefab-evidence/*.sha256
            target/linked-prefab-evidence/captures/*.png
            target/linked-prefab-evidence/captures/*.txt
          if-no-files-found: error
          retention-days: 7

  room-wall-authoring:
    # Each mandatory wall authoring route owns its runner, target and evidence.
    name: room wall authoring (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: cpu
            os: ubuntu-22.04
            timeout: 45
          - mode: cpu
            os: windows-latest
            timeout: 45
          - mode: gpu
            os: ubuntu-22.04
            timeout: 45
          - mode: export
            os: ubuntu-22.04
            timeout: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Room wall software Vulkan dependency
        if: matrix.mode != 'cpu'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Install Room wall namespace acceptance dependency
        if: matrix.mode == 'export'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Required independent Room wall authoring acceptance
        shell: bash
        timeout-minutes: ${{ matrix.timeout }}
        env:
          ORR_ROOM_WALL_GATE_EVIDENCE: ${{ matrix.mode == 'export' && '/tmp' || runner.temp }}/orr-room-wall-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          unset PYTHONOPTIMIZE
          python -B tools/room_wall_gate.py ${{ matrix.mode }}
      - name: Retain Room wall and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-wall-${{ matrix.mode }}-${{ matrix.os }}
          path: ${{ matrix.mode == 'export' && '/tmp' || runner.temp }}/orr-room-wall-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  static-model-authoring:
    # Independent feature routes own separate runners, private targets and evidence.
    # Keep all eight rows mandatory; the final aggregate requires this matrix.
    name: static model authoring (${{ matrix.feature }}, ${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: uv
            mode: cpu
            os: ubuntu-22.04
            timeout: 45
          - feature: uv
            mode: cpu
            os: windows-latest
            timeout: 45
          - feature: uv
            mode: gpu
            os: ubuntu-22.04
            timeout: 45
          - feature: uv
            mode: export
            os: ubuntu-22.04
            timeout: 60
          - feature: pivot
            mode: cpu
            os: ubuntu-22.04
            timeout: 45
          - feature: pivot
            mode: cpu
            os: windows-latest
            timeout: 45
          - feature: pivot
            mode: gpu
            os: ubuntu-22.04
            timeout: 45
          - feature: pivot
            mode: export
            os: ubuntu-22.04
            timeout: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install static authoring software Vulkan dependency
        if: matrix.mode != 'cpu'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Install static authoring namespace acceptance dependency
        if: matrix.mode == 'export'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Required independent static model authoring acceptance
        shell: bash
        timeout-minutes: ${{ matrix.timeout }}
        env:
          ORR_STATIC_UV_EVIDENCE: ${{ matrix.mode == 'export' && '/tmp' || runner.temp }}/orr-static-${{ matrix.feature }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          ORR_STATIC_PIVOT_EVIDENCE: ${{ matrix.mode == 'export' && '/tmp' || runner.temp }}/orr-static-${{ matrix.feature }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -B tools/static_model_${{ matrix.feature }}_gate.py ${{ matrix.mode }}
      - name: Retain static authoring and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.feature }}-${{ matrix.mode }}-${{ matrix.os }}
          path: ${{ matrix.mode == 'export' && '/tmp' || runner.temp }}/orr-static-${{ matrix.feature }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sample-build:
    # View-layer demos, audio, and editor. Build and test on Linux and Windows,
    # plus required Linux software-GPU/window tests; separate from the sim jobs.
    name: sample build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporary hosted-runner compatibility pin for required bubblewrap mount isolation.
        # ubuntu-latest denied UID mapping; no security setting or isolation assertion is changed.
        # Migrate back to a current compatible runner before 2027-04-17 (22.04 removal):
        # https://github.com/actions/runner-images/issues/14254
        os: [ubuntu-22.04, windows-latest]
    steps:
      - name: Prevent Python bytecode in source checkout
        shell: bash
        run: printf '%s\n' 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Required static prop CPU CLI and bindings acceptance
        shell: bash
        timeout-minutes: 45
        env:
          ORR_STATIC_GATE_EVIDENCE: ${{ runner.temp }}/static-prop-cpu-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -B tools/static_model_extract_gate.py cpu
      - name: Retain static prop CPU and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-prop-cpu-${{ matrix.os }}
          path: ${{ runner.temp }}/static-prop-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

      - name: Required static texture variant CPU CLI and bindings acceptance
        shell: bash
        timeout-minutes: 45
        env:
          ORR_STATIC_RETEXTURE_EVIDENCE: ${{ runner.temp }}/static-retexture-cpu-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -B tools/static_model_retexture_gate.py cpu
      - name: Retain static texture variant CPU and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-retexture-cpu-${{ matrix.os }}
          path: ${{ runner.temp }}/static-retexture-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

      - name: Required animation clip extraction cpu acceptance
        shell: bash
        timeout-minutes: 45
        env:
          ORR_CLIP_EXTRACT_EVIDENCE: ${{ runner.temp }}/clip-extract-cpu-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -B - <<'PYCLIPCPU'
          import hashlib, importlib.util, json, urllib.parse, os, pathlib, re, shutil, subprocess, sys, time, traceback
          
          repo = pathlib.Path.cwd()
          # Reuse the reviewed stdlib lifecycle primitive; no RAW16 commands run on import.
          sys.dont_write_bytecode = True
          spec = importlib.util.spec_from_file_location('clip_process_lifecycle', repo / 'tools/raw16_import_gate.py')
          lifecycle = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lifecycle)
          evidence = pathlib.Path(os.environ['ORR_CLIP_EXTRACT_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=False)
          paths = ['Cargo.lock', 'Cargo.toml', 'tools/raw16_import_gate.py',
                   'crates/orr_model/Cargo.toml', 'crates/orr_render/Cargo.toml', 'crates/orr_model/examples/animation_clip_extract.rs',
                   'crates/orr_model/examples/animation_clip_extract/authoring.rs',
                   'crates/orr_model/tests/animation_clip_extract.rs',
                   'crates/orr_render/tests/animation_clip_extract.rs', 'docs/animation-clip-extract.md']
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          identity = lambda: {name: digest(repo / name) for name in paths}
          frozen = identity()
          report = {'status': 'started', 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'source_sha256': frozen, 'platform': sys.platform, 'commands': []}
          def record():
              (evidence / 'receipt.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          def producer_fence():
              for item in report.values():
                  if isinstance(item, dict) and 'producer' in item:
                      assert digest(evidence / item['file']) == item['sha256'], 'retained producer changed'
          def run(label, command, expected=0):
              producer_fence()
              log = evidence / (label + '.log')
              entry = {'label': label, 'argv': command, 'expected_exit': expected, 'log': log.name, 'state': 'running'}
              report['commands'].append(entry)
              record()  # A durable pending receipt exists even if the enclosing job is interrupted.
              try:
                  output = lifecycle.bounded_run(command, repo, os.environ.copy(), log, 1200, expected_exit=expected)
                  entry['state'] = 'passed'
                  print(output, flush=True)
                  return output
              except BaseException:
                  entry['state'] = 'failed'
                  raise
              finally:
                  producer_fence()
                  child_receipt = log.with_suffix('.json')
                  if child_receipt.is_file():
                      entry['process'] = json.loads(child_receipt.read_text())
                  record()
          def inventory(output):
              return re.findall(r'^([A-Za-z0-9_:]+): test$', output, re.M)
          def executable(output, label, package, kind, features, limit):
              artifacts = [json.loads(line) for line in output.splitlines() if line.startswith('{')]
              producers = [a for a in artifacts if a.get('reason') == 'compiler-artifact'
                           and a.get('target', {}).get('name') == 'animation_clip_extract' and a.get('executable')]
              assert len(producers) == 1, producers
              producer = producers[0]
              target = producer['target']
              crate = repo / 'crates' / package
              assert pathlib.Path(producer['manifest_path']).resolve() == (crate / 'Cargo.toml').resolve()
              assert producer['package_id'].startswith('path+')
              package_uri = urllib.parse.urlsplit(producer['package_id'][5:].split('#', 1)[0])
              assert package_uri.scheme == 'file' and package_uri.netloc == ''
              package_path = urllib.parse.unquote(package_uri.path)
              if os.name == 'nt': package_path = package_path.lstrip('/')
              assert pathlib.Path(package_path).resolve() == crate.resolve()
              assert target['kind'] == [kind] and target['crate_types'] == ['bin']
              source = crate / ('examples' if kind == 'example' else 'tests') / 'animation_clip_extract.rs'
              assert pathlib.Path(target['src_path']).resolve() == source.resolve()
              assert producer['profile']['test'] is (kind == 'test') and producer['profile']['opt_level'] == '3'
              assert set(producer['features']) == set(features), producer['features']
              original = pathlib.Path(producer['executable'])
              assert original.is_file() and not original.is_symlink() and 0 < original.stat().st_size <= limit
              original_hash = digest(original)
              copy = evidence / (label + original.suffix)
              assert not copy.exists()
              shutil.copy2(original, copy)
              assert digest(copy) == original_hash
              report[label] = {'producer': producer, 'sha256': original_hash, 'file': copy.name,
                               'bytes': copy.stat().st_size, 'max_bytes': limit}
              record()
              return str(copy)
          expected = '''actual_demo_appends_one_clip_preserves_originals_and_cooks_reloads

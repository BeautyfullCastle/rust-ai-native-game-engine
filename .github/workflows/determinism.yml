      # (extraction, slerp interpolation, instance lists), no window, no GPU.
      - run: cargo run -p orr_sample --release --bin physics3d -- --headless --bodies 300 --ticks 300
      # The 3D sample in a real (virtual X11) window on lavapipe: renders a fixed

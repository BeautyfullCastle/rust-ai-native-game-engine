                         'procedural_point_light_matches_diffuse_oracle_and_off_preserves_standalone_pixels',
                         'procedural_static_and_skinned_share_one_depth_across_animation_and_batch_orders',
                         'resize_empty_frames_and_subsequent_far_geometry_never_reuse_stale_depth',
                         'saved_reloaded_and_failed_reload_settings_preserve_identical_gpu_output',
                         'skinned_point_lighting_follows_deformed_world_positions_normals_and_separate_instances',
                         'static_batches_share_depth_in_both_orders_and_ignore_private_clear_colors',
                         'static_point_lighting_uses_transformed_world_position_and_inverse_transpose_normal',
                         'static_skinned_batches_occlude_in_both_orders_as_animated_vertices_cross_plane'],
            'ignored': [],
            'adapter': 'imported scene acceptance adapter: .+ \\(software: true\\)',
            'filter': ''}]
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "material-ci" / PHASE
          root.mkdir(parents=True, exist_ok=True)
          # Keep stdout and stderr even when Cargo fails; every command fails closed.
          def run(label, argv, extra_env=None):
              path = root / (label + ".log")
              with path.open("w", encoding="utf-8") as log:
                  log.write("COMMAND " + json.dumps(argv) + "\n")
                  log.flush()
                  env = os.environ.copy()
                  for key in ["ORR_MODEL_SCREENSHOT", "ORR_SKINNED_CAPTURE_DIR", "ORR_PARTICLE_CAPTURE_DIR", "ORR_PARTICLE_SHOWCASE_CAPTURE_DIR"]:
                      env.pop(key, None)
                  env.update(extra_env or {})
                  result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, text=True, env=env)
              text = path.read_text(encoding="utf-8", errors="replace")
              print(text, flush=True)
              assert result.returncode == 0, (label, result.returncode)
              return text

          def listed(text):
              return sorted(re.findall(r"^([A-Za-z0-9_:]+): test$", text, re.M))

          def check_result(text, name, adapter, filtered):
              assert text.count("test result:") == 1, name
              assert re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in [0-9.]+s$", text, re.M) == [("1", "0", "0", "0", str(filtered))], name
              assert re.findall(r"^running (\d+) test(?:s)?$", text, re.M) == ["1"], name
              # External driver stderr may split `test name ... ok` across lines.
              # The exact prefix and authoritative successes list still identify it.
              assert re.findall(r"^test ([A-Za-z0-9_:]+) \.\.\. ", text, re.M) == [name], name
              assert re.findall(r"^successes:\n((?:    [A-Za-z0-9_:]+\n)+)", text, re.M) == ["    " + name + "\n"], name
              assert not re.search(r"(?i)SKIP:|skipping|adapter unavailable|SKIP software", text), name
              if adapter:
                  # Require a real observation within this exact successful test's output.
                  marker = "---- " + name + " stdout ----\n"
                  assert re.findall(r"^---- .* stdout ----$", text, re.M) == [marker.rstrip("\n")], name
                  output = text.split(marker, 1)[1].split("\nsuccesses:", 1)[0]
                  observed = sorted(set(re.findall("^" + adapter + "$", output, re.M)))
                  assert len(observed) == 1, (name, "missing or inconsistent adapter observation")
                  return observed[0]
              return None
              # SH9's historical driver label carries driver_info; retain the literal
              # log without promoting it to a richer adapter identity claim.

          capture_adapters = {}
          parity_records = []
          def audit_capture_pair(kind):
              import hashlib
              off_label, on_label = kind + "-off", kind + "-on"
              assert capture_adapters[off_label] == capture_adapters[on_label], "cross-feature adapter mismatch"
              names, size = (["static"], 128) if kind == "model" else (["rest", "midpoint", "key"], 192)
              for name in names:
                  off = root / "captures" / off_label / (name + ".ppm")
                  on = root / "captures" / on_label / (name + ".ppm")
                  header = f"P6\n{size} {size}\n255\n".encode()
                  a, b = off.read_bytes(), on.read_bytes()
                  assert a.startswith(header) and len(a) == len(header) + size * size * 3, str(off)
                  assert b.startswith(header) and len(b) == len(header) + size * size * 3, str(on)
                  assert a == b, (kind, name, "feature-off/on RGB differs")
                  parity_records.append({"off": str(off), "on": str(on), "adapter_observation": capture_adapters[off_label], "sha256": hashlib.sha256(a).hexdigest(), "bytes": len(a)})
                  (root / "pixel-parity.json").write_text(json.dumps(parity_records, indent=2) + "\n")

          def prepared_source():
              import hashlib
              paths = ["Cargo.lock", ".github/workflows/determinism.yml",
                       "crates/orr_render/src/imported_scene.rs",
                       "crates/orr_render/src/model_renderer.rs",
                       "crates/orr_render/src/renderer3d/composed.rs"]
              return {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in paths}

          prepared_records = {}
          def audit_prepared_capture(label, observed, text, source_before, checkout):
              import hashlib, math, struct
              assert prepared_source() == source_before, "prepared source changed during commands"
              adapter = re.fullmatch(r'prepared-camera adapter: name="([^"\r\n]+)" backend=Vulkan device_type=Cpu vendor=\d+ device=\d+ driver="[^"\r\n]*" driver_info="[^"\r\n]*" software=true', observed)
              assert adapter is not None, "prepared fixture requires observed software Vulkan"
              summary = "prepared-camera actual-device acceptance: 12 successful frames, 23 captures; raw/prepared/reversed parity, separate coverage, nearer overlap, resize and rejected-target preservation passed; native interaction untested"
              assert text.count(summary) == 1
              folder = root / "captures" / label
              specs = {"initial-seed": {"size": [128, 96], "seed": True}}
              for width, height in [(128, 96), (96, 128)]:
                  for projection in ["perspective", "orthographic"]:
                      prefix = f"{projection}-{width}x{height}"
                      for kind in ["raw", "prepared", "reversed"]:
                          specs[f"{prefix}-{kind}"] = {"size": [width, height], "projection": projection, "success": True, "equals": f"{prefix}-raw"}
                      for kind in ["mismatch", "late"]:
                          specs[f"accepted-{prefix}-{kind}"] = {"size": [width, height], "equals": f"{prefix}-reversed"}
              for kind in ["mismatch", "late"]:
                  specs[f"initial-perspective-128x96-{kind}"] = {"size": [128, 96], "equals": "initial-seed"}
              assert len(specs) == 23
              assert {p.name for p in folder.iterdir()} == {name + ext for name in specs for ext in [".ppm", ".rgba", ".json"]}
              pixels, metadata, files, coverage = {}, {}, {}, {}
              full = label == "prepared-full"
              f32 = lambda bits: struct.unpack("<f", struct.pack("<I", bits))[0]
              for name, expected in specs.items():
                  paths = {ext: folder / (name + ext) for ext in [".ppm", ".rgba", ".json"]}
                  assert all(p.is_file() and not p.is_symlink() for p in paths.values())
                  raw = paths[".rgba"].read_bytes()
                  width, height = expected["size"]
                  assert len(raw) == width * height * 4
                  assert all(raw[i] == 255 for i in range(3, len(raw), 4))
                  header = f"P6\n{width} {height}\n255\n".encode()
                  rgb = bytes(channel for offset in range(0, len(raw), 4) for channel in raw[offset:offset + 3])
                  assert paths[".ppm"].read_bytes() == header + rgb
                  meta = json.loads(paths[".json"].read_text())
                  assert set(meta) == {"fixture", "size", "matrix_bits", "eye", "target", "adapter", "software", "metallic_roughness", "animation"}
                  assert meta["fixture"] == name and meta["size"] == expected["size"]
                  assert meta["eye"] == [f32(0x3e000000), f32(0x3e4ccccd), 8.0]
                  assert meta["target"] == [f32(0x3e000000), f32(0x3e4ccccd), 0.0]
                  assert meta["adapter"] == adapter.group(1) and meta["software"] is True
                  assert meta["metallic_roughness"] is full and meta["animation"] is full
                  bits = meta["matrix_bits"]
                  assert len(bits) == 4 and all(len(column) == 4 for column in bits)
                  assert all(type(v) is int and 0 <= v <= 0xffffffff and math.isfinite(f32(v)) for column in bits for v in column)
                  assert bits != [list(row) for row in zip(*bits)]
                  pixels[name], metadata[name] = raw, meta
                  if expected.get("success"):
                      points = [([-1.35, 0.35, 0.0], 0), ([1.0, 0.25, 0.0], 0),
                                ([-1.0, 0.0, 1.2], 1), ([0.0, -0.9, 0.75], 2)]
                      if full:
                          points.append(([-0.12, 1.2, 0.1], 3))
                      coverage[name] = []
                      for point, kind in points:
                          half_h = (8.0 - point[2]) * math.tan(math.radians(53.0) * 0.5) if expected["projection"] == "perspective" else 2.4
                          half_w = half_h * width / height
                          x = math.floor(width * (0.5 + (point[0] - 0.125) / (2.0 * half_w)))
                          y = math.floor(height * (0.5 - (point[1] - 0.2) / (2.0 * half_h)))
                          assert 0 < x < width - 1 and 0 < y < height - 1
                          samples = [list(raw[(row * width + column) * 4:(row * width + column) * 4 + 3])
                                     for row in range(y - 1, y + 2) for column in range(x - 1, x + 2)]
                          def match(rgb):
                              r, g, b = rgb
                              if kind == 0: return r > g + 20 and r > b + 20
                              if kind == 1: return b > r + 20 and b > g + 20
                              if kind == 2: return g > r + 20 and g > b + 20
                              return max(rgb) > 10
                          count = sum(map(match, samples))
                          assert count >= (1 if kind == 3 else 3), (name, point, samples)
                          coverage[name].append({"world": point, "pixel_center": [x, y], "samples": samples, "passing_pixels": count})
                  for path in paths.values():
                      files[path.name] = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "bytes": path.stat().st_size}
              for name, expected in specs.items():
                  if expected.get("seed"):
                      assert pixels[name] == bytes([255, 0, 255, 255]) * (128 * 96)
                  else:
                      assert pixels[name] == pixels[expected["equals"]], name
                      assert metadata[name]["matrix_bits"] == metadata[expected["equals"]]["matrix_bits"]
              for dimensions in ["128x96", "96x128"]:
                  assert metadata[f"perspective-{dimensions}-raw"]["matrix_bits"] != metadata[f"orthographic-{dimensions}-raw"]["matrix_bits"]
              for projection in ["perspective", "orthographic"]:
                  assert metadata[f"{projection}-128x96-raw"]["matrix_bits"] != metadata[f"{projection}-96x128-raw"]["matrix_bits"]
              record = {"checkout": checkout, "source_sha256": source_before, "adapter_observation": observed,
                        "successful_readbacks": 12, "seed_or_rejection_readbacks": 11,
                        "files": files, "coverage": coverage,
                        "scope": "Actual hosted software-Vulkan fixture; no physical-GPU, native-window or terrain-clearance claim. Cargo cache freshness is not claimed."}
              with (root / (label + "-capture-audit.json")).open("x") as output:
                  json.dump(record, output, indent=2)
                  output.write("\n")
              prepared_records[label] = record

          def verify_prepared_records():
              import hashlib
              assert set(prepared_records) == {"prepared-minimal", "prepared-full"}
              assert prepared_records["prepared-minimal"]["adapter_observation"] == prepared_records["prepared-full"]["adapter_observation"]
              for label, record in prepared_records.items():
                  assert prepared_source() == record["source_sha256"]
                  for name, expected in record["files"].items():
                      assert hashlib.sha256((root / "captures" / label / name).read_bytes()).hexdigest() == expected["sha256"]
              assert sum(len(record["files"]) for record in prepared_records.values()) == 138

          for g in GROUPS:
              if g["label"].startswith("prepared-"):
                  source_before = prepared_source()
                  checkout_log = run(g["label"] + "-checkout", ["git", "rev-parse", "HEAD"])
                  checkout_lines = re.findall(r"^[0-9a-f]{40}$", checkout_log, re.M)
                  assert len(checkout_lines) == 1
                  checkout = checkout_lines[0]
              base = ["cargo", "test", "--locked", "--release", "-p", g["package"], "--no-default-features"]
              if g["features"]:
                  base += ["--features", g["features"]]
              base += ["--lib"] if g["target"] == "--lib" else ["--test", g["target"]]
              query = base + ([g["filter"]] if g["filter"] else [])
              names = listed(run(g["label"] + "-list", query + ["--", "--list"]))
              assert names == g["names"], g["label"]
              full_names = listed(run(g["label"] + "-full-list", base + ["--", "--list"])) if g["filter"] else names
              assert full_names and len(full_names) == len(set(full_names)) and set(names) <= set(full_names), g["label"]
              assert listed(run(g["label"] + "-ignored", query + ["--", "--ignored", "--list"])) == g["ignored"], g["label"]
              assert g["selected"] and set(g["selected"]) <= set(g["names"]), g["label"]
              for index, name in enumerate(g["selected"]):
                  args = base + [name, "--", "--exact", "--test-threads=1", "--show-output"]
                  if name in g["ignored"]:
                      args += ["--ignored"]
                  capture_env = {}
                  if PHASE == "gpu" and g["label"] in ["model-off", "model-on"] and name == "imported_uv_material_slots_child_transform_depth_camera_and_rejection_readback":
                      folder = root / "captures" / g["label"]
                      folder.mkdir(parents=True, exist_ok=False)
                      capture_env["ORR_MODEL_SCREENSHOT"] = str(folder / "static.ppm")
                  if PHASE == "gpu" and g["label"] in ["skin-off", "skin-on"] and name == "gltf_and_glb_cook_reload_rest_midpoint_key_match_analytic_pixels_and_current_bounds":
                      folder = root / "captures" / g["label"]
                      folder.mkdir(parents=True, exist_ok=False)
                      capture_env["ORR_SKINNED_CAPTURE_DIR"] = str(folder)
                  if g["label"].startswith("prepared-"):
                      folder = root / "captures" / g["label"]
                      folder.mkdir(parents=True, exist_ok=False)
                      capture_env["ORR_PREPARED_CAMERA_CAPTURE_DIR"] = str(folder)
                  text = run(g["label"] + "-" + str(index + 1), args, capture_env)
                  observed = check_result(text, name, g["adapter"], len(full_names) - 1)
                  if g["label"].startswith("prepared-"):
                      audit_prepared_capture(g["label"], observed, text, source_before, checkout)
                  if capture_env:
                      capture_adapters[g["label"]] = observed
                      (root / "capture-adapters.json").write_text(json.dumps(capture_adapters, indent=2) + "\n")
                      if g["label"].endswith("-on"):
                          audit_capture_pair(g["label"].split("-", 1)[0])

          # PPM compares RGB only, with identical observed adapters in each pair.
          assert len(parity_records) == 4
          verify_prepared_records()
          PYMATERIAL
      - name: Retain material actual-device evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: material-device-${{ matrix.os }}
          path: ${{ runner.temp }}/material-ci/gpu
          if-no-files-found: error
          retention-days: 7
      - name: Required particle renderer actual-device readback
        if: runner.os == 'Linux'
        shell: bash
        env:
          ORR_REQUIRE_GPU: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          # Reuse the installed Mesa dependency. Record actual adapter identity;
          # selecting a Vulkan ICD does not prove which backend RHI chose.
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | sort)
          test "${#icds[@]}" -eq 1
          export VK_ICD_FILENAMES="${icds[0]}"
          export VK_DRIVER_FILES="${icds[0]}"
          cargo test --locked --release -p orr_render --no-default-features --features particles --test particles -- --ignored --list > "$RUNNER_TEMP/particle-renderer-ignored.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/particle-renderer-ignored.txt")" -eq 1
          grep -Fx 'particle_shader_depth_blend_order_camera_and_rejection_readback: test' "$RUNNER_TEMP/particle-renderer-ignored.txt"

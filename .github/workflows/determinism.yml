          assert not re.search(r'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested|without source hiding|source_hiding=false|software GPU unavailable',text,re.I)
          PYRESULT
          python3 - <<'PYEVIDENCE'
          import hashlib, json, os, pathlib, struct
          root=pathlib.Path(os.environ['ORR_COLLECT_UI_EVIDENCE'])
          expected=[f'{phase}-authored-ui-export.png' for phase in ['playing','won','lost']]
          assert sorted(p.name for p in (root/'captures').glob('*.png')) == sorted(expected)
          images=[]
          for path in [root/'ui-library-overlay.png']+[root/'captures'/name for name in expected]:
              data=path.read_bytes()
              assert len(data)>32 and data[:8]==b'\x89PNG\r\n\x1a\n',str(path)
              width,height=struct.unpack('>II',data[16:24]); assert width>0 and height>0
              images.append({'path':str(path),'width':width,'height':height,'sha256':hashlib.sha256(data).hexdigest()})
          (root/'capture-manifest.json').write_text(json.dumps(images,indent=2)+'\n')
          # The exact source test asserts byte equality for each source/export PNG, real changed
          # UI pixels, font/license closure, Restart widget dispatch, saved Best and relaunch,
          # and immutable project/export snapshots. It has no GPU or isolation skip branch.
          PYEVIDENCE
          sha256sum --check "$ROOT/tools.sha256"

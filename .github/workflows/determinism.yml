          root.mkdir(parents=True, exist_ok=True)
          # Keep stdout and stderr even when Cargo fails; every command fails closed.
          def run(label, argv, extra_env=None):
              path = root / (label + ".log")
              with path.open("w", encoding="utf-8") as log:
                  log.write("COMMAND " + json.dumps(argv) + "\n")
                  log.flush()
                  env = os.environ.copy()
                  for key in ["ORR_MODEL_SCREENSHOT", "ORR_SKINNED_CAPTURE_DIR", "ORR_PARTICLE_CAPTURE_DIR", "ORR_PARTICLE_SHOWCASE_CAPTURE_DIR"]:
                      env.pop(key, None)
                  env.update(extra_env or {})
                  result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, text=True, env=env)
              text = path.read_text(encoding="utf-8", errors="replace")
              print(text, flush=True)
              assert result.returncode == 0, (label, result.returncode)
              return text

          def listed(text):
              return sorted(re.findall(r"^([A-Za-z0-9_:]+): test$", text, re.M))

          def check_result(text, name, adapter, filtered):
              assert text.count("test result:") == 1, name
              assert re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in [0-9.]+s$", text, re.M) == [("1", "0", "0", "0", str(filtered))], name
              assert re.findall(r"^running (\d+) test(?:s)?$", text, re.M) == ["1"], name
              # External driver stderr may split `test name ... ok` across lines.
              # The exact prefix and authoritative successes list still identify it.
              assert re.findall(r"^test ([A-Za-z0-9_:]+) \.\.\. ", text, re.M) == [name], name
              assert re.findall(r"^successes:\n((?:    [A-Za-z0-9_:]+\n)+)", text, re.M) == ["    " + name + "\n"], name
              assert not re.search(r"(?i)SKIP:|skipping|adapter unavailable|SKIP software", text), name
              if adapter:
                  # Require a real observation within this exact successful test's output.
                  marker = "---- " + name + " stdout ----\n"
                  assert re.findall(r"^---- .* stdout ----$", text, re.M) == [marker.rstrip("\n")], name
                  output = text.split(marker, 1)[1].split("\nsuccesses:", 1)[0]
                  observed = sorted(set(re.findall("^" + adapter + "$", output, re.M)))
                  assert len(observed) == 1, (name, "missing or inconsistent adapter observation")
                  return observed[0]
              return None
              # SH9's historical driver label carries driver_info; retain the literal
              # log without promoting it to a richer adapter identity claim.

          capture_adapters = {}
          parity_records = []
          def audit_capture_pair(kind):
              import hashlib
              off_label, on_label = kind + "-off", kind + "-on"
              assert capture_adapters[off_label] == capture_adapters[on_label], "cross-feature adapter mismatch"
              names, size = (["static"], 128) if kind == "model" else (["rest", "midpoint", "key"], 192)
              for name in names:
                  off = root / "captures" / off_label / (name + ".ppm")
                  on = root / "captures" / on_label / (name + ".ppm")
                  header = f"P6\n{size} {size}\n255\n".encode()
                  a, b = off.read_bytes(), on.read_bytes()
                  assert a.startswith(header) and len(a) == len(header) + size * size * 3, str(off)
                  assert b.startswith(header) and len(b) == len(header) + size * size * 3, str(on)
                  assert a == b, (kind, name, "feature-off/on RGB differs")
                  parity_records.append({"off": str(off), "on": str(on), "adapter_observation": capture_adapters[off_label], "sha256": hashlib.sha256(a).hexdigest(), "bytes": len(a)})
                  (root / "pixel-parity.json").write_text(json.dumps(parity_records, indent=2) + "\n")


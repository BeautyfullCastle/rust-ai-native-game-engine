                  current = identity(original["pid"])
                  if current is None:
                      continue
                  if current["starttime"] != original["starttime"]:
                      raise RuntimeError("owned child start identity changed before reap")
                  if current["ppid"] != os.getpid():
                      continue
                  try:
                      pid, status = os.waitpid(original["pid"], os.WNOHANG)
                  except ChildProcessError:
                      continue

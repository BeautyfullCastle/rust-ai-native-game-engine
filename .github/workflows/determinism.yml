          import pathlib, struct, sys
          with pathlib.Path(sys.argv[1]).open('rb') as binary:
              header = binary.read(64)
              assert header[:6] == b'\x7fELF\x02\x01'
              assert struct.unpack_from('<H', header, 18)[0] == 62
              table = struct.unpack_from('<Q', header, 32)[0]
              size, count = struct.unpack_from('<HH', header, 54)
              assert size >= 56 and count > 0
              interpreters = []
              for index in range(count):
                  binary.seek(table + index * size)
                  entry = binary.read(56)
                  if struct.unpack_from('<I', entry)[0] == 3:
                      offset = struct.unpack_from('<Q', entry, 8)[0]
                      length = struct.unpack_from('<Q', entry, 32)[0]
                      assert 1 < length <= 4096
                      binary.seek(offset)
                      interpreter = binary.read(length)
                      assert interpreter.startswith(b'/') and interpreter.endswith(b'\0')
                      interpreters.append(pathlib.Path(interpreter[:-1].decode()))
              assert len(interpreters) == 1 and interpreters[0].is_file()
          PYELF

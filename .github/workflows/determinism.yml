          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          python3 - <<'PY'
          import os, pathlib, tempfile
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as directory:
              probe = pathlib.Path(directory) / 'permission-probe'
              probe.write_bytes(b'permission-denial')
              probe.chmod(0)
              try:
                  try:
                      probe.read_bytes()
                  except PermissionError:
                      pass
                  else:
                      raise AssertionError('export acceptance needs real mode-000 permission denial')
              finally:
                  probe.chmod(0o600)
          PY
          cargo build --locked --release -p orr_sample --no-default-features --bin arena
          cp target/release/arena "$RUNNER_TEMP/arena-default-no-project"
          test -x "$RUNNER_TEMP/arena-default-no-project"
          sha256sum "$RUNNER_TEMP/arena-default-no-project"

                  status.update(state="CPU_PASSED", default_passes=26, render_cpu_passes=3, window_state_reducer_passes=5, strict_configurations=4)
              else:
                  producer = build("render-device", "render", "render")
                  check_inventory("render-device", producer, RENDER_NAMES, [DEVICE_NAME])
                  status["actual_device_invocations"] = 1
                  text = execute("render-device-test", producer, [DEVICE_NAME, "--exact", "--ignored", "--test-threads=1", "--show-output"])
                  result(text, [DEVICE_NAME], [], 3)
                  marker = "---- " + DEVICE_NAME + " stdout ----\n"
                  require(re.findall(r"^---- .* stdout ----$", text, re.M) == [marker.rstrip("\n")], "exact device output section")
                  output = text.split(marker, 1)[1].split("\nsuccesses:", 1)[0]
                  adapter = capture_audit(output)
                  status.update(state="DEVICE_PASSED_VISUAL_REVIEW_PENDING", adapter=adapter,
                                software=True, capture_triples=22, capture_audit_sha256=sha(E / "capture-audit.json"))
              source_fence()
              evidence_budget()
              require(run("checkout-after", ["git", "rev-parse", "HEAD"], 20).strip() == checkout, "checkout changed")
              for producer in status["producers"].values():
                  require(sha(Path(producer["executable"])) == producer["sha256"], "final producer drift")
              if PHASE == "gpu":
                  audit = json.loads((E / "capture-audit.json").read_text())
                  require({p.name for p in (E / "captures").iterdir()} == set(audit["files"]), "final capture set")
                  for name, record in audit["files"].items():
                      require(sha(E / "captures" / name) == record["sha256"], "final capture drift")
          except BaseException as error:
              status.update(state="STOPPED", error=repr(error))
              raise
          finally:
              status["seconds"] = time.monotonic() - phase_started
              save(E / "terminal.json", status)
              print(json.dumps({k: v for k, v in status.items() if k not in ["commands", "producers"]}, indent=2), flush=True)

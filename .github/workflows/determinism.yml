          assert len({(pathlib.Path(x['copy']).stat().st_dev,pathlib.Path(x['copy']).stat().st_ino) for x in items})==2
          assert items[0]['features']==items[1]['features']
          (root/'tools.sha256').write_text(''.join(f"{x['sha256']}  {x['copy']}\n" for x in items))
          (root/'tools-paths.txt').write_text(''.join(x['copy']+'\n' for x in items))
          (root/'artifacts.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'artifacts':items},indent=2)+'\n')
          PYMANIFEST
          sha256sum --check "$ROOT/tools.sha256"
        env:
          ORR_IMAGE_REIMPORT_EVIDENCE: /tmp/orr-image-reimport-${{ github.run_id }}-${{ github.run_attempt }}

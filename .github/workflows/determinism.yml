        run: |
          python -B - <<'PYCLIPGPU'
          import hashlib, importlib.util, json, urllib.parse, os, pathlib, re, shutil, subprocess, sys, time, traceback
          
          repo = pathlib.Path.cwd()
          # Reuse the reviewed stdlib lifecycle primitive; no RAW16 commands run on import.
          sys.dont_write_bytecode = True
          spec = importlib.util.spec_from_file_location('clip_process_lifecycle', repo / 'tools/raw16_import_gate.py')
          lifecycle = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lifecycle)
          evidence = pathlib.Path(os.environ['ORR_CLIP_EXTRACT_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=False)
          captures = evidence / 'captures'
          paths = ['Cargo.lock', 'Cargo.toml', 'tools/raw16_import_gate.py',
                   'crates/orr_model/Cargo.toml', 'crates/orr_render/Cargo.toml', 'crates/orr_model/examples/animation_clip_extract.rs',
                   'crates/orr_model/examples/animation_clip_extract/authoring.rs',
                   'crates/orr_model/tests/animation_clip_extract.rs',
                   'crates/orr_render/tests/animation_clip_extract.rs', 'docs/animation-clip-extract.md']
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          identity = lambda: {name: digest(repo / name) for name in paths}
          frozen = identity()
          report = {'status': 'started', 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'source_sha256': frozen, 'commands': []}
          def record():
              (evidence / 'receipt.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          def producer_fence():
              for item in report.values():
                  if isinstance(item, dict) and 'producer' in item:
                      assert digest(evidence / item['file']) == item['sha256'], 'retained producer changed'
          def run(label, command, expected=0):
              producer_fence()
              log = evidence / (label + '.log')
              entry = {'label': label, 'argv': command, 'expected_exit': expected, 'log': log.name, 'state': 'running'}
              report['commands'].append(entry)
              record()  # A durable pending receipt exists even if the enclosing job is interrupted.
              try:
                  output = lifecycle.bounded_run(command, repo, os.environ.copy(), log, 1200, expected_exit=expected)
                  entry['state'] = 'passed'
                  print(output, flush=True)
                  return output
              except BaseException:
                  entry['state'] = 'failed'
                  raise
              finally:
                  producer_fence()
                  child_receipt = log.with_suffix('.json')
                  if child_receipt.is_file():
                      entry['process'] = json.loads(child_receipt.read_text())
                  record()
          def executable(output, label, package, kind, features, limit):
              artifacts = [json.loads(line) for line in output.splitlines() if line.startswith('{')]
              producers = [a for a in artifacts if a.get('reason') == 'compiler-artifact'
                           and a.get('target', {}).get('name') == 'animation_clip_extract' and a.get('executable')]
              assert len(producers) == 1, producers
              producer = producers[0]
              target = producer['target']
              crate = repo / 'crates' / package
              assert pathlib.Path(producer['manifest_path']).resolve() == (crate / 'Cargo.toml').resolve()
              assert producer['package_id'].startswith('path+')
              package_uri = urllib.parse.urlsplit(producer['package_id'][5:].split('#', 1)[0])
              assert package_uri.scheme == 'file' and package_uri.netloc == ''
              package_path = urllib.parse.unquote(package_uri.path)
              if os.name == 'nt': package_path = package_path.lstrip('/')
              assert pathlib.Path(package_path).resolve() == crate.resolve()
              assert target['kind'] == [kind] and target['crate_types'] == ['bin']
              source = crate / ('examples' if kind == 'example' else 'tests') / 'animation_clip_extract.rs'
              assert pathlib.Path(target['src_path']).resolve() == source.resolve()
              assert producer['profile']['test'] is (kind == 'test') and producer['profile']['opt_level'] == '3'
              assert set(producer['features']) == set(features), producer['features']
              original = pathlib.Path(producer['executable'])
              assert original.is_file() and not original.is_symlink() and 0 < original.stat().st_size <= limit
              original_hash = digest(original)
              copy = evidence / (label + original.suffix)
              assert not copy.exists()
              shutil.copy2(original, copy)
              assert digest(copy) == original_hash
              report[label] = {'producer': producer, 'sha256': original_hash, 'file': copy.name,
                               'bytes': copy.stat().st_size, 'max_bytes': limit}
              record()
              return str(copy)
          name = 'cli_extract_installed_cooked_clip_matches_source_time_gpu_and_analytic_oracle'
          command = ['cargo', 'test', '--locked', '--release', '-p', 'orr_render', '--features',
                     'animation,imported-scene', '--test', 'animation_clip_extract']
          try:
              icds = sorted(pathlib.Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
              report['icds'] = [str(path) for path in icds]; record()
              assert len(icds) == 1, 'exactly one existing Lavapipe manifest is required'
              os.environ.update(VK_ICD_FILENAMES=str(icds[0]), VK_DRIVER_FILES=str(icds[0]),
                                WGPU_BACKEND='vulkan', ORR_REQUIRE_GPU='1',
                                ORR_CLIP_EXTRACT_REQUIRE_SOFTWARE='1', ORR_CLIP_EXTRACT_CAPTURE_DIR=str(captures))
              report['device_environment'] = {key: os.environ[key] for key in [
                  'VK_ICD_FILENAMES', 'VK_DRIVER_FILES', 'WGPU_BACKEND', 'ORR_REQUIRE_GPU',
                  'ORR_CLIP_EXTRACT_REQUIRE_SOFTWARE', 'ORR_CLIP_EXTRACT_CAPTURE_DIR']}
              build = run('build-render-consumer', [*command, '--no-run', '--message-format=json'])
              test_binary = executable(build, 'device-test-executable', 'orr_render', 'test',
                                       ['animation', 'default', 'imported-scene', 'models'], 128 * 1024**2)
              for label, flags in [('inventory', []), ('ignored-inventory', ['--ignored'])]:
                  output = run(label, [test_binary, *flags, '--list'])
                  assert re.findall(r'^([A-Za-z0-9_:]+): test$', output, re.M) == [name]
              output = run('device', [test_binary, name, '--ignored', '--exact', '--nocapture', '--test-threads=1'])
              assert re.search(r'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;', output)
              assert re.search(r'^test ' + name + r' \.\.\. ', output, re.M)
              expected = {'original.glb', 'trimmed.glb', 'original.glb.cooked.json', 'trimmed.glb.cooked.json', 'adapter.json', 'acceptance.json'}
              for index in range(5):
                  expected.add(f'sample-{index}.json')
                  for variant in ['original-source-time', 'trimmed-rebased-time', 'preserved-original-clip', 'wrong-unrebased-time']:
                      expected.update(f'sample-{index}-{variant}.{extension}' for extension in ['rgba', 'ppm'])
              expected.update(['empty-draw-clear.rgba', 'empty-draw-clear.ppm'])
              assert len(expected) == 53  # Preserve every existing unretimed capture.
              retiming_cases = [('half-speed', 0.5), ('double-speed', 2.0)]
              for label, speed in retiming_cases:
                  prefix = f'retimed-{label}'
                  added = {f'{prefix}.glb', f'{prefix}.glb.cooked.json', f'{prefix}.json',
                           f'{prefix}-wrong-rate-control.rgba', f'{prefix}-wrong-rate-control.ppm'}
                  for index in range(5):
                      added.add(f'{prefix}-sample-{index}.json')
                      for variant in ['original-source-time', 'retimed-mapped-time', 'preserved-original-clip']:
                          added.update(f'{prefix}-sample-{index}-{variant}.{extension}' for extension in ['rgba', 'ppm'])
                  assert len(added) == 40 and expected.isdisjoint(added)
                  expected.update(added)
              assert len(expected) == 133 and {path.name for path in captures.iterdir()} == expected
              for path in captures.iterdir():
                  assert path.is_file() and not path.is_symlink()
                  if path.suffix == '.rgba': assert path.stat().st_size == 147456
                  if path.suffix == '.ppm':
                      assert path.stat().st_size == 110607 and path.read_bytes().startswith(b'P6\n192 192\n255\n')
              accepted = json.loads((captures / 'acceptance.json').read_text())
              adapter = json.loads((captures / 'adapter.json').read_text())
              assert accepted['status'] == 'passed' and accepted['mandatory_gpu'] is True
              assert accepted['required_software_vulkan'] is True
              assert accepted['source_hidden_after_install'] is True and accepted['cooked_reload_before_render'] is True
              assert adapter == accepted['adapter'] and adapter['backend'] == 'Vulkan' and adapter['software'] is True
              assert len(accepted['samples']) == 5
              assert accepted['schema_version'] == 1
              assert [(entry['label'], entry['speed']) for entry in accepted['retiming']] == retiming_cases
              for entry, (label, speed) in zip(accepted['retiming'], retiming_cases):
                  prefix = f'retimed-{label}'
                  assert entry == json.loads((captures / f'{prefix}.json').read_text())
                  assert entry['status'] == 'passed' and entry['source_clip'] == 0 and entry['extracted_clip'] == 2
                  assert entry['start'] == 0.25 and entry['end'] == 1.5 and entry['duration'] == 1.25 / speed
                  assert entry['key_times'] == [0.0, 0.75 / speed, 1.25 / speed]
                  assert entry['source_hidden_after_install'] is True and entry['cooked_reload_before_render'] is True
                  assert len(entry['samples']) == 5
                  for index, (sample, offset) in enumerate(zip(entry['samples'], [0.0, 0.25, 0.75, 1.0, 1.25])):
                      assert sample == json.loads((captures / f'{prefix}-sample-{index}.json').read_text())
                      assert sample['local_time'] == offset / speed and sample['source_time'] == 0.25 + offset
                      assert 0 <= sample['equivalent_pixel_differences'] <= 32
                      assert sample['preserved_pixel_differences'] == 0
                      if index == 0: assert sample['temporal_pixel_differences'] is None
                      else: assert sample['temporal_pixel_differences'] > 100
                  control = entry['wrong_rate_control']
                  assert control['sample_index'] == 1 and control['local_time'] == 0.25 / speed
                  assert control['correct_source_time'] == 0.5 and control['wrong_source_time'] == 0.25 + 0.25 / speed
                  assert control['pixel_differences'] > 100
              assert digest(pathlib.Path(test_binary)) == report['device-test-executable']['sha256']
              report['capture_sha256'] = {path.name: {'sha256': digest(path), 'bytes': path.stat().st_size} for path in sorted(captures.iterdir())}
              report['status'] = 'passed'
          except BaseException:
              report['status'] = 'failed'
              report['failure'] = traceback.format_exc()
              raise
          finally:
              report['source_unchanged'] = identity() == frozen
              if captures.exists():

name: determinism

# Cross-platform determinism CI (design doc §3.2): the same golden tests
# (fixed input sequences with hardcoded/recorded checksums) must produce
# bit-identical results on every supported target. A single differing bit
# on any platform is a CI failure — that's the whole point of fixed-point,
# integer-only simulation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest-x86_64
          - os: windows-latest
            name: windows-latest-x86_64
          - os: macos-latest
            name: macos-latest-arm64
          - os: ubuntu-24.04-arm
            name: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulation float-type guard
        # Type declarations (including arithmetic-free POD fields) are checked
        # separately from float arithmetic. Keep view/test/bench float use out
        # of this library-only policy; FP's feature-gated conversion boundary
        # is exercised explicitly. Failure is mandatory on every native leg.
        run: python tools/check_sim_float_types.py

      - name: Simulation POD regression fixtures
        # Keep native commands in separate steps so Windows' default pwsh
        # cannot hide the library guard's failure behind a later success.
        run: python tools/test_sim_float_guard.py

      - name: Asset core, cooker, and strict fixture gates
        run: cargo test --locked --release -p orr_asset -p orr_asset_cook -p orr_asset_fixture

      - name: Reproduce checked-in cooked asset bytes
        run: cargo run --locked --release -p orr_asset_cook -- cook --index assets/fixture_v1/index.json --out assets/fixture_v1/cooked --root a_0000000000001001 --root a_0000000000002001 --check

      - name: Strict asset crate clippy
        run: cargo clippy --locked -p orr_asset -p orr_asset_cook -p orr_asset_fixture --all-targets -- -D warnings

      - name: cargo test --workspace --release
        # Release, not debug: matches the profile the design doc's tick
        # budget is measured against, and is what the golden tests (whose
        # constants are pinned to a specific i64/i128 op sequence, not to
        # a specific build profile) are expected to run under in CI.
        #
        # `orr_sample` (wgpu + winit window demo) is excluded: it is view
        # layer, needs no determinism check, and its GPU stack is checked
        # separately from the sim crates by the required `sample-build` job.
        # `orr_editor` (egui, needs Rust 1.95+, GUI/GPU stack) is excluded for
        # the same reason and is built and tested by `sample-build` too.
        # `orr_web_gpu` (the browser's wgpu view) is excluded likewise (`sample-build`).
        #
        # `orr_games` (PhysGame, Yard3D: the sample games without any view code) and
        # `orr_wasm_bench` (pinned checksums of the FP/ECS/physics workloads) are in it: their
        # golden tests are the cross-platform checks of the wasm/narrow fast paths.
        #
        # This includes `orr_relay_net` and the relay end-to-end tests of
        # `orr_server` (`tests/net_e2e.rs`): real loopback QUIC/WebSocket with
        # a real-time server loop, a few seconds each.
        #
        # `orr_ffi` (the C ABI) is in it: its test compiles a C client with the
        # runner's C compiler (gcc/clang, or MSVC through the `cc` crate), links
        # it to the built cdylib and compares its output with the Rust bridge.
        # Linux must have a compiler (required); elsewhere the test skips with a
        # message if the runner has none.
        run: cargo test --workspace --release --timings --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu
        env:
          ORR_REQUIRE_C_COMPILER: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Upload native release build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-native-${{ matrix.name }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify orr_ffi artifacts (cdylib + staticlib + import library)
        # The C ABI tests always build and verify these, even when the runner
        # has no C compiler. Reuse their artifacts instead of rebuilding with
        # a different workspace feature set after the tests.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) artifacts=(liborr_ffi.so liborr_ffi.a) ;;
            macOS) artifacts=(liborr_ffi.dylib liborr_ffi.a) ;;
            Windows) artifacts=(orr_ffi.dll orr_ffi.dll.lib orr_ffi.lib) ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          for artifact in "${artifacts[@]}"; do
            path="target/release/$artifact"
            if [[ ! -f "$path" || ! -s "$path" ]]; then
              echo "::error::Missing or empty FFI artifact: $path"
              exit 1
            fi
          done

      - name: cargo clippy --workspace --all-targets
        # `-D warnings` only on the crates this task owns (`orr_sim`,
        # `orr_session`, `orr_testgame`, `orr_physics`, `orr_physics3d`); other crates may be
        # under concurrent work with their own warning budget.
        run: |
          cargo clippy --workspace --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu --all-targets
          cargo clippy -p orr_sim -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_proto -p orr_server -p orr_relay_net -p orr_reflect -p orr_reflect_derive -p orr_edit -p orr_remote -p orr_mcp -p orr_cli -p orr_viewstream -p orr_tui -p orr_net -p orr_web -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - name: cargo build -p orr_sim --features hotpatch
        # Desktop-only, off-by-default hot-patch hook (design doc decision
        # #10 — see crates/orr_sim/src/hotpatch.rs): build-only check (not
        # `test`/`run`) that the `subsecond`-backed code path still
        # compiles on every native desktop target. Never build this
        # feature for the wasm32 job below — subsecond has no wasm32
        # code-swap story and the feature must never leak into a release
        # or replay-verification build.
        run: cargo build -p orr_sim --features hotpatch

  sample-build:
    # View-layer demos, audio, and editor. Build and test on Linux and Windows,
    # plus required Linux software-GPU/window tests; separate from the sim jobs.
    name: sample build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporary hosted-runner compatibility pin for required bubblewrap mount isolation.
        # ubuntu-latest denied UID mapping; no security setting or isolation assertion is changed.
        # Migrate back to a current compatible runner before 2027-04-17 (22.04 removal):
        # https://github.com/actions/runner-images/issues/14254
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Includes `orr_sample`'s relay end-to-end tests (real loopback QUIC/WebSocket).
      - run: cargo test -p orr_sample -p orr_view -p orr_bridge -p orr_rhi -p orr_render -p orr_editor -p orr_web_gpu --release --timings
      - name: Upload sample release build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-sample-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo clippy -p orr_sample -p orr_view -p orr_bridge -p orr_rhi -p orr_render -p orr_editor -p orr_web_gpu --all-targets
      - name: Authored Arena CPU and standalone CLI regressions
        run: cargo test --locked --release -p orr_sample --features project,input-actions --lib --test project_runtime --test project_cli --test input_actions -- --test-threads=1
      - name: Authored Arena mixed UI CLI rejection regressions
        run: cargo test --locked --release -p orr_sample --features project,input-actions,game-ui --test project_cli -- --test-threads=1
      - name: Saved editor and authored runtime parity
        run: cargo test --locked --release -p orr_editor --features sprites --lib --test deps --test runtime_project --test saved_project --test arena_sprites -- --test-threads=1
      - name: Strict authored Arena mixed-feature Clippy
        run: cargo clippy --locked -p orr_sample --features project,input-actions,game-ui --all-targets -- -D warnings
      - name: Strict saved-project editor Clippy
        run: cargo clippy --locked -p orr_editor --features sprites --all-targets -- -D warnings
      # Real Kira PCM tests stay device-free. Native CPAL is opt-in and gets
      # compile coverage; opening a physical device is not a CI success claim.
      - run: cargo test -p orr_audio --release
      - name: Asset fixture device-free audio and all-tick equality
        run: cargo test --locked -p orr_asset_fixture --features audio --release
      - name: Strict asset fixture audio clippy
        run: cargo clippy --locked -p orr_asset_fixture --features audio --all-targets -- -D warnings
      - run: cargo test -p orr_sample --features audio --release --lib arena_audio
      - run: cargo clippy -p orr_audio --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - run: cargo check -p orr_sample --features audio-native --all-targets
      # GPU readback pixel tests on a software Vulkan adapter (lavapipe), so
      # they really run instead of skipping. Linux only.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - if: runner.os == 'Linux'
        run: cargo test -p orr_render --release --test gpu --test gpu3d
        env:
          ORR_REQUIRE_GPU: "1"
      # HDR is an explicit required acceptance lane, not an optional adapter
      # smoke test. Keep each feature configuration separate: animated-models
      # deliberately excludes the static-only editor test via its cfg.
      - name: Required HDR RHI software-adapter acceptance (1 test)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_rhi --features gpu-tests --test hdr_texture -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Required HDR renderer acceptance (11 tests)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_render --features imported-scene,animation --test hdr -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Required HDR animated editor acceptance (3 tests)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_editor --features animated-models --test yard3d_hdr -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Required HDR static-only editor acceptance (1 test)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_editor --features models --test yard3d_hdr_static -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      # The editor's GPU tests (viewport pixels read back, the app rendered by
      # egui_kittest's wgpu renderer) on the same software adapter.
      - if: runner.os == 'Linux'
        run: cargo test -p orr_editor --release --test gpu
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Provision repository-hidden authored runtime proof
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Mandatory authored runtime compositor readback
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_sample --features project,input-actions,game-ui --test project_compositor_gpu -- --test-threads=1 --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
          ORR_PROJECT_CAPTURE_DIR: ${{ runner.temp }}/authored-runtime-captures
      - name: Copied standalone Arena binary without source repository
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_sample --features project,input-actions --test project_cli -- --list > "$RUNNER_TEMP/project-cli-tests.txt"
          grep -Fx 'enabled::copied_standalone_binary_runs_without_repository_paths: test' "$RUNNER_TEMP/project-cli-tests.txt"
          cargo test --locked --release -p orr_sample --features project,input-actions --test project_cli enabled::copied_standalone_binary_runs_without_repository_paths -- --exact --test-threads=1 --nocapture
        env:
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
      - name: Mandatory saved-project editor presentation regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_editor --features sprites --test saved_project_gpu --test arena_sprites_gpu -- --test-threads=1 --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
          ORR_PROJECT_CAPTURE_DIR: ${{ runner.temp }}/saved-editor-captures
          ORR_SPRITE_CAPTURE_DIR: ${{ runner.temp }}/saved-editor-sprite-captures
      - name: Upload authored runtime and saved editor GPU evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: authored-runtime-gpu-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/authored-runtime-captures
            ${{ runner.temp }}/saved-editor-captures
            ${{ runner.temp }}/saved-editor-sprite-captures
          if-no-files-found: error
          retention-days: 7
      # The physics sample's headless benchmark: no window, no GPU. Runs the
      # physics game through the bridge with rollbacks (the checksum tests
      # are in `crates/orr_sample/tests/physics_e2e.rs`, run above).
      - run: cargo run -p orr_sample --release --bin physics -- --headless --bodies 300 --ticks 300
      # The 3D sample (orr_physics3d yard): headless sim plus the view's CPU work
      # (extraction, slerp interpolation, instance lists), no window, no GPU.
      - run: cargo run -p orr_sample --release --bin physics3d -- --headless --bodies 300 --ticks 300
      # The 3D sample in a real (virtual X11) window on lavapipe: renders a fixed
      # number of frames and reads the presented frame back as a PNG.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q xvfb libxkbcommon-x11-0
      # Real Arena editor windows, served by the existing integration-test host.
      # No additional host/CLI build and no renderer fallback: missing windows,
      # screenshots, expected pixels, or authoritative checksums fail this step.
      - name: Arena editor native-window smoke
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p orr_editor --release --test arena arena_native_window_smoke -- --exact --nocapture
        env:
          ORR_REQUIRE_NATIVE_EDITOR: "1"
          ORR_NATIVE_EDITOR_ARTIFACT_DIR: ${{ runner.temp }}/arena-editor-native
          WGPU_BACKEND: vulkan
      - name: Upload Arena editor native-window evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: arena-editor-native-${{ matrix.os }}
          path: ${{ runner.temp }}/arena-editor-native
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo run -p orr_sample --release --bin physics3d -- --bodies 200 --frames 20 --size 640x360 --screenshot "$RUNNER_TEMP/physics3d.png"
      # The mobile / weak-GPU preset (no MSAA, 512 texel shadow map, 12-segment meshes) on the same adapter.
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo run -p orr_sample --release --bin physics3d -- --low --bodies 200 --frames 20 --size 640x360 --screenshot "$RUNNER_TEMP/physics3d_low.png"

  wasm32:
    name: wasm32-wasip1 (wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-wasip1 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v25.0.0
      - run: echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: cargo test (orr_fp, orr_ecs, orr_session, orr_physics, orr_physics3d golden tests) on wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        # `orr_sim`/`orr_testgame` are exercised transitively through
        # `orr_session`'s tests; listing packages explicitly keeps this
        # job scoped to the crates whose determinism actually matters
        # (avoids dragging in anything future-added that isn't
        # `no_std`/wasm-clean yet).
        run: |
          cargo test --locked --release --target wasm32-wasip1 -p orr_asset
          cargo test --locked --release --target wasm32-wasip1 -p orr_asset_fixture --lib
          cargo test --release --target wasm32-wasip1 -p orr_fp
          cargo test --release --target wasm32-wasip1 -p orr_ecs
          cargo test --release --target wasm32-wasip1 -p orr_session --test arena -- golden
          cargo test --release --target wasm32-wasip1 -p orr_physics --test physics -- golden
          cargo test --release --target wasm32-wasip1 -p orr_physics3d --test golden -- golden
          cargo test --release --target wasm32-wasip1 -p orr_games --test golden
          cargo test --release --target wasm32-wasip1 -p orr_wasm_bench --test checksums

      - name: the same with wasm simd128 (the opt-in WEB_SIMD=1 build) must give the same bits
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: -C target-feature=+simd128
        run: |
          cargo test --locked --release --target wasm32-wasip1 --target-dir target/simd -p orr_asset_fixture --lib
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_fp
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_ecs
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_games --test golden
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_wasm_bench --test checksums

      - name: wasm bench report (wasmtime; informational, never fails the build)
        continue-on-error: true
        run: |
          cargo build --release --target wasm32-wasip1 -p orr_wasm_bench --bin bench_runner
          wasmtime run target/wasm32-wasip1/release/bench_runner.wasm --ms 150

  wasm32-browser:
    # The browser client (`orr_web`, wasm-bindgen glue) and the sim crates it
    # runs must build and actually execute in Chromium: transport, rollback,
    # native/wasm checksums and GPU canvas pixels are mandatory below.
    name: wasm32-unknown-unknown (browser runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-unknown-unknown target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check asset core without default features on wasm32
        run: cargo check --target wasm32-unknown-unknown -p orr_asset --no-default-features

      - name: Check audio-free asset fixture on wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p orr_asset_fixture --no-default-features

      - name: cargo build (sim crates + orr_web) for wasm32-unknown-unknown
        run: cargo build --release --target wasm32-unknown-unknown -p orr_fp -p orr_ecs -p orr_sim -p orr_proto -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_games -p orr_web -p orr_web_gpu -p orr_wasm_bench

      - name: cargo clippy (orr_web, orr_web_gpu, orr_games, orr_wasm_bench) for wasm32-unknown-unknown
        run: cargo clippy --target wasm32-unknown-unknown -p orr_web -p orr_web_gpu -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned browser test tools
        run: |
          npm ci --prefix tools/webtransport
          tools/webtransport/node_modules/.bin/playwright install --with-deps chromium

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); v={p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"}; assert len(v) == 1, v; print(v.pop())')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Generate browser JS and WASM packages
        run: tools/build_web.sh
        env:
          WEB_PROFILE: release
          WEB_GPU: "1"

      - name: Browser harness regression tests
        run: npm test --prefix tools/webtransport

      - name: Browser runtime (WebTransport, WS, WSS, WebGL2 and WebGPU)
        run: cargo test -p orr_server --release --test browser_e2e -- --nocapture --test-threads=1
        env:
          ORR_REQUIRE_BROWSER: "1"
          ORR_REQUIRE_WEBGPU: "1"

      - name: web profile build and size report (informational, never fails the build)
        continue-on-error: true
        run: |
          cargo build --profile web --target wasm32-unknown-unknown -p orr_web -p orr_web_gpu
          for f in orr_web orr_web_gpu; do
            raw=$(stat -c %s "target/wasm32-unknown-unknown/web/$f.wasm")
            gz=$(gzip -9 -c "target/wasm32-unknown-unknown/web/$f.wasm" | wc -c)
            echo "$f.wasm (web profile, before wasm-bindgen/wasm-opt): $raw bytes, gzip $gz"
          done

  android-arm64:
    # Android ARM64 (design doc 3.2): the sim crates are built for aarch64-linux-android and their
    # golden tests are run as that target's own binaries (statically linked bionic, NDK clang as the
    # linker) under qemu-user, so the bits are those of real aarch64 code. A device or emulator image
    # is not needed for determinism; docs/mobile.md says what a real device run adds.
    name: aarch64-linux-android (NDK + qemu-user)
    runs-on: ubuntu-latest
    env:
      ORR_ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-linux-android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk-${{ env.ORR_ANDROID_NDK_VERSION }}

      - name: Install qemu-user
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update -q
          sudo apt-get "${apt_options[@]}" install -y -q qemu-user

      - name: cargo build (sim crates + games) for aarch64-linux-android
        # Library builds need no linker, so this also works without an NDK.
        run: cargo build --release --target aarch64-linux-android -p orr_fp -p orr_ecs -p orr_sim -p orr_proto -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_games --lib

      - name: golden tests on aarch64-linux-android under qemu-aarch64
        # Pin the previously passing NDK: r30's static libc duplicates Rust's rust_eh_personality.
        # Temporary CI-only compatibility pin: r29 is upstream-unsupported.
        # Revalidate a supported NDK before replacing it; this is not a product-runtime requirement.
        # `crt-static` runs these binaries under qemu-user without Android's dynamic linker.
        # Doc tests are not cross-run.
        # `--test-threads=1`: a multi-threaded test harness in a static bionic binary under qemu-user
        # segfaults about one run in three (thread start-up in the emulator, not our code; the same binaries
        # passed 12 of 12 runs single-threaded).
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUNNER: qemu-aarch64
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" ]]; then
            echo "::error::Android SDK root is unavailable"
            exit 1
          fi
          NDK="$SDK/ndk/$ORR_ANDROID_NDK_VERSION"
          if [[ ! -r "$NDK/source.properties" ]]; then
            echo "::error::Pinned NDK $ORR_ANDROID_NDK_VERSION is missing at $NDK"
            exit 1
          fi
          REVISION=$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$NDK/source.properties" | tr -d '\r')
          if [[ "$REVISION" != "$ORR_ANDROID_NDK_VERSION" ]]; then
            echo "::error::Expected NDK $ORR_ANDROID_NDK_VERSION, found '$REVISION' at $NDK"
            exit 1
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in aarch64-linux-android24-clang llvm-ar; do
            if [[ ! -x "$BIN/$tool" ]]; then
              echo "::error::Pinned NDK tool is unavailable: $BIN/$tool"
              exit 1
            fi
          done
          test -r "$BIN/../sysroot/usr/lib/aarch64-linux-android/libc.a"
          echo "Using Android NDK $REVISION at $NDK"
          "$BIN/aarch64-linux-android24-clang" --version
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo test --locked --release --target aarch64-linux-android -p orr_asset --tests -- --test-threads=1
          cargo test --locked --release --target aarch64-linux-android -p orr_asset_fixture --lib -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_fp --tests -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_ecs --tests -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_session --test arena -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_physics --test physics -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_physics3d --test golden -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_games --test golden -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_wasm_bench --test checksums -- --test-threads=1

  cross_platform_checksum_compare:
    name: cross-platform checksum comparison
    # Preserve this check name for existing branch protection. Every checksum
    # target and the sample graphics/audio/editor matrix must pass the gate.
    needs: [native, wasm32, wasm32-browser, android-arm64, sample-build]
    # Without always(), a failed/skipped dependency skips this required check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every checksum and sample runner to pass
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WASM32_RESULT: ${{ needs.wasm32.result }}
          ANDROID_ARM64_RESULT: ${{ needs['android-arm64'].result }}
          BROWSER_RESULT: ${{ needs['wasm32-browser'].result }}
          SAMPLE_BUILD_RESULT: ${{ needs['sample-build'].result }}
        run: |
          failed=0
          for result_var in NATIVE_RESULT WASM32_RESULT ANDROID_ARM64_RESULT BROWSER_RESULT SAMPLE_BUILD_RESULT; do
            result="${!result_var}"
            echo "$result_var=$result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$result_var must be success, got '$result'"
              failed=1
            fi
          done
          if [[ "$failed" != "0" ]]; then
            exit 1
          fi

          echo "All native matrix legs, wasm32-wasip1 (including SIMD), and"
          echo "aarch64-linux-android passed their pinned golden-checksum assertions."
          echo "Chromium passed native/wasm checkpoint comparisons and required GPU views."
          echo "Both sample-build matrix legs passed their graphics/audio/editor checks,"
          echo "including required Linux software-GPU and Arena native-window smoke tests."
          echo "The targets assert the same constants in orr_fp, orr_session,"
          echo "orr_physics, orr_physics3d, orr_games, orr_wasm_bench, and orr_asset_fixture tests."
          echo "No checksum artifacts are exchanged: each target independently"
          echo "matches those shared expected values, so every runner must pass."

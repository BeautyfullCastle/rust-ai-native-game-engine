      - name: Build and pin separate reimport Collect runtime and exporter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=${ORR_IMAGE_REIMPORT_EVIDENCE:?mandatory external evidence root}
          export TMPDIR="$ROOT/temporary" XDG_RUNTIME_DIR="$ROOT/xdg-runtime"
          export ORR_REQUIRE_GPU=1 WGPU_BACKEND=vulkan CARGO_TERM_COLOR=never
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          TOOLS="${CARGO_TARGET_DIR:-target}/orr-image-reimport-tools-$(basename "$ROOT")"
          export TOOLS
          python3 - <<'PYPATHS'
          import os,pathlib,tempfile
          hidden=pathlib.Path.cwd().resolve().parent;tools=pathlib.Path(os.environ['TOOLS']).resolve();root=pathlib.Path(os.environ['ORR_IMAGE_REIMPORT_EVIDENCE']).resolve()
          assert tools.is_relative_to(hidden) and not tools.exists()
          assert not root.is_relative_to(hidden) and pathlib.Path(tempfile.gettempdir()).resolve().is_relative_to(root)
          tools.mkdir(parents=True)
          (root/'hidden-root.txt').write_text(str(hidden)+'\n')
          PYPATHS
          # Separate exact-profile builds and immediate copies prevent binary path reuse across feature builds.
          features=collect-sprites,collect-ui,collect-progress,linked-prefabs,project-export
          for name in collect_dodge orr_export_collect; do
            cargo build --locked --release -p orr_sample --no-default-features --features "$features" --bin "$name" --message-format=json > "$ROOT/$name-build.jsonl" 2> "$ROOT/$name-build.stderr"
            python3 - "$name" "$features" <<'PYPIN'
          import hashlib,json,os,pathlib,shutil,sys
          name,requested=sys.argv[1:];root=pathlib.Path(os.environ['ORR_IMAGE_REIMPORT_EVIDENCE']).resolve();manifest=(pathlib.Path.cwd()/'crates/orr_sample/Cargo.toml').resolve()
          rows=[json.loads(line) for line in (root/f'{name}-build.jsonl').read_text().splitlines() if line.strip()]
          found=[row for row in rows if row.get('reason')=='compiler-artifact' and pathlib.Path(row['manifest_path']).resolve()==manifest and row['target']['name']==name and row['target']['kind']==['bin'] and row['profile']['test'] is False and row.get('executable')]
          assert len(found)==1,(name,found)
          item=found[0];expected=set(requested.split(','))|{'collect-dodge','project','sprites','game-ui','input-actions'}
          assert set(item['features'])==expected,(item['features'],sorted(expected))
          source=pathlib.Path(item['executable']).resolve(strict=True);copy=pathlib.Path(os.environ['TOOLS']).resolve()/name
          assert source.is_relative_to(pathlib.Path.cwd().resolve().parent) and os.access(source,os.X_OK) and not copy.exists()
          shutil.copy2(source,copy);digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert hashlib.sha256(copy.read_bytes()).hexdigest()==digest and os.access(copy,os.X_OK)
          (root/f'{name}-artifact.json').write_text(json.dumps({'source':str(source),'copy':str(copy),'sha256':digest,'manifest':str(manifest),'package_id':item['package_id'],'target':item['target'],'features':item['features'],'requested_features':requested,'profile':item['profile']},indent=2)+'\n')
          PYPIN
          done
          python3 - <<'PYMANIFEST'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['ORR_IMAGE_REIMPORT_EVIDENCE']).resolve();items=[json.loads((root/f'{n}-artifact.json').read_text()) for n in ['collect_dodge','orr_export_collect']]
          assert len({x['copy'] for x in items})==2
          assert len({(pathlib.Path(x['copy']).stat().st_dev,pathlib.Path(x['copy']).stat().st_ino) for x in items})==2
          assert items[0]['features']==items[1]['features']
          (root/'tools.sha256').write_text(''.join(f"{x['sha256']}  {x['copy']}\n" for x in items))
          (root/'tools-paths.txt').write_text(''.join(x['copy']+'\n' for x in items))
          (root/'artifacts.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'artifacts':items},indent=2)+'\n')
          PYMANIFEST
          sha256sum --check "$ROOT/tools.sha256"
        env:
          ORR_IMAGE_REIMPORT_EVIDENCE: /tmp/orr-image-reimport-${{ github.run_id }}-${{ github.run_attempt }}

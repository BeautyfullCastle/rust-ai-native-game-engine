  wasm32:
    name: wasm32-wasip1 (wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-wasip1 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v25.0.0
      - run: echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: cargo test (orr_fp, orr_ecs, orr_session, orr_physics, orr_physics3d golden tests) on wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        # `orr_sim`/`orr_testgame` are exercised transitively through
        # `orr_session`'s tests; listing packages explicitly keeps this
        # job scoped to the crates whose determinism actually matters
        # (avoids dragging in anything future-added that isn't
        # `no_std`/wasm-clean yet).
        run: |
          cargo test --locked --release --target wasm32-wasip1 -p orr_asset
          cargo test --locked --release --target wasm32-wasip1 -p orr_asset_fixture --lib
          cargo test --release --target wasm32-wasip1 -p orr_fp
          cargo test --release --target wasm32-wasip1 -p orr_ecs
          cargo test --release --target wasm32-wasip1 -p orr_session --test arena -- golden
          cargo test --release --target wasm32-wasip1 -p orr_physics --test physics -- golden
          cargo test --release --target wasm32-wasip1 -p orr_physics3d --test golden -- golden
          cargo test --release --target wasm32-wasip1 -p orr_games --test golden
          cargo test --release --target wasm32-wasip1 -p orr_wasm_bench --test checksums

      - name: the same with wasm simd128 (the opt-in WEB_SIMD=1 build) must give the same bits
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: -C target-feature=+simd128
        run: |
          cargo test --locked --release --target wasm32-wasip1 --target-dir target/simd -p orr_asset_fixture --lib
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_fp
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_ecs
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_games --test golden
          cargo test --release --target wasm32-wasip1 --target-dir target/simd -p orr_wasm_bench --test checksums

      - name: wasm bench report (wasmtime; informational, never fails the build)
        continue-on-error: true
        run: |
          cargo build --release --target wasm32-wasip1 -p orr_wasm_bench --bin bench_runner
          wasmtime run target/wasm32-wasip1/release/bench_runner.wasm --ms 150

  wasm32-browser:
    # The browser client (`orr_web`, wasm-bindgen glue) and the sim crates it
    # runs must build and actually execute in Chromium: transport, rollback,
    # native/wasm checksums and GPU canvas pixels are mandatory below.
    name: wasm32-unknown-unknown (browser runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32-unknown-unknown target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check asset core without default features on wasm32
        run: cargo check --target wasm32-unknown-unknown -p orr_asset --no-default-features

      - name: Check audio-free asset fixture on wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p orr_asset_fixture --no-default-features

      - name: cargo build (sim crates + orr_web) for wasm32-unknown-unknown
        run: cargo build --release --target wasm32-unknown-unknown -p orr_fp -p orr_ecs -p orr_sim -p orr_proto -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_games -p orr_web -p orr_web_gpu -p orr_wasm_bench

      - name: cargo clippy (orr_web, orr_web_gpu, orr_games, orr_wasm_bench) for wasm32-unknown-unknown
        run: cargo clippy --target wasm32-unknown-unknown -p orr_web -p orr_web_gpu -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned browser test tools
        run: |
          npm ci --prefix tools/webtransport
          tools/webtransport/node_modules/.bin/playwright install --with-deps chromium

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); v={p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"}; assert len(v) == 1, v; print(v.pop())')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Generate browser JS and WASM packages
        run: tools/build_web.sh
        env:
          WEB_PROFILE: release
          WEB_GPU: "1"

      - name: Browser harness regression tests
        run: npm test --prefix tools/webtransport

      - name: Browser runtime (WebTransport, WS, WSS, WebGL2 and WebGPU)
        run: cargo test -p orr_server --release --test browser_e2e -- --nocapture --test-threads=1
        env:
          ORR_REQUIRE_BROWSER: "1"
          ORR_REQUIRE_WEBGPU: "1"

      - name: web profile build and size report (informational, never fails the build)
        continue-on-error: true
        run: |
          cargo build --profile web --target wasm32-unknown-unknown -p orr_web -p orr_web_gpu
          for f in orr_web orr_web_gpu; do
            raw=$(stat -c %s "target/wasm32-unknown-unknown/web/$f.wasm")
            gz=$(gzip -9 -c "target/wasm32-unknown-unknown/web/$f.wasm" | wc -c)
            echo "$f.wasm (web profile, before wasm-bindgen/wasm-opt): $raw bytes, gzip $gz"
          done

  android-arm64:
    # Android ARM64 (design doc 3.2): the sim crates are built for aarch64-linux-android and their
    # golden tests are run as that target's own binaries (statically linked bionic, NDK clang as the
    # linker) under qemu-user, so the bits are those of real aarch64 code. A device or emulator image
    # is not needed for determinism; docs/mobile.md says what a real device run adds.
    name: aarch64-linux-android (NDK + qemu-user)
    runs-on: ubuntu-latest
    env:
      ORR_ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-linux-android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk-${{ env.ORR_ANDROID_NDK_VERSION }}

      - name: Install qemu-user
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update -q
          sudo apt-get "${apt_options[@]}" install -y -q qemu-user

      - name: cargo build (sim crates + games) for aarch64-linux-android
        # Library builds need no linker, so this also works without an NDK.
        run: cargo build --release --target aarch64-linux-android -p orr_fp -p orr_ecs -p orr_sim -p orr_proto -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_games --lib

      - name: golden tests on aarch64-linux-android under qemu-aarch64
        # Pin the previously passing NDK: r30's static libc duplicates Rust's rust_eh_personality.
        # Temporary CI-only compatibility pin: r29 is upstream-unsupported.
        # Revalidate a supported NDK before replacing it; this is not a product-runtime requirement.
        # `crt-static` runs these binaries under qemu-user without Android's dynamic linker.
        # Doc tests are not cross-run.
        # `--test-threads=1`: a multi-threaded test harness in a static bionic binary under qemu-user
        # segfaults about one run in three (thread start-up in the emulator, not our code; the same binaries
        # passed 12 of 12 runs single-threaded).
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUNNER: qemu-aarch64
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" ]]; then
            echo "::error::Android SDK root is unavailable"
            exit 1
          fi
          NDK="$SDK/ndk/$ORR_ANDROID_NDK_VERSION"
          if [[ ! -r "$NDK/source.properties" ]]; then
            echo "::error::Pinned NDK $ORR_ANDROID_NDK_VERSION is missing at $NDK"
            exit 1
          fi
          REVISION=$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$NDK/source.properties" | tr -d '\r')
          if [[ "$REVISION" != "$ORR_ANDROID_NDK_VERSION" ]]; then
            echo "::error::Expected NDK $ORR_ANDROID_NDK_VERSION, found '$REVISION' at $NDK"
            exit 1
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in aarch64-linux-android24-clang llvm-ar; do
            if [[ ! -x "$BIN/$tool" ]]; then
              echo "::error::Pinned NDK tool is unavailable: $BIN/$tool"
              exit 1
            fi
          done
          test -r "$BIN/../sysroot/usr/lib/aarch64-linux-android/libc.a"
          echo "Using Android NDK $REVISION at $NDK"
          "$BIN/aarch64-linux-android24-clang" --version
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo test --locked --release --target aarch64-linux-android -p orr_asset --tests -- --test-threads=1
          cargo test --locked --release --target aarch64-linux-android -p orr_asset_fixture --lib -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_fp --tests -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_ecs --tests -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_session --test arena -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_physics --test physics -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_physics3d --test golden -- golden --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_games --test golden -- --test-threads=1
          cargo test --release --target aarch64-linux-android -p orr_wasm_bench --test checksums -- --test-threads=1

  cross_platform_checksum_compare:
    name: cross-platform checksum comparison
    # Preserve this check name for existing branch protection. Every checksum
    # target, sample graphics/audio/editor matrix, linked-prefab and Room lanes must pass.
    needs: [native, wasm32, wasm32-browser, android-arm64, sample-build, sample-linked-prefabs, sample-room, static-model-authoring, room-wall-authoring]
    # Without always(), a failed/skipped dependency skips this required check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every checksum and sample runner to pass
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WASM32_RESULT: ${{ needs.wasm32.result }}
          ANDROID_ARM64_RESULT: ${{ needs['android-arm64'].result }}
          BROWSER_RESULT: ${{ needs['wasm32-browser'].result }}
          SAMPLE_BUILD_RESULT: ${{ needs['sample-build'].result }}
          LINKED_PREFABS_RESULT: ${{ needs['sample-linked-prefabs'].result }}
          ROOM_RESULT: ${{ needs['sample-room'].result }}
        run: |
          failed=0
          for result_var in NATIVE_RESULT WASM32_RESULT ANDROID_ARM64_RESULT BROWSER_RESULT SAMPLE_BUILD_RESULT LINKED_PREFABS_RESULT ROOM_RESULT; do
            result="${!result_var}"
            echo "$result_var=$result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$result_var must be success, got '$result'"
              failed=1
            fi
          done
          if [[ "$failed" != "0" ]]; then
            exit 1
          fi

          echo "All native matrix legs, wasm32-wasip1 (including SIMD), and"
          echo "aarch64-linux-android passed their pinned golden-checksum assertions."
          echo "Chromium passed native/wasm checkpoint comparisons and required GPU views."
          echo "Room contracts, creator and source-hidden GPU/export checks passed."
          echo "Both sample-build matrix legs passed their graphics/audio/editor checks,"
          echo "including required Linux software-GPU and Arena native-window smoke tests."
          echo "The independent linked-prefab contracts, GPU/export, and strict lint lane passed."
          echo "The targets assert the same constants in orr_fp, orr_session,"
          echo "orr_physics, orr_physics3d, orr_games, orr_wasm_bench, and orr_asset_fixture tests."
          echo "No checksum artifacts are exchanged: each target independently"
          echo "matches those shared expected values, so every runner must pass."
      - name: Require every independent static authoring matrix row to pass
        shell: bash
        env:
          AUTHORING_RESULT: ${{ needs['static-model-authoring'].result }}
        run: |
          echo "AUTHORING_RESULT=$AUTHORING_RESULT"
          if [[ "$AUTHORING_RESULT" != "success" ]]; then
            echo "::error::AUTHORING_RESULT must be success, got '$AUTHORING_RESULT'"
            exit 1
          fi
          echo "All eight independent static authoring routes passed."
      - name: Require every independent Room wall authoring matrix row to pass
        if: always()
        shell: bash
        env:
          ROOM_WALL_RESULT: ${{ needs['room-wall-authoring'].result }}
        run: |
          echo "ROOM_WALL_RESULT=$ROOM_WALL_RESULT"
          if [[ "$ROOM_WALL_RESULT" != "success" ]]; then
            echo "::error::ROOM_WALL_RESULT must be success, got '$ROOM_WALL_RESULT'"
            exit 1
          fi
          echo "All four independent Room wall authoring routes passed."

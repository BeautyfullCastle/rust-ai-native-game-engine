      - name: Build and pin exact Collect sprite runtime and exporter artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=${ORR_COLLECT_SPRITE_EVIDENCE:?mandatory external evidence root}
          export TMPDIR="$ROOT/temporary" XDG_RUNTIME_DIR="$ROOT/xdg-runtime"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          python3 - <<'PYPATHS'
          import os, pathlib, tempfile
          checkout = pathlib.Path.cwd().resolve()
          hidden = checkout.parent
          target = pathlib.Path(os.environ.get('CARGO_TARGET_DIR', 'target')).resolve()
          evidence = pathlib.Path(os.environ['ORR_COLLECT_SPRITE_EVIDENCE']).resolve()
          temporary = pathlib.Path(tempfile.gettempdir()).resolve()
          assert target.is_relative_to(hidden), 'source-hidden root must cover original build outputs'
          assert not evidence.is_relative_to(hidden) and not temporary.is_relative_to(hidden)
          assert evidence.is_relative_to(pathlib.Path('/tmp').resolve()) and temporary.is_relative_to(evidence)
          PYPATHS
          cargo build --locked --release -p orr_sample --no-default-features --features collect-sprites,collect-progress,project-export --bin collect_dodge --bin orr_export_collect --message-format=json > "$ROOT/tools-build.jsonl" 2> "$ROOT/tools-build.stderr"
          python3 - <<'PYPIN'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ['ORR_COLLECT_SPRITE_EVIDENCE']).resolve()
          manifest = (pathlib.Path.cwd() / 'crates/orr_sample/Cargo.toml').resolve()
          records = [json.loads(line) for line in (root / 'tools-build.jsonl').read_text().splitlines() if line.strip()]
          tools = root / 'tools'
          tools.mkdir()
          entries = []
          for name in ['collect_dodge', 'orr_export_collect']:
              found = [row for row in records if row.get('reason') == 'compiler-artifact'
                       and pathlib.Path(row['manifest_path']).resolve() == manifest
                       and row['target']['name'] == name and row['target']['kind'] == ['bin']
                       and row['profile']['test'] is False and row.get('executable')]
              assert len(found) == 1, (name, found)
              item = found[0]
              features = set(item['features'])
              assert {'collect-sprites', 'collect-progress', 'project-export'} <= features, features
              assert not features & {'player-settings', 'project-create', 'game-ui'}, features
              source = pathlib.Path(item['executable']).resolve(strict=True)
              target = tools / name
              assert os.access(source, os.X_OK), source
              shutil.copy2(source, target)
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              assert digest == hashlib.sha256(target.read_bytes()).hexdigest() and os.access(target, os.X_OK)
              entries.append({'source': str(source), 'copy': str(target), 'sha256': digest,
                              'target': item['target'], 'features': item['features'], 'profile': item['profile']})
          (root / 'tools.sha256').write_text(''.join(f"{item['sha256']}  {item['copy']}\n" for item in entries))
          (root / 'artifacts.json').write_text(json.dumps({
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'manifest': str(manifest), 'artifacts': entries,
          }, indent=2) + '\n')
          PYPIN
          sha256sum --check "$ROOT/tools.sha256"
        env:
          ORR_COLLECT_SPRITE_EVIDENCE: /tmp/orr-collect-sprite-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mandatory Collect sprite runtime editor and source-hidden export GPU proofs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=${ORR_COLLECT_SPRITE_EVIDENCE:?mandatory external evidence root}
          export TMPDIR="$ROOT/temporary" XDG_RUNTIME_DIR="$ROOT/xdg-runtime"
          export ORR_COLLECT_RUNTIME="$ROOT/tools/collect_dodge"
          export ORR_COLLECT_EXPORTER="$ROOT/tools/orr_export_collect"
          export ORR_COLLECT_CAPTURES="$ROOT/captures"
          export ORR_COLLECT_SPRITE_CAPTURE="$ROOT/captures/runtime-atlas.png"
          export ORR_COLLECT_EDITOR_CAPTURE="$ROOT/captures/editor-atlas.png"
          export ORR_REQUIRE_GPU=1 ORR_REQUIRE_PROJECT_ISOLATION=1
          mkdir "$ORR_COLLECT_CAPTURES"
          test -x "$ORR_COLLECT_RUNTIME"
          test -x "$ORR_COLLECT_EXPORTER"
          sha256sum --check "$ROOT/tools.sha256"
          for lane in runtime editor export; do
            package=orr_sample
            features=collect-sprites,collect-progress,project-export
            target=collect_sprites
            case "$lane" in
              runtime) name=collect_real_atlas_pixels_read_only_runtime ;;
              editor) package=orr_editor; features=sprites,collect-dodge; name=collect_sprite_actual_editor_pixels ;;
              export) target=collect_project_export; name=collect_sprite_source_hidden_export_matches_actual_atlas ;;
            esac
            cargo test --locked --release -p "$package" --no-default-features --features "$features" --test "$target" "$name" -- --ignored --exact --list > "$ROOT/$lane-gpu-list.txt"
            test "$(grep -cE '^[[:alnum:]_:]+: test$' "$ROOT/$lane-gpu-list.txt")" -eq 1
            grep -Fx "$name: test" "$ROOT/$lane-gpu-list.txt"
            cargo test --locked --release -p "$package" --no-default-features --features "$features" --test "$target" "$name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$ROOT/$lane-gpu.log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$ROOT/$lane-gpu.log"
            if grep -Ei 'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested|without source hiding|source_hiding=false|software GPU unavailable' "$ROOT/$lane-gpu.log"; then exit 1; fi
          done
          python3 - <<'PYPNG'
          import hashlib, os, pathlib, struct
          root = pathlib.Path(os.environ['ORR_COLLECT_CAPTURES'])
          expected = ['runtime-atlas.png', 'editor-atlas.png']
          for phase in ['initial', 'idle', 'won']:
              expected += [f'sprite-{phase}-source.png', f'sprite-{phase}-export.png']
          assert sorted(path.name for path in root.glob('*.png')) == sorted(expected)
          for name in expected:
              data = (root / name).read_bytes()
              assert len(data) > 32 and data[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', data[16:24])
              assert width > 0 and height > 0, name
              print(f'{name}: {width}x{height}, sha256={hashlib.sha256(data).hexdigest()}')
          for phase in ['initial', 'idle', 'won']:
              assert (root / f'sprite-{phase}-source.png').read_bytes() == (root / f'sprite-{phase}-export.png').read_bytes(), phase
          PYPNG
          sha256sum --check "$ROOT/tools.sha256"
        env:
          ORR_COLLECT_SPRITE_EVIDENCE: /tmp/orr-collect-sprite-${{ github.run_id }}-${{ github.run_attempt }}

              names = listed(run(g["label"] + "-list", query + ["--", "--list"]))
              assert names == g["names"], g["label"]
              full_names = listed(run(g["label"] + "-full-list", base + ["--", "--list"])) if g["filter"] else names
              assert full_names and len(full_names) == len(set(full_names)) and set(names) <= set(full_names), g["label"]
              assert listed(run(g["label"] + "-ignored", query + ["--", "--ignored", "--list"])) == g["ignored"], g["label"]
              assert g["selected"] and set(g["selected"]) <= set(g["names"]), g["label"]
              for index, name in enumerate(g["selected"]):
                  args = base + [name, "--", "--exact", "--test-threads=1", "--show-output"]
                  if name in g["ignored"]:
                      args += ["--ignored"]
                  capture_env = {}

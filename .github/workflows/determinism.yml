                  marker = "---- " + name + " stdout ----\n"
                  assert re.findall(r"^---- .* stdout ----$", text, re.M) == [marker.rstrip("\n")], name
                  output = text.split(marker, 1)[1].split("\nsuccesses:", 1)[0]
                  observed = sorted(set(re.findall("^" + adapter + "$", output, re.M)))
                  assert len(observed) == 1, (name, "missing or inconsistent adapter observation")

name: determinism

# Cross-platform determinism CI (design doc §3.2): the same golden tests
# (fixed input sequences with hardcoded/recorded checksums) must produce
# bit-identical results on every supported target. A single differing bit
# on any platform is a CI failure — that's the whole point of fixed-point,
# integer-only simulation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest-x86_64
          - os: windows-latest
            name: windows-latest-x86_64
          - os: macos-latest
            name: macos-latest-arm64
          - os: ubuntu-24.04-arm
            name: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulation float-type guard
        # Type declarations (including arithmetic-free POD fields) are checked
        # separately from float arithmetic. Keep view/test/bench float use out
        # of this library-only policy; FP's feature-gated conversion boundary
        # is exercised explicitly. Failure is mandatory on every native leg.
        run: python tools/check_sim_float_types.py

      - name: Simulation POD regression fixtures
        # Keep native commands in separate steps so Windows' default pwsh
        # cannot hide the library guard's failure behind a later success.
        run: python tools/test_sim_float_guard.py

      - name: Asset core, cooker, and strict fixture gates
        run: cargo test --locked --release -p orr_asset -p orr_asset_cook -p orr_asset_fixture

      - name: Reproduce checked-in cooked asset bytes
        run: cargo run --locked --release -p orr_asset_cook -- cook --index assets/fixture_v1/index.json --out assets/fixture_v1/cooked --root a_0000000000001001 --root a_0000000000002001 --check

      - name: Strict asset crate clippy
        run: cargo clippy --locked -p orr_asset -p orr_asset_cook -p orr_asset_fixture --all-targets -- -D warnings

      - name: cargo test --workspace --release
        # Release, not debug: matches the profile the design doc's tick
        # budget is measured against, and is what the golden tests (whose
        # constants are pinned to a specific i64/i128 op sequence, not to
        # a specific build profile) are expected to run under in CI.
        #
        # `orr_sample` (wgpu + winit window demo) is excluded: it is view
        # layer, needs no determinism check, and its GPU stack is checked
        # separately from the sim crates by the required `sample-build` job.
        # `orr_editor` (egui, needs Rust 1.95+, GUI/GPU stack) is excluded for
        # the same reason and is built and tested by `sample-build` too.
        # `orr_web_gpu` (the browser's wgpu view) is excluded likewise (`sample-build`).
        #
        # `orr_games` (PhysGame, Yard3D: the sample games without any view code) and
        # `orr_wasm_bench` (pinned checksums of the FP/ECS/physics workloads) are in it: their
        # golden tests are the cross-platform checks of the wasm/narrow fast paths.
        #
        # This includes `orr_relay_net` and the relay end-to-end tests of
        # `orr_server` (`tests/net_e2e.rs`): real loopback QUIC/WebSocket with
        # a real-time server loop, a few seconds each.
        #
        # `orr_ffi` (the C ABI) is in it: its test compiles a C client with the
        # runner's C compiler (gcc/clang, or MSVC through the `cc` crate), links
        # it to the built cdylib and compares its output with the Rust bridge.
        # Linux must have a compiler (required); elsewhere the test skips with a
        # message if the runner has none.
        run: cargo test --workspace --release --timings --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu
        env:
          ORR_REQUIRE_C_COMPILER: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Upload native release build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-native-${{ matrix.name }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Required CollectDodge gameplay core and example
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_games --features collect-dodge --test collect_dodge -- --list > collect-dodge-tests.txt
          test "$(grep -cE '^[[:alnum:]_:]+: test$' collect-dodge-tests.txt)" -eq 17
          cargo test --locked --release -p orr_games --features collect-dodge --test collect_dodge -- --nocapture 2>&1 | tee collect-dodge-tests.log
          grep -F 'test result: ok. 17 passed; 0 failed; 0 ignored;' collect-dodge-tests.log
          cargo run --locked --release -p orr_games --features collect-dodge --example collect_dodge 2>&1 | tee collect-dodge-example.log
          grep -F 'win -> restart -> hazard loss verified; checksum=a7b61c44ba9f26bd' collect-dodge-example.log
          cargo clippy --locked -p orr_games --all-features --all-targets -- -D warnings

      - name: Required RoomEscapeV1 gameplay core
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_games --features room-escape --lib room_escape_game::tests:: -- --list > room-core-list.txt
          cargo test --locked --release -p orr_games --features room-escape --lib room_escape_game::tests:: -- --ignored --list > room-core-ignored.txt
          python - <<'PYROOM'
          import pathlib, re
          expected = ['room_escape_game::tests::admission_rejects_hostile_hidden_fields_missing_roles_and_anonymous_entities', 'room_escape_game::tests::canonical_setup_and_initial_only_admission', 'room_escape_game::tests::hostile_samples_are_wholly_neutral', 'room_escape_game::tests::key_then_exit_requires_separate_edges_and_won_freezes', 'room_escape_game::tests::movement_bounds_each_segment_before_casting', 'room_escape_game::tests::only_connected_slot_zero_controls_player', 'room_escape_game::tests::rejects_noncanonical_and_unbounded_authoring_before_math', 'room_escape_game::tests::snapshot_replay_and_initial_frame_restart_match_exact_bytes', 'room_escape_game::tests::wall_blocks_key_interaction_and_exit_stays_locked', 'room_escape_game::tests::walls_stop_motion_and_diagonal_is_normalized']
          read = lambda name: pathlib.Path(name).read_text()
          listed = lambda name: sorted(re.findall(r'^([A-Za-z0-9_:]+): test$', read(name), re.M))
          assert listed('room-core-list.txt') == expected
          assert listed('room-core-ignored.txt') == []
          PYROOM
          cargo test --locked --release -p orr_games --features room-escape --lib room_escape_game::tests:: -- --nocapture 2>&1 | tee room-core.log
          python - <<'PYROOM'
          import pathlib, re
          text = pathlib.Path('room-core.log').read_text()
          rows = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', text, re.M)
          assert text.count('test result:') == 1
          assert rows == [('10', '0', '0')], rows
          assert not re.search(r'(?im)^\s*(?:SKIP:|.*\bskipping\b)', text)
          PYROOM
      - name: Upload RoomEscapeV1 native core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-core-${{ matrix.name }}
          path: |
            room-core-list.txt
            room-core-ignored.txt
            room-core.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify orr_ffi artifacts (cdylib + staticlib + import library)
        # The C ABI tests always build and verify these, even when the runner
        # has no C compiler. Reuse their artifacts instead of rebuilding with
        # a different workspace feature set after the tests.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) artifacts=(liborr_ffi.so liborr_ffi.a) ;;
            macOS) artifacts=(liborr_ffi.dylib liborr_ffi.a) ;;
            Windows) artifacts=(orr_ffi.dll orr_ffi.dll.lib orr_ffi.lib) ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          for artifact in "${artifacts[@]}"; do
            path="target/release/$artifact"
            if [[ ! -f "$path" || ! -s "$path" ]]; then
              echo "::error::Missing or empty FFI artifact: $path"
              exit 1
            fi
          done

      - name: cargo clippy --workspace --all-targets
        # `-D warnings` only on the crates this task owns (`orr_sim`,
        # `orr_session`, `orr_testgame`, `orr_physics`, `orr_physics3d`); other crates may be
        # under concurrent work with their own warning budget.
        run: |
          cargo clippy --workspace --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu --all-targets
          cargo clippy -p orr_sim -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_proto -p orr_server -p orr_relay_net -p orr_reflect -p orr_reflect_derive -p orr_edit -p orr_remote -p orr_mcp -p orr_cli -p orr_viewstream -p orr_tui -p orr_net -p orr_web -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - name: cargo build -p orr_sim --features hotpatch
        # Desktop-only, off-by-default hot-patch hook (design doc decision
        # #10 — see crates/orr_sim/src/hotpatch.rs): build-only check (not
        # `test`/`run`) that the `subsecond`-backed code path still
        # compiles on every native desktop target. Never build this
        # feature for the wasm32 job below — subsecond has no wasm32
        # code-swap story and the feature must never leak into a release
        # or replay-verification build.
        run: cargo build -p orr_sim --features hotpatch

  sample-linked-prefabs:
    name: sample linked prefabs (ubuntu-22.04)
    # Independent required Linux lane; keep commands and evidence identical to
    # the former sample-build block. Never reuse binaries from another job.
    # Pin matches sample-build's bubblewrap-compatible x64 runner; migrate
    # before 2027-04-17: https://github.com/actions/runner-images/issues/14254
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install linked-prefab software Vulkan dependency
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Linked Collect prefab contracts and feature boundaries
        shell: bash
        run: tools/check-linked-prefabs.sh contracts
      - name: Install linked-prefab namespace acceptance dependency
        run: sudo apt-get install -y -q bubblewrap
      - name: Linked Collect actual editor GPU and source-hidden export
        shell: bash
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: "1"
        run: tools/check-linked-prefabs.sh gpu
      - name: Strict seven-crate linked prefab and inherited feature Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p orr_sample -p orr_editor -p orr_remote -p orr_edit -p orr_reflect -p orr_package -p orr_games --no-default-features --features orr_editor/linked-prefabs,orr_sample/linked-prefabs,orr_remote/linked-prefabs,orr_edit/linked-prefabs,orr_reflect/linked-prefabs,orr_sample/collect-ui,orr_editor/collect-ui,orr_sample/collect-dodge,orr_sample/collect-sprites,orr_sample/collect-progress,orr_sample/project-create,orr_sample/project-export,orr_sample/player-settings,orr_sample/input-actions,orr_sample/game-ui,orr_editor/collect-dodge,orr_editor/project-ui,orr_editor/animated-models,orr_editor/terrain-physics,orr_editor/navigation,orr_editor/irradiance-probes,orr_remote/collect-dodge,orr_remote/terrain-physics,orr_remote/navigation,orr_games/collect-dodge,orr_games/terrain-physics,orr_games/navigation --all-targets -- -D warnings 2>&1 | tee "${ORR_LINKED_EVIDENCE:-target/linked-prefab-evidence}/combined-feature-clippy.log"
      - name: Upload linked prefab acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linked-prefab-evidence-ubuntu-22.04
          path: |
            target/linked-prefab-evidence/*.log
            target/linked-prefab-evidence/*.sha256
            target/linked-prefab-evidence/captures/*.png
            target/linked-prefab-evidence/captures/*.txt
          if-no-files-found: error
          retention-days: 7

  sample-build:
    # View-layer demos, audio, and editor. Build and test on Linux and Windows,
    # plus required Linux software-GPU/window tests; separate from the sim jobs.
    name: sample build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporary hosted-runner compatibility pin for required bubblewrap mount isolation.
        # ubuntu-latest denied UID mapping; no security setting or isolation assertion is changed.
        # Migrate back to a current compatible runner before 2027-04-17 (22.04 removal):
        # https://github.com/actions/runner-images/issues/14254
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Particles are presentation-only and default-off. Separate steps keep
      # every configuration mandatory under both bash and Windows PowerShell.
      # sample-build already feeds the required cross-platform aggregate.
      - name: View CPU library default tests
        run: cargo test --locked --release -p orr_view --lib
      - name: View CPU library explicit feature-off tests
        run: cargo test --locked --release -p orr_view --no-default-features --lib
      - name: View CPU particle feature tests
        run: cargo test --locked --release -p orr_view --no-default-features --features particles --lib
      - name: Strict view CPU default Clippy
        run: cargo clippy --locked -p orr_view --all-targets -- -D warnings
      - name: Strict view CPU feature-off Clippy
        run: cargo clippy --locked -p orr_view --no-default-features --all-targets -- -D warnings
      - name: Strict view CPU particle feature Clippy
        run: cargo clippy --locked -p orr_view --no-default-features --features particles --all-targets -- -D warnings
      # Optional particle renderer and additive RHI arm stay default-off.
      # Separate commands preserve mandatory failures on Linux and Windows.
      - name: Particle renderer feature-off RHI check
        run: cargo check --locked -p orr_rhi --no-default-features --all-targets
      - name: Particle renderer feature-off library tests
        run: cargo test --locked --release -p orr_render --no-default-features --lib
      - name: Particle renderer CPU and mock library tests
        run: cargo test --locked --release -p orr_render --no-default-features --features particles --lib
      - name: Strict particle renderer feature-off Clippy
        run: cargo clippy --locked -p orr_render --no-default-features --all-targets -- -D warnings
      - name: Strict particle renderer enabled Clippy
        run: cargo clippy --locked -p orr_render --no-default-features --features particles --all-targets -- -D warnings
      - name: Required material sample CPU CLI and strict feature boundaries
        run: python tools/material_sample_gate.py cpu --evidence "${{ runner.temp }}/material-sample-cpu"
      - name: Retain material sample CPU and partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-sample-cpu-${{ matrix.os }}
          path: ${{ runner.temp }}/material-sample-cpu
          if-no-files-found: error
          retention-days: 7
      # The actual sample/compositor seam is separately gated and default-off.
      - name: Particle sample default library tests
        run: cargo test --locked --release -p orr_sample --lib
      - name: Particle sample feature-off library tests
        run: cargo test --locked --release -p orr_sample --no-default-features --lib
      - name: Particle sample enabled library tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_sample --no-default-features --features particle-demo --lib 2>&1 | tee "$RUNNER_TEMP/particle-sample-cpu.log"
          test "$(grep -c '^test result:' "$RUNNER_TEMP/particle-sample-cpu.log")" -eq 1
          grep -E '^test result: ok\. 19 passed; 0 failed; 2 ignored; 0 measured; 0 filtered out; finished in [0-9.]+s$' "$RUNNER_TEMP/particle-sample-cpu.log"
      - name: Strict particle sample default Clippy
        run: cargo clippy --locked -p orr_sample --all-targets -- -D warnings
      - name: Strict particle sample feature-off Clippy
        run: cargo clippy --locked -p orr_sample --no-default-features --all-targets -- -D warnings
      - name: Strict particle sample enabled Clippy
        run: cargo clippy --locked -p orr_sample --no-default-features --features particle-demo --all-targets -- -D warnings
      - name: Particle imported-scene compositor library tests
        run: cargo test --locked --release -p orr_render --no-default-features --features imported-scene,particles --lib
      - name: Strict particle imported-scene compositor Clippy
        run: cargo clippy --locked -p orr_render --no-default-features --features imported-scene,particles --all-targets -- -D warnings
      - name: Required Terrain Trail default, render and window CPU contracts
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTERRAIN'
          PHASE = 'cpu'
          def enable_subreaper():
              if os.name != "posix" or not Path("/proc/self/stat").is_file():
                  raise RuntimeError("owned group audit requires Linux procfs")
              libc = ctypes.CDLL(None, use_errno=True)
              # /usr/include/linux/prctl.h: PR_SET_CHILD_SUBREAPER=36, GET=37.
              if libc.prctl(36, 1, 0, 0, 0) != 0:
                  raise OSError(ctypes.get_errno(), "PR_SET_CHILD_SUBREAPER")
              value = ctypes.c_int()
              if libc.prctl(37, ctypes.byref(value), 0, 0, 0) != 0 or value.value != 1:
                  raise RuntimeError("subreaper state was not verified")
          
          def identity(pid):
              try:
                  text = Path(f"/proc/{pid}/stat").read_text()
              except FileNotFoundError:
                  return None
              # comm may contain spaces/parentheses; the final ')' terminates it.
              fields = text.rsplit(") ", 1)[1].split()
              return {"pid": pid, "state": fields[0], "ppid": int(fields[1]),
                      "pgid": int(fields[2]), "sid": int(fields[3]), "starttime": int(fields[19])}
          
          def group_members(pgid, deadline):
              members = []
              for ordinal, path in enumerate(Path("/proc").iterdir()):
                  if ordinal >= 32768 or time.monotonic() >= deadline:
                      raise RuntimeError("bounded proc scan exhausted")
                  if path.name.isdecimal():
                      record = identity(int(path.name))
                      if record is not None and record["pgid"] == pgid:
                          members.append(record)
                          if len(members) > 512:
                              raise RuntimeError("owned group member bound exceeded")
              return sorted(members, key=lambda item: item["pid"])
          
          def reap_owned(members):
              reaped = []
              for original in members:
                  current = identity(original["pid"])
                  if current is None:
                      continue
                  if current["starttime"] != original["starttime"]:
                      raise RuntimeError("owned child start identity changed before reap")
                  if current["ppid"] != os.getpid():
                      continue
                  try:
                      pid, status = os.waitpid(original["pid"], os.WNOHANG)
                  except ChildProcessError:
                      continue
                  if pid:
                      reaped.append({"pid": pid, "starttime": original["starttime"], "wait_status": status})
              return reaped
          
          def audit(groups, timeout=10):
              deadline = time.monotonic() + timeout
              reaped = []
              observed = []
              while True:
                  remaining = []
                  for original in groups:
                      leader = identity(original["pid"])
                      if leader is not None and leader["starttime"] != original["starttime"]:
                          raise RuntimeError("owned leader PID was reused; no signal sent to that group")
                      members = group_members(original["pgid"], deadline)
                      if any(m["sid"] != original["sid"] or m["starttime"] < original["starttime"] for m in members):
                          raise RuntimeError("unexpected process group identity; no signal sent to that group")
                      if members:
                          if len(observed) < 16:
                              observed.append({"leader": original, "members": members})
                          remaining.extend(members)
                          try:
                              os.killpg(original["pgid"], signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          # Signal before waiting: an unreaped owned member keeps the
                          # original group ID reserved while the signal is issued.
                          reaped.extend(reap_owned(members))
                  if not remaining:
                      return {"verified_owned_process_groups_absent": True,
                              "reaped_adopted_children": reaped, "cleanup_observations": observed,
                              "remaining_owned_group_members": []}
                  if time.monotonic() >= deadline:
                      raise RuntimeError(f"owned groups still observable after bounded cleanup: {remaining!r}")
                  time.sleep(0.01)
          
          def signal_owned_group(original):
              leader = identity(original["pid"])
              require(leader is None or leader["starttime"] == original["starttime"], "owned leader PID reused; no signal")
              members = group_members(original["pgid"], time.monotonic() + 10)
              require(not any(m["sid"] != original["sid"] or m["starttime"] < original["starttime"] for m in members), "unexpected owned group identity; no signal")
              if members:
                  try:
                      os.killpg(original["pgid"], signal.SIGKILL)
                  except ProcessLookupError:
                      pass
          
          import ctypes, hashlib, json, math, os, queue, re, shutil, signal, struct, subprocess, sys, threading, time, zlib
          from pathlib import Path
          if sys.flags.optimize:
              raise RuntimeError("Python optimization disables validation")
          LOG_CAP = 8 * 1024 * 1024
          DISK_FLOOR = 1024**3
          def require(condition, message="contract failed"):
              if not condition:
                  raise AssertionError(message)
          
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          
          def save(path, value):
              with path.open("x", encoding="utf-8") as file:
                  json.dump(value, file, indent=2)
                  file.write("\n")
          
          def inventory(text, expected):
              names = re.findall(r"^([A-Za-z0-9_:]+): test$", text, re.M)
              require(sorted(names) == sorted(expected) and len(set(names)) == len(names), "test inventory mismatch")
              require(re.findall(r"^\s*(\d+) tests?, 0 benchmarks\s*$", text, re.M) == [str(len(expected))], "inventory summary")
          
          def result(text, passed, ignored, filtered):
              require(not re.search(r"SKIP:|skipping|adapter unavailable|SKIP software", text, re.I), "device skip")
              require(re.findall(r"^test result: (.+)$", text, re.M) and text.count("test result:") == 1, "one result summary")
              expected = (str(len(passed)), "0", str(len(ignored)), "0", str(filtered))
              require(re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in [0-9.]+s$", text, re.M) == [expected], "result summary")
              require(re.findall(r"^running (\d+) test(?:s)?$", text, re.M) == [str(len(passed) + len(ignored))], "running count")
              require(sorted(re.findall(r"^test ([A-Za-z0-9_:]+) \.\.\. ", text, re.M)) == sorted(passed + ignored), "named test prefixes")
              require(sorted(re.findall(r"^test (.+) \.\.\. ignored(?:,.*)?$", text, re.M)) == sorted(ignored), "ignored names")
              require(re.findall(r"^successes:\n((?:    [A-Za-z0-9_:]+\n)+)", text, re.M) == ["".join("    " + n + "\n" for n in sorted(passed))], "successful named results")
          
          
          def png_rgba(data, shape):
              """Decode only bounded, noninterlaced RGBA8 PNG; reject malformed chunks."""
              require(len(data) <= 2 * 1024**2 and data[:8] == b"\x89PNG\r\n\x1a\n", "PNG signature/size")
              width, height = shape
              require(0 < width <= 640 and 0 < height <= 480, "PNG dimensions")
              pos, compressed, state, seen_header = 8, bytearray(), 0, False
              while pos < len(data):
                  require(pos + 12 <= len(data), "truncated chunk")
                  length = struct.unpack_from(">I", data, pos)[0]
                  require(length <= 2 * 1024**2 and pos + 12 + length <= len(data), "chunk length")
                  kind = data[pos+4:pos+8]; payload = data[pos+8:pos+8+length]
                  require(all(65 <= v <= 90 or 97 <= v <= 122 for v in kind) and 65 <= kind[2] <= 90, "chunk type/reserved bit")
                  crc = struct.unpack_from(">I", data, pos+8+length)[0]
                  require(zlib.crc32(kind+payload) & 0xffffffff == crc, "chunk CRC")
                  pos += length + 12
                  if kind == b"IHDR":
                      require(not seen_header and pos == 33 and length == 13, "IHDR order")
                      require(struct.unpack(">IIBBBBB", payload) == (width, height, 8, 6, 0, 0, 0), "RGBA8 format")
                      seen_header = True
                  elif kind == b"IDAT":
                      require(seen_header and state in (0, 1), "IDAT order")
                      state = 1; compressed.extend(payload)
                  elif kind == b"IEND":
                      require(state in (1, 2) and length == 0 and pos == len(data), "IEND/order/trailing bytes")
                      state = 3
                  else:
                      require(seen_header and kind[0] & 32, "unknown critical chunk")
                      if state == 1:

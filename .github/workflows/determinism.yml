          cargo test --locked --release -p orr_editor --no-default-features --features image-reimport,collect-ui,linked-prefabs --test image_reimport "$name" -- --ignored --exact --list > "$ROOT/editor-gpu-list.txt"
          python3 "$ROOT/check-results.py" "$ROOT" editor-gpu one-list

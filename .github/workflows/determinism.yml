name: determinism

# Cross-platform determinism CI (design doc §3.2): the same golden tests
# (fixed input sequences with hardcoded/recorded checksums) must produce
# bit-identical results on every supported target. A single differing bit
# on any platform is a CI failure — that's the whole point of fixed-point,
# integer-only simulation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest-x86_64
          - os: windows-latest
            name: windows-latest-x86_64
          - os: macos-latest
            name: macos-latest-arm64
          - os: ubuntu-24.04-arm
            name: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulation float-type guard
        # Type declarations (including arithmetic-free POD fields) are checked
        # separately from float arithmetic. Keep view/test/bench float use out
        # of this library-only policy; FP's feature-gated conversion boundary
        # is exercised explicitly. Failure is mandatory on every native leg.
        run: python tools/check_sim_float_types.py

      - name: Simulation POD regression fixtures
        # Keep native commands in separate steps so Windows' default pwsh
        # cannot hide the library guard's failure behind a later success.
        run: python tools/test_sim_float_guard.py

      - name: Asset core, cooker, and strict fixture gates
        run: cargo test --locked --release -p orr_asset -p orr_asset_cook -p orr_asset_fixture

      - name: Reproduce checked-in cooked asset bytes
        run: cargo run --locked --release -p orr_asset_cook -- cook --index assets/fixture_v1/index.json --out assets/fixture_v1/cooked --root a_0000000000001001 --root a_0000000000002001 --check

      - name: Strict asset crate clippy
        run: cargo clippy --locked -p orr_asset -p orr_asset_cook -p orr_asset_fixture --all-targets -- -D warnings

      - name: cargo test --workspace --release
        # Release, not debug: matches the profile the design doc's tick
        # budget is measured against, and is what the golden tests (whose
        # constants are pinned to a specific i64/i128 op sequence, not to
        # a specific build profile) are expected to run under in CI.
        #
        # `orr_sample` (wgpu + winit window demo) is excluded: it is view
        # layer, needs no determinism check, and its GPU stack is checked
        # separately from the sim crates by the required `sample-build` job.
        # `orr_editor` (egui, needs Rust 1.95+, GUI/GPU stack) is excluded for
        # the same reason and is built and tested by `sample-build` too.
        # `orr_web_gpu` (the browser's wgpu view) is excluded likewise (`sample-build`).
        #
        # `orr_games` (PhysGame, Yard3D: the sample games without any view code) and
        # `orr_wasm_bench` (pinned checksums of the FP/ECS/physics workloads) are in it: their
        # golden tests are the cross-platform checks of the wasm/narrow fast paths.
        #
        # This includes `orr_relay_net` and the relay end-to-end tests of
        # `orr_server` (`tests/net_e2e.rs`): real loopback QUIC/WebSocket with
        # a real-time server loop, a few seconds each.
        #
        # `orr_ffi` (the C ABI) is in it: its test compiles a C client with the
        # runner's C compiler (gcc/clang, or MSVC through the `cc` crate), links
        # it to the built cdylib and compares its output with the Rust bridge.
        # Linux must have a compiler (required); elsewhere the test skips with a
        # message if the runner has none.
        run: cargo test --workspace --release --timings --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu
        env:
          ORR_REQUIRE_C_COMPILER: ${{ runner.os == 'Linux' && '1' || '0' }}

      - name: Upload native release build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-native-${{ matrix.name }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Required CollectDodge gameplay core and example
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_games --features collect-dodge --test collect_dodge -- --list > collect-dodge-tests.txt
          test "$(grep -cE '^[[:alnum:]_:]+: test$' collect-dodge-tests.txt)" -eq 17
          cargo test --locked --release -p orr_games --features collect-dodge --test collect_dodge -- --nocapture 2>&1 | tee collect-dodge-tests.log
          grep -F 'test result: ok. 17 passed; 0 failed; 0 ignored;' collect-dodge-tests.log
          cargo run --locked --release -p orr_games --features collect-dodge --example collect_dodge 2>&1 | tee collect-dodge-example.log
          grep -F 'win -> restart -> hazard loss verified; checksum=a7b61c44ba9f26bd' collect-dodge-example.log
          cargo clippy --locked -p orr_games --all-features --all-targets -- -D warnings

      - name: Verify orr_ffi artifacts (cdylib + staticlib + import library)
        # The C ABI tests always build and verify these, even when the runner
        # has no C compiler. Reuse their artifacts instead of rebuilding with
        # a different workspace feature set after the tests.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) artifacts=(liborr_ffi.so liborr_ffi.a) ;;
            macOS) artifacts=(liborr_ffi.dylib liborr_ffi.a) ;;
            Windows) artifacts=(orr_ffi.dll orr_ffi.dll.lib orr_ffi.lib) ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          for artifact in "${artifacts[@]}"; do
            path="target/release/$artifact"
            if [[ ! -f "$path" || ! -s "$path" ]]; then
              echo "::error::Missing or empty FFI artifact: $path"
              exit 1
            fi
          done

      - name: cargo clippy --workspace --all-targets
        # `-D warnings` only on the crates this task owns (`orr_sim`,
        # `orr_session`, `orr_testgame`, `orr_physics`, `orr_physics3d`); other crates may be
        # under concurrent work with their own warning budget.
        run: |
          cargo clippy --workspace --exclude orr_sample --exclude orr_editor --exclude orr_web_gpu --all-targets
          cargo clippy -p orr_sim -p orr_session -p orr_testgame -p orr_physics -p orr_physics3d -p orr_proto -p orr_server -p orr_relay_net -p orr_reflect -p orr_reflect_derive -p orr_edit -p orr_remote -p orr_mcp -p orr_cli -p orr_viewstream -p orr_tui -p orr_net -p orr_web -p orr_games -p orr_wasm_bench --all-targets -- -D warnings

      - name: cargo build -p orr_sim --features hotpatch
        # Desktop-only, off-by-default hot-patch hook (design doc decision
        # #10 — see crates/orr_sim/src/hotpatch.rs): build-only check (not
        # `test`/`run`) that the `subsecond`-backed code path still
        # compiles on every native desktop target. Never build this
        # feature for the wasm32 job below — subsecond has no wasm32
        # code-swap story and the feature must never leak into a release
        # or replay-verification build.
        run: cargo build -p orr_sim --features hotpatch

  sample-build:
    # View-layer demos, audio, and editor. Build and test on Linux and Windows,
    # plus required Linux software-GPU/window tests; separate from the sim jobs.
    name: sample build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Temporary hosted-runner compatibility pin for required bubblewrap mount isolation.
        # ubuntu-latest denied UID mapping; no security setting or isolation assertion is changed.
        # Migrate back to a current compatible runner before 2027-04-17 (22.04 removal):
        # https://github.com/actions/runner-images/issues/14254
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Includes `orr_sample`'s relay end-to-end tests (real loopback QUIC/WebSocket).
      - run: cargo test -p orr_sample -p orr_view -p orr_bridge -p orr_rhi -p orr_render -p orr_editor -p orr_web_gpu --release --timings
      - name: Upload sample release build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-sample-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo clippy -p orr_sample -p orr_view -p orr_bridge -p orr_rhi -p orr_render -p orr_editor -p orr_web_gpu --all-targets
      - name: Authored Arena CPU and standalone CLI regressions
        run: cargo test --locked --release -p orr_sample --features project,input-actions --lib --test project_runtime --test project_cli --test input_actions -- --test-threads=1
      - name: Authored Arena mixed UI CLI rejection regressions
        run: cargo test --locked --release -p orr_sample --features project,input-actions,game-ui --test project_cli -- --test-threads=1
      - name: Saved editor and authored runtime parity
        run: cargo test --locked --release -p orr_editor --features sprites --lib --test deps --test runtime_project --test saved_project --test arena_sprites -- --test-threads=1
      - name: Strict authored Arena mixed-feature Clippy
        run: cargo clippy --locked -p orr_sample --features project,input-actions,game-ui --all-targets -- -D warnings
      - name: Strict saved-project editor Clippy
        run: cargo clippy --locked -p orr_editor --features sprites --all-targets -- -D warnings
      # Real Kira PCM tests stay device-free. Native CPAL is opt-in and gets
      # compile coverage; opening a physical device is not a CI success claim.
      - run: cargo test -p orr_audio --release
      - name: Asset fixture device-free audio and all-tick equality
        run: cargo test --locked -p orr_asset_fixture --features audio --release
      - name: Strict asset fixture audio clippy
        run: cargo clippy --locked -p orr_asset_fixture --features audio --all-targets -- -D warnings
      - run: cargo test -p orr_sample --features audio --release --lib arena_audio
      - run: cargo clippy -p orr_audio --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - run: cargo check -p orr_sample --features audio-native --all-targets
      # GPU readback pixel tests on a software Vulkan adapter (lavapipe), so
      # they really run instead of skipping. Linux only.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - if: runner.os == 'Linux'
        run: cargo test -p orr_render --release --test gpu --test gpu3d
        env:
          ORR_REQUIRE_GPU: "1"
      # HDR is an explicit required acceptance lane, not an optional adapter
      # smoke test. Keep each feature configuration separate: animated-models
      # deliberately excludes the static-only editor test via its cfg.
      - name: Required HDR RHI software-adapter acceptance (1 test)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_rhi --features gpu-tests --test hdr_texture -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Required HDR renderer acceptance (11 tests)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_render --features imported-scene,animation --test hdr -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Required HDR animated editor acceptance (3 tests)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_editor --features animated-models --test yard3d_hdr -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Required HDR static-only editor acceptance (1 test)
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_editor --features models --test yard3d_hdr_static -- --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
      # The editor's GPU tests (viewport pixels read back, the app rendered by
      # egui_kittest's wgpu renderer) on the same software adapter.
      - if: runner.os == 'Linux'
        run: cargo test -p orr_editor --release --test gpu
        env:
          ORR_REQUIRE_GPU: "1"
      - name: Provision repository-hidden authored runtime proof
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Mandatory authored runtime compositor readback
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_sample --features project,input-actions,game-ui --test project_compositor_gpu -- --test-threads=1 --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
          ORR_PROJECT_CAPTURE_DIR: ${{ runner.temp }}/authored-runtime-captures
      - name: Copied standalone Arena binary without source repository
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_sample --features project,input-actions --test project_cli -- --list > "$RUNNER_TEMP/project-cli-tests.txt"
          grep -Fx 'enabled::copied_standalone_binary_runs_without_repository_paths: test' "$RUNNER_TEMP/project-cli-tests.txt"
          cargo test --locked --release -p orr_sample --features project,input-actions --test project_cli enabled::copied_standalone_binary_runs_without_repository_paths -- --exact --test-threads=1 --nocapture
        env:
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
      - name: Mandatory saved-project editor presentation regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p orr_editor --features sprites --test saved_project_gpu --test arena_sprites_gpu -- --test-threads=1 --nocapture
        env:
          ORR_REQUIRE_GPU: "1"
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
          ORR_PROJECT_CAPTURE_DIR: ${{ runner.temp }}/saved-editor-captures
          ORR_SPRITE_CAPTURE_DIR: ${{ runner.temp }}/saved-editor-sprite-captures
      - name: Upload authored runtime and saved editor GPU evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: authored-runtime-gpu-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/authored-runtime-captures
            ${{ runner.temp }}/saved-editor-captures
            ${{ runner.temp }}/saved-editor-sprite-captures
          if-no-files-found: error
          retention-days: 7
      - name: Build trusted feature-disabled Arena export fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          python3 - <<'PY'
          import os, pathlib, tempfile
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as directory:
              probe = pathlib.Path(directory) / 'permission-probe'
              probe.write_bytes(b'permission-denial')
              probe.chmod(0)
              try:
                  try:
                      probe.read_bytes()
                  except PermissionError:
                      pass
                  else:
                      raise AssertionError('export acceptance needs real mode-000 permission denial')
              finally:
                  probe.chmod(0o600)
          PY
          cargo build --locked --release -p orr_sample --no-default-features --bin arena
          cp target/release/arena "$RUNNER_TEMP/arena-default-no-project"
          test -x "$RUNNER_TEMP/arena-default-no-project"
          sha256sum "$RUNNER_TEMP/arena-default-no-project"
          python3 - "$RUNNER_TEMP/arena-default-no-project" <<'PYELF'
          import pathlib, struct, sys
          with pathlib.Path(sys.argv[1]).open('rb') as binary:
              header = binary.read(64)
              assert header[:6] == b'\x7fELF\x02\x01'
              assert struct.unpack_from('<H', header, 18)[0] == 62
              table = struct.unpack_from('<Q', header, 32)[0]
              size, count = struct.unpack_from('<HH', header, 54)
              assert size >= 56 and count > 0
              interpreters = []
              for index in range(count):
                  binary.seek(table + index * size)
                  entry = binary.read(56)
                  if struct.unpack_from('<I', entry)[0] == 3:
                      offset = struct.unpack_from('<Q', entry, 8)[0]
                      length = struct.unpack_from('<Q', entry, 32)[0]
                      assert 1 < length <= 4096
                      binary.seek(offset)
                      interpreter = binary.read(length)
                      assert interpreter.startswith(b'/') and interpreter.endswith(b'\0')
                      interpreters.append(pathlib.Path(interpreter[:-1].decode()))
              assert len(interpreters) == 1 and interpreters[0].is_file()
          PYELF
      - name: Required export admission and transaction tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --lib project_export:: -- --list > "$RUNNER_TEMP/export-unit-list.txt"
          test "$(grep -cE '^project_export::[[:alnum:]_:]+: test$' "$RUNNER_TEMP/export-unit-list.txt")" -eq 25
          cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --lib project_export:: -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/export-unit-tests.log"
          grep -F 'test result: ok. 25 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/export-unit-tests.log"
          if grep -E 'SKIP|source-hiding acceptance not requested' "$RUNNER_TEMP/export-unit-tests.log"; then
            echo '::error::A required export unit path was skipped'
            exit 1
          fi
      - name: Mandatory exported-folder CLI isolation and GPU acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ORR_EXPORT_DEFAULT_RUNTIME"
          cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --test project_export -- --list > "$RUNNER_TEMP/export-integration-list.txt"
          test "$(grep -cE '^[[:alnum:]_]+: test$' "$RUNNER_TEMP/export-integration-list.txt")" -eq 17
          cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --test project_export -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/export-integration-tests.log"
          grep -F 'test result: ok. 17 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/export-integration-tests.log"
          if grep -E 'SKIP|source-hiding acceptance not requested' "$RUNNER_TEMP/export-integration-tests.log"; then
            echo '::error::A required export acceptance path was skipped'
            exit 1
          fi
        env:
          ORR_EXPORT_DEFAULT_RUNTIME: ${{ runner.temp }}/arena-default-no-project
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
          ORR_EXPORT_HIDE_ROOT: ${{ github.workspace }}
          ORR_REQUIRE_GPU: "1"
          ORR_PROJECT_CAPTURE_DIR: ${{ runner.temp }}/exported-arena-captures
      - name: Strict mixed export feature Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p orr_sample --features project-export,input-actions,game-ui --all-targets -- -D warnings
      - name: Upload exported-folder acceptance evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: exported-arena-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/exported-arena-captures
            ${{ runner.temp }}/export-unit-list.txt
            ${{ runner.temp }}/export-unit-tests.log
            ${{ runner.temp }}/export-integration-list.txt
            ${{ runner.temp }}/export-integration-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Build independent UI-free authored Arena fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/arena-default-no-project"
          cargo build --locked --release -p orr_sample --no-default-features --features project,input-actions --bin arena
          cp target/release/arena "$RUNNER_TEMP/arena-project-without-ui"
          test -x "$RUNNER_TEMP/arena-project-without-ui"
          sha256sum "$RUNNER_TEMP/arena-default-no-project" "$RUNNER_TEMP/arena-project-without-ui"
      - name: Required UI-free authored restart and rejection tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for specification in project_restart_seed:2 project_cli:6 project_ui_export:1; do
            target=${specification%:*}
            count=${specification#*:}
            cargo test --locked --release -p orr_sample --no-default-features --features project-export,input-actions --test "$target" -- --list > "$RUNNER_TEMP/no-ui-$target-list.txt"
            test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/no-ui-$target-list.txt")" -eq "$count"
            cargo test --locked --release -p orr_sample --no-default-features --features project-export,input-actions --test "$target" -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/no-ui-$target.log"
            grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/no-ui-$target.log"
            if grep -Ei 'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested' "$RUNNER_TEMP/no-ui-$target.log"; then exit 1; fi
          done
      - name: Mandatory authored UI admission restart composition and export
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ORR_EXPORT_DEFAULT_RUNTIME"
          test -x "$ORR_PROJECT_ONLY_RUNTIME"
          mkdir -p "$ORR_PROJECT_UI_CAPTURE_DIR"
          cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --lib -- --list > "$RUNNER_TEMP/authored-ui-library-list.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/authored-ui-library-list.txt")" -eq 73
          cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --lib -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/authored-ui-library.log"
          grep -F 'test result: ok. 73 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/authored-ui-library.log"
          if grep -Ei 'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested' "$RUNNER_TEMP/authored-ui-library.log"; then exit 1; fi
          for specification in project_restart_seed:3 project_ui_boundaries:1 project_ui_compositor:1 project_ui_export:3 project_cli:5; do
            target=${specification%:*}
            count=${specification#*:}
            cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --test "$target" -- --list > "$RUNNER_TEMP/authored-ui-$target-list.txt"
            test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/authored-ui-$target-list.txt")" -eq "$count"
            cargo test --locked --release -p orr_sample --features project-export,input-actions,game-ui --test "$target" -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/authored-ui-$target.log"
            grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "$RUNNER_TEMP/authored-ui-$target.log"
            if grep -Ei 'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested' "$RUNNER_TEMP/authored-ui-$target.log"; then exit 1; fi
          done
        env:
          ORR_EXPORT_DEFAULT_RUNTIME: ${{ runner.temp }}/arena-default-no-project
          ORR_PROJECT_ONLY_RUNTIME: ${{ runner.temp }}/arena-project-without-ui
          ORR_REQUIRE_PROJECT_ONLY_RUNTIME: "1"
          ORR_REQUIRE_PROJECT_ISOLATION: "1"
          ORR_EXPORT_HIDE_ROOT: ${{ github.workspace }}
          ORR_REQUIRE_GPU: "1"
          ORR_PROJECT_UI_CAPTURE_DIR: ${{ runner.temp }}/authored-ui-captures
      - name: Required independent editor UI opt-in boundaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for features in sprites project-ui sprites,orr_sample/game-ui; do
            label=${features//\//-}
            cargo test --locked --release -p orr_editor --no-default-features --features "$features" --test project_ui -- --list > "$RUNNER_TEMP/editor-ui-$label-list.txt"
            test "$(grep -cE '^[[:alnum:]_:]+: test$' "$RUNNER_TEMP/editor-ui-$label-list.txt")" -eq 1
            cargo test --locked --release -p orr_editor --no-default-features --features "$features" --test project_ui -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/editor-ui-$label.log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/editor-ui-$label.log"

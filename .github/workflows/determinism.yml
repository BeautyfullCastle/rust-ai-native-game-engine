      - name: Build and pin exact Collect creator runtime exporter and progress harness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=${ORR_NEW_COLLECT_EVIDENCE:?mandatory external evidence root}
          export TMPDIR="$ROOT/temporary" XDG_RUNTIME_DIR="$ROOT/xdg-runtime"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          python3 - <<'PYPATHS'
          import os, pathlib, tempfile
          hidden = pathlib.Path.cwd().resolve().parent
          target = pathlib.Path(os.environ.get('CARGO_TARGET_DIR', 'target')).resolve()
          evidence = pathlib.Path(os.environ['ORR_NEW_COLLECT_EVIDENCE']).resolve()
          temporary = pathlib.Path(tempfile.gettempdir()).resolve()
          assert target.is_relative_to(hidden), 'source-hidden root must cover original build outputs'
          assert not evidence.is_relative_to(hidden) and not temporary.is_relative_to(hidden)
          assert evidence.is_relative_to(pathlib.Path('/tmp').resolve()) and temporary.is_relative_to(evidence)
          PYPATHS
          mkdir "$ROOT/tools"
          # Copy each artifact immediately after its matching Cargo build, before another feature profile can overwrite a normal binary path.
          for lane in creator runtime exporter progress-harness; do
            case "$lane" in
              creator) name=orr_new_arena; features=project-create,collect-dodge ;;
              runtime) name=collect_dodge; features=collect-sprites,collect-progress ;;
              exporter) name=orr_export_collect; features=project-export,collect-sprites,collect-progress ;;
              progress-harness) name=orr_sample; features=collect-sprites,collect-progress ;;
            esac
            if [[ "$lane" == progress-harness ]]; then
              cargo test --locked --release -p orr_sample --no-default-features --features "$features" --lib --no-run --message-format=json > "$ROOT/$lane-build.jsonl" 2> "$ROOT/$lane-build.stderr"
            else
              cargo build --locked --release -p orr_sample --no-default-features --features "$features" --bin "$name" --message-format=json > "$ROOT/$lane-build.jsonl" 2> "$ROOT/$lane-build.stderr"
            fi
            python3 - "$lane" "$name" "$features" <<'PYPIN'
          import hashlib, json, os, pathlib, shutil, sys
          lane, name, requested = sys.argv[1:]
          root = pathlib.Path(os.environ['ORR_NEW_COLLECT_EVIDENCE']).resolve()
          manifest = (pathlib.Path.cwd() / 'crates/orr_sample/Cargo.toml').resolve()
          is_test = lane == 'progress-harness'; kind = 'lib' if is_test else 'bin'
          records = [json.loads(line) for line in (root / f'{lane}-build.jsonl').read_text().splitlines() if line.strip()]
          found = [row for row in records if row.get('reason') == 'compiler-artifact'
                   and pathlib.Path(row['manifest_path']).resolve() == manifest
                   and row['target']['name'] == name and row['target']['kind'] == [kind]
                   and row['profile']['test'] is is_test and row.get('executable')]
          assert len(found) == 1, (lane, found)
          item = found[0]
          expected = set(requested.split(',')) | {'collect-dodge', 'project', 'sprites'}
          assert set(item['features']) == expected, (lane, item['features'], sorted(expected))
          source = pathlib.Path(item['executable']).resolve(strict=True)
          assert source.is_relative_to(pathlib.Path.cwd().resolve().parent)
          assert os.access(source, os.X_OK), source
          copy = root / 'tools' / ('progress-test-harness' if is_test else name)
          assert not copy.exists()
          shutil.copy2(source, copy)
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == hashlib.sha256(copy.read_bytes()).hexdigest() and os.access(copy, os.X_OK)
          (root / f'{lane}-artifact.json').write_text(json.dumps({'lane':lane,'source':str(source),'copy':str(copy),'sha256':digest,'manifest':str(manifest),'package_id':item['package_id'],'target':item['target'],'features':item['features'],'requested_features':requested,'profile':item['profile']},indent=2)+'\n')
          PYPIN
          done
          python3 - <<'PYMANIFEST'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['ORR_NEW_COLLECT_EVIDENCE']).resolve()
          entries = [json.loads((root / f'{lane}-artifact.json').read_text()) for lane in ['creator','runtime','exporter','progress-harness']]
          (root / 'tools.sha256').write_text(''.join(f"{item['sha256']}  {item['copy']}\n" for item in entries))
          (root / 'artifacts.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'artifacts':entries},indent=2)+'\n')
          PYMANIFEST
          sha256sum --check "$ROOT/tools.sha256"
          "$ROOT/tools/progress-test-harness" --list > "$ROOT/pinned-library-list.txt"
          "$ROOT/tools/progress-test-harness" --ignored --list > "$ROOT/pinned-library-ignored.txt"
          python3 - "$ROOT" <<'PYHOOKS'
          import json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          expected = json.loads((root / 'expected-inventories.json').read_text())
          def names(file): return sorted(re.findall(r'^([A-Za-z0-9_:]+): test$', (root/file).read_text(), re.M))
          assert names('pinned-library-list.txt') == expected['minimal-progress-library']
          assert len(names('pinned-library-list.txt')) == 64
          assert names('pinned-library-ignored.txt') == expected['ignored-library-hooks']
          PYHOOKS
        env:
          ORR_NEW_COLLECT_EVIDENCE: /tmp/orr-new-collect-${{ github.run_id }}-${{ github.run_attempt }}

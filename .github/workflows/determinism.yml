                  for key in ["ORR_MODEL_SCREENSHOT", "ORR_SKINNED_CAPTURE_DIR", "ORR_PARTICLE_CAPTURE_DIR", "ORR_PARTICLE_SHOWCASE_CAPTURE_DIR"]:
                      env.pop(key, None)
                  env.update(extra_env or {})
                  result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, text=True, env=env)

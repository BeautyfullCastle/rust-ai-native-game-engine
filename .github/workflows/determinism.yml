          import pathlib, re, sys
          text = pathlib.Path(sys.argv[3]).read_text()
          rows = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', text, re.M)
          parent = (sys.argv[1], '0', sys.argv[2])
          if sys.argv[4] == 'ui-library':
              # The real progress concurrency test spawns exactly two inherited-stdout children.
              assert rows == [('1', '0', '0'), ('1', '0', '0'), parent], rows
          elif sys.argv[4] == "package":
              assert text.count("test result:") == 2, "unexpected or malformed package summary"
              assert rows == [("1", "0", "0"), parent], rows
          else:
              assert rows == [parent], rows
          assert not re.search(r'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested', text, re.I)
          PYRESULT
          }
          check_result ui-library 137 2 cargo test --locked --release -p orr_sample --no-default-features --features collect-ui,collect-progress,collect-sprites,project-export --lib
          check_result editor-panel 6 0 cargo test --locked --release -p orr_editor --no-default-features --features collect-ui --lib collect_ui_panel
          unset ORR_PACKAGE_FIFO_TEST_ROOT
          check_result package 29 0 cargo test --locked --release -p orr_package --lib
        env:

          def audit(groups, timeout=10):
              deadline = time.monotonic() + timeout
              reaped = []
              observed = []
              while True:
                  remaining = []
                  for original in groups:
                      leader = identity(original["pid"])
                      if leader is not None and leader["starttime"] != original["starttime"]:
                          raise RuntimeError("owned leader PID was reused; no signal sent to that group")
                      members = group_members(original["pgid"], deadline)
                      if any(m["sid"] != original["sid"] or m["starttime"] < original["starttime"] for m in members):
                          raise RuntimeError("unexpected process group identity; no signal sent to that group")
                      if members:
                          if len(observed) < 16:
                              observed.append({"leader": original, "members": members})
                          remaining.extend(members)
                          try:
                              os.killpg(original["pgid"], signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          # Signal before waiting: an unreaped owned member keeps the
                          # original group ID reserved while the signal is issued.
                          reaped.extend(reap_owned(members))
                  if not remaining:
                      return {"verified_owned_process_groups_absent": True,
                              "reaped_adopted_children": reaped, "cleanup_observations": observed,
                              "remaining_owned_group_members": []}
                  if time.monotonic() >= deadline:
                      raise RuntimeError(f"owned groups still observable after bounded cleanup: {remaining!r}")
                  time.sleep(0.01)
          
          def signal_owned_group(original):
              leader = identity(original["pid"])
              require(leader is None or leader["starttime"] == original["starttime"], "owned leader PID reused; no signal")
              members = group_members(original["pgid"], time.monotonic() + 10)
              require(not any(m["sid"] != original["sid"] or m["starttime"] < original["starttime"] for m in members), "unexpected owned group identity; no signal")
              if members:
                  try:
                      os.killpg(original["pgid"], signal.SIGKILL)
                  except ProcessLookupError:
                      pass
          

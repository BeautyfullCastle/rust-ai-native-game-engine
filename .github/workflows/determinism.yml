          JSONINVENTORY
          check_result() {
            local label=$1 passed=$2 ignored=$3
            shift 3
            "$@" -- --list > "$ROOT/$label-list.txt"
            "$@" -- --ignored --list > "$ROOT/$label-ignored.txt"
            python3 - "$ROOT" "$label" "$passed" "$ignored" <<'PYLIST'
          import json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1]); label = sys.argv[2]
          expected = json.loads((root / 'expected-inventories.json').read_text())
          def names(path):
              return sorted(re.findall(r'^([A-Za-z0-9_:]+): test$', path.read_text(), re.M))
          actual = names(root / f'{label}-list.txt')
          ignored = names(root / f'{label}-ignored.txt')
          assert actual == sorted(expected[label]), (label, actual)
          assert len(actual) == int(sys.argv[3]) + int(sys.argv[4])
          assert ignored == (expected['ignored-library-hooks'] if int(sys.argv[4]) else []), ignored
          PYLIST
            "$@" -- --nocapture 2>&1 | tee "$ROOT/$label.log"
            python3 - "$passed" "$ignored" "$ROOT/$label.log" "$label" <<'PYRESULT'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[3]).read_text()
          rows = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', text, re.M)
          parent = (sys.argv[1], '0', sys.argv[2])
          if sys.argv[4] == 'ui-library':
              # The real progress concurrency test spawns exactly two inherited-stdout children.
              assert rows == [('1', '0', '0'), ('1', '0', '0'), parent], rows
          elif sys.argv[4] == "package":
              assert text.count("test result:") == 2, "unexpected or malformed package summary"
              assert rows == [("1", "0", "0"), parent], rows
          else:
              assert rows == [parent], rows
          assert not re.search(r'SKIP:|negative skipped|without capture|direct relocated execution used|source-hiding acceptance not requested', text, re.I)
          PYRESULT
          }
          check_result ui-library 162 3 cargo test --locked --release -p orr_sample --no-default-features --features collect-ui,collect-progress,collect-sprites,project-export --lib
          check_result editor-panel 6 0 cargo test --locked --release -p orr_editor --no-default-features --features collect-ui --lib collect_ui_panel
          unset ORR_PACKAGE_FIFO_TEST_ROOT
          check_result package 31 0 cargo test --locked --release -p orr_package --lib
        env:
          ORR_COLLECT_UI_EVIDENCE: /tmp/orr-collect-ui-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and pin separate no-UI runtime UI tools and exact libtest
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=${ORR_COLLECT_UI_EVIDENCE:?mandatory external evidence root}
          export TMPDIR="$ROOT/temporary" XDG_RUNTIME_DIR="$ROOT/xdg-runtime"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v bwrap
          bwrap --ro-bind / / -- /bin/true
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          python3 - <<'PYPATHS'
          import os, pathlib, tempfile
          hidden = pathlib.Path.cwd().resolve().parent
          target = pathlib.Path(os.environ.get('CARGO_TARGET_DIR', 'target')).resolve()
          evidence = pathlib.Path(os.environ['ORR_COLLECT_UI_EVIDENCE']).resolve()
          temporary = pathlib.Path(tempfile.gettempdir()).resolve()
          assert target.is_relative_to(hidden), 'source-hidden root must cover original build outputs'
          assert not evidence.is_relative_to(hidden) and not temporary.is_relative_to(hidden)
          assert evidence.is_relative_to(pathlib.Path('/tmp').resolve()) and temporary.is_relative_to(evidence)
          PYPATHS
          mkdir "$ROOT/tools"
          # Copy each artifact immediately after its matching Cargo build, before another feature profile can overwrite a normal binary path.
          for lane in no-ui-runtime runtime exporter progress-harness; do
            case "$lane" in
              no-ui-runtime) name=collect_dodge; features=collect-dodge ;;
              runtime) name=collect_dodge; features=collect-ui,collect-progress,collect-sprites,project-export ;;
              exporter) name=orr_export_collect; features=collect-ui,collect-progress,collect-sprites,project-export ;;
              progress-harness) name=orr_sample; features=collect-ui,collect-progress,collect-sprites,project-export ;;
            esac
            if [[ "$lane" == progress-harness ]]; then
              cargo test --locked --release -p orr_sample --no-default-features --features "$features" --lib --no-run --message-format=json > "$ROOT/$lane-build.jsonl" 2> "$ROOT/$lane-build.stderr"
            else
              cargo build --locked --release -p orr_sample --no-default-features --features "$features" --bin "$name" --message-format=json > "$ROOT/$lane-build.jsonl" 2> "$ROOT/$lane-build.stderr"
            fi
            python3 - "$lane" "$name" "$features" <<'PYPIN'
          import hashlib, json, os, pathlib, shutil, sys
          lane, name, requested = sys.argv[1:]
          root = pathlib.Path(os.environ['ORR_COLLECT_UI_EVIDENCE']).resolve()
          manifest = (pathlib.Path.cwd() / 'crates/orr_sample/Cargo.toml').resolve()
          is_test = lane == 'progress-harness'; kind = 'lib' if is_test else 'bin'
          records = [json.loads(line) for line in (root / f'{lane}-build.jsonl').read_text().splitlines() if line.strip()]
          found = [row for row in records if row.get('reason') == 'compiler-artifact'
                   and pathlib.Path(row['manifest_path']).resolve() == manifest
                   and row['target']['name'] == name and row['target']['kind'] == [kind]
                   and row['profile']['test'] is is_test and row.get('executable')]
          assert len(found) == 1, (lane, found)
          item = found[0]
          expected = {'collect-dodge', 'project', 'sprites'} if lane == 'no-ui-runtime' else {'collect-ui','collect-progress','collect-sprites','project-export','collect-dodge','project','sprites','game-ui','input-actions'}
          assert set(item['features']) == expected, (lane, item['features'], sorted(expected))
          source = pathlib.Path(item['executable']).resolve(strict=True)
          assert source.is_relative_to(pathlib.Path.cwd().resolve().parent)
          assert os.access(source, os.X_OK), source
          copy = root / 'tools' / {'no-ui-runtime':'no-ui-collect','runtime':'collect_dodge','exporter':'orr_export_collect','progress-harness':'progress-test-harness'}[lane]
          assert not copy.exists()
          shutil.copy2(source, copy)
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == hashlib.sha256(copy.read_bytes()).hexdigest() and os.access(copy, os.X_OK)
          (root / f'{lane}-artifact.json').write_text(json.dumps({'lane':lane,'source':str(source),'copy':str(copy),'sha256':digest,'manifest':str(manifest),'package_id':item['package_id'],'target':item['target'],'features':item['features'],'requested_features':requested,'profile':item['profile']},indent=2)+'\n')
          PYPIN
          done
          python3 - <<'PYMANIFEST'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['ORR_COLLECT_UI_EVIDENCE']).resolve()
          entries = [json.loads((root / f'{lane}-artifact.json').read_text()) for lane in ['no-ui-runtime','runtime','exporter','progress-harness']]
          assert len({item['copy'] for item in entries}) == 4
          assert len({(pathlib.Path(item['copy']).stat().st_dev,pathlib.Path(item['copy']).stat().st_ino) for item in entries}) == 4
          assert entries[0]['sha256'] != entries[1]['sha256'], 'minimal no-UI and UI runtime must be separate feature-correct builds'
          (root / 'tools.sha256').write_text(''.join(f"{item['sha256']}  {item['copy']}\n" for item in entries))
          (root / 'artifacts.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'artifacts':entries},indent=2)+'\n')
          PYMANIFEST
          sha256sum --check "$ROOT/tools.sha256"
          "$ROOT/tools/progress-test-harness" --list > "$ROOT/pinned-library-list.txt"
          "$ROOT/tools/progress-test-harness" --ignored --list > "$ROOT/pinned-library-ignored.txt"
          python3 - "$ROOT" <<'PYHOOKS'
          import json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          expected = json.loads((root / 'expected-inventories.json').read_text())
          def names(file): return sorted(re.findall(r'^([A-Za-z0-9_:]+): test$', (root/file).read_text(), re.M))
          assert names('pinned-library-list.txt') == expected['ui-library']
          assert len(names('pinned-library-list.txt')) == 165
          assert names('pinned-library-ignored.txt') == expected['ignored-library-hooks']
          PYHOOKS
        env:
          ORR_COLLECT_UI_EVIDENCE: /tmp/orr-collect-ui-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mandatory authored Collect UI GPU export Restart and Best relaunch
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=${ORR_COLLECT_UI_EVIDENCE:?mandatory external evidence root}
          export TMPDIR="$ROOT/temporary" XDG_RUNTIME_DIR="$ROOT/xdg-runtime"
          export ORR_COLLECT_NO_UI_RUNTIME="$ROOT/tools/no-ui-collect"
          export ORR_COLLECT_RUNTIME="$ROOT/tools/collect_dodge"
          export ORR_COLLECT_EXPORTER="$ROOT/tools/orr_export_collect"
          export ORR_PROGRESS_TEST_BIN="$ROOT/tools/progress-test-harness"
          export ORR_EXPORT_HIDE_ROOT="$(dirname "$(pwd -P)")"
          export ORR_REQUIRE_GPU=1 ORR_REQUIRE_PROJECT_ISOLATION=1
          export ORR_COLLECT_CAPTURES="$ROOT/captures"
          mkdir "$ORR_COLLECT_CAPTURES"
          sha256sum --check "$ROOT/tools.sha256"
          python3 - <<'PYPATHS'
          import os, pathlib
          keys=['ORR_COLLECT_NO_UI_RUNTIME','ORR_COLLECT_RUNTIME','ORR_COLLECT_EXPORTER','ORR_PROGRESS_TEST_BIN']
          paths=[pathlib.Path(os.environ[k]).resolve(strict=True) for k in keys]
          assert len(set(paths)) == 4
          hidden=pathlib.Path(os.environ['ORR_EXPORT_HIDE_ROOT']).resolve(strict=True)
          assert all(not p.is_relative_to(hidden) and os.access(p,os.X_OK) for p in paths)
          PYPATHS
          name=collect_authored_ui_export_gpu_workflow
          cargo test --locked --release -p orr_sample --no-default-features --features collect-ui,collect-progress,collect-sprites,project-export --test collect_project_export "$name" -- --ignored --exact --list > "$ROOT/ui-export-list.txt"
          test "$(grep -cE '^[[:alnum:]_:]+: test$' "$ROOT/ui-export-list.txt")" -eq 1
          grep -Fx "$name: test" "$ROOT/ui-export-list.txt"
          cargo test --locked --release -p orr_sample --no-default-features --features collect-ui,collect-progress,collect-sprites,project-export --test collect_project_export "$name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$ROOT/ui-export.log"
          python3 - "$ROOT/ui-export.log" <<'PYRESULT'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text()

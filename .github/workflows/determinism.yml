                      'static_skinned_batches_occlude_in_both_orders_as_animated_vertices_cross_plane'],
            'selected': ['bounded_batch_and_aggregate_draw_limits_accept_boundary_and_reject_without_effects',
                         'external_static_trs_composes_mirrored_sheared_nodes_and_preserves_standalone',

name: Collect physical key capture acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-input-capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_COLLECT_CAPTURE_CI: ${{ github.workspace }}/target/collect-input-capture-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed evidence checker self-tests
        run: python -m unittest discover -s tools -p test_collect_input_capture_gate.py
      - name: Compiled capture inventories, captured-map producer, production Keys and old regressions
        run: python tools/collect_input_capture_gate.py contracts --evidence "${{ env.ORR_COLLECT_CAPTURE_CI }}"
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_COLLECT_CAPTURE_CI/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_COLLECT_CAPTURE_CI/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/collect-controls-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_COLLECT_CAPTURE_CI/vulkan-driver.log"
      - name: Explicit capture tool and actual main EditorApp software GPU acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: python tools/collect_input_capture_gate.py gpu --evidence "${{ env.ORR_COLLECT_CAPTURE_CI }}"
      - name: Preserve all counts, failures, maps, receipts and full editor captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-input-capture-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_COLLECT_CAPTURE_CI }}
          if-no-files-found: error

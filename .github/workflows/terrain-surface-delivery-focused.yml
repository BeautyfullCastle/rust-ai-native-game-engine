name: terrain-surface-delivery focused Linux CI
# Publication waits for final product review and exact remote PR/head handoff.
# Added by the 2026-11-03 request for minimal actual remote CI.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/terrain-surface-delivery-20261103]
permissions:
  contents: read
concurrency:
  group: terrain-surface-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terrain-surface-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      WGPU_BACKEND: gl
      ORR_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          evidence=$(mktemp -d "$RUNNER_TEMP/terrain-surface-evidence.XXXXXXXX")
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "TERRAIN_SURFACE_CAPTURE_DIR=$evidence/editor" >> "$GITHUB_ENV"
          echo "ORR_NAV_SURFACE_EVIDENCE_DIR=$evidence/delivery" >> "$GITHUB_ENV"
          echo "ORR_NAV_SURFACE_AUTHORED_SCENE=$evidence/editor/authored/navigation.scene.yaml" >> "$GITHUB_ENV"
          echo "ORR_NAV_SURFACE_PLAYER_BIN=$GITHUB_WORKSPACE/target/release/navigation_surface_player" >> "$GITHUB_ENV"
          echo "ORR_NAV_SURFACE_EXPORT_BIN=$GITHUB_WORKSPACE/target/release/navigation_surface_export" >> "$GITHUB_ENV"
          export EVIDENCE="$evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build and software rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/terrain-surface-delivery-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Run focused feature contracts and actual UI
        shell: python {0}
        run: |
          import hashlib, json, os, re, runpy
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          editor_gpu = 'terrain_surface::tests::actual_full_app_gpu_apply_undo_redo_save_hidden_png_reopen_edit_play_and_agent'
          suites = [
              ('codec', 'orr_terrain_view', 'surface', ['--lib', 'surface::tests::'], 9, 0),
              ('bundle', 'orr_navigation_view', 'authored-surface-bundle', ['--lib', 'surface_bundle::manifest::tests::'], 8, 0),
              ('player', 'orr_navigation_view', 'authored-surface-bundle', ['--test', 'surface_delivery'], 2, 0),
              ('editor-cpu', 'orr_editor', 'terrain-surface,navigation-export', ['--lib', 'terrain_surface::tests::'], 10, 1),
              ('editor-ui', 'orr_editor', 'terrain-surface,navigation-export', ['--lib', editor_gpu], 1, 0),
              ('delivery-ui', 'orr_navigation_view', 'authored-surface-bundle,gpu', ['--test', 'surface_delivery', 'actual::relocated_actual_surface_bundle_capture_and_refusals'], 1, 0),
          ]
          for label, package, features, args, count, ignored in suites:
              if label == 'delivery-ui':
                  authored = Path(os.environ['ORR_NAV_SURFACE_AUTHORED_SCENE'])
                  if not authored.is_file():
                      raise RuntimeError('Missing exact Editor-authored delivery input')
                  helpers['run_logged'](['cargo', 'build', '--locked', '--release', '-p', 'orr_navigation_view', '--features', 'authored-surface-bundle,gpu', '--bin', 'navigation_surface_player', '--bin', 'navigation_surface_export'], evidence / 'binaries.log')
              flags = ['--format=pretty', '--color=never', '--test-threads=1']
              if label.endswith('-ui'):
                  flags += ['--ignored', '--exact', '--show-output']
              command = ['cargo', 'test', '--locked', '--release', '-p', package, '--features', features] + args + ['--'] + flags
              output = helpers['run_logged'](command, evidence / (label + '.log'))
              normalized = output.replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(normalized)
              cases = helpers['CASE'].findall(normalized)
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, ignored, 0):
                  raise RuntimeError(f'{label}: unexpected passing/ignored test census')
              passed = [(name, status) for name, status in cases if status == 'ok']
              skipped = re.findall(r'^test (\S+) \.\.\. ignored(?:,.*)?$', normalized, re.MULTILINE)
              if len(passed) != count or len({name for name, status in passed}) != count or skipped != ([editor_gpu] if ignored else []):
                  raise RuntimeError(f'{label}: missing, duplicate or unexpected skipped cases')
              if re.findall(r'^running (\d+) tests?$', normalized, re.MULTILINE) != [str(count + ignored)]:
                  raise RuntimeError(f'{label}: inconsistent executed test count')
          # Count direct capture files only: nested bundle fixtures are not captures.
          editor = Path(os.environ['TERRAIN_SURFACE_CAPTURE_DIR'])
          delivery = Path(os.environ['ORR_NAV_SURFACE_EVIDENCE_DIR'])
          editor_names = ['01-checker-edit', '02-applied-edit', '03-undo-edit', '04-redo-edit', '05-reopened-edit', '06-moving-play']
          delivery_names = ['source-0', 'source-48', 'relocated-0', 'relocated-48']
          for root, names in [(editor, editor_names), (delivery, delivery_names)]:
              if {p.name for p in root.glob('*.png')} != {name + '.png' for name in names}:
                  raise RuntimeError(f'{root.name}: unexpected direct capture census')
              for name in names:
                  data = (root / (name + '.png')).read_bytes()
                  if len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                      raise RuntimeError(f'Invalid capture: {name}')
                  json.loads((root / (name + '.json')).read_text())
          adapter = json.loads((editor / 'adapter.json').read_text())
          if not adapter.get('harness_adapter') or adapter.get('native_window') is not False:
              raise RuntimeError('Missing offscreen Editor adapter evidence')
          handoff = json.loads((delivery / 'editor-handoff.json').read_text())
          if handoff.get('saved_scene') != os.environ['ORR_NAV_SURFACE_AUTHORED_SCENE'] or handoff.get('editor_originals_preserved') is not True:
              raise RuntimeError('Wrong or missing Editor handoff')
          authored = editor / 'authored'
          for path, key in [('navigation.scene.yaml', 'scene_sha256'), (handoff['terrain_relative'], 'terrain_sha256'), (handoff['terrain_relative'] + '.surface.json', 'surface_sha256')]:
              if hashlib.sha256((authored / path).read_bytes()).hexdigest() != handoff[key]:
                  raise RuntimeError(f'Changed Editor handoff: {path}')
          proof = json.loads((delivery / 'frame-proof.json').read_text())
          trajectory = json.loads((delivery / 'trajectory.json').read_text())
          if proof['ticks'] != 48 or len(trajectory) != 49:
              raise RuntimeError('Incomplete CPU Frame trajectory')
          for name in ['initial', 'final']:
              if hashlib.sha256((delivery / (name + '.frame')).read_bytes()).hexdigest() != proof[name + '_frame_sha256']:
                  raise RuntimeError('Wrong CPU Frame receipt')
          for tick in [0, 48]:
              pixels = json.loads((delivery / f'pixels-{tick}.json').read_text())
              if len(pixels['authored_color_counts']) != 4 or min(pixels['authored_color_counts']) <= 1000 or pixels['cyan_route_pixels'] <= 10 or pixels['orange_agent_pixels'] <= 30:
                  raise RuntimeError('Missing authored colors, route or agent')
              for prefix in ['source', 'relocated']:
                  receipt = json.loads((delivery / f'{prefix}-{tick}.json').read_text())
                  if receipt['tick'] != tick or receipt['checksum'] != trajectory[tick] or receipt['restart_checked'] is not (prefix == 'relocated') or receipt['capture']['offscreen'] is not True or not receipt['capture']['adapter']:
                      raise RuntimeError('Incomplete actual-binary checksum/restart/capture receipt')
          (delivery / 'acceptance.txt').read_text()
          binaries = [Path(os.environ[key]) for key in ['ORR_NAV_SURFACE_PLAYER_BIN', 'ORR_NAV_SURFACE_EXPORT_BIN']]
          (evidence / 'binaries.sha256').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + str(path) + '\n' for path in binaries))
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'executed_test_counts': {suite[0]: suite[4] for suite in suites}, 'full_workspace': False}, indent=2))
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-surface-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: error

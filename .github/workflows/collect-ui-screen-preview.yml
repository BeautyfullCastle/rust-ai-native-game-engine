name: Collect UI screen preview acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-ui-screen-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_COLLECT_PREVIEW_CI: ${{ github.workspace }}/target/collect-ui-preview-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused preview state and unchanged panel and runtime contracts
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_PREVIEW_CI"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Exact core names prevent substring overlap with app tests. The app
          # CPU and GPU gates below remain independently mandatory.
          core_names = {
              'collect_ui_preview::tests::accepted_unsaved_document_and_undo_rebuild_context',
              'collect_ui_preview::tests::admission_uses_cloned_bytes_without_reading_paths',
              'collect_ui_preview::tests::all_actions_are_observed_without_changing_selected_screen_or_document',
              'collect_ui_preview::tests::all_four_screens_render_authored_labels_and_explicit_selection',
              'collect_ui_preview::tests::authored_parent_clipping_and_overlap_use_production_hit_testing',
              'collect_ui_preview::tests::bounded_viewport_overrides_external_size_and_scale',
              'collect_ui_preview::tests::cancellation_resize_screen_and_document_change_drop_pointer_capture',
              'collect_ui_preview::tests::changed_valid_font_rebuilds_context_even_for_identical_document',
              'collect_ui_preview::tests::close_releases_active_context_and_reopens_retained_admission',
              'collect_ui_preview::tests::invalid_current_document_fails_closed_until_corrected',
              'collect_ui_preview::tests::invalid_font_admission_drops_previous_preview_and_cannot_reopen',
              'collect_ui_preview::tests::invalid_position_preview_is_atomic_and_accepted_changes_replace_candidate',
              'collect_ui_preview::tests::readmission_at_new_path_or_epoch_resets_settings_and_closes',
              'collect_ui_preview::tests::released_position_preview_keeps_admission_until_apply_and_cancel_restores',
              'collect_ui_preview::tests::same_identity_and_document_keep_active_context',
              'collect_ui_preview::tests::scene_epoch_and_missing_panel_clear_all_admission',
              'collect_ui_preview::tests::terminal_variants_and_playing_phase_use_bounded_synthetic_hud',
              'collect_ui_preview::tests::viewport_and_sample_bounds_are_atomic_and_font_checked',
          }
          base = ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features",
                  "--features", "collect-ui", "--lib"]
          inventory = h["run_logged"](base + ["--", "--list", "--format=pretty", "--color=never"],
                                       evidence / "compiled-libtest-inventory.log")
          compiled_core = [line.removesuffix(": test") for line in inventory.splitlines()
                           if line.startswith("collect_ui_preview::tests::") and line.endswith(": test")]
          if len(compiled_core) != 18 or set(compiled_core) != core_names:
              raise RuntimeError("Compiled core preview inventory differs from the 18 mandatory cases")
          output = h["run_logged"](
              base + ["collect_ui_preview::tests::", "--", "--skip", "app::collect_ui_preview::",
                      "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "core-preview-batch.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          cases = h["CASE"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (18, 0, 0, 0)
                  or len(cases) != 18 or set(cases) != {(name, "ok") for name in core_names}):
              raise RuntimeError("Mandatory exact 18-case preview batch did not pass")
          for package, suite, count in (
              ("orr_editor", "collect_ui_panel::tests", 5 if os.name == "nt" else 6),
              ("orr_sample", "collect_ui::tests", 14),
              ("orr_sample", "collect_app::tests", 11),
          ):
              output = h["run_logged"](
                  ["cargo", "test", "--locked", "-p", package, "--no-default-features", "--features", "collect-ui",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (package + "-" + suite.replace("::", "-") + ".log"))
              h["validate_tests"](output, suite, count)
          name = "reparent_contract_cpu_batch"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--test", "collect_ui_reparent", "--", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "reparent-candidate-cpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected exact reparent candidate contract batch")
          name = "app::collect_ui_preview::tests::actual_editor_preview_controls_preserve_host_and_scene_epoch"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", name, "--", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-editor-controls-cpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected exactly one passing actual EditorApp controls test")
          for label, args in (
              ("default-check", ["check", "--lib"]),
              ("collect-ui-check", ["check", "--lib", "--features", "collect-ui"]),
              ("collect-ui-strict", ["clippy", "--lib", "--features", "collect-ui", "--", "-D", "warnings"]),
          ):
              h["run_logged"](["cargo", args[0], "--locked", "-p", "orr_editor", "--no-default-features", *args[1:]], evidence / (label + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_COLLECT_PREVIEW_CI/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_COLLECT_PREVIEW_CI/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/collect-preview-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_COLLECT_PREVIEW_CI/vulkan-driver.log"
      - name: Actual EditorApp isolated preview and production renderer pixel parity
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import runpy
          import struct
          h = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_COLLECT_PREVIEW_CI"]).resolve()
          captures = evidence / "software-gpu"
          captures.mkdir(exist_ok=False)
          os.environ["ORR_COLLECT_UI_PREVIEW_EVIDENCE"] = str(captures)
          name = "app::collect_ui_preview::tests::actual_editor_preview_gpu_matches_production_and_never_dispatches"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui",
               "--lib", name, "--", "--ignored", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-preview-gpu.log").replace("\r\n", "\n")
          summaries = h["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or h["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError("Expected one executed software GPU test with no skips")
          receipt = json.loads((captures / "collect-ui-preview-acceptance.json").read_text())
          if (type(receipt.get("schema")) is not int or receipt["schema"] != 1
                  or receipt.get("window_pixels") != [1800, 1200]
                  or type(receipt.get("production_collect_ui_pixel_parity_cases")) is not int
                  or receipt["production_collect_ui_pixel_parity_cases"] != 7):
              raise RuntimeError("Unexpected preview receipt schema or parity inventory")
          for flag in ("production_editor_app", "software_vulkan", "full_default_width_controls",
                       "unsaved_label_and_button_visible", "landscape_and_portrait", "clipping_and_admitted_font",
                       "observed_play_menu_restart_quit", "pointer_leave_cancelled", "host_checksum_history_mode_input_unchanged",
                       "ui_undo_save_reopen", "scene_manifest_unchanged", "close_and_missing_panel_release_gpu"):
              if receipt.get(flag) is not True:
                  raise RuntimeError("Missing verified preview predicate: " + flag)
          if receipt.get("native_os_window") is not False:
              raise RuntimeError("Software-GPU synthetic input must not claim native window acceptance")
          adapter = receipt.get("adapter")
          if not isinstance(adapter, str) or "llvmpipe" not in adapter.lower() or "Cpu" not in adapter or "Vulkan" not in adapter:
              raise RuntimeError("Explicit llvmpipe CPU Vulkan evidence required")
          for name, size in (
              ("title-default-landscape", (640, 360)),
              ("title-unsaved-landscape", (640, 360)),
              ("title-unsaved-portrait", (360, 640)),
              ("playing-portrait", (360, 640)),
              ("menu-portrait", (360, 640)),
              ("terminal-landscape", (640, 360)),
              ("title-saved-reopened", (640, 360)),
          ):
              for suffix, expected in (("canvas", size), ("editor", (1800, 1200))):
                  filename = name + "-" + suffix + ".png"
                  raw = (captures / filename).read_bytes()
                  if raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR" or struct.unpack(">II", raw[16:24]) != expected:
                      raise RuntimeError("Missing or wrong-sized preview screenshot: " + filename)
          # Reparent extends this existing Linux GPU step, not the job matrix.
          import hashlib
          def validate_reparent(output, captures):
              summaries = h["SUMMARY"].findall(output)
              if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                      or h["CASE"].findall(output) != [(reparent_test, "ok")]
                      or "skip" in output.lower()):
                  raise RuntimeError("Expected one executed reparent GPU case without skips")
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise RuntimeError("Duplicate receipt key")
                      result[key] = value
                  return result
              receipt_path = captures / "reparent-acceptance.json"
              receipt = json.loads(receipt_path.read_text(), object_pairs_hook=unique)
              for key, value in (("schema", 1), ("production_preview_pixel_parity_cases", 4)):
                  if type(receipt.get(key)) is not int or receipt[key] != value:
                      raise RuntimeError("Unexpected reparent census: " + key)
              if receipt.get("window_pixels") != [1800, 1200]:
                  raise RuntimeError("Unexpected reparent window dimensions")
              for flag in ("actual_editor_app", "software_vulkan", "stage_cancel_apply_undo_save_reopen",
                           "saved_production_collect_ui_play", "same_parent_no_history", "new_parent_clipping_visible",
                           "selection_document_focus_escape_viewport_screen_mode_close_title_x_epoch_play_panel_cancel",
                           "saved_authored_play_button_click"):
                  if receipt.get(flag) is not True:
                      raise RuntimeError("Missing reparent predicate: " + flag)
              if (receipt.get("native_os_window") is not False or receipt.get("separate_runtime_process") is not False
                      or receipt.get("redo") != "not integrated; PR182 prerequisite"):
                  raise RuntimeError("Reparent evidence must preserve acceptance limitations")
              adapter = receipt.get("adapter")
              if not isinstance(adapter, str) or "llvmpipe" not in adapter.lower() or "Cpu" not in adapter or "Vulkan" not in adapter:
                  raise RuntimeError("Explicit llvmpipe CPU Vulkan reparent evidence required")
              expected = {name + "-" + suffix + ".png": size
                          for name in ("reparent-initial", "reparent-staged-clipping", "reparent-cancelled", "reparent-saved-reopened")
                          for suffix, size in (("canvas", (640, 360)), ("editor", (1800, 1200)))}
              if {path.name for path in captures.glob("*.png")} != set(expected):
                  raise RuntimeError("Unexpected reparent screenshot inventory")
              hashes = {}
              for filename, size in expected.items():
                  raw = (captures / filename).read_bytes()
                  if raw[:8] != b"\x89PNG\r\n\x1a\n" or raw[12:16] != b"IHDR" or struct.unpack(">II", raw[16:24]) != size:
                      raise RuntimeError("Missing or wrong-sized reparent screenshot: " + filename)
                  hashes[filename] = hashlib.sha256(raw).hexdigest()
              hashes[receipt_path.name] = hashlib.sha256(receipt_path.read_bytes()).hexdigest()
              return hashes
          captures = evidence / "reparent-software-gpu"
          captures.mkdir(exist_ok=False)
          os.environ["ORR_COLLECT_UI_REPARENT_EVIDENCE"] = str(captures)
          reparent_test = "app::collect_ui_preview::tests::reparent_tests::actual_editor_reparent_stage_cancel_apply_undo_save_reopen_play"
          output = h["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--no-default-features", "--features", "collect-ui,project-create",
               "--lib", reparent_test, "--", "--ignored", "--exact", "--format=pretty", "--color=never", "--test-threads=1"],
              evidence / "actual-reparent-gpu.log").replace("\r\n", "\n")
          hashes = validate_reparent(output, captures)
          manifest = captures / "verified-sha256.json"
          manifest.write_text(json.dumps(hashes, sort_keys=True, indent=2) + "\n")
          if json.loads(manifest.read_text()) != validate_reparent(output, captures):
              raise RuntimeError("Reparent artifact hash verification failed")
      - name: Retain exact counts, production parity captures and full controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-ui-screen-preview-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_COLLECT_PREVIEW_CI }}
          if-no-files-found: error

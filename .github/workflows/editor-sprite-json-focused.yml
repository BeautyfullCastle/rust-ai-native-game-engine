name: Editor JSON sprite authoring focused CI

on:
  pull_request:
    branches: [su/engine-correctness-hardening]
    paths:
      - '.github/workflows/editor-sprite-json-focused.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/editor-sprite-json.md'
      - 'docs/sprite-clip-sequence.md'
      - 'crates/orr_editor/Cargo.toml'
      - 'crates/orr_editor/src/lib.rs'
      - 'crates/orr_editor/src/sprite_json_authoring.rs'
      - 'crates/orr_editor/src/sprite_json_authoring/**'
      - 'crates/orr_editor/src/sprite_package_install.rs'
      - 'crates/orr_editor/src/sprite_panel.rs'
      - 'crates/orr_editor/src/sprite_panel/**'
      - 'crates/orr_editor/src/sprite_grid_authoring.rs'
      - 'crates/orr_editor/src/sprite_grid_authoring/**'
      - 'crates/orr_editor/src/sprite_rectangle_authoring.rs'
      - 'crates/orr_editor/src/sprite_rectangle_authoring/**'
      - 'crates/orr_package/**'
      - 'crates/orr_sample/**'
      - 'crates/orr_sprite/**'
      - 'assets/sprite_demo/**'
      - 'scenes/arena_blank.scene.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-sprite-json-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  editor-sprite-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Create isolated evidence directory
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/editor-sprite-json-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' 'Focused editor JSON sprite authoring checks; results are recorded per command.' > "$EVIDENCE_DIR/workflow-status.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact candidate and prepare Linux toolchain
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/editor-sprite-json-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$EVIDENCE_DIR/source-commit-and-tree.txt"
          printf 'event_sha=%s\npr_head_sha=%s\npr_base_sha=%s\n' "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" > "$EVIDENCE_DIR/candidate-context.txt"
          git status --porcelain=v1 > "$EVIDENCE_DIR/source-status.txt"
          test ! -s "$EVIDENCE_DIR/source-status.txt"
          git archive --format=tar HEAD > "$EVIDENCE_DIR/source.tar"
          sha256sum "$EVIDENCE_DIR/source.tar" | tee "$EVIDENCE_DIR/source-archive-sha256.txt"
          uname -a | tee "$EVIDENCE_DIR/platform.txt"
          hostname | tee "$EVIDENCE_DIR/runner-hostname.txt"
          rustup toolchain install 1.99.1 --profile minimal --component clippy 2>&1 | tee "$EVIDENCE_DIR/rustup.log"
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE_DIR/rustc.txt"
          cargo --version --verbose | tee "$EVIDENCE_DIR/cargo.txt"
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE_DIR/dependencies.log"
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a "$EVIDENCE_DIR/dependencies.log"
      - name: Run JSON authoring and narrow sprite regressions
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/editor-sprite-json-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/editor-sprite-json-${{ github.run_id }}-${{ github.run_attempt }}
        shell: python {0}
        run: |
          import json, os, re, subprocess, tomllib
          from collections import Counter
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_DIR'])
          results = []
          observed_tests = []
          expected_executions = 0
          json_feature = 'sprite-json-authoring'
          combined = f'{json_feature},sprite-rectangle-authoring,tilemap'

          def save(summary=None):
              payload = {'commands': results}
              if summary is not None:
                  payload['test_summary'] = summary
              (evidence / 'results.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')

          def run(label, command, expected_tests=None):
              global expected_executions
              log_path = evidence / f'{label}.log'
              with log_path.open('w', encoding='utf-8') as log:
                  process = subprocess.Popen(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding='utf-8',
                      errors='replace',
                      bufsize=1,
                  )
                  lines = []
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                      log.flush()
                      lines.append(line)
                  code = process.wait()

              output = ''.join(lines)
              result = {
                  'label': label,
                  'command': command,
                  'log': str(log_path),
                  'exit': code,
                  'ok': code == 0,
              }
              if expected_tests is not None:
                  expected_executions += expected_tests
                  summaries = [
                      (status, int(passed), int(failed), int(ignored), int(measured))
                      for status, passed, failed, ignored, measured in re.findall(
                          r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',
                          output,
                          re.M,
                      )
                  ]
                  running = [int(count) for count in re.findall(r'^running (\d+) tests?$', output, re.M)]
                  events = re.findall(r'^test (\S+) \.\.\. (.+)$', output, re.M)
                  statuses = Counter()
                  names = []
                  for name, detail in events:
                      status = detail.split(',', 1)[0].strip()
                      names.append(name)
                      statuses[status] += 1
                      observed_tests.append({
                          'package': command[command.index('-p') + 1],
                          'name': name,
                          'status': status,
                          'run': label,
                      })
                  expected_namespaced = len({
                      (command[command.index('-p') + 1], name)
                      for name in names
                  })
                  inventory_ok = (
                      expected_tests > 0
                      and summaries == [('ok', expected_tests, 0, 0, 0)]
                      and running == [expected_tests]
                      and len(events) == expected_tests
                      and expected_namespaced == expected_tests
                      and statuses['ok'] == expected_tests
                      and statuses['ignored'] == 0
                      and statuses['FAILED'] == 0
                      and statuses['failed'] == 0
                      and len(statuses) == 1
                  )
                  result.update({
                      'expected_tests': expected_tests,
                      'running': running,
                      'summaries': summaries,
                      'status_counts': dict(statuses),
                      'observed_test_names': names,
                      'test_inventory_ok': inventory_ok,
                  })
                  result['ok'] = result['ok'] and inventory_ok
              results.append(result)
              save()
              return result, output

          def tests(label, package, selector, expected, features=None):
              command = ['cargo', 'test', '--locked', '-p', package]
              if features:
                  command += ['--features', features]
              command += ['--lib']
              if selector:
                  command += [selector]
              command += ['--', '--test-threads=1']
              return run(label, command, expected)

          def test_command(package, selector, features=None):
              command = ['cargo', 'test', '--locked', '-p', package]
              if features:
                  command += ['--features', features]
              command += ['--lib']
              if selector:
                  command += [selector]
              command += ['--', '--test-threads=1']
              return command

          manifest = tomllib.loads(Path('crates/orr_editor/Cargo.toml').read_text(encoding='utf-8'))
          expected_feature = ['sprite-package-install', 'orr_package/sprite-authoring', 'orr_sprite/png-import']
          declared_feature = manifest['features'].get(json_feature)
          boundary_static_ok = declared_feature == expected_feature
          boundary_command, boundary_output = run(
              'json-feature-boundary-cargo-tree',
              ['cargo', 'tree', '--locked', '-p', 'orr_editor', '--features', json_feature, '--format', '{p}|{f}'],
          )
          editor_lines = [line for line in boundary_output.splitlines() if line.startswith('orr_editor v')]
          editor_features = [feature.strip() for feature in editor_lines[0].rsplit('|', 1)[-1].split(',')] if len(editor_lines) == 1 else []
          boundary_dynamic_ok = (
              'sprite-json-authoring' in editor_features
              and 'sprite-package-install' in editor_features
              and 'sprites' in editor_features
              and 'sprite-grid-authoring' not in editor_features
              and 'sprite-rectangle-authoring' not in editor_features
          )
          boundary_command.update({
              'declared_features': declared_feature,
              'static_boundary_ok': boundary_static_ok,
              'resolved_editor_features': editor_features,
              'resolved_boundary_ok': boundary_dynamic_ok,
          })
          boundary_command['ok'] = boundary_command['ok'] and boundary_static_ok and boundary_dynamic_ok
          save()

          test_plan = [
              # Exact JSON backend, headless UI, and Linux consumer inventory.
              # One Unix symlink test is cfg(unix); Linux registers all 12 backend cases.
              ('json-backend-minimal', 'orr_editor', 'sprite_json_authoring::tests::', 12, json_feature),
              ('json-ui-minimal', 'orr_editor', 'sprite_panel::json_package_ui::tests::', 10, json_feature),
              ('json-consumer-integration', 'orr_editor', 'sprite_panel::json_package_ui::integration_tests::', 1, json_feature),
              # Preserve installer, grid lock, and rectangle UI APIs.
              ('installer-ui-json-feature-regression', 'orr_editor', 'sprite_panel::package_install_ui::tests::', 4, json_feature),
              ('grid-ui-minimal-regression', 'orr_editor', 'sprite_panel::grid_package_ui::tests::', 4, 'sprite-grid-authoring'),
              ('rectangle-ui-regression', 'orr_editor', 'sprite_panel::rectangle_package_ui::tests::', 8, 'sprite-rectangle-authoring'),
              ('installer-preview-integration-regression', 'orr_editor', 'sprite_panel::package_install_ui::integration_tests::', 2, 'sprite-grid-authoring,tilemap'),
              # Exercise the checked package writer and PNG decoder.
              ('sprite-package-writer', 'orr_package', 'sprite_package::', 13, 'sprite-authoring'),
              ('sprite-png-decoder', 'orr_sprite', None, 18, 'png-import'),
          ]
          planned_executions = sum(expected for _, _, _, expected, _ in test_plan)

          def record_unrun_tests(reason):
              for label, package, selector, expected, features in test_plan:
                  command = test_command(package, selector, features)
                  log_path = evidence / f'{label}.log'
                  log_path.write_text(
                      f'UNRUN: {reason}\nCommand: {command!r}\nExpected test executions: {expected}\n',
                      encoding='utf-8',
                  )
                  results.append({
                      'label': label,
                      'command': command,
                      'log': str(log_path),
                      'status': 'UNRUN',
                      'unrun_reason': reason,
                      'expected_tests': expected,
                      'ok': False,
                  })
              failed_commands = sum(not result.get('ok', False) and result.get('status') != 'UNRUN' for result in results)
              summary = {
                  'expected_executions': planned_executions,
                  'executed': 0,
                  'unique': 0,
                  'repeated': 0,
                  'ignored': 0,
                  'failed': 0,
                  'other_status': 0,
                  'unrun_test_commands': len(test_plan),
                  'unrun_test_executions': planned_executions,
                  'failed_commands': failed_commands,
                  'tests': [],
              }
              (evidence / 'test-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
              save(summary)
              (evidence / 'scope.txt').write_text(
                  f'Focused JSON authoring compile gate failed: {reason}. All {len(test_plan)} selected test commands ({planned_executions} expected executions) are recorded as UNRUN with per-command logs. No selected tests were executed.\n',
                  encoding='utf-8',
              )

          minimal_compile, _ = run(
              'compile-only-json-minimal',
              ['cargo', 'test', '--no-run', '--locked', '-p', 'orr_editor', '--lib', '--features', json_feature],
          )
          combined_compile, _ = run(
              'compile-only-json-rectangle-tilemap-combined',
              ['cargo', 'test', '--no-run', '--locked', '-p', 'orr_editor', '--lib', '--features', combined],
          )
          if not minimal_compile['ok'] or not combined_compile['ok']:
              failed = [result['label'] for result in (minimal_compile, combined_compile) if not result['ok']]
              reason = 'compile-only gate failed: ' + ', '.join(failed)
              record_unrun_tests(reason)
              raise SystemExit(reason)

          # Compile gates passed; now run every selected inventory exactly once.
          for plan in test_plan:
              tests(*plan)

          run(
              'strict-editor-json-minimal',
              ['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', json_feature, '--lib', '--', '-D', 'warnings'],
          )
          run(
              'strict-editor-json-rectangle-tilemap-combined',
              ['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', combined, '--lib', '--', '-D', 'warnings'],
          )
          run(
              'installer-only-compile-boundary',
              ['cargo', 'check', '--locked', '-p', 'orr_editor', '--lib', '--no-default-features', '--features', 'sprite-package-install'],
          )
          run(
              'grid-only-compile-boundary',
              ['cargo', 'check', '--locked', '-p', 'orr_editor', '--lib', '--no-default-features', '--features', 'sprite-grid-authoring'],
          )
          run(
              'rectangle-compile-boundary',
              ['cargo', 'check', '--locked', '-p', 'orr_editor', '--lib', '--no-default-features', '--features', 'sprite-rectangle-authoring'],
          )
          run(
              'editor-default-feature-off',
              ['cargo', 'check', '--locked', '-p', 'orr_editor', '--lib', '--no-default-features'],
          )

          executions = len(observed_tests)
          unique_tests = {(entry['package'], entry['name']) for entry in observed_tests}
          statuses = Counter(entry['status'] for entry in observed_tests)
          summary = {
              'expected_executions': expected_executions,
              'executed': executions,
              'unique': len(unique_tests),
              'repeated': executions - len(unique_tests),
              'ignored': statuses['ignored'],
              'failed': statuses['FAILED'] + statuses['failed'],
              'other_status': executions - statuses['ok'] - statuses['ignored'] - statuses['FAILED'] - statuses['failed'],
              'failed_commands': sum(not result['ok'] for result in results),
              'tests': observed_tests,
          }
          (evidence / 'test-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          save(summary)
          (evidence / 'scope.txt').write_text(
              'Focused Ubuntu CPU coverage validates default-off standalone JSON+PNG sprite package authoring. Minimal and combined JSON+rectangle+tilemap no-run compile gates precede all selected tests; any failure records every selected inventory as UNRUN. Coverage also includes installer/grid/rectangle/default-off compile boundaries, the registered Linux JSON consumer integration test, package-writer and PNG-decoder regressions, minimal and combined strict Clippy, and resolved feature boundaries. Every selected test command must execute its exact nonzero expected inventory with no ignored or failed cases. CPU evidence does not establish native window rendering, Windows behavior, visual JSON-to-PNG identity, or actual play/video.\n',
              encoding='utf-8',
          )
          if (
              executions != expected_executions
              or summary['ignored'] != 0
              or summary['failed'] != 0
              or summary['other_status'] != 0
              or summary['failed_commands'] != 0
              or not boundary_static_ok
              or not boundary_dynamic_ok
          ):
              raise SystemExit('Focused editor JSON sprite authoring checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-sprite-json-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-sprite-json-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

name: Room light before outcomes focused CI
on:
  push:
    branches: [codex/package-pointer-diagnosis-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Authored light activation and actual gameplay
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_sample --features room-project,project-create --test room_lighting -- --test-threads=1 2>&1 | tee ci-evidence/default-off.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/default-off.log
          cargo test --locked -p orr_sample --features room-lighting --lib room_lighting:: -- --test-threads=1 2>&1 | tee ci-evidence/core.log
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' ci-evidence/core.log
          cargo test --locked -p orr_sample --features room-lighting,project-create --test room_lighting -- --test-threads=1 2>&1 | tee ci-evidence/admission.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/admission.log
          cargo build --locked -p orr_sample --features room-lighting,room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          cargo test --locked -p orr_sample --features room-lighting,room-character,project-create,project-export --test room_lighting_export --no-run 2>&1 | tee ci-evidence/legacy-gpu-export-compile.log
          cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --test room_lighting activation:: -- --test-threads=1 2>&1 | tee ci-evidence/widgets.log
          grep -F 'test result: ok. 2 passed; 0 failed; 2 ignored;' ci-evidence/widgets.log
          ORR_LIGHT_ACTIVATION_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --test room_lighting activation::before_outcome_saved_export_consumes_conditions_without_authoring_sources -- --ignored --exact 2>&1 | tee ci-evidence/deployed-before.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed-before.log
          cargo test --locked -p orr_editor --features package-manager,room-lighting,room-character,project-create,windows-export --lib package_manager_panel::keep::tests::pointer_route_diagnoses_each_keep_stage -- --exact --nocapture 2>&1 | tee ci-evidence/pointer-settled.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/pointer-settled.log
          cargo clippy --locked -p orr_sample --features room-project,project-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-default-off.log
          cargo clippy --locked -p orr_editor --features room-lighting,room-character,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-light-before-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: Mesh hazards patrol focused CI
on:
  push:
    branches: [codex/mesh-hazards-patrol-20261107]
permissions:
  contents: read
jobs:
  mesh-hazards-patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Saved patrol through transactional hazard gameplay
        shell: bash
        run: |
          set -euo pipefail
          cases() {
            local name="$1" count="$2"; shift 2
            "$@" 2>&1 | tee "ci-evidence/$name.log"
            grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "ci-evidence/$name.log"
          }
          cases bridge 2 cargo test --locked -p orr_bridge --lib frame_view::tests::
          cases legacy-input 5 cargo test --locked -p orr_games --features mesh-mission --lib mesh_navigation_game::mesh_play_input_tests::
          cases legacy-hazards 12 cargo test --locked -p orr_games --features mesh-hazards --lib mesh_navigation_game::hazards::tests::
          cases hazards-regression 12 cargo test --locked -p orr_games --features mesh-hazards,mesh-patrol --lib mesh_navigation_game::hazards::tests::
          cases patrol-regression 7 cargo test --locked -p orr_games --features mesh-hazards,mesh-patrol --lib mesh_navigation_game::patrol::tests::
          cases hazards-patrol 9 cargo test --locked -p orr_games --features mesh-hazards,mesh-patrol --lib mesh_navigation_game::hazards::patrol_tests::
          cases admission 6 cargo test --locked -p orr_remote --features mesh-hazards,mesh-patrol --lib mesh_navigation::hazards::patrol_profile_tests::
          cases hazard-host 5 cargo test --locked -p orr_remote --features mesh-hazards,mesh-patrol --lib mesh_navigation::hazards::tests:: -- --test-threads=1
          cases patrol-host 5 cargo test --locked -p orr_remote --features mesh-hazards,mesh-patrol --lib mesh_navigation::patrol::tests::
          cases profile-off 2 cargo test --locked -p orr_remote --features mesh-hazards --test mesh_feature_profile
          cases profile-on 2 cargo test --locked -p orr_remote --features mesh-hazards,mesh-patrol --test mesh_feature_profile
          cases profile-mismatch 2 cargo test --locked -p orr_remote --features mesh-hazards,orr_games/mesh-patrol --test mesh_feature_profile
          cases panel 6 cargo test --locked -p orr_editor --features mesh-patrol,mesh-hazards-export --lib mesh_navigation::patrol_panel::tests:: -- --test-threads=1
          cases navigation-integration 2 cargo test --locked -p orr_editor --features mesh-patrol,mesh-hazards-export --lib mesh_navigation::patrol_integration_tests:: -- --test-threads=1
          cases hazards-integration 2 cargo test --locked -p orr_editor --features mesh-patrol,mesh-hazards-export --lib mesh_navigation::patrol_hazards_integration_tests:: -- --test-threads=1
          cargo check --locked -p orr_editor --features mesh-navigation --lib 2>&1 | tee ci-evidence/feature-off.log
          cargo build --locked -p orr_remote --features mesh-patrol,mesh-hazards --bin orr_mesh_hazards 2>&1 | tee ci-evidence/native-hazards.log
          cargo clippy --locked -p orr_bridge --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-bridge.log
          cargo clippy --locked -p orr_games --features mesh-patrol,mesh-hazards --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-games.log
          cargo clippy --locked -p orr_remote --features mesh-patrol,mesh-hazards --lib --bin orr_mesh_hazards -- -D warnings 2>&1 | tee ci-evidence/clippy-remote.log
          cargo clippy --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol,mesh-prop-shading --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
          echo 'CPU UI/Editor Play only. Actual GPU/window/physical playtest/video UNRUN on locked computer.' | tee ci-evidence/gpu-scope.txt
      - name: Preserve originals including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-hazards-patrol-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

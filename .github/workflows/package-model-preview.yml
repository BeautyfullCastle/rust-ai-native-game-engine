name: Static package model preview acceptance
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-model-preview:
    # Additive optional-feature coverage; no existing mandatory gate is replaced.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE: ${{ github.workspace }}/target/package-model-preview-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Focused CPU preview contracts and optional feature boundaries
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=False)
          # Unix symlink rejection test is excluded on Windows; all other tests are shared.
          for suite, count in (
              ("package_model_preview", 20 if os.name == "nt" else 21),
          ):
              output = helpers["run_logged"](
                  ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "package-manager",
                   "--lib", suite + "::", "--", "--format=pretty", "--color=never", "--test-threads=1"],
                  evidence / (suite.replace("::", "-") + ".log"))
              helpers["validate_tests"](output, suite, count)
          for name, args in (
              ("default-check", ["check", "--lib"]),
              ("package-manager-check", ["check", "--lib", "--features", "package-manager"]),
              ("package-manager-lint", ["clippy", "--lib", "--features", "package-manager", "--", "-D", "warnings"]),
              ("package-preview-ui-lint", ["clippy", "--test", "package_model_preview_ui", "--features", "package-manager", "--", "-D", "warnings"]),
          ):
              helpers["run_logged"](["cargo", args[0], "--locked", "-p", "orr_editor", *args[1:]],
                                    evidence / (name + ".log"))
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/package-model-preview-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
          printf 'Software Vulkan ICD: %s\n' "${drivers[0]}" | tee "$ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE/vulkan-driver.log"
      - name: Explicit ignored production EditorApp Static package model preview acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import runpy

          helpers = runpy.run_path("tools/check-authoring-controls.py")
          evidence = Path(os.environ["ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE"])
          capture = evidence / "package-preview-ui"
          if capture.exists():
              raise RuntimeError("Package model preview acceptance requires an absent, fresh capture directory")
          os.environ["ORR_PACKAGE_MODEL_PREVIEW_CAPTURE_DIR"] = str(capture.resolve())
          name = "verified_static_package_preview_is_read_only_and_assignment_still_reopens"
          output = helpers["run_logged"](
              ["cargo", "test", "--locked", "-p", "orr_editor", "--features", "package-manager",
               "--test", "package_model_preview_ui", name, "--", "--exact", "--ignored",
               "--format=pretty", "--color=never", "--test-threads=1"], evidence / "package-preview-ui.log")
          summaries = helpers["SUMMARY"].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (1, 0, 0, 0)
                  or re.findall(r"^running (\d+) tests?$", output, re.M) != ["1"]
                  or helpers["CASE"].findall(output) != [(name, "ok")]):
              raise RuntimeError(f"{name}: expected exactly one executed passing ignored test")
          receipt = json.loads((capture / "receipt.json").read_text())
          expected = {
              "test": "verified_static_package_preview_is_read_only_and_assignment_still_reopens",
              "reset_exact": True, "preview_without_selection": True,
              "preview_preserves_project_source_files_frame_history_bindings_and_editor_camera": True,
              "corrupt_cached_asset_refused": True, "use_model_save_reopen_preserved": True,
          }
          if any(type(receipt.get(key)) is not type(value) or receipt.get(key) != value
                 for key, value in expected.items()):
              raise RuntimeError("Fresh Static package model preview receipt is incomplete or inconsistent")
          if not isinstance(receipt.get("adapter"), str) or "llvmpipe" not in receipt["adapter"].lower():
              raise RuntimeError("Expected actual llvmpipe software Vulkan viewport adapter")
          for key in ("different_asset_pixels", "orbit_changed_pixels", "zoom_changed_pixels"):
              value = receipt.get(key)
              if type(value) is not int or value <= 1000:
                  raise RuntimeError(f"{key}: expected more than 1000 changed preview pixels")
          for image in ("01-verified.png", "02-foreground.png", "02-foreground-canvas.png",
                        "03-background.png", "03-background-canvas.png", "04-orbit.png", "04-orbit-canvas.png",
                        "05-zoom-canvas.png", "06-reset.png", "06-reset-canvas.png", "07-closed.png",
                        "08-corrupt-refused.png", "09-assigned-saved.png", "10-reopened.png"):
              data = (capture / image).read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise RuntimeError(f"Missing or malformed fresh package model preview capture: {image}")
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-model-preview-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_PACKAGE_MODEL_PREVIEW_EVIDENCE }}
          if-no-files-found: error

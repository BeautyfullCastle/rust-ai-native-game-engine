name: Room model pose focused CI
on:
  push:
    branches: [codex/room-model-pose-check-20261107]
permissions:
  contents: read
jobs:
  room-poses:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Static and animated native CPU pose path and deployed launcher
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_sample --features room-project --lib room_app::tests::strict_options -- --exact 2>&1 | tee ci-evidence/options-static.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/options-static.log
          cargo test --locked -p orr_sample --features room-project --test room_project pose_checks:: -- --test-threads=1 2>&1 | tee ci-evidence/static.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/static.log
          cargo test --locked -p orr_sample --features room-animated-models,project-export --test room_animated_project pose_checks:: -- --test-threads=1 2>&1 | tee ci-evidence/animated-export.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/animated-export.log
          cargo test --locked -p orr_sample --features room-character,project-export --test room_animated_project pose_checks:: -- --test-threads=1 2>&1 | tee ci-evidence/character-export.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/character-export.log
          cargo test --locked -p orr_sample --features room-character,project-create --test room_pose_character -- --test-threads=1 2>&1 | tee ci-evidence/character-cursor.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/character-cursor.log
          cargo clippy --locked -p orr_sample --features room-project --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-static.log
          cargo clippy --locked -p orr_sample --features room-animated-models,project-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-animated.log
          cargo clippy --locked -p orr_sample --features room-character,project-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-character.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-model-pose-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

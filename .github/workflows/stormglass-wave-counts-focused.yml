name: Stormglass wave counts focused CI
# Additive real native/WASM checks; local mandatory validation and review remain required.
on:
  push:
    branches: [su/stormglass-wave-counts-20261103]
permissions:
  contents: read
concurrency:
  group: stormglass-wave-counts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-wasm-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      EVIDENCE: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Select Rust and WASM target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate counts and compare fresh actual WASM to native consumed-input trace
        shell: python {0}
        run: |
          import hashlib, json, os, re, runpy, subprocess
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          core = ['cargo', 'test', '--locked', '--release', '-p', 'orr_games', '--features', 'coop-defense-scene', '--lib', 'wave_counts_tests', '--', '--format=pretty', '--color=never', '--test-threads=1']
          output = helpers['run_logged'](core, evidence / 'counts-tests.log').replace('\r\n', '\n')
          summaries = helpers['SUMMARY'].findall(output)
          cases = helpers['CASE'].findall(output)
          if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (10, 0, 0, 0):
              raise RuntimeError('Expected ten passing count tests, with no ignored tests')
          if len(cases) != 10 or len({name for name, status in cases}) != 10 or any(status != 'ok' or 'wave_counts_tests::' not in name for name, status in cases):
              raise RuntimeError('Missing, duplicate or unexpected count test case')
          trace_command = ['cargo', 'run', '--locked', '--release', '-p', 'orr_games', '--features', 'coop-defense-scene', '--example', 'coop_defense_campaign_trace', '--', '--counts']
          trace = evidence / 'counts-trace.json'
          (evidence / 'trace-command.json').write_text(json.dumps(trace_command))
          with trace.open('w') as stdout, (evidence / 'trace-build.log').open('w') as stderr:
              subprocess.run(trace_command, stdout=stdout, stderr=stderr, check=True, timeout=2700)
          oracle = json.loads(trace.read_text())
          if len(oracle['rows']) != 1794 or oracle['lastWave'] != 3:
              raise RuntimeError('Unexpected count campaign trace inventory')
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_coop_defense_web', '--target', 'wasm32-unknown-unknown', '--profile', 'web'], evidence / 'wasm-build.log')
          wasm = Path('target/wasm32-unknown-unknown/web/orr_coop_defense_web.wasm')
          if wasm.read_bytes()[:8] != b'\x00asm\x01\x00\x00\x00':
              raise RuntimeError('Fresh build did not produce a WASM module')
          helpers['run_logged'](['node', '--version'], evidence / 'node-version.log')
          helpers['run_logged'](['node', 'tools/check_coop_defense_wasm.mjs', str(wasm), str(trace), 'examples/static-game-starter/scenes/stormglass-counts.scene.yaml'], evidence / 'actual-wasm.log')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'core_tests': 10, 'native_trace_rows': len(oracle['rows']), 'wasm_sha256': hashlib.sha256(wasm.read_bytes()).hexdigest(), 'full_workspace': False, 'browser_or_gpu': False}, indent=2))
      - name: Preserve source, native trace, WASM and logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-wave-counts-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ci-evidence
            target/wasm32-unknown-unknown/web/orr_coop_defense_web.wasm
          if-no-files-found: error

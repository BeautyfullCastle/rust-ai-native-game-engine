name: Terrain waypoint patrol focused CI
on:
  push:
    branches: [codex/terrain-waypoint-patrol-20261107]
permissions:
  contents: read
jobs:
  terrain-waypoint-patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      EDITOR_FEATURES: package-manager,room-character,room-lighting,project-create,windows-export,mesh-hazards-export,mesh-animated-models,mesh-patrol,mesh-prop-shading,terrain-patrol,navigation-export
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Saved routes and bounded deterministic playback
        shell: bash
        run: |
          set -euo pipefail
          cases() {
            local label="$1" count="$2"; shift 2
            "$@" 2>&1 | tee "ci-evidence/$label.log"
            grep -F "test result: ok. $count passed; 0 failed; 0 ignored;" "ci-evidence/$label.log"
          }
          cases legacy-host 6 cargo test --locked -p orr_remote --features navigation --test navigation_yard3d -- --test-threads=1
          cases legacy-reader 5 cargo test --locked -p orr_navigation_view --features authored-surface-bundle --lib authored::tests:: -- --test-threads=1
          cases legacy-export-profile 2 cargo test --locked -p orr_navigation_view --features authored-surface-bundle --lib terrain_patrol_tests:: -- --test-threads=1
          cases core 9 cargo test --locked -p orr_games --features terrain-patrol --lib navigation_yard3d_game::patrol::tests::
          cases admission 5 cargo test --locked -p orr_remote --features terrain-patrol --lib navigation_yard3d::patrol::tests:: -- --test-threads=1
          cases profile-off 2 cargo test --locked -p orr_remote --features navigation --test terrain_patrol_profile
          cases profile-on 2 cargo test --locked -p orr_remote --features terrain-patrol --test terrain_patrol_profile
          cases profile-mismatch 2 cargo test --locked -p orr_remote --features navigation,orr_games/terrain-patrol --test terrain_patrol_profile
          cases reader-profile 3 cargo test --locked -p orr_navigation_view --features authored-surface-bundle,terrain-patrol --lib terrain_patrol_tests:: -- --test-threads=1
          cases panel 5 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib navigation_panel::patrol_panel::tests:: -- --test-threads=1
          cases integration 2 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib navigation_panel::patrol_integration_tests:: -- --test-threads=1
          cases projection 3 cargo test --locked -p orr_editor --features "$EDITOR_FEATURES" --lib navigation_view::tests:: -- --test-threads=1
          cargo check --locked -p orr_editor --features navigation --lib 2>&1 | tee ci-evidence/feature-off-editor.log
          cargo build --locked -p orr_navigation_view --features authored,terrain-patrol --bin navigation_player 2>&1 | tee ci-evidence/native-reader-build.log
          cargo clippy --locked -p orr_games --features terrain-patrol --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-games.log
          cargo clippy --locked -p orr_remote --features terrain-patrol --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-remote.log
          cargo clippy --locked -p orr_navigation_view --features authored-surface-bundle,terrain-patrol --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-reader.log
          cargo clippy --locked -p orr_editor --features "$EDITOR_FEATURES" --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-editor.log
          echo 'CPU authoring/Frame playback only. Native reader compiled, not launched. GPU/window/physical playtest/video UNRUN; legacy patrol bundle export unsupported.' | tee ci-evidence/gpu-scope.txt
      - name: Preserve originals including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-waypoint-patrol-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

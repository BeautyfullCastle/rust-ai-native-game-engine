name: Room camera projection match focused CI
on:
  push:
    branches: [codex/room-camera-projection-match-20261107]
permissions:
  contents: read
jobs:
  room-projection-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Room projection draft to saved runtime use
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p orr_editor --features room-project --lib 2>&1 | tee ci-evidence/minimal-room.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::projection_match::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/math.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/math.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::projection_match_panel_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::tests::widgets_stage_apply_undo_save_reopen -- --exact 2>&1 | tee ci-evidence/legacy-widgets.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-widgets.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::tests::play_widgets_cannot_apply_or_save_staged_values -- --exact 2>&1 | tee ci-evidence/legacy-play.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-play.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::redo_tests::redo_widget_resets_live_once_and_is_disabled_in_play -- --exact 2>&1 | tee ci-evidence/legacy-redo.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-redo.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::projection_match_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 1 passed; 0 failed; 1 ignored;' ci-evidence/integration.log
          cargo build --locked -p orr_sample --features room-lighting,room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_ROOM_PROJECTION_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib room_camera_panel::projection_match_integration_tests::room_projection_switch_survives_source_hidden_native_export -- --ignored --exact 2>&1 | tee ci-evidence/deployed.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed.log
          cargo clippy --locked -p orr_editor --features package-manager,room-character,room-lighting,room-authoring,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-room.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-projection-match-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

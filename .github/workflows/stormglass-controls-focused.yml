name: stormglass-controls focused Linux CI
on:
  push:
    branches: [codex/stormglass-controls-20261106]
permissions:
  contents: read
concurrency:
  group: stormglass-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
      - name: Verify controls and preserved settings/input paths
        shell: bash
        run: |
          set -euo pipefail
          features=coop-defense-controls,coop-defense-attack-clip,coop-defense-run-save
          cargo test --locked -p orr_sample --features "$features" --lib defense_controls::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/model.log
          grep -F 'test result: ok. 13 passed; 0 failed; 0 ignored;' ci-evidence/model.log
          cargo test --locked -p orr_sample --features "$features" --lib defense_ui::controls_ui_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/ui.log
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' ci-evidence/ui.log
          cargo test --locked -p orr_sample --features "$features" --lib defense_app::controls_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/app.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/app.log
          cargo test --locked -p orr_sample --features "$features" --lib audio_settings -- --test-threads=1 2>&1 | tee ci-evidence/audio-storage.log
          grep -F 'test result: ok. 11 passed; 0 failed; 0 ignored;' ci-evidence/audio-storage.log
          cargo test --locked -p orr_sample --features "$features" --lib defense_app::pause_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/pause.log
          grep -F 'test result: ok. 14 passed; 0 failed; 0 ignored;' ci-evidence/pause.log
          cargo test --locked -p orr_sample --features "$features" --lib defense_ui::modifier_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/modifiers.log
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' ci-evidence/modifiers.log
          cargo clippy --locked -p orr_sample --features "$features" --lib --bin coop_defense -- -D warnings 2>&1 | tee ci-evidence/clippy.log
          cargo clippy --locked -p orr_sample --features coop-defense-audio-settings,coop-defense-run-save --lib --bin coop_defense -- -D warnings 2>&1 | tee ci-evidence/audio-only-clippy.log
          cargo test --locked -p orr_sample --features coop-defense --lib controls_flag_feature_off -- --test-threads=1 2>&1 | tee ci-evidence/feature-off.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/feature-off.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-controls-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: Lighting preset effects focused CI
on:
  push:
    branches: [codex/lighting-preset-effects-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Portable effect preset to saved scene and CPU runtime policy
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_lighting_preset:: -- --test-threads=1 2>&1 | tee ci-evidence/codec-store.log
          grep -F 'test result: ok. 28 passed; 0 failed; 0 ignored;' ci-evidence/codec-store.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_lighting_panel::presets:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 9 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_lighting_panel::preset_effects_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/integration.log
          cargo test --locked -p orr_editor --features mesh-hazards-export --lib mesh_lighting::post_process_runtime::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/runtime-policy.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/runtime-policy.log
          cargo clippy --locked -p orr_editor --features mesh-hazards-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-consumer.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-preset-effects-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

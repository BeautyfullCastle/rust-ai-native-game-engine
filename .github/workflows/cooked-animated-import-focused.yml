name: Cooked animated import focused CI
on:
  push:
    branches: [codex/cooked-animated-import-20261107]
permissions:
  contents: read
jobs:
  light-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Authored animation import to saved installed game
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features package-manager --lib model_package_import::cooked_animated_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/backend-off.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/backend-off.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib model_package_import::cooked_animated_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/backend-on.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/backend-on.log
          cargo test --locked -p orr_editor --features package-manager --lib model_package_import_panel::cooked_animated_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/ui-off.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/ui-off.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib model_package_import_panel::cooked_animated_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/ui-on.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/ui-on.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib model_package_import::tests::imports_valid_static_glb_unchanged_and_copies_explicit_license -- --exact 2>&1 | tee ci-evidence/legacy-glb.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-glb.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib model_package_import::tests::cooked_static_preserves_noncanonical_bytes_identity_history_license_and_hashes -- --exact 2>&1 | tee ci-evidence/legacy-static.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-static.log
          cargo test --locked -p orr_editor --features package-manager --lib model_package_import_panel::tests::source_format_and_file_widgets_revoke_rights_and_disable_while_busy -- --exact 2>&1 | tee ci-evidence/legacy-ui-format-off.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-ui-format-off.log
          cargo test --locked -p orr_editor --features package-manager --lib model_package_import_panel::tests::request_snapshot_pins_format_kind_paths_and_rights -- --exact 2>&1 | tee ci-evidence/legacy-ui-snapshot-off.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-ui-snapshot-off.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib model_package_import_panel::tests::source_format_and_file_widgets_revoke_rights_and_disable_while_busy -- --exact 2>&1 | tee ci-evidence/legacy-ui-format.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-ui-format.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models --lib model_package_import_panel::tests::request_snapshot_pins_format_kind_paths_and_rights -- --exact 2>&1 | tee ci-evidence/legacy-ui-snapshot.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-ui-snapshot.log
          cargo test --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::cooked_animated_import_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 1 passed; 0 failed; 1 ignored;' ci-evidence/integration.log
          cargo build --locked -p orr_sample --features room-lighting,room-character --bin room_escape 2>&1 | tee ci-evidence/runtime-build.log
          ORR_COOKED_ANIMATED_IMPORT_RUNTIME="$PWD/target/debug/room_escape" cargo test --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::cooked_animated_import_tests::imported_cooked_animation_survives_source_hidden_native_export -- --ignored --exact 2>&1 | tee ci-evidence/deployed.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/deployed.log
          cargo clippy --locked -p orr_editor --features package-manager --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-off.log
          cargo clippy --locked -p orr_editor --features package-manager,room-animated-models,room-character,room-lighting,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-on.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooked-animated-import-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

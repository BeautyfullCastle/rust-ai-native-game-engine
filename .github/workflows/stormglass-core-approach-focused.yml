name: stormglass core approach focused CI
on:
  push:
    branches: [codex/stormglass-core-approach-20261107]
permissions:
  contents: read
jobs:
  core-approach:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
      - name: Check CPU core approach and shared painter regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_sample --features coop-defense --lib core_approach_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/core-baseline.log
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' ci-evidence/core-baseline.log
          cargo test --locked -p orr_sample --features coop-defense-controls --lib core_approach_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/core-controls.log
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' ci-evidence/core-controls.log
          cargo test --locked -p orr_sample --features coop-defense --lib merge_guide_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/merge-regression.log
          grep -F 'test result: ok. 7 passed; 0 failed; 0 ignored;' ci-evidence/merge-regression.log
          cargo test --locked -p orr_sample --features coop-defense --lib defense_view::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/view-regression.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' ci-evidence/view-regression.log
          cargo test --locked -p orr_sample --features coop-defense --lib defense_ui::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/ui-regression.log
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' ci-evidence/ui-regression.log
          cargo clippy --locked -p orr_sample --features coop-defense --lib --bin coop_defense -- -D warnings 2>&1 | tee ci-evidence/clippy-baseline.log
          cargo clippy --locked -p orr_sample --features coop-defense-controls --lib --bin coop_defense -- -D warnings 2>&1 | tee ci-evidence/clippy-controls.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-core-approach-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error


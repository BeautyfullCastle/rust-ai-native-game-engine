name: stormglass settings setup focused Windows CI
on:
  push:
    branches: [codex/stormglass-settings-setup-20261107, codex/stormglass-settings-check-20261107]
permissions:
  contents: read
jobs:
  settings-setup:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory ci-evidence | Out-Null
          git rev-parse HEAD | Set-Content ci-evidence/source.txt
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong source' }
          rustc --version --verbose | Set-Content ci-evidence/rustc.txt
      - name: Focused native setup and existing storage regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --locked -p orr_sample --features coop-defense-controls --lib defense_audio_settings:: -- --test-threads=1 *>&1 | Tee-Object ci-evidence/storage.log
          if ($LASTEXITCODE -ne 0) { throw 'Storage test failure' }
          if (-not ((Get-Content ci-evidence/storage.log -Raw).Contains('test result: ok. 27 passed; 0 failed; 0 ignored;'))) { throw 'Incomplete storage inventory' }
          cargo test --locked -p orr_sample --features coop-defense-controls --bin orr_prepare_stormglass_settings *>&1 | Tee-Object ci-evidence/cli-unit.log
          if ($LASTEXITCODE -ne 0) { throw 'CLI unit failure' }
          if (-not ((Get-Content ci-evidence/cli-unit.log -Raw).Contains('test result: ok. 2 passed; 0 failed; 0 ignored;'))) { throw 'Incomplete CLI unit inventory' }
          cargo clippy --locked -p orr_sample --features coop-defense-controls --lib --bin coop_defense --bin orr_prepare_stormglass_settings -- -D warnings *>&1 | Tee-Object ci-evidence/clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failure' }
          cargo clippy --locked -p orr_sample --features coop-defense-audio-settings --lib --bin coop_defense -- -D warnings *>&1 | Tee-Object ci-evidence/audio-only.log
          if ($LASTEXITCODE -ne 0) { throw 'Audio-only feature failure' }
          cargo build --locked -p orr_sample --features coop-defense-controls --bin orr_prepare_stormglass_settings *>&1 | Tee-Object ci-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failure' }
          & ./tools/test_stormglass_settings_setup_windows.ps1 -Executable "$PWD/target/debug/orr_prepare_stormglass_settings.exe" -EvidenceDirectory "$PWD/../ci-setup-cases" *>&1 | Tee-Object ci-evidence/cli-smoke.log
          Copy-Item -LiteralPath ../ci-setup-cases -Destination ci-evidence/cases -Recurse
          if ((Get-Content ci-evidence/cases/result.json -Raw | ConvertFrom-Json).cases -ne 19) { throw 'Incomplete CLI inventory' }
      - name: Collect partial CLI failures
        if: always()
        shell: pwsh
        run: |
          if ((Test-Path -LiteralPath ../ci-setup-cases) -and -not (Test-Path -LiteralPath ci-evidence/cases)) {
            Copy-Item -LiteralPath ../ci-setup-cases -Destination ci-evidence/cases -Recurse
          }
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormglass-settings-setup-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

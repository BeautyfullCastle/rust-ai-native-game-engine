name: PNG sequence package acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  png-sequence-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_SEQUENCE_EVIDENCE: ${{ github.workspace }}/target/png-sequence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Default refusal, exact-count CPU contracts and strict lint
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          import subprocess
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=False)
          helpers['run_logged'](['python', 'tools/check-png-canvas-receipt.py', '--self-test'], evidence / 'receipt-validator-self-tests.log')
          examples = ('png_sequence_package', 'png_grid_package')
          selectors = [arg for example in examples for arg in ('--example', example)]
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', *selectors], evidence / 'default-build.log')
          for example in examples:
              binary = Path('target/debug/examples/' + example).resolve()
              absent = evidence / ('must-not-exist-' + example)
              for label, args in [('help', ['--help']), ('inputs', ['--recipe', str(evidence / 'missing.json'), '--out', str(absent)])]:
                  result = subprocess.run([str(binary), *args], capture_output=True, text=True, timeout=10)
                  (evidence / (example + '-disabled-' + label + '.log')).write_text(result.stdout + result.stderr + '\nexit=' + str(result.returncode))
                  if result.returncode != 1 or result.stdout or result.stderr.strip() != example + ' requires Linux and --features project-create' or absent.exists():
                      raise RuntimeError('Default example did not refuse before I/O')
          helpers['run_logged'](['rustfmt', '--edition', '2021', '--check', 'crates/orr_sample/examples/png_sequence_package.rs', 'crates/orr_sample/examples/png_grid_package.rs', 'crates/orr_sample/tests/png_grid_package.rs', 'crates/orr_editor/tests/png_grid_package_consumer.rs', 'crates/orr_sample/tests/png_sequence_package_gpu.rs', 'crates/orr_sample/tests/png_sequence_canvas_gpu.rs'], evidence / 'format.log')
          expected = {'png_sequence_package': 20, 'png_sprite_package': 16, 'png_grid_package': 11}
          test_selectors = [arg for example in expected for arg in ('--example', example)]
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', *test_selectors, '--', '--format=pretty', '--color=never'], evidence / 'example-batch-tests.log').replace('\r\n', '\n')
          blocks = re.split(r'(?m)^\s*Running unittests examples/(\w+)\.rs \([^\n]+\)\n', output)
          if len(blocks) != 1 + 2 * len(expected) or set(blocks[1::2]) != set(expected):
              raise RuntimeError('Missing or unexpected example harness')
          for example, block in zip(blocks[1::2], blocks[2::2]):
              count = expected[example]
              summaries = helpers['SUMMARY'].findall(block)
              cases = helpers['CASE'].findall(block)
              if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (count, 0, 0, 0, 0)
                  or re.findall(r'^running (\d+) tests?$', block, re.M) != [str(count)]
                  or len(cases) != count or len({name for name, _ in cases}) != count or any(status != 'ok' for _, status in cases)):
                  raise RuntimeError('Exact-count CPU acceptance failed')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_sample', '--features', 'project-create', *selectors, '--test', 'png_sequence_package_gpu', '--test', 'png_sequence_canvas_gpu', '--test', 'png_grid_package_gpu', '--', '-D', 'warnings'], evidence / 'clippy.log')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', 'sprites', '--test', 'png_grid_package_consumer', '--', '-D', 'warnings'], evidence / 'grid-consumer-clippy.log')
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', '--features', 'project-create', *selectors], evidence / 'cli-build.log')
          os.environ['ORR_PNG_GRID_PACKAGE_BIN'] = str(Path('target/debug/examples/png_grid_package').resolve())
          consumer = 'grid_cli_install_editor_save_reopen_and_locomotion'
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_editor', '--features', 'sprites', '--test', 'png_grid_package_consumer', '--', '--ignored', '--exact', consumer, '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'grid-editor-consumer.log').replace('\r\n', '\n')
          summaries = helpers['SUMMARY'].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (1, 0, 0, 0, 0)
              or re.findall(r'^running (\d+) tests?$', output, re.M) != ['1']
              or helpers['CASE'].findall(output) != [(consumer, 'ok')]
              or re.search(r'\bSKIP\b', output)):
              raise RuntimeError('Required grid editor consumer skipped or incomplete')
      - name: Install software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_SEQUENCE_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_SEQUENCE_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/png-sequence-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
      - name: Required real CLI install and production renderer acceptance
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          os.environ['ORR_PNG_SEQUENCE_PACKAGE_BIN'] = str(Path('target/debug/examples/png_sequence_package').resolve())
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--test', 'png_sequence_package_gpu', '--', '--exact', 'cli_sequence_installed_runtime_loop_once_and_wrong_order_gpu_readback', '--nocapture', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'gpu.log').replace('\r\n', '\n')
          summaries = helpers['SUMMARY'].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (1, 0, 0, 0, 0)
              or re.findall(r'^running (\d+) tests?$', output, re.M) != ['1']
              or 'PNG sequence: 57 production GPU captures' not in output
              or re.findall(r'^test (\S+) \.\.\. ', output, re.M) != ['cli_sequence_installed_runtime_loop_once_and_wrong_order_gpu_readback']
              or re.search(r'\bSKIP\b', output)):
              raise RuntimeError('Required GPU acceptance skipped or incomplete')
      - name: Required common-canvas actual GPU acceptance and hashed receipt
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          gate = runpy.run_path('tools/check-png-canvas-receipt.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          os.environ['ORR_PNG_SEQUENCE_PACKAGE_BIN'] = str(Path('target/debug/examples/png_sequence_package').resolve())
          canvas = evidence / 'canvas'
          os.environ['ORR_CANVAS_EVIDENCE'] = str(canvas)
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--test', 'png_sequence_canvas_gpu', '--', '--exact', gate['TEST'], '--nocapture', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'canvas-gpu.log')
          gate['validate_log'](output)
          helpers['run_logged'](['python', 'tools/check-png-canvas-receipt.py', str(canvas)], evidence / 'canvas-receipt-validation.log')
      - name: Required grid installed pixels and authoritative parity
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          test = 'grid_cli_installed_locomotion_twelve_capture_pixels_and_frame_parity'
          marker = 'PNG grid: 12 Vulkan captures; 54 authoritative parity checks; source-hidden installed packages; Loop/Once and wrong-cell control'
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def unique_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'Duplicate receipt key')
                  result[key] = value
              return result
          def digest(path):
              require(path.is_file() and not path.is_symlink(), 'Missing or linked artifact')
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def validate_grid(output, pixels, producer_hash):
              output = output.replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(output)
              require(len(summaries) == 1 and tuple(map(int, summaries[0][:5])) == (1, 0, 0, 0, 0), 'Grid exact-one test summary failed')
              require(re.findall(r'^running (\d+) tests?$', output, re.M) == ['1'], 'Grid test census failed')
              require(re.findall(r'^test (\S+) \.\.\. ', output, re.M) == [test], 'Grid test identity failed')
              require(output.count(marker) == 1 and not re.search(r'\bSKIP\b', output), 'Grid success marker missing or skipped')
              receipt_path = pixels / 'receipt.json'
              receipt_hash = digest(receipt_path)
              receipt = json.loads(receipt_path.read_text(), object_pairs_hook=unique_pairs)
              require(type(receipt.get('schema')) is int and receipt['schema'] == 1 and receipt.get('test') == test, 'Wrong grid receipt schema/test')
              require(type(receipt.get('capture_count')) is int and receipt['capture_count'] == 12 and type(receipt.get('parity_checks')) is int and receipt['parity_checks'] == 54, 'Incomplete grid receipt')
              require(receipt.get('source_hidden') is True and receipt.get('installed_bytes_preserved') is True, 'Grid source/install claims missing')
              require(receipt.get('backend') == 'Vulkan' and isinstance(receipt.get('adapter'), str) and receipt['adapter'].strip(), 'Missing Vulkan adapter record')
              require(receipt.get('device_type') in ('Other', 'IntegratedGpu', 'DiscreteGpu', 'VirtualGpu', 'Cpu') and type(receipt.get('is_software')) is bool, 'Missing device classification')
              require(receipt.get('producer_sha256') == producer_hash and re.fullmatch(r'[0-9a-f]{64}', receipt.get('source_png_sha256', '')) is not None, 'Grid producer/source digest mismatch')
              expected = [(f'grid-good-tick-{tick}.png', tick, cell, False) for tick, cell in ((0, 0), (5, 0), (6, 1), (11, 1), (12, 0), (13, 2), (18, 2), (19, 3), (24, 3), (25, 3), (26, 0))]
              expected.append(('grid-wrong-order-tick-19.png', 19, 2, True))
              captures = receipt.get('captures')
              require(isinstance(captures, list) and len(captures) == 12, 'Wrong grid capture inventory')
              require(set(path.name for path in pixels.iterdir()) == {name for name, *_ in expected} | {'receipt.json', 'partial-receipt.json', 'grid-good-cli.log', 'grid-wrong-order-cli.log'}, 'Unexpected or missing grid artifacts')
              hashes = []
              for row, (name, tick, cell, wrong) in zip(captures, expected):
                  require(isinstance(row, dict) and row.get('file') == name and type(row.get('tick')) is int and row['tick'] == tick and type(row.get('cell')) is int and row['cell'] == cell and row.get('wrong_order') is wrong, 'Wrong grid capture identity/order')
                  path = pixels / name
                  actual = digest(path)
                  require(row.get('sha256') == actual, 'Grid capture digest mismatch')
                  header = path.read_bytes()[:24]
                  require(header[:8] == b'\x89PNG\r\n\x1a\n' and header[12:16] == b'IHDR' and header[16:24] == (64).to_bytes(4, 'big') * 2, 'Wrong grid PNG dimensions')
                  hashes.append({'file': name, 'sha256': actual})
              return {'receipt_sha256': receipt_hash, 'partial_receipt_sha256': digest(pixels / 'partial-receipt.json'), 'cli_logs': [{'file': name, 'sha256': digest(pixels / name)} for name in ('grid-good-cli.log', 'grid-wrong-order-cli.log')], 'producer_sha256': producer_hash, 'captures': hashes, 'adapter': receipt['adapter'], 'backend': receipt['backend'], 'device_type': receipt['device_type'], 'is_software': receipt['is_software']}
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          binary = Path('target/debug/examples/png_grid_package').resolve()
          producer_hash = digest(binary)
          os.environ['ORR_PNG_GRID_PACKAGE_BIN'] = str(binary)
          pixels = evidence / 'grid-pixels'
          require(not pixels.exists(), 'Grid evidence must be fresh')
          os.environ['ORR_GRID_PIXEL_EVIDENCE'] = str(pixels)
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--test', 'png_grid_package_gpu', '--', '--ignored', '--exact', test, '--nocapture', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'grid-gpu.log')
          require(digest(binary) == producer_hash, 'Grid CLI changed during GPU acceptance')
          verified = validate_grid(output, pixels, producer_hash)
          (evidence / 'grid-pixels-verified.json').write_text(json.dumps(verified, sort_keys=True, indent=2) + '\n')
      - name: Retain logs on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-sequence-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_SEQUENCE_EVIDENCE }}
          if-no-files-found: error

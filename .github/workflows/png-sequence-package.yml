name: PNG sequence package acceptance
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  png-sequence-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_SEQUENCE_EVIDENCE: ${{ github.workspace }}/target/png-sequence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Default refusal, exact-count CPU contracts and strict lint
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          import subprocess
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=False)
          binary = Path('target/debug/examples/png_sequence_package').resolve()
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', '--example', 'png_sequence_package'], evidence / 'default-build.log')
          absent = evidence / 'must-not-exist'
          for label, args in [('help', ['--help']), ('inputs', ['--recipe', str(evidence / 'missing.json'), '--out', str(absent)])]:
              result = subprocess.run([str(binary), *args], capture_output=True, text=True, timeout=10)
              (evidence / ('disabled-' + label + '.log')).write_text(result.stdout + result.stderr + '\nexit=' + str(result.returncode))
              if result.returncode != 1 or result.stdout or result.stderr.strip() != 'png_sequence_package requires Linux and --features project-create' or absent.exists():
                  raise RuntimeError('Default example did not refuse before I/O')
          helpers['run_logged'](['rustfmt', '--edition', '2021', '--check', 'crates/orr_sample/examples/png_sequence_package.rs', 'crates/orr_sample/tests/png_sequence_package_gpu.rs'], evidence / 'format.log')
          for example, count in [('png_sequence_package', 14), ('png_sprite_package', 16)]:
              output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--example', example, '--', '--format=pretty', '--color=never'], evidence / (example + '-tests.log')).replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(output)
              cases = helpers['CASE'].findall(output)
              if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (count, 0, 0, 0, 0)
                  or re.findall(r'^running (\d+) tests?$', output, re.M) != [str(count)]
                  or len(cases) != count or len({name for name, _ in cases}) != count or any(status != 'ok' for _, status in cases)):
                  raise RuntimeError('Exact-count CPU acceptance failed')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--example', 'png_sequence_package', '--test', 'png_sequence_package_gpu', '--', '-D', 'warnings'], evidence / 'clippy.log')
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--example', 'png_sequence_package'], evidence / 'cli-build.log')
      - name: Install software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_SEQUENCE_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_SEQUENCE_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/png-sequence-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
      - name: Required real CLI install and production renderer acceptance
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          os.environ['ORR_PNG_SEQUENCE_PACKAGE_BIN'] = str(Path('target/debug/examples/png_sequence_package').resolve())
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--test', 'png_sequence_package_gpu', '--', '--nocapture', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'gpu.log').replace('\r\n', '\n')
          summaries = helpers['SUMMARY'].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (1, 0, 0, 0, 0)
              or re.findall(r'^running (\d+) tests?$', output, re.M) != ['1']
              or 'PNG sequence: 57 production GPU captures' not in output
              or 'cli_sequence_installed_runtime_loop_once_and_wrong_order_gpu_readback' not in output
              or re.search(r'\bSKIP\b', output)):
              raise RuntimeError('Required GPU acceptance skipped or incomplete')
      - name: Retain logs on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-sequence-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_SEQUENCE_EVIDENCE }}
          if-no-files-found: error

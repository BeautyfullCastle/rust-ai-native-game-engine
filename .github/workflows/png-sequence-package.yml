name: PNG sequence package acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  png-sequence-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_SEQUENCE_EVIDENCE: ${{ github.workspace }}/target/png-sequence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Default refusal, exact-count CPU contracts and strict lint
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          import subprocess
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=False)
          helpers['run_logged'](['python', 'tools/check-png-canvas-receipt.py', '--self-test'], evidence / 'receipt-validator-self-tests.log')
          examples = ('png_sequence_package', 'png_grid_package')
          selectors = [arg for example in examples for arg in ('--example', example)]
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', *selectors], evidence / 'default-build.log')
          for example in examples:
              binary = Path('target/debug/examples/' + example).resolve()
              absent = evidence / ('must-not-exist-' + example)
              for label, args in [('help', ['--help']), ('inputs', ['--recipe', str(evidence / 'missing.json'), '--out', str(absent)])]:
                  result = subprocess.run([str(binary), *args], capture_output=True, text=True, timeout=10)
                  (evidence / (example + '-disabled-' + label + '.log')).write_text(result.stdout + result.stderr + '\nexit=' + str(result.returncode))
                  if result.returncode != 1 or result.stdout or result.stderr.strip() != example + ' requires Linux and --features project-create' or absent.exists():
                      raise RuntimeError('Default example did not refuse before I/O')
          helpers['run_logged'](['rustfmt', '--edition', '2021', '--check', 'crates/orr_sample/examples/png_sequence_package.rs', 'crates/orr_sample/examples/png_grid_package.rs', 'crates/orr_sample/tests/png_grid_package.rs', 'crates/orr_editor/tests/png_grid_package_consumer.rs', 'crates/orr_sample/tests/png_sequence_package_gpu.rs', 'crates/orr_sample/tests/png_sequence_canvas_gpu.rs'], evidence / 'format.log')
          expected = {'png_sequence_package': 20, 'png_sprite_package': 16, 'png_grid_package': 11}
          test_selectors = [arg for example in expected for arg in ('--example', example)]
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', *test_selectors, '--', '--format=pretty', '--color=never'], evidence / 'example-batch-tests.log').replace('\r\n', '\n')
          blocks = re.split(r'(?m)^\s*Running unittests examples/(\w+)\.rs \([^\n]+\)\n', output)
          if len(blocks) != 1 + 2 * len(expected) or set(blocks[1::2]) != set(expected):
              raise RuntimeError('Missing or unexpected example harness')
          for example, block in zip(blocks[1::2], blocks[2::2]):
              count = expected[example]
              summaries = helpers['SUMMARY'].findall(block)
              cases = helpers['CASE'].findall(block)
              if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (count, 0, 0, 0, 0)
                  or re.findall(r'^running (\d+) tests?$', block, re.M) != [str(count)]
                  or len(cases) != count or len({name for name, _ in cases}) != count or any(status != 'ok' for _, status in cases)):
                  raise RuntimeError('Exact-count CPU acceptance failed')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_sample', '--features', 'project-create', *selectors, '--test', 'png_sequence_package_gpu', '--test', 'png_sequence_canvas_gpu', '--', '-D', 'warnings'], evidence / 'clippy.log')
          helpers['run_logged'](['cargo', 'clippy', '--locked', '-p', 'orr_editor', '--features', 'sprites', '--test', 'png_grid_package_consumer', '--', '-D', 'warnings'], evidence / 'grid-consumer-clippy.log')
          helpers['run_logged'](['cargo', 'build', '--locked', '-p', 'orr_sample', '--features', 'project-create', *selectors], evidence / 'cli-build.log')
          os.environ['ORR_PNG_GRID_PACKAGE_BIN'] = str(Path('target/debug/examples/png_grid_package').resolve())
          consumer = 'grid_cli_install_editor_save_reopen_and_locomotion'
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_editor', '--features', 'sprites', '--test', 'png_grid_package_consumer', '--', '--ignored', '--exact', consumer, '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'grid-editor-consumer.log').replace('\r\n', '\n')
          summaries = helpers['SUMMARY'].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (1, 0, 0, 0, 0)
              or re.findall(r'^running (\d+) tests?$', output, re.M) != ['1']
              or helpers['CASE'].findall(output) != [(consumer, 'ok')]
              or re.search(r'\bSKIP\b', output)):
              raise RuntimeError('Required grid editor consumer skipped or incomplete')
      - name: Install software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_SEQUENCE_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_SEQUENCE_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/png-sequence-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
      - name: Required real CLI install and production renderer acceptance
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import re
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          os.environ['ORR_PNG_SEQUENCE_PACKAGE_BIN'] = str(Path('target/debug/examples/png_sequence_package').resolve())
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--test', 'png_sequence_package_gpu', '--', '--exact', 'cli_sequence_installed_runtime_loop_once_and_wrong_order_gpu_readback', '--nocapture', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'gpu.log').replace('\r\n', '\n')
          summaries = helpers['SUMMARY'].findall(output)
          if (len(summaries) != 1 or tuple(map(int, summaries[0][:5])) != (1, 0, 0, 0, 0)
              or re.findall(r'^running (\d+) tests?$', output, re.M) != ['1']
              or 'PNG sequence: 57 production GPU captures' not in output
              or re.findall(r'^test (\S+) \.\.\. ', output, re.M) != ['cli_sequence_installed_runtime_loop_once_and_wrong_order_gpu_readback']
              or re.search(r'\bSKIP\b', output)):
              raise RuntimeError('Required GPU acceptance skipped or incomplete')
      - name: Required common-canvas actual GPU acceptance and hashed receipt
        env:
          WGPU_BACKEND: vulkan
          ORR_REQUIRE_GPU: '1'
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import runpy
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          gate = runpy.run_path('tools/check-png-canvas-receipt.py')
          evidence = Path(os.environ['ORR_SEQUENCE_EVIDENCE'])
          os.environ['ORR_PNG_SEQUENCE_PACKAGE_BIN'] = str(Path('target/debug/examples/png_sequence_package').resolve())
          canvas = evidence / 'canvas'
          os.environ['ORR_CANVAS_EVIDENCE'] = str(canvas)
          output = helpers['run_logged'](['cargo', 'test', '--locked', '-p', 'orr_sample', '--features', 'project-create', '--test', 'png_sequence_canvas_gpu', '--', '--exact', gate['TEST'], '--nocapture', '--format=pretty', '--color=never', '--test-threads=1'], evidence / 'canvas-gpu.log')
          gate['validate_log'](output)
          helpers['run_logged'](['python', 'tools/check-png-canvas-receipt.py', str(canvas)], evidence / 'canvas-receipt-validation.log')
      - name: Retain logs on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-sequence-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_SEQUENCE_EVIDENCE }}
          if-no-files-found: error

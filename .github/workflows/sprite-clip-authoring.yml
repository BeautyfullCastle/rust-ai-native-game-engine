name: Sprite clip authoring
on:
  pull_request:
  push:
    branches: [su/engine-correctness-hardening]
permissions:
  contents: read
jobs:
  sprite-clip-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      ORR_SPRITE_EVIDENCE_ROOT: /tmp/orr-sprite-clip-evidence
      ORR_SPRITE_WORK_ROOT: /tmp/orr-sprite-clip-work
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software GPU and namespace isolation tools
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers bubblewrap
      - name: Exact inventories, no-Apply control, default boundaries and strict profiles
        run: tools/check-sprite-clip-authoring.sh contracts
      - name: Actual App composition and source-hidden read-only Arena export
        env:
          ORR_REQUIRE_GPU: '1'
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          # Pin the installed Mesa CPU adapter rather than silently choosing a
          # hosted hardware adapter. Missing lavapipe is a mandatory failure.
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | sort)
          test "${#icds[@]}" -eq 1
          export VK_ICD_FILENAMES="${icds[0]}"
          export VK_DRIVER_FILES="${icds[0]}"
          tools/check-sprite-clip-authoring.sh acceptance
      - name: Retain source identities, exact producer and runtime logs, and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-clip-authoring-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: |
            /tmp/orr-sprite-clip-evidence/**/*.json
            /tmp/orr-sprite-clip-evidence/**/*.stdout
            /tmp/orr-sprite-clip-evidence/**/*.stderr
            /tmp/orr-sprite-clip-evidence/**/*.png

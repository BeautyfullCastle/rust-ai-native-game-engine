name: Mesh light draft preview focused CI
on:
  push:
    branches: [codex/mesh-light-draft-preview-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mesh-light-draft-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mesh-light-draft-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect preview, picker input and saved consumer checks
        shell: python {0}
        run: |
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          evidence=Path('ci-evidence');results=[]
          full='package-manager,room-character,room-lighting,room-authoring,project-create,windows-export,mesh-hazards-export,mesh-mission,mesh-animated-models,mesh-patrol,mesh-prop-shading'
          def run(label,command,count=None):
              with (evidence/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  lines=[]
                  for line in p.stdout:
                      print(line,end='',flush=True);log.write(line);log.flush();lines.append(line)
                  code=p.wait()
              text=''.join(lines);ok=code==0
              if count is not None:
                  summary=re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text,re.M)
                  names=re.findall(r'^test (\S+) \.\.\. ok$',text,re.M)
                  running=re.findall(r'^running (\d+) tests?$',text,re.M)
                  ok=ok and summary==[('ok',str(count),'0','0','0')] and len(names)==len(set(names))==count and running==[str(count)]
              results.append(dict(label=label,command=command,exit=code,ok=ok,expected=count))
              (evidence/'results.json').write_text(json.dumps(results,indent=2))
              return ok
          def tests(label,selector,count,extra=()):
              run(label,['cargo','test','--locked','-p','orr_editor','--features',full,'--lib',selector,'--']+list(extra)+['--test-threads=1'],count)
          checks=[
            ('draft-preview-core','mesh_lighting_panel::draft_preview::tests::',5),
            ('draft-preview-ui','mesh_lighting_panel::draft_preview_ui_tests::',2),
            ('draft-preview-apply-save','mesh_lighting_panel::draft_preview_integration_tests::',1),
            ('draft-preview-app','app::mesh_light_preview::tests::',3),
            ('light-pick-core','mesh_lighting_panel::viewport_pick::tests::',5),
            ('light-pick-ui','mesh_lighting_panel::viewport_pick_ui_tests::',2),
            ('light-pick-apply-save','mesh_lighting_panel::viewport_pick_integration_tests::',1),
            ('light-pick-app','app::mesh_light_pick::tests::',3),
            ('point-codec','mesh_lighting::point_light::tests::',6),
            ('legacy-codec','mesh_lighting::tests::',4),
            ('legacy-panel','mesh_lighting_panel::tests::',8),
            ('legacy-point-ui','mesh_lighting_panel::point_light_ui::tests::',4),
            ('legacy-point-save','mesh_lighting_panel::point_light_integration_tests::',1),
            ('legacy-panel-presets','mesh_lighting_panel::presets::tests::',5),
            ('legacy-panel-effects','mesh_lighting_panel::post_process_tests::',3),
            ('legacy-preset-effects','mesh_lighting_panel::presets::post_process_tests::',4),
            ('legacy-preset-save','mesh_lighting_panel::preset_effects_integration_tests::',1),
            ('legacy-store','mesh_lighting_store::tests::',6),
            ('legacy-app-selection','app::point_light_tests::',2),
            ('legacy-export','mesh_export::tests::point_light_tests::',3),
            ('legacy-hazards-export','mesh_hazards_export::tests::point_light_tests::',3),
            ('legacy-room-light-app','app::room_light_pick::tests::',2),
            ('legacy-mesh-patrol-app','mesh_navigation::agent_viewport::patrol_tests::',3),
          ]
          assert sum(n for _,_,n in checks)+1==78
          for label,selector,count in checks: tests(label,selector,count)
          built=run('native-build',['cargo','build','--locked','-p','orr_editor','--features',full,'--bin','orr_mesh_player','--bin','orr_mesh_hazards_player'])
          if built:
              tool=evidence.resolve()/'mesh-point-light-runtime'
              shutil.copy2('target/debug/orr_mesh_hazards_player',tool);tool.chmod(0o755)
              os.environ['ORR_MESH_POINT_LIGHT_RUNTIME']=str(tool)
              (evidence/'runtime.sha256').write_text(hashlib.sha256(tool.read_bytes()).hexdigest()+'  '+str(tool)+'\n')
              tests('legacy-source-hidden-native','mesh_hazards_player::point_light_acceptance::point_light_survives_source_hidden_native_export_and_restart',1,['--exact','--ignored'])
          else:results.append(dict(label='legacy-source-hidden-native',ok=False,expected=1,unrun='native build failed'))
          run('strict-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','mesh-navigation','--lib','--','-D','warnings'])
          run('strict-full',['cargo','clippy','--locked','-p','orr_editor','--features',full,'--lib','--bin','orr_mesh_player','--bin','orr_mesh_hazards_player','--','-D','warnings'])
          run('feature-off',['cargo','check','--locked','-p','orr_editor','--features','models','--lib'])
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          (evidence/'scope.txt').write_text('78 focused CPU executions required; success requires zero failed/ignored. App adapter supplies camera/current-frame gate; rendered pixels/GPU not exercised. Legacy saved/native point-light consumers retained. Windows/window/physicalplay/video UNRUN; no full-workspace validation.')
          if not all(r['ok'] for r in results):raise SystemExit('Focused Mesh light draft preview checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-light-draft-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

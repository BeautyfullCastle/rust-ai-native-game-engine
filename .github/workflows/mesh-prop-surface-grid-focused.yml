name: mesh-prop-surface-grid focused Linux CI
# Publication waits for final product review and exact remote PR/head handoff.
# Added by the 2026-11-03 request for minimal actual remote CI.
# Additive to existing Linux-local verification and independent review.
on:
  push:
    branches: [su/mesh-prop-surface-grid-20261103]
permissions:
  contents: read
concurrency:
  group: mesh-prop-surface-grid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mesh-prop-surface-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      WGPU_BACKEND: gl
      ORR_REQUIRE_GPU: '1'
      EVIDENCE: ${{ github.workspace }}/ci-evidence
      ORR_MESH_PROP_SURFACE_GRID_EVIDENCE: ${{ github.workspace }}/ci-evidence/captures
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/source.txt"
      - name: Install Linux build and software rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$EVIDENCE/dependencies.log"
          sudo apt-get install -y -q build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers 2>&1 | tee -a "$EVIDENCE/dependencies.log"
          runtime=$(mktemp -d "$RUNNER_TEMP/mesh-prop-surface-grid-xdg.XXXXXXXX")
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Select verified Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          rustc --version --verbose | tee "$EVIDENCE/rustc.txt"
          cargo --version | tee "$EVIDENCE/cargo.txt"
      - name: Run focused feature contracts and actual UI
        shell: python {0}
        run: |
          import json, os, re, runpy
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          helpers = runpy.run_path('tools/check-authoring-controls.py')
          suites = [('surface-grid', 'orr_editor', 'mesh-prop-shading', ['--lib', 'mesh_props_panel::surface_grid::tests'], 22), ('actual-ui', 'orr_editor', 'mesh-prop-shading', ['--test', 'mesh_prop_surface_grid_ui', 'surface_height_grid_preserves_props_history_pixels_and_source_free_reopen'], 1)]
          for label, package, features, args, count in suites:
              flags = ['--format=pretty', '--color=never', '--test-threads=1']
              if label == 'actual-ui':
                  flags += ['--ignored', '--exact', '--show-output']
              command = ['cargo', 'test', '--locked', '--release', '-p', package, '--features', features] + args + ['--'] + flags
              output = helpers['run_logged'](command, evidence / (label + '.log'))
              normalized = output.replace('\r\n', '\n')
              summaries = helpers['SUMMARY'].findall(normalized)
              cases = helpers['CASE'].findall(normalized)
              if len(summaries) != 1 or tuple(map(int, summaries[0][:4])) != (count, 0, 0, 0):
                  raise RuntimeError(f'{label}: expected exactly {count} passing tests with no skips')
              if len(cases) != count or len({name for name, status in cases}) != count or any(status != 'ok' for name, status in cases):
                  raise RuntimeError(f'{label}: missing, duplicate or failing individual cases')
              if re.findall(r'^running (\d+) tests?$', normalized, re.MULTILINE) != [str(count)]:
                  raise RuntimeError(f'{label}: inconsistent executed test count')
          if True:
              images = list((evidence / 'captures').rglob('*.png'))
              if len(images) != 11:
                  raise RuntimeError(f'Expected 11 fresh PNGs, found {len(images)}')
              for path in images:
                  data = path.read_bytes()
                  if len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                      raise RuntimeError(f'Invalid PNG: {path.name}')
          (evidence / 'scope.json').write_text(json.dumps({'head': os.environ['GITHUB_SHA'], 'executed_test_counts': {suite[0]: suite[4] for suite in suites}, 'full_workspace': False}, indent=2))
      - name: Preserve source, logs and captures including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-prop-surface-grid-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

name: Room wall groups CPU and Linux UI acceptance
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021, su/static-game-starter-20261022]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wall-groups:
    # Additive gate: retain all existing workflows and Windows test sources.
    # Windows hardware-Vulkan UI remains separately required before merge.
    # No approved GPU runner is declared here; this job does not claim that proof.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      ORR_WALL_GROUP_EVIDENCE: ${{ github.workspace }}/target/wall-groups-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-count guard self-tests
        run: python tools/check-authoring-controls.py --self-test
      - name: Mandatory store, template, editor and feature boundaries
        shell: python {0}
        run: |
          import os
          import subprocess
          subprocess.run(["python", "tools/check-room-wall-groups.py", "--evidence",
                          os.environ["ORR_WALL_GROUP_EVIDENCE"]], check=True)
      - name: Install explicit Linux software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q 2>&1 | tee "$ORR_WALL_GROUP_EVIDENCE/vulkan-install.log"
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 2>&1 | tee -a "$ORR_WALL_GROUP_EVIDENCE/vulkan-install.log"
          mapfile -t drivers < <(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -type f)
          test "${#drivers[@]}" -eq 1
          runtime=$(mktemp -d "$RUNNER_TEMP/room-wall-groups-xdg.XXXXXXXX")
          chmod 700 "$runtime"
          {
            echo "VK_DRIVER_FILES=${drivers[0]}"
            echo "VK_ICD_FILENAMES=${drivers[0]}"
            echo "XDG_RUNTIME_DIR=$runtime"
          } >> "$GITHUB_ENV"
      - name: Mandatory Linux production EditorApp software Vulkan acceptance
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        shell: python {0}
        run: |
          import os
          import subprocess
          subprocess.run(["python", "tools/check-room-wall-groups.py", "--gpu", "--evidence",
                          os.environ["ORR_WALL_GROUP_EVIDENCE"]], check=True)
      - name: Retain receipts, screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-groups-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORR_WALL_GROUP_EVIDENCE }}
          if-no-files-found: error

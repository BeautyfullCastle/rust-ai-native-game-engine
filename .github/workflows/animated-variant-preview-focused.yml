name: Animated variant preparation preview focused CI
on:
  push:
    branches: [codex/animated-variant-preview-20261107]
permissions:
  contents: read
jobs:
  animated-variant-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Read-only authoring preparation and isolated preview
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p orr_editor --features package-manager --lib model_package_import_panel::variant_preview_disabled_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/feature-off.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/feature-off.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_package_import::variant_preview::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/backend.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/backend.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_package_import_panel::variant_preview::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/panel.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' ci-evidence/panel.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib app::variant_model_preview::tests:: -- --test-threads=1 2>&1 | tee ci-evidence/window.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' ci-evidence/window.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::variant_preview_integration_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/integration.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/integration.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib model_package_import_panel::animated_color_tests::actual_color_checkbox_and_import_worker_publish_variant_and_report_asset_digest -- --exact 2>&1 | tee ci-evidence/legacy-color.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-color.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::editor_animated_texture_tests::actual_editor_texture_widgets_import_install_assign_save_and_reopen -- --exact 2>&1 | tee ci-evidence/legacy-png.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-png.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::editor_material_catalog_tests::catalog_selected_material_imports_installs_assigns_and_reopens -- --exact 2>&1 | tee ci-evidence/legacy-catalog.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/legacy-catalog.log
          cargo test --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib package_manager_panel::variant_preview_parent_tests:: -- --test-threads=1 2>&1 | tee ci-evidence/parent-cancel.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' ci-evidence/parent-cancel.log
          cargo check --locked -p orr_editor --features package-manager,room-animated-models,mesh-hazards-export --lib 2>&1 | tee ci-evidence/cross-editor.log
          cargo clippy --locked -p orr_editor --features package-manager,room-character,room-lighting,project-create,windows-export --lib -- -D warnings 2>&1 | tee ci-evidence/clippy-preview.log
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-variant-preview-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: error

name: Static model sampler
on:
  pull_request:
    branches: [main, su/engine-correctness-hardening, su/authoring-development-integration-20261021, su/static-game-starter-20261022]
    types: [ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: static model sampler (${{ matrix.mode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: cpu, os: ubuntu-22.04}
          - {mode: cpu, os: windows-latest}
          - {mode: gpu, os: ubuntu-22.04}
          - {mode: ui, os: ubuntu-22.04}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_BUILD_JOBS: "2"
      # Keep retained release UI producers within the unchanged 128 MiB pin limit.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install software Vulkan
        if: matrix.mode != 'cpu'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers libxkbcommon-dev
      - name: Run source-bound mandatory acceptance
        env:
          ORR_STATIC_SAMPLER_EVIDENCE: ${{ runner.temp }}/orr-static-sampler-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: python -B tools/static_model_sampler_gate.py '${{ matrix.mode }}'
      - name: Required grouped planar UV acceptance
        if: matrix.mode == 'ui'
        shell: bash
        run: |
          export ORR_STATIC_PLANAR_UV_EVIDENCE="$RUNNER_TEMP/orr-static-sampler-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}/planar-uv"
          python -B tools/static_model_planar_uv_gate.py
      - name: Retain evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-model-sampler-${{ matrix.mode }}-${{ matrix.os }}
          path: ${{ runner.temp }}/orr-static-sampler-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  required:
    name: static model sampler required
    if: always()
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - env:
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE" = success

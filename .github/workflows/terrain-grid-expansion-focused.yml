name: Terrain grid expansion focused CI
on:
  push:
    branches: [codex/terrain-grid-expand-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terrain-grid-expansion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terrain-grid-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and prepare Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir ci-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree} | tee ci-evidence/source.txt
          git status --porcelain=v1 > ci-evidence/source-status.txt
          git archive --format=tar HEAD > ci-evidence/source.tar
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustup override set 1.99.1
          rustc --version --verbose | tee ci-evidence/rustc.txt
          uname -a | tee ci-evidence/platform.txt
          hostname | tee ci-evidence/runner-hostname.txt
          sudo apt-get update -q 2>&1 | tee ci-evidence/dependencies.log
          sudo apt-get install -y -q pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev 2>&1 | tee -a ci-evidence/dependencies.log
      - name: Collect grid expansion and save/use checks
        shell: python {0}
        run: |
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          evidence=Path('ci-evidence');results=[]
          full='terrain-patrol,room-authoring,terrain-png16'
          def run(label,command,count=None):
              with (evidence/(label+'.log')).open('w') as log:
                  p=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
                  lines=[]
                  for line in p.stdout:
                      print(line,end='',flush=True);log.write(line);log.flush();lines.append(line)
                  code=p.wait()
              text=''.join(lines);ok=code==0
              if count is not None:
                  summary=re.findall(r'^test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;',text,re.M)
                  names=re.findall(r'^test (\S+) \.\.\. ok$',text,re.M)
                  running=re.findall(r'^running (\d+) tests?$',text,re.M)
                  ok=ok and summary==[('ok',str(count),'0','0','0')] and len(names)==len(set(names))==count and running==[str(count)]
              results.append(dict(label=label,command=command,exit=code,ok=ok,expected=count))
              (evidence/'results.json').write_text(json.dumps(results,indent=2))
              return ok
          def tests(label,selector,count,extra=()):
              if not libtest_ready:
                  results.append(dict(label=label,ok=False,expected=count,unrun="libtest compilation failed"));return
              run(label,['cargo','test','--locked','-p','orr_editor','--features',full,'--lib',selector,'--']+list(extra)+['--test-threads=1'],count)
          run('terrain-core-unit',['cargo','test','--locked','-p','orr_terrain','--lib','--','--test-threads=1'],13)
          run('terrain-core-contract',['cargo','test','--locked','-p','orr_terrain','--test','terrain','--','--test-threads=1'],9)
          run('strict-core',['cargo','clippy','--locked','-p','orr_terrain','--all-targets','--','-D','warnings'])
          libtest_ready=run("libtest-build",["cargo","test","--locked","-p","orr_editor","--features",full,"--lib","--no-run"])
          checks=[
            ('grid-expansion-ui','terrain_panel::grid_expand::tests::',4),
            ('grid-expansion-save-use','terrain_panel::grid_expand::integration_tests::',3),
            ('terrain-document-regression','terrain_document::tests::',14),
            ('terrace-core','terrain_panel::terrace::tests::',6),
            ('terrace-save-use','terrain_panel::terrace::integration_tests::',3),
            ('flatten-regression','terrain_panel::flatten::tests::',5),
            ('smooth-regression','terrain_panel::smooth::tests::',8),
            ('offset-regression','terrain_panel::offset::tests::',7),
          ]
          for label,selector,count in checks: tests(label,selector,count)
          run('grid-expansion-minimal-ui',['cargo','test','--locked','-p','orr_editor','--features','terrain','--lib','terrain_panel::grid_expand::tests::','--','--test-threads=1'],4)
          run('strict-terrain-minimal',['cargo','clippy','--locked','-p','orr_editor','--features','terrain','--lib','--','-D','warnings'])
          run('strict-navigation',['cargo','clippy','--locked','-p','orr_editor','--features','navigation','--lib','--','-D','warnings'])
          run('strict-combined',['cargo','clippy','--locked','-p','orr_editor','--features',full,'--lib','--','-D','warnings'])
          run('feature-off',['cargo','check','--locked','-p','orr_editor','--features','models','--lib'])
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          (evidence/'scope.txt').write_text('Focused CPU origin-fixed terrain expansion, preserved heights and holes, bounds/overflow, one Undo/Redo, Save/reopen and explicit navigation consumption. Windows/GPU/physical play/video UNRUN; no full-workspace validation.')
          if not all(r['ok'] for r in results):raise SystemExit('Focused Terrain grid expansion checks failed')
      - name: Preserve every original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-grid-expansion-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: error

[package]
name = "orr_collect_delivery_game"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
egui = "0.36"
orr_bridge = { path = "../../crates/orr_bridge" }
orr_ecs = { path = "../../crates/orr_ecs" }
orr_edit = { path = "../../crates/orr_edit" }
orr_editor = { path = "../../crates/orr_editor", features = ["static-gameplay"] }
orr_fp = { path = "../../crates/orr_fp" }
orr_reflect = { path = "../../crates/orr_reflect", features = ["scene"] }
orr_remote = { path = "../../crates/orr_remote", default-features = false }
orr_sample = { path = "../../crates/orr_sample" }
orr_session = { path = "../../crates/orr_session" }
orr_sim = { path = "../../crates/orr_sim" }
orr_static_starter = { path = "../static-game-starter", features = ["gameplay", "standalone", "bundle"] }
orr_view = { path = "../../crates/orr_view" }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11"

[dev-dependencies]
png = "0.18.1"
tempfile = "3"
x11rb = { version = "0.13.2", features = ["xtest"] }

[features]
native-acceptance = []

[[bin]]
name = "collect-delivery-editor"
path = "src/bin/editor.rs"

[[bin]]
name = "collect-delivery-player"
path = "src/bin/collect-delivery-player.rs"

[[bin]]
name = "collect-delivery-bundle"
path = "src/bin/bundle.rs"

[[test]]
name = "journey"
path = "tests/journey.rs"

[[test]]
name = "native_journey"
path = "tests/native_journey.rs"
required-features = ["native-acceptance"]

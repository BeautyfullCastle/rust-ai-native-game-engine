<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrery wasm bench</title>
</head>
<body>
<pre id="out">running...</pre>
<script type="module">
// Same workloads as `bench_runner`, timed with performance.now(). The driver
// (tools/wasm_bench.cjs) reads window.benchResults.
import init, { case_names, case_units, prepare, run } from "./pkg/orr_wasm_bench.js";

const targetMs = Number(new URLSearchParams(location.search).get("ms") || 300);
const filter = (new URLSearchParams(location.search).get("only") || "").split(",").filter(Boolean);
await init();
const names = case_names();
const results = [];
for (let i = 0; i < names.length; i++) {
  if (filter.length && !filter.some((f) => names[i].includes(f))) continue;
  prepare(i);
  let iters = 1;
  for (;;) {
    const t = performance.now();
    run(iters);
    const el = performance.now() - t;
    if (el >= targetMs / 4 || iters >= 2 ** 40) { iters = Math.max(1, Math.floor((targetMs / (el / iters)))); break; }
    iters *= el < 0.5 ? 16 : 2;
  }
  let best = Infinity, sum = "";
  for (let k = 0; k < 3; k++) {
    const t = performance.now();
    sum = run(iters);
    best = Math.min(best, performance.now() - t);
  }
  const nsIter = (best * 1e6) / iters;
  results.push({ name: names[i], ns_per_iter: nsIter, ns_per_unit: nsIter / case_units(i), iters, checksum: sum });
}
window.benchResults = results;
document.getElementById("out").textContent = results.map((r) => `${r.name} ${r.ns_per_unit.toFixed(3)} ns ${r.checksum}`).join("\n");
</script>
</body>
</html>

[package]
name = "orr_sprite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPU-free, view-only sprite atlas and explicit-time animation data"

[features]
default = []
png-import = ["dep:png17"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png17 = { package = "png", version = "0.17", optional = true }

[package]
name = "orr_rhi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin render hardware interface over wgpu (view layer)"

[lints]
workspace = true

# Software-adapter acceptance runs in the provisioned Linux sample-build job.
# Native determinism jobs keep the RHI library and other default targets.
[features]
gpu-tests = []

[[test]]
name = "hdr_texture"
required-features = ["gpu-tests"]

[dependencies]
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"

# Browser: WebGPU is in wgpu's default features; add the WebGL2 fallback for browsers without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }

[package]
name = "orr_package"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
model-authoring = ["dep:orr_model", "dep:rustix"]
animation-authoring = ["model-authoring", "orr_model/animation"]
sprite-authoring = ["dep:orr_sprite", "orr_sprite/png-import"]

[dependencies]
orr_sprite = { path = "../orr_sprite", optional = true }
orr_model = { path = "../orr_model", features = ["import"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
tempfile = "3"

[[bin]]
name = "orr_pkg"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"], optional = true }

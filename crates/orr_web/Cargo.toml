[package]
name = "orr_web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Orrery browser client (wasm32-unknown-unknown): the same deterministic simulation and relay client as the native clients, over WebTransport with a WebSocket fallback"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
orr_proto = { path = "../orr_proto" }
orr_session = { path = "../orr_session" }
orr_sim = { path = "../orr_sim" }
orr_fp = { path = "../orr_fp" }
orr_testgame = { path = "../orr_testgame" }
orr_games = { path = "../orr_games" }
orr_physics = { path = "../orr_physics" }
orr_ecs = { path = "../orr_ecs" }

# Browser glue. Only built for wasm32, so native `cargo test --workspace` does not compile it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

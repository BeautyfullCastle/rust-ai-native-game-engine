[package]
name = "orr_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The server binary: real sockets (QUIC, WebSocket) through `orr_relay_net`.
default = ["net"]
net = ["dep:orr_relay_net", "dep:ctrlc"]
# Test harness (`orr_server::harness`): server + clients on a simulated
# network; off for the plain server.
harness = []

[dependencies]
orr_proto = { path = "../orr_proto" }
orr_session = { path = "../orr_session" }
orr_sim = { path = "../orr_sim" }
orr_ecs = { path = "../orr_ecs" }
orr_fp = { path = "../orr_fp" }
orr_testgame = { path = "../orr_testgame" }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
orr_relay_net = { path = "../orr_relay_net", optional = true }
ctrlc = { version = "3", optional = true }
bytemuck = "1"

[dev-dependencies]
# Turns the harness on for this crate's own tests.
orr_server = { path = ".", features = ["harness"] }
bytemuck = { version = "1", features = ["derive"] }
# Sim-only sample games (no GPU stack): the browser end-to-end test plays PhysGame.
orr_games = { path = "../orr_games" }

[[bin]]
name = "orr_server"
path = "src/main.rs"
required-features = ["net"]

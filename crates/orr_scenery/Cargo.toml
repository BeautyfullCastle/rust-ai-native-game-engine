[package]
name = "orr_scenery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Outdoor scene renderer on orr_rhi (sky, terrain, vegetation, water, HDR post) and the Forest Valley showcase (view layer)"

[lints]
workspace = true

[features]
default = ["showcase"]
# The forest_valley window and capture program. A crate that only draws the
# scene into its own target (the editor) turns this off.
showcase = ["dep:png", "dep:winit"]
# The outdoor pass for the engine's imported scene renderer (sky, water, vegetation).
passes = ["dep:orr_render"]

[dependencies]
orr_rhi = { path = "../orr_rhi" }
orr_render = { path = "../orr_render", features = ["imported-scene"], optional = true }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = { version = "0.18", optional = true }
winit = { version = "0.30", optional = true }

[[bin]]
name = "forest_valley"
path = "src/bin/forest_valley.rs"
test = false
required-features = ["showcase"]

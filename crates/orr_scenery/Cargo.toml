[package]
name = "orr_scenery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Outdoor scene renderer on orr_rhi (sky, terrain, vegetation, water, HDR post) and the Forest Valley showcase (view layer)"

[lints]
workspace = true

[dependencies]
orr_rhi = { path = "../orr_rhi" }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
winit = "0.30"

[[bin]]
name = "forest_valley"
path = "src/bin/forest_valley.rs"
test = false

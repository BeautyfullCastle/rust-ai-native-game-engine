[package]
name = "orr_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Orrery CLI `orr`: a thin ERP client for shell agents, scripts, CI and people"

[lints]
workspace = true

[[bin]]
name = "orr"
path = "src/main.rs"

[dependencies]
# The ERP client and the shared call/format logic: no GUI, no sample game.
orr_mcp = { path = "../orr_mcp" }
orr_remote = { path = "../orr_remote", default-features = false }
# Same features as orr_remote: fixed-point numbers keep their exact decimal text.
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
# Stage local replay exports beside the destination, then commit without truncation.
tempfile = "3"

[dev-dependencies]
orr_edit = { path = "../orr_edit" }
orr_reflect = { path = "../orr_reflect" }
orr_sample = { path = "../orr_sample" }
orr_sim = { path = "../orr_sim" }

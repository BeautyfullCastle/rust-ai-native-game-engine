[package]
name = "orr_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs Rust 1.95.
rust-version = "1.95"
publish = false
description = "egui editor MVP: hierarchy, inspector, viewport, timeline, undo (M4)"
default-run = "orr_editor"

[lints]
workspace = true

[features]
collect-audio = ["collect-dodge", "sprites", "orr_sample/collect-audio"]
collect-audio-native = ["collect-audio", "orr_sample/collect-audio-native"]
navigation-project = ["navigation", "orr_sample/navigation-project"]
room-checkpoint = ["room-ui", "orr_sample/room-checkpoint", "dep:rustix"]
# Optional new-project creator for explicit authoring and acceptance workflows.
project-create = ["orr_sample/project-create"]
room-project = ["models", "orr_remote/room-project", "orr_sample/room-project"]
image-reimport = ["sprites", "orr_sample/image-reimport"]
linked-prefabs = ["collect-dodge", "dep:tempfile", "orr_remote/linked-prefabs", "orr_sample/linked-prefabs", "orr_reflect/linked-prefabs"]
collect-dodge = ["orr_remote/collect-dodge", "orr_sample/collect-dodge"]
# Explicit saved-project UI admission and read-only preset/font preview.
room-ui = ["room-project", "project-ui", "orr_sample/room-ui"]
collect-ui = ["collect-dodge", "project-ui", "orr_sample/collect-ui"]
project-ui = ["sprites", "orr_sample/game-ui"]
navigation = ["terrain", "orr_remote/navigation", "dep:orr_navigation", "dep:orr_navigation_view"]
terrain-physics = ["terrain", "orr_remote/terrain-physics"]
default = []
terrain = ["orr_model_bindings/terrain", "models", "dep:orr_terrain", "dep:orr_terrain_view"]
irradiance-probes = ["orr_model_bindings/irradiance-probes", "models", "orr_render/irradiance-probes"]
sprites = ["dep:orr_sprite", "dep:orr_package", "dep:serde", "dep:tempfile", "orr_sample/project"]
models = ["dep:orr_model_bindings", "dep:orr_model", "orr_render/imported-scene", "dep:orr_package", "dep:serde", "dep:tempfile", "dep:sha2"]
animated-models = ["orr_model_bindings/animated-models", "models", "orr_model/animation", "orr_render/animation"]

[dependencies]
orr_navigation_view = { path = "../orr_navigation_view", optional = true }
orr_model_bindings = { path = "../orr_model_bindings", optional = true }
orr_navigation = { path = "../orr_navigation", optional = true }
orr_terrain = { path = "../orr_terrain", optional = true }
orr_terrain_view = { path = "../orr_terrain_view", optional = true }
sha2 = { version = "0.11", optional = true }
orr_model = { path = "../orr_model", features = ["import"], optional = true }
orr_sprite = { path = "../orr_sprite", optional = true }
orr_package = { path = "../orr_package", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }
# The editor is a view: it sees the simulation only through the bridge and ERP.
# No orr_sim / orr_session / orr_edit / orr_physics here (see tests/deps.rs).
orr_fp = { path = "../orr_fp" }
orr_ecs = { path = "../orr_ecs" }
orr_reflect = { path = "../orr_reflect", features = ["scene"] }
orr_bridge = { path = "../orr_bridge" }
orr_rhi = { path = "../orr_rhi" }
orr_render = { path = "../orr_render" }
orr_view = { path = "../orr_view" }
# The game's view plugin: its frame type for the bridge, reflect descriptors and draw mapping.
orr_sample = { path = "../orr_sample" }
orr_remote = { path = "../orr_remote" }
# JSON of ERP (exact decimals: same features as orr_remote).
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
egui = "0.36"
egui-wgpu = "0.36"
png = "0.17"

[dev-dependencies]
# Test-only Arena hosts and replay viewers; never linked directly by editor code.
orr_edit = { path = "../orr_edit" }
orr_sim = { path = "../orr_sim" }
# Tests only: replay a recording to check it against the live checksum.
orr_session = { path = "../orr_session" }
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
# Native test event loops run on libtest workers; this version is already locked.
winit = { version = "0.30.13", default-features = false }

[[bin]]
name = "orr_editor"
path = "src/main.rs"
# No unit tests here; keep the normal binary build, skip its empty test harness.
# Guarded by orr_tui/tests/deps.rs; put new tests in the library or tests/.
test = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"], optional = true }

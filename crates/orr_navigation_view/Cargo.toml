[package]
name = "orr_navigation_view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Optional packaged terrain-triangle point-agent offscreen navigation lab"

[lints]
workspace = true

[features]
default = []
authored-surface-bundle = ["authored-bundle", "orr_terrain_view/surface"]
authored-bundle = ["authored", "dep:orr_sample", "dep:rustix", "dep:sha2"]
authored = ["dep:orr_remote", "dep:orr_sim", "dep:orr_ecs", "dep:orr_bridge", "dep:orr_games"]
gpu = ["dep:orr_render", "dep:png"]

[dependencies]
orr_sample = { path = "../orr_sample", default-features = false, features = ["runtime-export-support"], optional = true }
rustix = { version = "1.1.5", features = ["fs", "process"], optional = true }
sha2 = { version = "0.11", optional = true }
orr_remote = { path = "../orr_remote", default-features = false, features = ["navigation"], optional = true }
orr_sim = { path = "../orr_sim", optional = true }
orr_ecs = { path = "../orr_ecs", optional = true }
orr_bridge = { path = "../orr_bridge", optional = true }
orr_games = { path = "../orr_games", features = ["navigation"], optional = true }
orr_navigation = { path = "../orr_navigation" }
orr_terrain = { path = "../orr_terrain" }
orr_terrain_view = { path = "../orr_terrain_view" }
orr_fp = { path = "../orr_fp", features = ["float-interop"] }
orr_model = { path = "../orr_model" }
orr_package = { path = "../orr_package" }
orr_render = { path = "../orr_render", features = ["models"], optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "navigation_lab"
path = "src/bin/navigation_lab.rs"
required-features = ["gpu"]

[[bin]]
name = "navigation_player"
path = "src/bin/navigation_player.rs"
required-features = ["authored"]
test = false
bench = false

[[bin]]
name = "navigation_export"
path = "src/bin/navigation_export.rs"
required-features = ["authored-bundle"]
test = false
bench = false

[[bin]]
name = "navigation_surface_player"
path = "src/bin/navigation_surface_player.rs"
required-features = ["authored-surface-bundle"]
test = false
bench = false

[[bin]]
name = "navigation_surface_export"
path = "src/bin/navigation_surface_export.rs"
required-features = ["authored-surface-bundle"]
test = false
bench = false

[package]
name = "orr_reflect"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["scene"]
# Strict-YAML scene files, JSON Schema output and Frame bake/unbake. Sim crates
# depend on this crate with `default-features = false` (derive and descriptors only).
scene = ["dep:saphyr-parser"]
# Editor-only linked prefab metadata; simulation-only builds remain dependency-free.
linked-prefabs = ["scene", "dep:sha2"]

[dependencies]
orr_fp = { path = "../orr_fp" }
orr_ecs = { path = "../orr_ecs" }
orr_reflect_derive = { path = "../orr_reflect_derive" }
bytemuck = { version = "1", features = ["derive"] }
saphyr-parser = { version = "0.1", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
serde_json = "1"

[package]
name = "orr_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Runs a Game in a window: fixed tick, input, bridge, interpolation, default 2D and 3D renderers, screenshots"

[lints]
workspace = true

[features]
default = ["audio-native", "gamepad"]
# The system audio device (CPAL) for `ViewContext::audio()`. Without it the sounds of the views play nothing.
audio-native = ["orr_audio/native"]
# Game controllers through `gilrs` (MIT OR Apache-2.0): the `InputContext` pad helpers read them. Without it the pads stay unconnected.
gamepad = ["dep:gilrs"]

[dependencies]
bytemuck = "1"
orr_audio = { path = "../orr_audio" }
orr_bridge = { path = "../orr_bridge" }
orr_view = { path = "../orr_view" }
# `imported-scene` draws models with the 3D shapes in one picture (view assets, `ViewRef`).
orr_render = { path = "../orr_render", features = ["imported-scene"] }
orr_model = { path = "../orr_model", features = ["import"] }
orr_session = { path = "../orr_session" }
orr_proto = { path = "../orr_proto" }
orr_sim = { path = "../orr_sim" }
orr_ecs = { path = "../orr_ecs" }
# Save slots: the folder checks of the authoring tools and the checksum of a save file.
orr_fsid = { path = "../orr_fsid" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
orr_gfx = { path = "../orr_gfx" }
orr_gfx_view = { path = "../orr_gfx_view" }
orr_physics3d = { path = "../orr_physics3d" }
orr_reflect = { path = "../orr_reflect" }
# `--host` and `--connect`: the relay server (without its binary's dependencies) and a socket link to it.
orr_server = { path = "../orr_server", default-features = false }
orr_relay_net = { path = "../orr_relay_net" }
# Window (view layer only): winit 0.30 (raw-window-handle 0.6, same as wgpu 30).
winit = "0.30"
# Game controllers (feature `gamepad`). Default features are the Windows Gaming Input backend; Linux uses udev, macOS IOKit.
gilrs = { version = "0.11", optional = true }
# Screenshot files.
png = "0.18"
# Overlay text: reads TrueType and OpenType files and rasterizes glyphs (MIT OR Apache-2.0; already in the lock file through egui).
ab_glyph = "0.2"

[dev-dependencies]
bytemuck = { version = "1", features = ["derive"] }
orr_fp = { path = "../orr_fp" }
orr_games = { path = "../orr_games" }
orr_sample = { path = "../orr_sample" }
orr_testgame = { path = "../orr_testgame" }
